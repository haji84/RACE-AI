name: Existing five-model forecast and result round
description: Sequential round with independent pre-cutoff receipt and verified result checkpoint
inputs:
  round:
    required: true
    description: Monotonic round within a replaceable worker batch
  saved-view-key:
    required: true
    description: Existing owner state secret, used only in private encrypted model and display paths
runs:
  using: composite
  steps:
    - name: Wait for next deadline scan or worker handoff
      id: ready
      shell: bash
      run: python scripts/github_existing_cycle.py repeat-prepare --round '${{ inputs.round }}'
    - name: Discover and forecast missing future P0 with existing models
      if: steps.ready.outputs.active == 'true'
      id: discovery
      shell: bash
      run: python scripts/github_existing_cycle.py supplement --round '${{ inputs.round }}'
    - name: Restore private history and fitted models before fresh exhibition capture
      if: steps.ready.outputs.active == 'true'
      continue-on-error: true
      shell: bash
      env:
        RACE_AI_STATE_KEY: ${{ inputs.saved-view-key }}
      run: python -m scripts.boat_all_model_cycle prepare --round '${{ inputs.round }}'
    - name: Freeze new P0 separately before any result reads
      if: steps.ready.outputs.active == 'true' && steps.discovery.outputs.supplement_ready == 'true'
      id: discovery_freeze
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.ready.outputs.p0_name }}
        path: p0_supplement_output/cycle-${{ inputs.round }}/forecasts.json
        if-no-files-found: error
        retention-days: 7
    - name: Forecast future unpublished originals with existing five models
      if: steps.ready.outputs.active == 'true'
      shell: bash
      run: python scripts/github_existing_cycle.py forecast --round '${{ inputs.round }}'
    - name: Freeze this round before reading any outcomes
      if: steps.ready.outputs.active == 'true'
      id: freeze
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.ready.outputs.forecast_name }}
        path: boat_nationwide_output/national.json
        if-no-files-found: error
        retention-days: 7
    - name: Execute remaining native families from the same retained exhibition
      if: steps.ready.outputs.active == 'true'
      continue-on-error: true
      id: all_models
      shell: bash
      env:
        RACE_AI_STATE_KEY: ${{ inputs.saved-view-key }}
      run: python -m scripts.boat_all_model_cycle generate --round '${{ inputs.round }}' --baseline-artifact '${{ steps.freeze.outputs.artifact-id }}'
    - name: Freeze additional native forecasts as owner ciphertext only
      if: steps.ready.outputs.active == 'true' && steps.all_models.outputs.ready == 'true'
      continue-on-error: true
      id: all_models_freeze
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: boat-all-model-forecasts-${{ github.run_id }}-r${{ inputs.round }}
        path: ${{ runner.temp }}/boat-all-model-forecasts/cycle-${{ inputs.round }}/forecasts.enc
        if-no-files-found: error
        retention-days: 7
    - name: Verify additional ciphertext and its independent save receipt
      if: steps.ready.outputs.active == 'true' && steps.all_models_freeze.outputs.artifact-id != ''
      continue-on-error: true
      shell: bash
      env:
        RACE_AI_STATE_KEY: ${{ inputs.saved-view-key }}
      run: python -m scripts.boat_all_model_cycle readback --round '${{ inputs.round }}' --artifact '${{ steps.all_models_freeze.outputs.artifact-id }}'
    - name: Generate private venue research after baseline originals are frozen
      if: steps.ready.outputs.active == 'true'
      id: native_research
      shell: bash
      run: python scripts/github_existing_cycle.py venue-research-forecast --round '${{ inputs.round }}'
    - name: Freeze owner-encrypted venue research separately from baseline originals
      if: steps.ready.outputs.active == 'true'
      continue-on-error: true
      id: venue_research_freeze
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.native_research.outputs.all_model_pairs == 'true' && 'all-existing-model-pairs' || 'boat-venue-research-p1' }}-${{ github.run_id }}-${{ inputs.round }}
        path: ${{ runner.temp }}/boat-venue-research-p1/cycle-${{ inputs.round }}/
        if-no-files-found: ignore
        retention-days: 7
    - name: Verify private research ciphertext and its independent pre-cutoff clock
      if: steps.ready.outputs.active == 'true' && steps.venue_research_freeze.outputs.artifact-id != ''
      shell: bash
      run: python scripts/github_existing_cycle.py venue-research-readback --p1-artifact '${{ steps.venue_research_freeze.outputs.artifact-id }}'
    - name: Read back original and independently check later official results
      if: steps.ready.outputs.active == 'true'
      shell: bash
      env:
        P0_SUPPLEMENT_ARTIFACT: ${{ steps.discovery_freeze.outputs.artifact-id }}
        RACE_AI_SAVED_VIEW_CAPTURE: 'true'
      run: |
        supplement_args=()
        if [[ -n "$P0_SUPPLEMENT_ARTIFACT" ]]; then
          supplement_args+=(--p0-supplement "$P0_SUPPLEMENT_ARTIFACT")
        fi
        python scripts/github_existing_cycle.py audit --round '${{ inputs.round }}' --p1-artifact '${{ steps.freeze.outputs.artifact-id }}' "${supplement_args[@]}"
    - name: Compare admitted private research with already verified official outcomes
      if: steps.ready.outputs.active == 'true'
      shell: bash
      run: python scripts/github_existing_cycle.py venue-research-pdca --round '${{ inputs.round }}'
    - name: Retain forecast and PDCA ciphertext on the existing GitHub state ref
      if: steps.ready.outputs.active == 'true'
      shell: bash
      run: python scripts/github_existing_cycle.py venue-research-retain --round '${{ inputs.round }}'
    - name: Keep only owner-encrypted private research PDCA
      if: steps.ready.outputs.active == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: boat-venue-research-pdca-${{ github.run_id }}-${{ inputs.round }}
        path: ${{ runner.temp }}/boat-venue-research-pdca/cycle-${{ inputs.round }}/
        if-no-files-found: ignore
        retention-days: 7
    - name: Save status and PDCA as a separate immutable result event
      if: steps.ready.outputs.active == 'true'
      id: result
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.ready.outputs.result_name }}
        path: existing_cycle_output/
        if-no-files-found: error
        retention-days: 7
    - name: Verify result archive before admitting the next round
      if: steps.ready.outputs.active == 'true'
      shell: bash
      run: python scripts/github_existing_cycle.py repeat-complete --round '${{ inputs.round }}' --p1-artifact '${{ steps.freeze.outputs.artifact-id }}' --result-artifact '${{ steps.result.outputs.artifact-id }}'
    - name: Automatically publish encrypted saved-forecast result comparisons
      if: steps.ready.outputs.active == 'true'
      shell: bash
      env:
        RACE_AI_STATE_KEY: ${{ inputs.saved-view-key }}
      run: |
        if ! python -m scripts.boat_saved_view_feed --result-artifact '${{ steps.result.outputs.artifact-id }}'; then
          echo '::warning::Encrypted result display update held; source collection continues.'
        fi
