name: Existing five-model forecast and result round
description: Sequential round with independent pre-cutoff receipt and verified result checkpoint
inputs:
  round:
    required: true
    description: Monotonic round within a replaceable worker batch
  saved-view-key:
    required: true
    description: Existing owner state secret, used only by encrypted display publication
runs:
  using: composite
  steps:
    - name: Wait for next deadline scan or worker handoff
      id: ready
      shell: bash
      run: python scripts/github_existing_cycle.py repeat-prepare --round '${{ inputs.round }}'
    - name: Discover and forecast missing future P0 with existing models
      if: steps.ready.outputs.active == 'true'
      id: discovery
      shell: bash
      run: python scripts/github_existing_cycle.py supplement --round '${{ inputs.round }}'
    - name: Freeze new P0 separately before any result reads
      if: steps.ready.outputs.active == 'true' && steps.discovery.outputs.supplement_ready == 'true'
      id: discovery_freeze
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.ready.outputs.p0_name }}
        path: p0_supplement_output/cycle-${{ inputs.round }}/forecasts.json
        if-no-files-found: error
        retention-days: 7
    - name: Forecast future unpublished originals with existing five models
      if: steps.ready.outputs.active == 'true'
      shell: bash
      run: python scripts/github_existing_cycle.py forecast
    - name: Freeze this round before reading any outcomes
      if: steps.ready.outputs.active == 'true'
      id: freeze
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.ready.outputs.forecast_name }}
        path: boat_nationwide_output/national.json
        if-no-files-found: error
        retention-days: 7
    - name: Read back original and independently check later official results
      if: steps.ready.outputs.active == 'true'
      shell: bash
      env:
        P0_SUPPLEMENT_ARTIFACT: ${{ steps.discovery_freeze.outputs.artifact-id }}
        RACE_AI_SAVED_VIEW_CAPTURE: 'true'
      run: |
        supplement_args=()
        if [[ -n "$P0_SUPPLEMENT_ARTIFACT" ]]; then
          supplement_args+=(--p0-supplement "$P0_SUPPLEMENT_ARTIFACT")
        fi
        python scripts/github_existing_cycle.py audit --round '${{ inputs.round }}' --p1-artifact '${{ steps.freeze.outputs.artifact-id }}' "${supplement_args[@]}"
    - name: Save status and PDCA as a separate immutable result event
      if: steps.ready.outputs.active == 'true'
      id: result
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.ready.outputs.result_name }}
        path: existing_cycle_output/
        if-no-files-found: error
        retention-days: 7
    - name: Verify result archive before admitting the next round
      if: steps.ready.outputs.active == 'true'
      shell: bash
      run: python scripts/github_existing_cycle.py repeat-complete --round '${{ inputs.round }}' --p1-artifact '${{ steps.freeze.outputs.artifact-id }}' --result-artifact '${{ steps.result.outputs.artifact-id }}'
    - name: Automatically publish encrypted saved-forecast result comparisons
      continue-on-error: true
      if: steps.ready.outputs.active == 'true'
      shell: bash
      env:
        RACE_AI_STATE_KEY: ${{ inputs.saved-view-key }}
      run: python -m scripts.boat_saved_view_feed --result-artifact '${{ steps.result.outputs.artifact-id }}'
