name: KEIRIN public Site result updates

on:
  schedule:
    # 08:10–00:55 JST. Offset from the private observer's scheduled minutes.
    - cron: '10,25,40,55 0-15,23 * * *'
  repository_dispatch:
    types: [keirin-official-sp-settled]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/keirin-public-site-results.yml'
      - 'scripts/keirin_publish_public_site_results.sh'
      - 'scripts/keirin_capture_public_two_sources.py'
      - 'scripts/keirin_public_site_results.py'
      - 'tests/test_keirin_public_site_results.py'

permissions:
  contents: read

jobs:
  verify-public-result-publisher:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify public result collection using fixtures
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'beautifulsoup4>=4.12,<5' 'cryptography>=44,<48'
          python -m unittest tests.test_keirin_public_site_results tests.test_keirin_capture_public_two_sources
          bash -n scripts/keirin_publish_public_site_results.sh

  publish-public-site-results:
    if: >-
      github.repository == 'haji84/RACE-AI' && github.repository_id == '1416489937' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'repository_dispatch' && github.actor_id == '41898282'))
    concurrency:
      group: keirin-public-site-results-state
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check and publish both payout markets for the public Site
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4>=4.12,<5' 'cryptography>=44,<48'
          python -m unittest tests.test_keirin_public_site_results
          bash scripts/keirin_publish_public_site_results.sh 0 --refresh-rosters
