name: KEIRIN public Site result updates

on:
  schedule:
    # 08:10–00:55 JST. Offset from the private observer's scheduled minutes.
    - cron: '10,25,40,55 0-15,23 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      watch_minutes:
        type: number
        default: 0

permissions:
  contents: read

jobs:
  publish-public-site-results:
    if: >-
      github.repository == 'haji84/RACE-AI' && github.repository_id == '1416489937' &&
      ((github.ref == 'refs/heads/main' &&
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
       (github.ref == 'refs/heads/feat/keirin-history-search-20261122' &&
        github.event_name == 'workflow_dispatch' && inputs.watch_minutes > 0))
    concurrency:
      group: keirin-public-site-results-state
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.watch_minutes > 0 && 355 || 12 }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check and publish both payout markets for the public Site
        shell: bash
        env:
          WATCH_MINUTES: ${{ inputs.watch_minutes || 0 }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4>=4.12,<5'
          python -m unittest tests.test_keirin_public_site_results
          bash scripts/keirin_publish_public_site_results.sh "$WATCH_MINUTES"
