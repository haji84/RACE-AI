name: BOAT owner-formal Pages verifier (source-free)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/boat-owner-formal-pages-proof.yml
      - scripts/boat_auto_site_coverage.py
      - tests/test_boat_auto_site_coverage.py
  push:
    branches: [main]
    paths:
      - .github/workflows/boat-owner-formal-pages-proof.yml
  workflow_run:
    workflows: ['BOAT schedule-gap retained-result recovery (zero provider GET)']
    types: [completed]
    branches: [main]
  schedule:
    # Source-free only: daily fallback if a workflow_run event is delayed.
    - cron: '37 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: boat-owner-formal-pages-proof
  cancel-in-progress: false
jobs:
  static_site:
    name: Verify exact candidate Pages assets, cache and manifest (zero GET)
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fe9c691d453a16087a2a973f857fcdef2a567c5c
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: audit-code
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          persist-credentials: false
      - name: Run daily source-free model status and automation gate tests
        working-directory: audit-code
        run: |
          python -m unittest tests.test_boat_auto_site_coverage -v
          python - <<'PY'
          from pathlib import Path
          code=Path('.github/workflows/boat-owner-formal-pages-proof.yml').read_text()
          assert "workflows: ['BOAT schedule-gap retained-result recovery (zero provider GET)']" in code
          assert "github.event.workflow_run.conclusion == 'success'" in code
          assert "github.event.workflow_run.head_branch == 'main'" in code
          assert "Auto.summarize(selected,native,status,day=active_day)" in code
          assert "if audit['status']=='COMPLETE'" in code
          assert "LATEST_DAY_MODEL_PARITY_MISMATCH" in code
          assert "github.event_name != 'pull_request'" in code
          print('BOAT_AUTO_SOURCEFREE_TRIGGER_AND_NO_FALSE_SITE_PARITY_VERIFIED')
          PY
      - name: Verify JavaScript syntax
        run: |
          node --check owner-formal.js
          node --check app.js
          node --check saved-performance.js
          node --check product-data.js
      - name: Require exact Pages asset SHA/size and active script versions
        run: |
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          obj=json.loads(Path('site-build.json').read_bytes())
          assert obj['schema']=='RACE_AI_SAVED_PAGES_BUILD_V1'
          assert obj['forecast_sha256']=='4169db99a1d99bbcf96c8fa1bfb076ed2d2fb1f434fc64cf7e43b38e55f5adda'
          index=Path('index.html').read_text()
          for path in ('app.js','index.html','owner-formal.js','saved-performance.js'):
              raw=Path(path).read_bytes()
              expected=obj['files'][path]
              assert expected=={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()},path
          for path in ('owner-formal.js','app.js'):
              sha=obj['files'][path]['sha256']
              assert index.count('./'+path+'?v='+sha[:12])==1,path
          assert '<section id="boat-owner-formal-proof"' in index
          assert 'RaceOwnerFormal' in Path('app.js').read_text()
          assert 'ownerEncryptedTrusted=true' in Path('app.js').read_text()
          assert 'ownerFormalRow(r)' in Path('app.js').read_text()
          assert obj['cipher_path'].startswith('views/')
          print('BOAT_PAGES_ASSET_SHA256_AND_MODULE_ORDER_VERIFIED')
          PY
      - name: Synthetic negative/positive browser summary contract (zero provider GET)
        run: |
          node - <<'JS'
          const O=require('./owner-formal.js');
          if(O.DAY!=='2026-11-12'||!O.EVIDENCE.endsWith('/43339230921'))process.exit(1);
          const ids=['boat-observed-pairwise-factor-v1','boat-observed-pairwise-start-v1'];
          const results=[];
          const prev='2026-11-12T18:00:00+09:00',post='2026-11-12T18:01:00+09:00';
          for(let i=0;i<142;i++){
            const jcd=String(Math.floor(i/12)+1).padStart(2,'0');
            const rno=String(i%12+1).padStart(2,'0');
            const race='20261112-'+jcd+'-'+rno;
            const official=i===141?'2026-11-12T18:03:00+09:00':post;
            const predictions=ids.map((model_id,index)=>({stage:'P0',model_id,
              persisted_at:'2026-11-12T17:45:00+09:00',ordered_top8:[[1,2,3]],
              fixture_hit:i<(index===0?26:25)}));
            const r={race_id:race,sport:'boat',event_date_jst:O.DAY,scope:'research',
              private_cycle_view:true,cutoff_at:prev,prediction:predictions[0],
              comparison_predictions:[predictions[1]],result:{status:'final',
              source_sha256:'a'.repeat(64),winning_combinations:[[1,2,3]],
              payout_yen_per_100:900,refund_boats:[],refunds:[],observed_at:'2026-11-12T18:05:00+09:00'}};
            if(i>=132){
              r.result.cutoff_reference={basis:'RAW_OFFICIAL_SP_SAME_ROSTER_SAVED_BEFORE_BOTH',
                original_cutoff_at:prev,result_schedule_cutoff_at:official,
                formal_eligible:false,offset_seconds:i===141?180:60};
              r.result_observations=[{race_id:race,status:'AVAILABLE',
                source_sha256:'a'.repeat(64),body_identity_verified:true,
                captured_at:'2026-11-12T18:05:00+09:00',closed_at:official,
                schedule_binding:'SP_EXPLICIT_RACE_HEADER',
                source_url:'https://www.boatrace.jp/owsp/sp/spdata?type=raceresult&hd=20261112&jcd='+jcd+'&rno='+Number(rno),
                data:{status:'settled',confirmed:true,finish_confirmed:true,
                payouts:[{bet_type:'trifecta',combination:[1,2,3],
                  payout_per_100_yen:900}],refund_boats:[],refunds:[]}}];
            }
            results.push(r);
          }
          const P={compare:(r,p)=>({status:p.fixture_hit?'HIT':'MISS'})};
          const v=O.inspect(results,P,O.ANCHOR);
          if(!v.verified||v.races!==142||v.predictions!==284||v.approvedReferences!==10)throw Error('GOOD_CASE_REJECTED:'+v.reason);
          results[133].result_observations[0].source_sha256='b'.repeat(64);
          const bad=O.inspect(results,P,O.ANCHOR);
          if(bad.verified||bad.reason!=='SP_CUTOFF_SOURCE_EVIDENCE_MISMATCH')throw Error('CORRUPTED_SHA_ADMITTED');
          if(O.inspect(results,P,'wrong').verified)throw Error('FORECAST_ANCHOR_BYPASS');
          results[133].result_observations[0].source_sha256='a'.repeat(64);
          const savedUrl=results[133].result_observations[0].source_url;
          results[133].result_observations[0].source_url=savedUrl.replace('jcd=12','jcd=01');
          if(O.inspect(results,P,O.ANCHOR).verified)throw Error('FOREIGN_RACE_SOURCE_ADMITTED');
          results[133].result_observations[0].source_url=savedUrl;
          results[133].result.refund_boats=[1];
          if(O.inspect(results,P,O.ANCHOR).verified)throw Error('FORGED_REFUND_ADMITTED');
          results[133].result.refund_boats=[];
          console.log('BOAT_SITE_POLICY_SYNTHETIC_POSITIVE_AND_NEGATIVE_OK');
          JS

  authenticated_site:
    name: Compare new site module with real AES saved 284 P0 and original scorer (zero GET)
    if: github.event_name != 'pull_request' && needs.static_site.result == 'success'
    needs: static_site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fe9c691d453a16087a2a973f857fcdef2a567c5c
          path: site
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0796b52c2804177976e4c2e5ab9b65f32589720b
          path: coverage-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: coverage-source/pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: coverage-source/pr72-reference
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -r coverage-source/requirements-history.txt
      - name: Use original signed AES saved view and true model scorer to attest browser comparison
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
        run: |
          python - <<'PY'
          import importlib.util,json,os,subprocess,sys
          from pathlib import Path
          from datetime import datetime,timezone
          source=Path('coverage-source').resolve()
          sys.path.insert(0,str(source))
          import race_ai
          for path in ('pr64-reference','pr72-reference'):
              child=(source/path/'race_ai').resolve()
              assert child.is_dir()
              race_ai.__path__.append(str(child))
          from scripts.boat_private_original_vault import _environment
          from race_ai.racer_result_bridge import SavedResultBridge
          from race_ai import saved_view_feed as F
          from race_ai import result_due_ledger as D,retained_model_pdca_audit as P
          owner_spec=importlib.util.spec_from_file_location(
              'boat_142_owner_formal',Path('scripts/boat_142_owner_formal.py').resolve())
          Owner=importlib.util.module_from_spec(owner_spec)
          owner_spec.loader.exec_module(Owner)
          bridge=SavedResultBridge(_environment(source),now=datetime.now(timezone.utc))
          view=F.current_view(bridge.git,bridge.bootstrap,day='2026-11-12')[3]
          derived,score,proof=Owner.score_owner_approved(view,F=F,D=D,P=P)
          assert proof['model_forecasts_scored']==284
          js=r"""
          const fs=require('fs');
          const Product=require('./site/product-data.js');
          const Perf=require('./site/saved-performance.js');
          const Owner=require('./site/owner-formal.js');
          try{
            const view=Product.parse(JSON.parse(fs.readFileSync(0,'utf8')));
            const rows=view.records.filter(r=>r.event_date_jst===Owner.DAY&&r.sport==='boat');
            const out=Owner.inspect(rows,Perf,Owner.ANCHOR);
            console.log(JSON.stringify(out.verified?
              {verified:true,counts:out.counts,races:out.races,predictions:out.predictions,approvedReferences:out.approvedReferences}:
              {verified:false,reason:out.reason||'MISMATCH'}));
          }catch(_){console.log(JSON.stringify({verified:false,reason:'BROWSER_PARSE_OR_COMPARE_REJECTED'}));process.exitCode=2;}
          """
          r=subprocess.run(['node','-e',js],input=json.dumps(view,ensure_ascii=False),
                           text=True,capture_output=True,timeout=150)
          public=json.loads(r.stdout)
          assert r.returncode==0 and public.get('verified') is True, \
              'BROWSER_AND_AES_COUNTS_NOT_YET_CONSISTENT'
          assert public['races']==142 and public['predictions']==284 and \
              public['approvedReferences']==10
          groups={g['model_id']:g for g in score['model_groups']}
          assert set(groups)==set(public['counts'])
          for name,c in public['counts'].items():
              g=groups[name]
              assert (c['hits'],c['misses'],c['forecasts'])==(g['hits'],g['misses'],g['forecasts'])
          print(json.dumps({'status':'BOAT_LIVE_ENCRYPTED_VIEW_AND_SITE_284_MATCH',
              'races':142,'forecasts':284,'approved_reference_races':10,
              'verified_models':{k:{'hits':v['hits'],'misses':v['misses']}
                for k,v in public['counts'].items()},
              'official_source_gets':0,'original_predictions_changed':False},
              sort_keys=True))

          # Event-driven daily checks use only actual signed encrypted Git
          # views. Other days are NOT assumed to have 142 races or 2 models.
          from scripts import boat_auto_site_coverage as Auto
          for active_day in bridge.days:
              selected=(derived if active_day=='2026-11-12' else
                        F.current_view(bridge.git,bridge.bootstrap,day=active_day)[3])
              native=(score if active_day=='2026-11-12' else
                      P.score_view(selected,authenticated=True))
              status={r['race_id']:D.reconciled_status(r) for r in selected['records']
                  if r.get('sport')=='boat' and r.get('event_date_jst')==active_day}
              if not status:
                  continue
              audit=Auto.summarize(selected,native,status,day=active_day)
              if audit['status']=='COMPLETE':
                  site_js=r"""
          const fs=require('fs');
          const Product=require('./site/product-data.js');
          const Perf=require('./site/saved-performance.js');
          const source=JSON.parse(fs.readFileSync(0,'utf8'));
          const view=Product.parse(source),counts={};
          for(const r of view.records){
            if(r.sport!=='boat')continue;
            const picks=[r.prediction,...(r.comparison_predictions||[])].filter(Boolean);
            for(const p of picks){
              const id=p.model_id+'|'+p.stage,cell=counts[id]||(counts[id]={forecasts:0,hits:0,misses:0,void:0});
              cell.forecasts++;
              const comparison=Perf.compare(r,p).status;
              if(!['HIT','MISS','VOID'].includes(comparison))
                throw new Error('BROWSER_NATIVE_FORMAL_MISMATCH');
              cell[comparison=='HIT'?'hits':comparison=='MISS'?'misses':'void']++;
            }
          }
          console.log(JSON.stringify(counts));
          """
                  checked=subprocess.run(['node','-e',site_js],
                      input=json.dumps(selected,ensure_ascii=False),
                      text=True,capture_output=True,timeout=90)
                  assert checked.returncode==0, 'LATEST_DAY_BROWSER_SCORER_HOLD'
                  actual=json.loads(checked.stdout)
                  expected={}
                  for group in native['model_groups']:
                      key=group['model_id']+'|'+group['stage']
                      cell=expected.setdefault(key,dict(forecasts=0,hits=0,misses=0,void=0))
                      for field in cell:
                          cell[field]+=group[field if field!='void' else 'void']
                  assert actual==expected,'LATEST_DAY_MODEL_PARITY_MISMATCH'
                  audit['site_parity_verified']=True
              else:
                  audit['site_parity_verified']=False
                  audit['site_parity_state']='HOLD_NOT_CLAIMED_COMPLETE'
              print(json.dumps(audit,sort_keys=True,ensure_ascii=False))
          PY

  live_pages_http:
    name: Confirm deployed Pages HTTP matches tested assets after AES parity (zero racing GET)
    if: github.event_name != 'pull_request' && needs.authenticated_site.result == 'success'
    needs: authenticated_site
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e3230146001bc1cf6e610a03da38bfa69d4282b8
          persist-credentials: false
      - name: Reopen actual public Pages HTML, app, model and decrypt assets via HTTP
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,urllib.parse
          from pathlib import Path
          base='https://haji84.github.io/RACE-AI/'
          manifest=json.loads(Path('site-build.json').read_bytes())
          assert manifest['schema']=='RACE_AI_SAVED_PAGES_BUILD_V1'
          selected=('index.html','app.js','owner-formal.js',
                    'saved-performance.js','saved-view-crypto.js')
          html=Path('index.html').read_text()
          for path in selected:
              raw=Path(path).read_bytes()
              digest=hashlib.sha256(raw).hexdigest()
              assert manifest['files'][path]=={'bytes':len(raw),'sha256':digest}
              if path.endswith('.js'):
                  assert './'+path+'?v='+digest[:12] in html
              request=urllib.request.Request(base+path+'?audit=owner-sourcefree',
                  headers={'User-Agent':'RACE-AI-AES-pages-auto-proof/1',
                           'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=25) as response:
                  assert response.status==200
                  final=urllib.parse.urlsplit(response.url)
                  assert final.hostname=='haji84.github.io' and final.path=='/RACE-AI/'+path
                  body=response.read(len(raw)+1)
              assert body==raw,'BOAT_DEPLOYED_PAGES_BYTES_CHANGED'
          assert '<section id="boat-owner-formal-proof"' in html
          print(json.dumps(dict(status='BOAT_AUTOMATIC_SITE_AES_AND_HTTP_PARITY_VERIFIED',
              assets=5,official_provider_gets=0,source_state_mutations=0,
              original_forecast_rewrites=0),sort_keys=True))
          PY
