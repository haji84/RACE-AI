      - 'p0-ohmura8-disjoint-older-k-20261024'
    paths:
      - 'docs/evidence/p0-ohmura8-disjoint-k-trigger-20261024.txt'
permissions:
  contents: read
jobs:
  one_older_k_block:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
