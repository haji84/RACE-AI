          ref: ${{ github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-parser-reference
      - name: Audit just new Oct01 to Oct08 K day files and six Ohmura8 registrations
        run: python -m scripts.p0_ohmura8_disjoint_older_k_20261024
