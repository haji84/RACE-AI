name: AUTORACE A-B and PDCA offline contract
on:
  pull_request:
    branches: [codex/actions-four-sport-e2e]
    paths:
      - 'race_ai/autorace_ab_pdca.py'
      - 'tests/test_autorace_ab_pdca.py'
      - 'race_ai/autorace_private_store.py'
      - 'race_ai/autorace_source_contract.py'
      - 'tests/test_autorace_private_source_e2e.py'
      - 'docs/AUTORACE_AB_AUTOMATION_STAGE_20261103.md'
      - '.github/workflows/autorace-ab-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autorace-ab-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify research model and A/B stage safety (synthetic only)
        run: python -m unittest tests.test_autorace_ab_pdca tests.test_autorace_private_source_e2e -v
