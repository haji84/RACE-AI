              raise SystemExit('NAME_BINDING_BUDGET_INVALID')
          if set(manifest['backups'])!=names-{'manifest.json'}:raise SystemExit('NAME_BINDING_BACKUP_COVERAGE_INVALID')
          for name,meta in manifest['backups'].items():
              raw=(restored/name).read_bytes()
              if len(raw)!=meta['bytes'] or hashlib.sha256(raw).hexdigest()!=meta['sha256']:raise SystemExit('NAME_BINDING_BACKUP_DIGEST_INVALID')
          if manifest['status']=='COMPLETED' and names!=allowed:raise SystemExit('NAME_BINDING_INCOMPLETE')
