        run: |
          result=0
          python - <<'PY' || result=$?
          import os, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          from publish_race_updates import workflow_session
          from publish_day_feed import get_json
          from web.race_contract import canonical
          opener, headers = workflow_session(os.environ['RACE_AI_ORIGINAL_COMMIT_SHA'])
          base = os.environ['RACE_AI_ORIGINAL_PUBLISH_URL'].rsplit('/',1)[0]
          feed = get_json(opener, urllib.request.Request(base+'/today',headers=headers),limit=6000000)
          path = Path(os.environ['RUNNER_TEMP'])/'race-ai-original-day.json'
          raw = canonical(feed)
          with path.open('xb') as handle: handle.write(raw)
          if path.read_bytes() != raw: raise SystemExit('ORIGINAL_DAY_LOCAL_READBACK_MISMATCH')
          PY
          if [ "$result" -eq 0 ]; then
            python scripts/collect_original_exhibition.py --day-input "$RUNNER_TEMP/race-ai-original-day.json" --race-id "$RACE_AI_EXHIBITION_RACE_ID" --review config/operator-exhibition-media.json --output-dir "$RUNNER_TEMP/race-ai-original/collector" --execute || result=$?
          fi
