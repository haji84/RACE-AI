              raise SystemExit('NAME_BINDING_BACKUP_COVERAGE_INVALID')
          for name in sorted(names):
              before,after=(original/name).read_bytes(),(restored/name).read_bytes()
              if not 0<len(after)<=64000 or before!=after:raise SystemExit('NAME_BINDING_BACKUP_BYTES_INVALID')
          manifest=json.loads((restored/'manifest.json').read_bytes())
