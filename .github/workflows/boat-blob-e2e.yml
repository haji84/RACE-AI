          path: ${{ runner.temp }}/race-ai-original-restored
      - name: Verify all original timing and forecast restored bytes
        if: always() && steps.original.outputs.backup_exists == 'true'
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          original,restored=root/'race-ai-original',root/'race-ai-original-restored'
          names={p.relative_to(original).as_posix() for p in original.rglob('*.json')}
          allowed={'collector/observation.json','collector/input.json','collector/manifest.json',
                   'published/race.json','published/original-request.json','published/original.json',
                   'published/baseline-request.json','published/baseline.json','published/post-request.json','published/post.json','published/manifest.json'}
          if not names or not names<=allowed or names!={p.relative_to(restored).as_posix() for p in restored.rglob('*') if p.is_file()}:
              raise SystemExit('ORIGINAL_BACKUP_FILE_COVERAGE_MISMATCH')
          for name in sorted(names):
              before,after=(original/name).read_bytes(),(restored/name).read_bytes()
              if not 0<len(after)<=256000 or before!=after: raise SystemExit('ORIGINAL_BACKUP_RESTORE_MISMATCH')
              print(json.dumps({'result':'ORIGINAL_BACKUP_RESTORE_VERIFIED','file':name,'bytes':len(after),'sha256':hashlib.sha256(after).hexdigest()}))
          for directory in ('collector','published'):
              manifest_path=directory+'/manifest.json'
              if manifest_path not in names: continue
              manifest=json.loads((restored/manifest_path).read_bytes())
              backups=manifest['backups']
              expected={name.split('/',1)[1] for name in names if name.startswith(directory+'/') and name!=manifest_path}
              if set(backups)!=expected: raise SystemExit('ORIGINAL_MANIFEST_FILE_COVERAGE_CONFLICT')
              for name,meta in backups.items():
                  if directory+'/'+name not in names: raise SystemExit('ORIGINAL_MANIFEST_PATH_INVALID')
                  raw=(restored/directory/name).read_bytes()
                  if len(raw)!=meta['bytes'] or hashlib.sha256(raw).hexdigest()!=meta['sha256']: raise SystemExit('ORIGINAL_MANIFEST_DIGEST_CONFLICT')
              if directory=='published' and (manifest['result'] not in {'ORIGINAL_EXHIBITION_PARTIAL_VERIFIED','ORIGINAL_EXHIBITION_PREDICTION_VERIFIED'} or manifest['validation_status']!='UNVALIDATED' or manifest['purchase_decision']!='skip' or manifest['purchase_recommendations']!=[] or manifest['official_source_requests']!=0):
                  raise SystemExit('ORIGINAL_RESEARCH_STATE_CONFLICT')
          print(json.dumps({'result':'ORIGINAL_ALL_CONTENT_RESTORE_VERIFIED','files':len(names)}))
          PY

