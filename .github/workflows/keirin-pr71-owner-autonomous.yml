# GitHub Actions is the only timer. ChatGPT tasks do not trigger this.
# Existing PR71 model weights/algorithms are untouched.
# Pinned, CI-tested source code is checked out on trusted runners.
name: KEIRIN PR71 GitHub-only forecast and PDCA

on:
  schedule:
    # UTC, approx. twice hourly. GitHub schedules may be delayed.
    - cron: '11,41 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-pr71-owner-autonomous.yml'
      - 'docs/KEIRIN_GITHUB_OWNER_AUTONOMY.md'
      - 'scripts/setup_keirin_owner_runner_windows.ps1'
      - 'tests/test_keirin_owner_bootstrap_guard.py'
  pull_request:
    paths:
      - '.github/workflows/keirin-pr71-owner-autonomous.yml'
      - 'docs/KEIRIN_GITHUB_OWNER_AUTONOMY.md'
      - 'scripts/setup_keirin_owner_runner_windows.ps1'
      - 'tests/test_keirin_owner_bootstrap_guard.py'

permissions:
  contents: read

concurrency:
  group: keirin-pr71-owner-${{ github.event_name == 'pull_request' && github.ref || 'main-writer' }}
  cancel-in-progress: false

jobs:
  synthetic-ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60b739bfb9861cbc48864b83651cfc2fb89c0fe7
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing source, owner-intake, PR71 and PDCA invariants
        env:
          PYTHONPATH: '.:tests'
        run: |
          python -m unittest -v tests.test_keirin_github_owner_future_intake tests.test_keirin_owner_captured_ssr_intake tests.test_keirin_winticket_embedded_racecard tests.test_keirin_next_published_race_probe tests.test_keirin_allowed_delivery tests.test_keirin_pr71_four_model_rank tests.test_keirin_permissioned_owner
      - name: No real forecast claim
        run: |
          echo 'Only synthetic tests. Production four-model forecast not proven.' >> "$GITHUB_STEP_SUMMARY"

  bootstrap-safety-ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify no private runner use on public repository
        run: python -m unittest -v tests.test_keirin_owner_bootstrap_guard
      - name: Parse PowerShell bootstrap syntax without running it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/setup_keirin_owner_runner_windows.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Output $_.Message }
            exit 1
          }
          Write-Output 'WINDOWS_BOOTSTRAP_POWERSHELL_PARSE_OK_NO_EXECUTION'

  public-preflight:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60b739bfb9861cbc48864b83651cfc2fb89c0fe7
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Next actual 7/9 rider pre-cutoff source, structural counts only
        shell: bash
        run: |
          set -euo pipefail
          day="$(TZ=Asia/Tokyo date +%F)"
          python -m scripts.keirin_next_published_race_probe --event-day-jst "$day" > "$RUNNER_TEMP/source.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"source.json").read_text())
          names=("status","race_id","source_races_observed","eligible_unstarted_races",
                 "rider_identity_count","preflight_checked_count",
                 "preflight_verified_source_count","required_source_slots_A_missing",
                 "critical_preflight_source_slots_missing","real_full_odds_verified",
                 "actual_model_prediction_saved")
          safe={k:d.get(k) for k in names}
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Source-only 347-factor gate\n")
              f.write(f"Status: {safe.get('status')}\n")
              f.write(f"Missing model inputs: {safe.get('required_source_slots_A_missing')}\n")
              f.write("Source probe cannot produce PR71 predictions or legal permissions.\n")
          PY

  # Production data is NEVER staged on the public hosted runner. The owner's
  # existing Windows private DB/inbox are used only with an explicit opt-in.
  # Label "keirin-owner-private" must be registered on the trusted machine.
  private-owner-PR71:
    if: >-
      github.event.repository.private == true &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.RACE_AI_KEIRIN_OWNER_RUNTIME_ENABLED == 'true'
    runs-on: [self-hosted, Windows, X64, keirin-owner-private]
    timeout-minutes: 25
    env:
      OWNER_DB: ${{ secrets.RACE_AI_KEIRIN_OWNER_DB }}
      OWNER_INBOX: ${{ secrets.RACE_AI_KEIRIN_OWNER_INBOX }}
      OWNER_MANIFEST: ${{ secrets.RACE_AI_KEIRIN_OWNER_GRANT_MANIFEST }}
      RACE_AI_PERSISTENT_PRIVATE_VOLUME: ACKNOWLEDGED
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60b739bfb9861cbc48864b83651cfc2fb89c0fe7
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require existing private permanent DB, inbox and grants
        id: owner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ready = (-not [string]::IsNullOrWhiteSpace($env:OWNER_DB)) -and (-not [string]::IsNullOrWhiteSpace($env:OWNER_INBOX))
          if ($ready) {
            $ready = (Test-Path -LiteralPath $env:OWNER_DB -PathType Leaf) -and (Test-Path -LiteralPath $env:OWNER_INBOX -PathType Container)
          }
          if ($ready -and (-not [string]::IsNullOrWhiteSpace($env:OWNER_MANIFEST))) {
            $ready = Test-Path -LiteralPath $env:OWNER_MANIFEST -PathType Leaf
          }
          if (-not $ready) {
            "ready=false" >> $env:GITHUB_OUTPUT
            "HOLD: Existing private SQLite, inbox or license proof is not connected." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          "ready=true" >> $env:GITHUB_OUTPUT
      - name: Save actual public pre-race pages into owner-private inbox
        if: >-
          steps.owner.outputs.ready == 'true' &&
          vars.RACE_AI_KEIRIN_OWNER_PUBLIC_FETCH_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & python -m scripts.keirin_github_owner_future_intake --inbox "$env:OWNER_INBOX" --lookahead-minutes 90 --max-races 16 > "$env:RUNNER_TEMP\owner-source-status.json"
          if ($LASTEXITCODE -ne 0) {
            "HOLD: Some real public sources were unavailable. No fake inputs added." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Source intake recorded. See existing private inbox for SHA originals." >> $env:GITHUB_STEP_SUMMARY
          }
          exit 0
      - name: Existing four PR71 models, immutable original and existing result PDCA
        if: steps.owner.outputs.ready == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @("--db", $env:OWNER_DB, "--inbox", $env:OWNER_INBOX)
          if (-not [string]::IsNullOrWhiteSpace($env:OWNER_MANIFEST)) {
            $arguments += @("--operator-reviewed-licenses", "--grant-manifest", $env:OWNER_MANIFEST)
          } else {
            $arguments += @("--personal-manual", "--owner-private-use-confirmed", "--owner-approved-source-profile", "owner-approved-winticket-keirinjp-20261109", "--owner-automatic-fetch-confirmed")
          }
          & python -m scripts.keirin_permissioned_owner_agent @arguments > "$env:RUNNER_TEMP\owner-cycle-status.json"
          if ($LASTEXITCODE -ne 0) {
            "HOLD: No verified complete owner model input. No default-zero prediction." >> $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          $r = Get-Content -LiteralPath "$env:RUNNER_TEMP\owner-cycle-status.json" -Raw | ConvertFrom-Json
          $count = [int]$r.four_model_ranked_races
          $revisions = [int]$r.four_model_result_revision_count
          "Private owner PR71 four-model ranked race count: $count" >> $env:GITHUB_STEP_SUMMARY
          "Existing result revision audit count: $revisions" >> $env:GITHUB_STEP_SUMMARY
          "No model coefficients changed; no post-result refreezing allowed." >> $env:GITHUB_STEP_SUMMARY
      - name: Keep originals private
        if: always()
        shell: pwsh
        run: |
          "All owner source HTML, forecasts, original SQLite and licensing files remain private." >> $env:GITHUB_STEP_SUMMARY
          "No ChatGPT automation is involved." >> $env:GITHUB_STEP_SUMMARY
