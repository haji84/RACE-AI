# Public RACE-AI: GitHub-hosted Ubuntu only. No Windows, no owner PC.
# Production PR71 state uses existing AES-GCM/SQLite code and a separate
# lineage on the SAME state/keirin-encrypted-history Git branch.
name: KEIRIN PR71 GitHub-only forecast and PDCA

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-pr71-owner-autonomous.yml'
      - 'scripts/keirin_cloud_pr71_state.py'
      - 'tests/test_keirin_cloud_pr71_state.py'
      - 'tests/test_keirin_cloud_workflow_guard.py'
      - 'docs/KEIRIN_GITHUB_OWNER_AUTONOMY.md'
  pull_request:
    paths:
      - '.github/workflows/keirin-pr71-owner-autonomous.yml'
      - 'scripts/keirin_cloud_pr71_state.py'
      - 'tests/test_keirin_cloud_pr71_state.py'
      - 'tests/test_keirin_cloud_workflow_guard.py'
      - 'docs/KEIRIN_GITHUB_OWNER_AUTONOMY.md'

permissions:
  contents: read

concurrency:
  group: keirin-pr71-cloud-${{ github.event_name == 'pull_request' && github.ref || 'main-git-writer' }}
  cancel-in-progress: false

jobs:
  synthetic-ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 60b739bfb9861cbc48864b83651cfc2fb89c0fe7
          path: pr71-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing PR71 and GitHub-only encrypted production state regressions
        shell: bash
        run: |
          set -euo pipefail
          export RACE_AI_PR71_PINNED_SOURCE_ROOT="$GITHUB_WORKSPACE/pr71-source"
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tests"
          cd "$GITHUB_WORKSPACE/pr71-source"
          python -m unittest -v tests.test_keirin_pr71_four_model_rank tests.test_keirin_allowed_delivery tests.test_keirin_permissioned_owner
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_cloud_pr71_state.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_cloud_workflow_guard.py' -v
          python -m py_compile "$GITHUB_WORKSPACE/scripts/keirin_cloud_pr71_state.py"
      - name: Do not claim synthetic results as live
        run: echo 'Only synthetic model + AES Git-state tests. No actual real-race prediction verified.' >> "$GITHUB_STEP_SUMMARY"

  public-preflight:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60b739bfb9861cbc48864b83651cfc2fb89c0fe7
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Next actual 7/9 rider pre-cutoff source, structural counts only
        shell: bash
        run: |
          set -euo pipefail
          day="$(TZ=Asia/Tokyo date +%F)"
          python -m scripts.keirin_next_published_race_probe --event-day-jst "$day" > "$RUNNER_TEMP/source.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"source.json").read_text())
          names=("status","race_id","source_races_observed","eligible_unstarted_races",
                 "rider_identity_count","preflight_checked_count",
                 "preflight_verified_source_count","required_source_slots_A_missing",
                 "critical_preflight_source_slots_missing","real_full_odds_verified",
                 "actual_model_prediction_saved")
          safe={k:d.get(k) for k in names}
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Source-only 347-factor gate\n")
              f.write(f"Status: {safe.get('status')}\n")
              f.write(f"Missing model inputs: {safe.get('required_source_slots_A_missing')}\n")
              f.write("Source probe cannot produce PR71 predictions or legal permissions.\n")
          PY

  # Production secrets are used only from trusted main GitHub-hosted jobs.
  # Secrets never reach pull_request jobs. This is a GitHub-hosted machine.
  github-hosted-pr71-cycle:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.archive.outputs.committed }}
    env:
      RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
      RACE_AI_KEIRIN_FEED_ENDPOINT: ${{ secrets.RACE_AI_KEIRIN_FEED_ENDPOINT }}
      RACE_AI_KEIRIN_FEED_RIGHTS_REF: ${{ secrets.RACE_AI_KEIRIN_FEED_RIGHTS_REF }}
      RACE_AI_KEIRIN_LICENSE_MANIFEST_B64: ${{ secrets.RACE_AI_KEIRIN_LICENSE_MANIFEST_B64 }}
      RACE_AI_KEIRIN_LICENSE_DOCUMENT_B64: ${{ secrets.RACE_AI_KEIRIN_LICENSE_DOCUMENT_B64 }}
      RACE_AI_KEIRIN_FEED_TOKEN: ${{ secrets.RACE_AI_KEIRIN_FEED_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: 60b739bfb9861cbc48864b83651cfc2fb89c0fe7
          path: pr71-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Git AES state, run existing four models, encrypt only verified changes
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RACE_AI_STATE_KEY" ]]; then
            echo 'NO_PRIVATE_AES_KEY_HOLD' >> "$GITHUB_STEP_SUMMARY"
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/pr71-source"
          python "$GITHUB_WORKSPACE/scripts/keirin_cloud_pr71_state.py" cycle --repo "$GITHUB_WORKSPACE" --source-root "$GITHUB_WORKSPACE/pr71-source" > "$RUNNER_TEMP/pr71-cycle.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"pr71-cycle.json").read_text())
          yes=r["state"]=="CLOUD_PR71_ENCRYPTED_GIT_HISTORY_READBACK_VERIFIED"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("committed="+("true" if yes else "false")+"\n")
          safe={k:r.get(k) for k in ("state","generation","source_state","new_forecast_stage_nonzero","existing_pdca_invoked")}
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("GitHub-hosted PR71 state: "+str(r["state"])+"\n")
              f.write("4-model originals only when complete permitted pre-race source is available.\n")
              f.write("No source values, prediction tickets or private SQLite released.\n")
          PY

  independent-cloud-readback:
    needs: github-hosted-pr71-cycle
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.github-hosted-pr71-cycle.outputs.committed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 60b739bfb9861cbc48864b83651cfc2fb89c0fe7
          path: pr71-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fresh GitHub runner verifies AES-GCM SHA, SQLite and unchanged four models
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/pr71-source"
          python "$GITHUB_WORKSPACE/scripts/keirin_cloud_pr71_state.py" verify --repo "$GITHUB_WORKSPACE" --source-root "$GITHUB_WORKSPACE/pr71-source" > "$RUNNER_TEMP/pr71-readback.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"pr71-readback.json").read_text())
          if r["state"]!="PR71_SEPARATE_GITHUB_RUNNER_AES_GCM_READBACK_OK":
              raise SystemExit("INDEPENDENT_CLOUD_READBACK_NOT_VERIFIED")
          print(json.dumps({"state":r["state"],"generation":r["generation"]}))
          PY
