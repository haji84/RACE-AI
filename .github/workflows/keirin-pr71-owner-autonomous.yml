permissions:
  contents: read

concurrency:
  group: keirin-pr71-cloud-${{ github.event_name == 'pull_request' && github.ref || 'main-git-writer' }}
  cancel-in-progress: false

jobs:
  synthetic-ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fe7e5581263b2b31fbd45536ac6a611c2779fa65
          path: pr71-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # Existing video evidence/PDCA source, never a mutable PR branch.
          ref: c52ff0216435b97a0209c43bbe5d0de589445736
          path: pr102-video
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-free private frame-regression decoding tools
        # CI has invented images only; no replay download or owner secrets.
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 opencv-python-headless==4.10.0.84 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5'
      - name: Existing PR71 and GitHub-only encrypted production state regressions
        shell: bash
        run: |
          set -euo pipefail
          export RACE_AI_PR71_PINNED_SOURCE_ROOT="$GITHUB_WORKSPACE/pr71-source"
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tests"
          cd "$GITHUB_WORKSPACE/pr71-source"
          python -m unittest -v tests.test_keirin_pr71_four_model_rank tests.test_keirin_allowed_delivery tests.test_keirin_permissioned_owner
          python -m unittest -v tests.test_keirin_licensed_result_stage tests.test_keirin_license_api_ingest
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_live_15min_proof tests.test_keirin_live_source_readiness)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_phase_overlay)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_frame_rider_identity_gate)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_historical_rider_color_eval)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_historical_color_runtime)
          # No provider network calls: synthetic BGR jersey rectangles only.
          python -m pip install --disable-pip-version-check numpy==1.26.4 opencv-python-headless==4.10.0.84
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_visual_jersey_proposals)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_historical_auto_private_runtime)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_blind_rider_holdout_gate)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_blind_video_review_packets)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_signed_blind_review_gate)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_sign_blind_review_private)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_restore_blind_owner_packets)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_private_blind_review_workbench)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_color_ab_stability)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_color_failure_triage)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_camera_motion_quality)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_color_track_flow_guard)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_bicycle_shape_context)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_private_bicycle_shape_motion_audit)
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_keirin_shape_digit_candidate_research)
          python -m py_compile "$GITHUB_WORKSPACE/scripts/keirin_private_shape_digit_holdout.py"
          python -m py_compile "$GITHUB_WORKSPACE/scripts/keirin_private_bicycle_shape_motion_audit.py"
          python -m py_compile "$GITHUB_WORKSPACE/scripts/keirin_private_camera_motion_audit.py"
          python -m py_compile "$GITHUB_WORKSPACE/scripts/keirin_private_color_failure_triage.py"
          python -m py_compile "$GITHUB_WORKSPACE/scripts/keirin_historical_color_eval_offline.py"
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" RACE_AI_PR102_PINNED_SOURCE_ROOT="$GITHUB_WORKSPACE/pr102-video" python -m unittest -v tests.test_keirin_phase_pr102_integration)
          (cd "$GITHUB_WORKSPACE/pr71-source" && RACE_AI_PHASE_MAIN_ROOT="$GITHUB_WORKSPACE" PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests" python "$GITHUB_WORKSPACE/tests/test_keirin_phase_pr71_integration.py")
          python -m unittest -v tests.test_keirin_winticket_prior_events tests.test_keirin_prior_selection tests.test_keirin_prior_private_stage tests.test_keirin_winticket_ex_connection tests.test_keirin_weather_input_connection tests.test_keirin_github_owner_future_intake
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_cloud_pr71_state.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_cloud_workflow_guard.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_day_four_model_audit.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_cloud_pr71_variable.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_source_gap_plan.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_licensed_source_readiness.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_cloud_owner_inputs.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_cloud_owner_source_cycle.py' -v
          python -m py_compile "$GITHUB_WORKSPACE/scripts/keirin_cloud_pr71_state.py" "$GITHUB_WORKSPACE/scripts/keirin_day_four_model_audit.py" "$GITHUB_WORKSPACE/scripts/keirin_cloud_pr71_variable.py" "$GITHUB_WORKSPACE/scripts/keirin_source_gap_plan.py" "$GITHUB_WORKSPACE/scripts/keirin_cloud_owner_inputs.py"
      - name: Owner-authored 71R result comparison and encrypted pilot bridge (no provider GET)
        run: |
          python -m unittest -v tests.test_keirin_manual_result_sync tests.test_keirin_manual_71_actions_bridge tests.test_keirin_manual71_live_evidence
          python -m unittest -v tests.test_keirin_manual71_owner_encrypted_intake
          python -m unittest -v tests.test_keirin_manual71_owner_intake_cli
          python -m py_compile race_ai/keirin_manual_71_actions_bridge.py scripts/keirin_cloud_pr71_state.py
      - name: Evidence-bound race grade and advancement tactics research regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_keirin_round_motivation tests.test_keirin_round_six_phase_rank tests.test_keirin_round_paired_audit tests.test_keirin_line_cohesion tests.test_keirin_line_three_arm_audit tests.test_keirin_private_review_pair_readiness tests.test_keirin_real_pair_finish_outcome tests.test_keirin_real_three_arm_prospective_bridge tests.test_keirin_observed_follow_admission tests.test_keirin_available_forecast_comparison tests.test_keirin_active_available_pipeline tests.test_keirin_real_seibuen_ab_cipher tests.test_keirin_seibuen_20261118_AB_settlement tests.test_keirin_nationwide_active_AB tests.test_keirin_nationwide_AB_executor tests.test_keirin_dynamic_nationwide_registry tests.test_keirin_nationwide_AB_results tests.test_keirin_nationwide_auto_generator tests.test_keirin_nationwide_auto_storage tests.test_keirin_nationwide_auto_runner tests.test_keirin_public_two_source_normalizer tests.test_keirin_capture_public_two_sources tests.test_keirin_discover_public_race_links
          python -m py_compile race_ai/keirin_round_motivation.py race_ai/keirin_round_six_phase_rank.py race_ai/keirin_round_paired_audit.py race_ai/keirin_line_cohesion.py race_ai/keirin_line_three_arm_audit.py scripts/keirin_private_review_pair_readiness.py race_ai/keirin_real_pair_finish_outcome.py race_ai/keirin_real_three_arm_prospective_bridge.py race_ai/keirin_observed_follow_admission.py race_ai/keirin_available_forecast_sources.py race_ai/keirin_available_prediction_audit.py race_ai/keirin_active_available_pipeline.py race_ai/keirin_seibuen_20261118_AB_settlement.py race_ai/keirin_nationwide_active_AB.py race_ai/keirin_nationwide_AB_executor.py race_ai/keirin_dynamic_nationwide_registry.py race_ai/keirin_nationwide_AB_results.py race_ai/keirin_nationwide_auto_generator.py race_ai/keirin_nationwide_auto_storage.py scripts/keirin_nationwide_auto_forecast.py scripts/keirin_nationwide_independent_cipher_readback.py race_ai/keirin_public_two_source_normalizer.py scripts/keirin_capture_public_two_sources.py scripts/keirin_discover_public_race_links.py
          echo 'Round-stage research features are not calibrated PR71 forecasts.' >> "$GITHUB_STEP_SUMMARY"
      - name: Do not claim synthetic results as live
        run: echo 'Synthetic model and AES tests are not actual real-race prediction evidence.' >> "$GITHUB_STEP_SUMMARY"
      - name: Export only public research detector code for independent local replay
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: keirin-public-frame-verifier-${{ github.sha }}
          path: |
            race_ai/keirin_visual_jersey_proposals.py
            race_ai/keirin_historical_rider_color_eval.py
            race_ai/keirin_blind_rider_holdout_gate.py
            scripts/keirin_blind_video_review_packets.py
            race_ai/keirin_signed_blind_review_gate.py
            scripts/keirin_sign_blind_review_private.py
            scripts/keirin_restore_blind_owner_packets.py
            scripts/keirin_private_blind_review_workbench.py
            scripts/keirin_finalize_blind_review_private.py
            race_ai/keirin_color_ab_stability.py
            scripts/keirin_private_color_ab_compare.py
            race_ai/keirin_color_failure_triage.py
            scripts/keirin_private_color_failure_triage.py
            race_ai/keirin_camera_motion_quality.py
            race_ai/keirin_color_track_flow_guard.py
            scripts/keirin_private_camera_motion_audit.py
            race_ai/keirin_bicycle_shape_context.py
            scripts/keirin_private_bicycle_shape_motion_audit.py
            race_ai/keirin_shape_digit_candidate_research.py
            scripts/keirin_private_shape_digit_holdout.py
          retention-days: 2
          if-no-files-found: error
      - name: Main-only owner-approved real source connection without production secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE"
          private_dir="$(mktemp -d "$RUNNER_TEMP/owner-source-connection.XXXXXX")"
          trap 'rm -rf "$private_dir"' EXIT
          cd "$GITHUB_WORKSPACE/pr71-source"
          python "$GITHUB_WORKSPACE/scripts/keirin_cloud_owner_inputs.py" \
            --inbox "$private_dir" --owner-automatic-fetch-confirmed --budget-seconds 120
          echo 'Source acquisition and private partial-input replay only; not model completion or durable storage.' >> "$GITHUB_STEP_SUMMARY"

  public-preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '3,33 * * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe7e5581263b2b31fbd45536ac6a611c2779fa65
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: preflight-audit
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Next actual 7/9 rider pre-cutoff source, structural counts only
        shell: bash
        run: |
          set -euo pipefail
          day="$(TZ=Asia/Tokyo date +%F)"
          python -m scripts.keirin_next_published_race_probe --event-day-jst "$day" > "$RUNNER_TEMP/source.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"source.json").read_text())
          names=("status","race_id","source_races_observed","eligible_unstarted_races",
                 "rider_identity_count","preflight_checked_count",
                 "preflight_verified_source_count","required_source_slots_A_missing",
                 "critical_preflight_source_slots_missing","real_full_odds_verified",
                 "actual_model_prediction_saved")
          safe={k:d.get(k) for k in names}
          missing=d.get("required_source_gap_groups_A")
          total=d.get("required_source_slots_A_missing")
          if (type(missing) is dict and type(total) is int and
              all(type(k) is str and type(v) is int and 0<v<=100
                  for k,v in missing.items()) and sum(missing.values())==total):
              safe["missing_source_group_counts_A"]=missing
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Source-only 347-factor gate\n")
              f.write(f"Status: {safe.get('status')}\n")
              f.write(f"Missing model inputs: {safe.get('required_source_slots_A_missing')}\n")
              f.write("Source probe cannot produce PR71 predictions or legal permissions.\n")
          PY
      - name: Classify missing source origin instances without new GETs
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tests:$GITHUB_WORKSPACE/preflight-audit"
          python "$GITHUB_WORKSPACE/preflight-audit/scripts/keirin_source_gap_plan.py" \
            --probe "$RUNNER_TEMP/source.json" > "$RUNNER_TEMP/keirin-source-origin-plan.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"keirin-source-origin-plan.json").read_text())
          safe_keys=("state","required_model_feature_slots","missing_model_feature_slots",
                     "distinct_required_origin_instances","distinct_missing_origin_instances",
                     "missing_source_field_families","deficits_by_source_kind",
                     "license_rights_verified","formal_model_predictions_verified")
          safe={k:r.get(k) for k in safe_keys}
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Model input slots vs independent source measurements\n")
              out.write(f"Model slots missing: {safe.get('missing_model_feature_slots')}\n")
              out.write(f"Distinct source instances missing: {safe.get('distinct_missing_origin_instances')}\n")
              out.write("No unobserved values filled or rights inferred.\n")
          PY

  # Five-minute ticks have no provider access without required configuration.
  # Presence is not source-use authority: pinned owner admission still decides.
  config_readiness:
    # Trusted main push performs only the no-network readiness check.
    # The actual predictor is still restricted to schedule/dispatch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
    env:
      # Existing owner-approved personal public-page collection is independent
      # of optional provider-licensed JSON exports; not itself a vendor grant.
      RACE_AI_OWNER_AUTO_SOURCE_PROFILE: owner-approved-winticket-keirinjp-20261109
      RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
      RACE_AI_KEIRIN_FEED_ENDPOINT: ${{ secrets.RACE_AI_KEIRIN_FEED_ENDPOINT }}
      RACE_AI_KEIRIN_FEED_RIGHTS_REF: ${{ secrets.RACE_AI_KEIRIN_FEED_RIGHTS_REF }}
      RACE_AI_KEIRIN_LICENSE_MANIFEST_B64: ${{ secrets.RACE_AI_KEIRIN_LICENSE_MANIFEST_B64 }}
      RACE_AI_KEIRIN_LICENSE_DOCUMENT_B64: ${{ secrets.RACE_AI_KEIRIN_LICENSE_DOCUMENT_B64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fail closed before permissioned intake if source configuration is absent
        id: guard
        run: python -m scripts.keirin_live_source_readiness

  # Production secrets remain restricted to trusted main runtime.
  github-hosted-pr71-cycle:
    needs: config_readiness
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && needs.config_readiness.outputs.eligible == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.archive.outputs.committed }}
      pilot_generation: ${{ steps.archive.outputs.pilot_generation }}
      pilot_cipher_sha: ${{ steps.archive.outputs.pilot_cipher_sha }}
      pilot_state: ${{ steps.archive.outputs.pilot_state }}
      pilot_new_audits: ${{ steps.archive.outputs.pilot_new_audits }}
      pilot_commit_state: ${{ steps.archive.outputs.pilot_commit_state }}
      pilot_rowset_sha: ${{ steps.archive.outputs.pilot_rowset_sha }}
      pilot_result_revision: ${{ steps.archive.outputs.pilot_result_revision }}
      pilot_html_sha: ${{ steps.archive.outputs.pilot_html_sha }}
    env:
      RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
      RACE_AI_KEIRIN_FEED_ENDPOINT: ${{ secrets.RACE_AI_KEIRIN_FEED_ENDPOINT }}
      RACE_AI_KEIRIN_FEED_RIGHTS_REF: ${{ secrets.RACE_AI_KEIRIN_FEED_RIGHTS_REF }}
      RACE_AI_KEIRIN_LICENSE_MANIFEST_B64: ${{ secrets.RACE_AI_KEIRIN_LICENSE_MANIFEST_B64 }}
      RACE_AI_KEIRIN_LICENSE_DOCUMENT_B64: ${{ secrets.RACE_AI_KEIRIN_LICENSE_DOCUMENT_B64 }}
      RACE_AI_KEIRIN_FEED_TOKEN: ${{ secrets.RACE_AI_KEIRIN_FEED_TOKEN }}
      RACE_AI_OWNER_AUTO_SOURCE_PROFILE: owner-approved-winticket-keirinjp-20261109
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: fe7e5581263b2b31fbd45536ac6a611c2779fa65
          path: pr71-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c52ff0216435b97a0209c43bbe5d0de589445736
          path: pr102-crypto
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Decrypt approved 71R RSA/AES envelope with existing owner Secret in private runner temp
        id: manual71
        shell: bash
        env:
          RACE_AI_KEIRIN_PRIVATE_RSA_PEM: ${{ secrets.RACE_AI_KEIRIN_PRIVATE_RSA_PEM }}
        run: |
          set -euo pipefail
          if [[ -z "${RACE_AI_KEIRIN_PRIVATE_RSA_PEM:-}" ]]; then
            echo 'HOLD_EXISTING_RSA_SECRET_NOT_CONFIGURED' >> "$GITHUB_STEP_SUMMARY"
            echo "staged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m pip install --disable-pip-version-check 'cryptography>=44,<48'
          dir="$RUNNER_TEMP/owner-manual71-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -m scripts.keirin_manual71_owner_intake_cli \
            --workspace "$GITHUB_WORKSPACE" \
            --helper "$GITHUB_WORKSPACE/pr102-crypto/race_ai/keirin_private_sealed_payload.py" \
            --private-dir "$dir"
          echo "private_dir=$dir" >> "$GITHUB_OUTPUT"
          echo "staged=true" >> "$GITHUB_OUTPUT"
          echo 'Owner manual71 source SHA-verified in 0700 temp, no plaintext in public workspace.' >> "$GITHUB_STEP_SUMMARY"
      - name: Restore Git AES state, run existing four models, encrypt only verified changes
        env:
          RACE_AI_KEIRIN_MANUAL71_PRIVATE_DIR: ${{ steps.manual71.outputs.private_dir }}
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RACE_AI_STATE_KEY" ]]; then
            echo 'NO_PRIVATE_AES_KEY_HOLD' >> "$GITHUB_STEP_SUMMARY"
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/pr71-source"
          python "$GITHUB_WORKSPACE/scripts/keirin_cloud_pr71_state.py" cycle --repo "$GITHUB_WORKSPACE" --source-root "$GITHUB_WORKSPACE/pr71-source" > "$RUNNER_TEMP/pr71-cycle.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"pr71-cycle.json").read_text())
          yes=r["state"]=="CLOUD_PR71_ENCRYPTED_GIT_HISTORY_READBACK_VERIFIED"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("committed="+("true" if yes else "false")+"\n")
          # Public-safe metadata only. Nothing from private original or payouts.
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              pilot=r.get("manual71_pilot") or {}
              def safe_token(v):
                  v=v if isinstance(v,str) else ""
                  return (v if v.isascii() and len(v)<=120 and
                          v.replace("_","").isalnum() else "UNKNOWN")
              f.write("pilot_commit_state="+safe_token(r.get("state"))+"\n")
              f.write("pilot_state="+safe_token(pilot.get("state"))+"\n")
              generation=r.get("generation")
              f.write("pilot_generation="+str(generation if type(generation) is int and generation>=1 else 0)+"\n")
              audits=pilot.get("new_audits")
              f.write("pilot_new_audits="+str(audits if type(audits) is int and 0<=audits<=100 else 0)+"\n")
              def verified_digest(v):
                  return (v if isinstance(v,str) and len(v)==64 and
                          all(c in "0123456789abcdef" for c in v) else "")
              f.write("pilot_rowset_sha="+verified_digest(pilot.get("audit_rowset_sha256"))+"\n")
              f.write("pilot_result_revision="+verified_digest(pilot.get("source_revision_sha256"))+"\n")
              f.write("pilot_html_sha="+verified_digest(pilot.get("latest_html_sha256"))+"\n")
              cipher=r.get("cipher_sha256")
              f.write("pilot_cipher_sha="+
                      (cipher if isinstance(cipher,str) and len(cipher)==64 and
                       all(c in "0123456789abcdef" for c in cipher) else "")+"\n")
          safe={k:r.get(k) for k in ("state","generation","source_state","new_forecast_stage_nonzero","existing_pdca_invoked","result_rows_appended","result_rows_held","four_model_variable_saved","four_model_variable_held","missing_source_config_keys","owner_source_acquisition","manual71_pilot","official_result_independently_authenticated")}
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("GitHub-hosted PR71 state: "+str(r["state"])+"\n")
              f.write("Partial owner-source values do not authorize model promotion.\n")
              f.write("No source values, prediction tickets or private SQLite released.\n")
          PY
      - name: Remove ephemeral decrypted owner 71R inputs after producer, including failures
        if: always()
        shell: bash
        env:
          MANUAL_PRIVATE_DIR: ${{ steps.manual71.outputs.private_dir }}
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_PRIVATE_DIR:-}" ]]; then
            case "$MANUAL_PRIVATE_DIR" in
              "$RUNNER_TEMP"/owner-manual71-*) rm -rf -- "$MANUAL_PRIVATE_DIR" ;;
              *) echo 'PRIVATE_CLEANUP_PATH_NOT_EXPECTED' >&2; exit 2 ;;
            esac
          fi

  independent-cloud-readback:
    needs: github-hosted-pr71-cycle
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.github-hosted-pr71-cycle.outputs.committed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fe7e5581263b2b31fbd45536ac6a611c2779fa65
          path: pr71-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fresh GitHub runner verifies AES-GCM SHA, SQLite and unchanged four models
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/pr71-source"
          python "$GITHUB_WORKSPACE/scripts/keirin_cloud_pr71_state.py" verify --repo "$GITHUB_WORKSPACE" --source-root "$GITHUB_WORKSPACE/pr71-source" > "$RUNNER_TEMP/pr71-readback.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"pr71-readback.json").read_text())
          if r["state"]!="PR71_SEPARATE_GITHUB_RUNNER_AES_GCM_READBACK_OK":
              raise SystemExit("INDEPENDENT_CLOUD_READBACK_NOT_VERIFIED")
          live=r.get("live_15min") or {}
          if live.get("schema")!="RACE_AI_LIVE_15MIN_PROOF_COUNTS_V1":
              raise SystemExit("LIVE_WINDOW_PROOF_COUNTER_MISSING")
          public={"state":r["state"],"generation":r["generation"],
                  "15min_proven_races":live["proven_races"],
                  "manual71_audit_readback":r.get("manual71_pilot_readback",{}),
                  "15min_model_result_pairs_proven":live["model_result_pairs_proven"],
                  "15min_holds_by_reason":live["holds"]}
          print(json.dumps(public,sort_keys=True))
          PY
      - name: Evaluate actual 5-stage one-race evidence, never infer result or browser verification
        shell: bash
        env:
          PILOT_COMMIT_STATE: ${{ needs.github-hosted-pr71-cycle.outputs.pilot_commit_state }}
          PILOT_STATE: ${{ needs.github-hosted-pr71-cycle.outputs.pilot_state }}
          PILOT_NEW_AUDITS: ${{ needs.github-hosted-pr71-cycle.outputs.pilot_new_audits }}
          PILOT_GENERATION: ${{ needs.github-hosted-pr71-cycle.outputs.pilot_generation }}
          PILOT_CIPHER_SHA: ${{ needs.github-hosted-pr71-cycle.outputs.pilot_cipher_sha }}
          PILOT_ROWSET_SHA: ${{ needs.github-hosted-pr71-cycle.outputs.pilot_rowset_sha }}
          PILOT_RESULT_REVISION: ${{ needs.github-hosted-pr71-cycle.outputs.pilot_result_revision }}
          PILOT_HTML_SHA: ${{ needs.github-hosted-pr71-cycle.outputs.pilot_html_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          root=Path(os.environ["GITHUB_WORKSPACE"])
          code=root/"race_ai"/"keirin_manual71_live_evidence.py"
          spec=importlib.util.spec_from_file_location("manual71_live_gate",code)
          if not spec or not spec.loader:
              raise SystemExit("MANUAL71_LIVE_GATE_MODULE_MISSING")
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          readback=module.load_report(Path(os.environ["RUNNER_TEMP"])/"pr71-readback.json")
          producer={
              "state":os.environ.get("PILOT_COMMIT_STATE"),
              "generation":int(os.environ.get("PILOT_GENERATION") or 0),
              "cipher_sha256":os.environ.get("PILOT_CIPHER_SHA"),
              "manual71_pilot":{
                  "state":os.environ.get("PILOT_STATE"),
                  "new_audits":int(os.environ.get("PILOT_NEW_AUDITS") or 0),
                  "source_revision_sha256":os.environ.get("PILOT_RESULT_REVISION"),
                  "audit_rowset_sha256":os.environ.get("PILOT_ROWSET_SHA"),
                  "latest_html_sha256":os.environ.get("PILOT_HTML_SHA"),
                  "official_results_authenticated":False}}
          summary=module.examine(
              producer=producer,readback=readback,
              action_run_id=os.environ.get("GITHUB_RUN_ID"),
              producer_job_id="github-hosted-pr71-cycle",
              reader_job_id="independent-cloud-readback",
              trusted_main=os.environ.get("GITHUB_REF")=="refs/heads/main")
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Manual71 same-race 5-stage acceptance\n")
              out.write("Run "+str(summary["production_run_id"])+" / "+summary["overall"]+"\n")
              for name,state in summary["gates"].items():
                  out.write(name+": "+state+"\n")
              out.write("Private HTML SHA does not prove browser render. Source and user-viewer independent verification missing => HOLD.\n")
          PY
      - name: Reconcile all 78 races and four original PR71 models after independent encrypted-state readback
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tests"
          cd "$GITHUB_WORKSPACE/pr71-source"
          python "$GITHUB_WORKSPACE/scripts/keirin_day_four_model_audit.py" \
            --cohort "$GITHUB_WORKSPACE/docs/evidence/2026-11-10/keirin_78r_source_only_cohort.json" \
            --encrypted-cloud-state --repo "$GITHUB_WORKSPACE" \
            --source-root "$GITHUB_WORKSPACE/pr71-source" > "$RUNNER_TEMP/pr71-78r-audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"pr71-78r-audit.json").read_text())
          assert d["expected_model_race_pairs"]==312
          assert d["frozen_model_race_pairs"]+d["model_race_pairs_missing"]==312
          safe={k:d[k] for k in ("scheduled_races","expected_model_race_pairs","frozen_four_model_races","missing_four_model_original_races","settled_research_races","formally_authenticated_model_race_scores")}
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## November 10: 78 races x 4 PR71 models\n")
              out.write(f"Verified frozen originals: {d['frozen_four_model_races']}\n")
              out.write(f"Originals missing, NOT counted as losses: {d['missing_four_model_original_races']}\n")
              out.write("Formal results remain separately gated.\n")
          PY
