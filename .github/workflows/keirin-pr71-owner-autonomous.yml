# Public RACE-AI: GitHub-hosted Ubuntu only. No Windows, no owner PC.
# Production PR71 state uses existing AES-GCM/SQLite code and a separate
# lineage on the SAME state/keirin-encrypted-history Git branch.
name: KEIRIN PR71 GitHub-only forecast and PDCA

on:
  schedule:
    # Five-minute prospective ticks. Actual persistence time decides the proof.
    # The public unlicensed source-gap probe stays at two runs an hour.
    - cron: '3,33 * * * *'
    - cron: '8,13,18,23,28,38,43,48,53,58 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-pr71-owner-autonomous.yml'
      - 'scripts/keirin_cloud_pr71_state.py'
      - 'scripts/keirin_live_source_readiness.py'
      - 'tests/test_keirin_live_source_readiness.py'
      - 'tests/test_keirin_cloud_pr71_state.py'
      - 'tests/test_keirin_cloud_workflow_guard.py'
      - 'scripts/keirin_day_four_model_audit.py'
      - 'scripts/keirin_cloud_pr71_variable.py'
      - 'scripts/keirin_source_gap_plan.py'
      - 'scripts/keirin_cloud_owner_inputs.py'
      - 'tests/test_keirin_cloud_owner_inputs.py'
      - 'tests/test_keirin_cloud_owner_source_cycle.py'
      - 'tests/test_keirin_source_gap_plan.py'
      - 'tests/test_keirin_licensed_source_readiness.py'
      - 'tests/test_keirin_day_four_model_audit.py'
      - 'tests/test_keirin_cloud_pr71_variable.py'
      - 'race_ai/live_15min_proof.py'
      - 'tests/test_live_15min_proof.py'
      - 'docs/evidence/2026-11-10/keirin_78r_source_only_cohort.json'
      - 'docs/KEIRIN_GITHUB_OWNER_AUTONOMY.md'
  pull_request:
    paths:
      - '.github/workflows/keirin-pr71-owner-autonomous.yml'
      - 'scripts/keirin_cloud_pr71_state.py'
      - 'scripts/keirin_live_source_readiness.py'
      - 'tests/test_keirin_live_source_readiness.py'
      - 'tests/test_keirin_cloud_pr71_state.py'
      - 'tests/test_keirin_cloud_workflow_guard.py'
      - 'scripts/keirin_day_four_model_audit.py'
      - 'scripts/keirin_cloud_pr71_variable.py'
      - 'scripts/keirin_source_gap_plan.py'
      - 'scripts/keirin_cloud_owner_inputs.py'
      - 'tests/test_keirin_cloud_owner_inputs.py'
      - 'tests/test_keirin_cloud_owner_source_cycle.py'
      - 'tests/test_keirin_source_gap_plan.py'
      - 'tests/test_keirin_licensed_source_readiness.py'
      - 'tests/test_keirin_day_four_model_audit.py'
      - 'tests/test_keirin_cloud_pr71_variable.py'
      - 'race_ai/live_15min_proof.py'
      - 'tests/test_live_15min_proof.py'
      - 'docs/evidence/2026-11-10/keirin_78r_source_only_cohort.json'
      - 'docs/KEIRIN_GITHUB_OWNER_AUTONOMY.md'

permissions:
  contents: read

concurrency:
  group: keirin-pr71-cloud-${{ github.event_name == 'pull_request' && github.ref || 'main-git-writer' }}
  cancel-in-progress: false

jobs:
  synthetic-ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9bb7e016e5200b5d25cbcc66b3ac6062b0c1aaa9
          path: pr71-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing PR71 and GitHub-only encrypted production state regressions
        shell: bash
        run: |
          set -euo pipefail
          export RACE_AI_PR71_PINNED_SOURCE_ROOT="$GITHUB_WORKSPACE/pr71-source"
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tests"
          cd "$GITHUB_WORKSPACE/pr71-source"
          python -m unittest -v tests.test_keirin_pr71_four_model_rank tests.test_keirin_allowed_delivery tests.test_keirin_permissioned_owner
          python -m unittest -v tests.test_keirin_licensed_result_stage tests.test_keirin_license_api_ingest
          (cd "$GITHUB_WORKSPACE" && PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest -v tests.test_live_15min_proof tests.test_keirin_live_source_readiness)
          python -m unittest -v tests.test_keirin_winticket_prior_events tests.test_keirin_prior_selection tests.test_keirin_prior_private_stage tests.test_keirin_winticket_ex_connection tests.test_keirin_weather_input_connection tests.test_keirin_github_owner_future_intake
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_cloud_pr71_state.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_cloud_workflow_guard.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_day_four_model_audit.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_cloud_pr71_variable.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_source_gap_plan.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_licensed_source_readiness.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_cloud_owner_inputs.py' -v
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_keirin_cloud_owner_source_cycle.py' -v
          python -m py_compile "$GITHUB_WORKSPACE/scripts/keirin_cloud_pr71_state.py" "$GITHUB_WORKSPACE/scripts/keirin_day_four_model_audit.py" "$GITHUB_WORKSPACE/scripts/keirin_cloud_pr71_variable.py" "$GITHUB_WORKSPACE/scripts/keirin_source_gap_plan.py" "$GITHUB_WORKSPACE/scripts/keirin_cloud_owner_inputs.py"
      - name: Do not claim synthetic results as live
        run: echo 'Synthetic model and AES tests are not actual real-race prediction evidence.' >> "$GITHUB_STEP_SUMMARY"
      - name: Main-only owner-approved real source connection without production secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE"
          private_dir="$(mktemp -d "$RUNNER_TEMP/owner-source-connection.XXXXXX")"
          trap 'rm -rf "$private_dir"' EXIT
          cd "$GITHUB_WORKSPACE/pr71-source"
          python "$GITHUB_WORKSPACE/scripts/keirin_cloud_owner_inputs.py" \
            --inbox "$private_dir" --owner-automatic-fetch-confirmed --budget-seconds 120
          echo 'Source acquisition and private partial-input replay only; not model completion or durable storage.' >> "$GITHUB_STEP_SUMMARY"

  public-preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '3,33 * * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9bb7e016e5200b5d25cbcc66b3ac6062b0c1aaa9
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: preflight-audit
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Next actual 7/9 rider pre-cutoff source, structural counts only
        shell: bash
        run: |
          set -euo pipefail
          day="$(TZ=Asia/Tokyo date +%F)"
          python -m scripts.keirin_next_published_race_probe --event-day-jst "$day" > "$RUNNER_TEMP/source.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"source.json").read_text())
          names=("status","race_id","source_races_observed","eligible_unstarted_races",
                 "rider_identity_count","preflight_checked_count",
                 "preflight_verified_source_count","required_source_slots_A_missing",
                 "critical_preflight_source_slots_missing","real_full_odds_verified",
                 "actual_model_prediction_saved")
          safe={k:d.get(k) for k in names}
          missing=d.get("required_source_gap_groups_A")
          total=d.get("required_source_slots_A_missing")
          if (type(missing) is dict and type(total) is int and
              all(type(k) is str and type(v) is int and 0<v<=100
                  for k,v in missing.items()) and sum(missing.values())==total):
              safe["missing_source_group_counts_A"]=missing
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Source-only 347-factor gate\n")
              f.write(f"Status: {safe.get('status')}\n")
              f.write(f"Missing model inputs: {safe.get('required_source_slots_A_missing')}\n")
              f.write("Source probe cannot produce PR71 predictions or legal permissions.\n")
          PY
      - name: Classify missing source origin instances without new GETs
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tests:$GITHUB_WORKSPACE/preflight-audit"
          python "$GITHUB_WORKSPACE/preflight-audit/scripts/keirin_source_gap_plan.py" \
            --probe "$RUNNER_TEMP/source.json" > "$RUNNER_TEMP/keirin-source-origin-plan.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"keirin-source-origin-plan.json").read_text())
          safe_keys=("state","required_model_feature_slots","missing_model_feature_slots",
                     "distinct_required_origin_instances","distinct_missing_origin_instances",
                     "missing_source_field_families","deficits_by_source_kind",
                     "license_rights_verified","formal_model_predictions_verified")
          safe={k:r.get(k) for k in safe_keys}
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Model input slots vs independent source measurements\n")
              out.write(f"Model slots missing: {safe.get('missing_model_feature_slots')}\n")
              out.write(f"Distinct source instances missing: {safe.get('distinct_missing_origin_instances')}\n")
              out.write("No unobserved values filled or rights inferred.\n")
          PY

  # Five-minute ticks have no provider access without required configuration.
  # Presence is not source-use authority: pinned owner admission still decides.
  config_readiness:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
    env:
      # Existing owner-approved personal public-page collection is independent
      # of optional provider-licensed JSON exports; not itself a vendor grant.
      RACE_AI_OWNER_AUTO_SOURCE_PROFILE: owner-approved-winticket-keirinjp-20261109
      RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
      RACE_AI_KEIRIN_FEED_ENDPOINT: ${{ secrets.RACE_AI_KEIRIN_FEED_ENDPOINT }}
      RACE_AI_KEIRIN_FEED_RIGHTS_REF: ${{ secrets.RACE_AI_KEIRIN_FEED_RIGHTS_REF }}
      RACE_AI_KEIRIN_LICENSE_MANIFEST_B64: ${{ secrets.RACE_AI_KEIRIN_LICENSE_MANIFEST_B64 }}
      RACE_AI_KEIRIN_LICENSE_DOCUMENT_B64: ${{ secrets.RACE_AI_KEIRIN_LICENSE_DOCUMENT_B64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fail closed before permissioned intake if source configuration is absent
        id: guard
        run: python -m scripts.keirin_live_source_readiness

  # Production secrets remain restricted to trusted main runtime.
  github-hosted-pr71-cycle:
    needs: config_readiness
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && needs.config_readiness.outputs.eligible == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.archive.outputs.committed }}
    env:
      RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
      RACE_AI_KEIRIN_FEED_ENDPOINT: ${{ secrets.RACE_AI_KEIRIN_FEED_ENDPOINT }}
      RACE_AI_KEIRIN_FEED_RIGHTS_REF: ${{ secrets.RACE_AI_KEIRIN_FEED_RIGHTS_REF }}
      RACE_AI_KEIRIN_LICENSE_MANIFEST_B64: ${{ secrets.RACE_AI_KEIRIN_LICENSE_MANIFEST_B64 }}
      RACE_AI_KEIRIN_LICENSE_DOCUMENT_B64: ${{ secrets.RACE_AI_KEIRIN_LICENSE_DOCUMENT_B64 }}
      RACE_AI_KEIRIN_FEED_TOKEN: ${{ secrets.RACE_AI_KEIRIN_FEED_TOKEN }}
      RACE_AI_OWNER_AUTO_SOURCE_PROFILE: owner-approved-winticket-keirinjp-20261109
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: 9bb7e016e5200b5d25cbcc66b3ac6062b0c1aaa9
          path: pr71-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Git AES state, run existing four models, encrypt only verified changes
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RACE_AI_STATE_KEY" ]]; then
            echo 'NO_PRIVATE_AES_KEY_HOLD' >> "$GITHUB_STEP_SUMMARY"
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/pr71-source"
          python "$GITHUB_WORKSPACE/scripts/keirin_cloud_pr71_state.py" cycle --repo "$GITHUB_WORKSPACE" --source-root "$GITHUB_WORKSPACE/pr71-source" > "$RUNNER_TEMP/pr71-cycle.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"pr71-cycle.json").read_text())
          yes=r["state"]=="CLOUD_PR71_ENCRYPTED_GIT_HISTORY_READBACK_VERIFIED"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("committed="+("true" if yes else "false")+"\n")
          safe={k:r.get(k) for k in ("state","generation","source_state","new_forecast_stage_nonzero","existing_pdca_invoked","result_rows_appended","result_rows_held","four_model_variable_saved","four_model_variable_held","missing_source_config_keys","owner_source_acquisition","official_result_independently_authenticated")}
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("GitHub-hosted PR71 state: "+str(r["state"])+"\n")
              f.write("Partial owner-source values do not authorize model promotion.\n")
              f.write("No source values, prediction tickets or private SQLite released.\n")
          PY

  independent-cloud-readback:
    needs: github-hosted-pr71-cycle
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.github-hosted-pr71-cycle.outputs.committed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9bb7e016e5200b5d25cbcc66b3ac6062b0c1aaa9
          path: pr71-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fresh GitHub runner verifies AES-GCM SHA, SQLite and unchanged four models
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE/pr71-source"
          python "$GITHUB_WORKSPACE/scripts/keirin_cloud_pr71_state.py" verify --repo "$GITHUB_WORKSPACE" --source-root "$GITHUB_WORKSPACE/pr71-source" > "$RUNNER_TEMP/pr71-readback.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"pr71-readback.json").read_text())
          if r["state"]!="PR71_SEPARATE_GITHUB_RUNNER_AES_GCM_READBACK_OK":
              raise SystemExit("INDEPENDENT_CLOUD_READBACK_NOT_VERIFIED")
          live=r.get("live_15min") or {}
          if live.get("schema")!="RACE_AI_LIVE_15MIN_PROOF_COUNTS_V1":
              raise SystemExit("LIVE_WINDOW_PROOF_COUNTER_MISSING")
          public={"state":r["state"],"generation":r["generation"],
                  "15min_proven_races":live["proven_races"],
                  "15min_model_result_pairs_proven":live["model_result_pairs_proven"],
                  "15min_holds_by_reason":live["holds"]}
          print(json.dumps(public,sort_keys=True))
          PY
      - name: Reconcile all 78 races and four original PR71 models after independent encrypted-state readback
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/pr71-source:$GITHUB_WORKSPACE/pr71-source/tests:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tests"
          cd "$GITHUB_WORKSPACE/pr71-source"
          python "$GITHUB_WORKSPACE/scripts/keirin_day_four_model_audit.py" \
            --cohort "$GITHUB_WORKSPACE/docs/evidence/2026-11-10/keirin_78r_source_only_cohort.json" \
            --encrypted-cloud-state --repo "$GITHUB_WORKSPACE" \
            --source-root "$GITHUB_WORKSPACE/pr71-source" > "$RUNNER_TEMP/pr71-78r-audit.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"pr71-78r-audit.json").read_text())
          assert d["expected_model_race_pairs"]==312
          assert d["frozen_model_race_pairs"]+d["model_race_pairs_missing"]==312
          safe={k:d[k] for k in ("scheduled_races","expected_model_race_pairs","frozen_four_model_races","missing_four_model_original_races","settled_research_races","formally_authenticated_model_race_scores")}
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## November 10: 78 races x 4 PR71 models\n")
              out.write(f"Verified frozen originals: {d['frozen_four_model_races']}\n")
              out.write(f"Originals missing, NOT counted as losses: {d['missing_four_model_original_races']}\n")
              out.write("Formal results remain separately gated.\n")
          PY
