name: P0 official preview HTML one-shot field audit
on:
  push:
    branches:
      - 'p0-exhibition-beforeinfo-20261024'
    paths:
      - 'docs/evidence/p0-exhibition-beforeinfo-trigger-20261024.txt'
permissions:
  contents: read
jobs:
  one_preview_get:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      RACE_AI_EXHIBIT_ONE_SHOT: ONE-MIKUNI-8R-PREVIEW-20261024
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-parser-reference
      - name: Read one official pre-race page through pinned PR64 parser
        run: python -m scripts.p0_real_mikuni_8r_preview_weather_20261024
