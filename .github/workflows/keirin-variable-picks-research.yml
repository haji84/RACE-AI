name: KEIRIN variable picks research regression
on:
  pull_request:
    paths:
      - "race_ai/keirin_variable_selection.py"
      - "race_ai/keirin_variable_integration.py"
      - "race_ai/keirin_real_rider_shadow.py"
      - "race_ai/keirin_shadow_variable_pair.py"
      - "race_ai/keirin_shadow_variable_intake.py"
      - "scripts/keirin_permissioned_owner_agent.py"
      - "tests/test_keirin_shadow_variable_pair.py"
      - "race_ai/keirin_private_spool.py"
      - "scripts/keirin_private_agent.py"
      - "tests/test_keirin_variable_selection.py"
      - "tests/test_keirin_variable_integration.py"
      - "tests/test_keirin_reference_history_recheck.py"
      - "race_ai/keirin_reference_history_recheck.py"
      - "scripts/keirin_reference_history_audit.py"
      - "scripts/keirin_variable_reconcile_private.py"
      - "docs/KEIRIN_VARIABLE_SELECTION_RESEARCH_20261108.md"
      - ".github/workflows/keirin-variable-picks-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variable-picks-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Synthetic only, never actual race profit
        env:
          PYTHONPATH: ".:tests"
        run: |
          python -m unittest -v tests.test_keirin_variable_selection tests.test_keirin_variable_integration tests.test_keirin_private_spool tests.test_keirin_private_agent tests.test_keirin_reference_history_recheck tests.test_keirin_shadow_variable_pair
          python -m compileall -q race_ai/keirin_variable_selection.py race_ai/keirin_variable_integration.py race_ai/keirin_private_spool.py race_ai/keirin_reference_history_recheck.py race_ai/keirin_real_rider_shadow.py race_ai/keirin_shadow_variable_pair.py race_ai/keirin_shadow_variable_intake.py scripts/keirin_private_agent.py scripts/keirin_permissioned_owner_agent.py scripts/keirin_reference_history_audit.py scripts/keirin_variable_reconcile_private.py
