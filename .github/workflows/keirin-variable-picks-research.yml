  workflow_dispatch:

permissions:
  contents: read

jobs:
  variable-picks-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read existing GitHub KEIRIN archive state (ciphertext only)
        uses: actions/checkout@v4
        with:
          ref: state/keirin-encrypted-history
          path: existing-keirin-history
          persist-credentials: false
      - name: Audit existing encrypted history without new DB or real-data assertions
        run: python -m scripts.keirin_existing_asset_preflight --state-tree "$GITHUB_WORKSPACE/existing-keirin-history"
      - name: Recover actual retained SYNTHETIC Git archive and verify SHA + SQLite
        run: python -m scripts.keirin_existing_archive_verify --state-tree "$GITHUB_WORKSPACE/existing-keirin-history" --source-repo "$GITHUB_WORKSPACE"
      - name: Synthetic only, never actual race profit
        env:
          PYTHONPATH: ".:tests"
        run: |
          python -m unittest -v tests.test_keirin_variable_selection tests.test_keirin_variable_integration tests.test_keirin_private_spool tests.test_keirin_private_agent tests.test_keirin_reference_history_recheck tests.test_keirin_saved_original_reference tests.test_keirin_shadow_variable_pair tests.test_keirin_mansha_rank_audit tests.test_keirin_pr71_four_model_rank tests.test_keirin_historical_asof_replay tests.test_keirin_historical_archive_inventory tests.test_keirin_historical_sparse_feature_probe tests.test_keirin_historical_context_gates tests.test_keirin_historical_prior_signal_rules tests.test_keirin_non_rakuten_sources tests.test_keirin_owner_approved_sources tests.test_keirin_owner_public_page_fetch tests.test_keirin_public_source_smoke tests.test_keirin_winticket_embedded_odds tests.test_keirin_winticket_embedded_racecard tests.test_keirin_future_public_ssr_probe tests.test_keirin_owner_captured_ssr_intake tests.test_keirin_winticket_day_index tests.test_keirin_owner_odds_csv tests.test_keirin_license_api_ingest tests.test_keirin_existing_asset_reuse tests.test_keirin_github_production_archive tests.test_keirin_public_ciphertext_consent
          python -m unittest -v tests.test_keirin_real_rider_shadow tests.test_keirin_allowed_delivery tests.test_keirin_pr71_source_ab_stage tests.test_keirin_83_reference_pdca_bridge tests.test_keirin_83_reference_pdca_runner tests.test_keirin_owner_manual tests.test_keirin_owner_saved_csv tests.test_keirin_owner_saved_hex tests.test_keirin_permissioned_owner tests.test_keirin_preflight
          python -m compileall -q scripts/keirin_winticket_day_index_diagnostic.py race_ai/keirin_winticket_day_index.py scripts/keirin_future_day_index_probe.py race_ai/keirin_owner_captured_ssr_intake.py scripts/keirin_future_public_ssr_probe.py race_ai/keirin_winticket_embedded_odds.py race_ai/keirin_winticket_embedded_racecard.py scripts/keirin_public_source_smoke.py race_ai/keirin_owner_approved_sources.py race_ai/keirin_owner_auto_sources.py race_ai/keirin_owner_public_page_fetch.py race_ai/keirin_public_ciphertext_consent.py scripts/keirin_github_production_archive.py scripts/keirin_github_production_bundle.py scripts/keirin_existing_archive_verify.py scripts/keirin_existing_asset_preflight.py race_ai/keirin_variable_selection.py race_ai/keirin_variable_integration.py race_ai/keirin_private_spool.py race_ai/keirin_reference_history_recheck.py race_ai/keirin_real_rider_shadow.py race_ai/keirin_real_shadow_intake.py race_ai/keirin_shadow_variable_pair.py race_ai/keirin_mansha_rank_audit.py race_ai/keirin_pr71_four_model_rank.py race_ai/keirin_historical_asof_replay.py race_ai/keirin_historical_archive_inventory.py race_ai/keirin_historical_sparse_feature_probe.py race_ai/keirin_historical_context_gates.py race_ai/keirin_historical_prior_signal_rules.py race_ai/keirin_pr71_source_ab_stage.py race_ai/keirin_83_reference_pdca_bridge.py scripts/keirin_83_reference_pdca.py scripts/keirin_historical_prior_signal_probe.py scripts/keirin_historical_archive_inventory.py scripts/keirin_historical_sparse_probe.py race_ai/keirin_existing_asset_reuse.py race_ai/keirin_shadow_variable_intake.py race_ai/keirin_owner_odds_csv.py race_ai/keirin_licensed_odds_export.py race_ai/keirin_licensed_api_ingest.py scripts/keirin_private_agent.py scripts/keirin_permissioned_owner_agent.py scripts/keirin_reference_history_audit.py scripts/keirin_saved_historical_replay.py scripts/keirin_variable_reconcile_private.py
      - name: One-shot REAL public site GET pre-cutoff, SHA/structural counts only
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        run: python -m scripts.keirin_public_source_smoke --one-shot

      - name: Probe FUTURE 11/10 Aomori 3R (public HTML only; no secret)
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        run: |
          python -m scripts.keirin_future_public_ssr_probe \
            --race-id 202611101203 \
            --racecard-url 'https://www.winticket.jp/keirin/aomori/racecard/2026110812/3/3' \
            --odds-url 'https://www.winticket.jp/keirin/aomori/odds/2026110812/3/3'

      - name: Probe NEXT 11/10 WINTICKET nationwide public day index
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        run: python -m scripts.keirin_future_day_index_probe --date 2026-11-10

      - name: Diagnose only day index public path shapes, no original data
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        run: python -m scripts.keirin_winticket_day_index_diagnostic --date 2026-11-10
