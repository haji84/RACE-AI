name: KEIRIN variable picks research regression
on:
  pull_request:
    paths:
      - "race_ai/keirin_variable_selection.py"
      - "race_ai/keirin_variable_integration.py"
      - "race_ai/keirin_real_rider_shadow.py"
      - "race_ai/keirin_real_shadow_intake.py"
      - "race_ai/keirin_shadow_variable_pair.py"
      - "race_ai/keirin_mansha_rank_audit.py"
      - "race_ai/keirin_pr71_four_model_rank.py"
      - "race_ai/keirin_historical_asof_replay.py"
      - "tests/test_keirin_historical_asof_replay.py"
      - "tests/test_keirin_pr71_four_model_rank.py"
      - "tests/test_keirin_mansha_rank_audit.py"
      - "race_ai/keirin_existing_asset_reuse.py"
      - "tests/test_keirin_existing_asset_reuse.py"
      - "scripts/keirin_existing_asset_preflight.py"
      - "scripts/keirin_existing_archive_verify.py"
      - "race_ai/keirin_shadow_variable_intake.py"
      - "race_ai/keirin_owner_odds_csv.py"
      - "race_ai/keirin_licensed_odds_export.py"
      - "scripts/keirin_github_production_archive.py"
      - "scripts/keirin_github_production_bundle.py"
      - "tests/test_keirin_github_production_archive.py"
      - "race_ai/keirin_licensed_api_ingest.py"
      - "tests/test_keirin_license_api_ingest.py"
      - "tests/test_keirin_owner_odds_csv.py"
      - "scripts/keirin_permissioned_owner_agent.py"
      - "tests/test_keirin_shadow_variable_pair.py"
      - "race_ai/keirin_private_spool.py"
      - "scripts/keirin_private_agent.py"
      - "tests/test_keirin_variable_selection.py"
      - "tests/test_keirin_variable_integration.py"
      - "tests/test_keirin_reference_history_recheck.py"
      - "race_ai/keirin_reference_history_recheck.py"
      - "scripts/keirin_saved_historical_replay.py"
      - "tests/test_keirin_saved_original_reference.py"
      - "scripts/keirin_reference_history_audit.py"
      - "scripts/keirin_variable_reconcile_private.py"
      - "docs/KEIRIN_VARIABLE_SELECTION_RESEARCH_20261108.md"
      - ".github/workflows/keirin-variable-picks-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variable-picks-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read existing GitHub KEIRIN archive state (ciphertext only)
        uses: actions/checkout@v4
        with:
          ref: state/keirin-encrypted-history
          path: existing-keirin-history
          persist-credentials: false
      - name: Audit existing encrypted history without new DB or real-data assertions
        run: python -m scripts.keirin_existing_asset_preflight --state-tree "$GITHUB_WORKSPACE/existing-keirin-history"
      - name: Recover actual retained SYNTHETIC Git archive and verify SHA + SQLite
        run: python -m scripts.keirin_existing_archive_verify --state-tree "$GITHUB_WORKSPACE/existing-keirin-history" --source-repo "$GITHUB_WORKSPACE"
      - name: Synthetic only, never actual race profit
        env:
          PYTHONPATH: ".:tests"
        run: |
          python -m unittest -v tests.test_keirin_variable_selection tests.test_keirin_variable_integration tests.test_keirin_private_spool tests.test_keirin_private_agent tests.test_keirin_reference_history_recheck tests.test_keirin_saved_original_reference tests.test_keirin_shadow_variable_pair tests.test_keirin_mansha_rank_audit tests.test_keirin_pr71_four_model_rank tests.test_keirin_historical_asof_replay tests.test_keirin_owner_odds_csv tests.test_keirin_license_api_ingest tests.test_keirin_existing_asset_reuse tests.test_keirin_github_production_archive
          python -m unittest -v tests.test_keirin_real_rider_shadow tests.test_keirin_allowed_delivery tests.test_keirin_owner_manual tests.test_keirin_owner_saved_csv tests.test_keirin_owner_saved_hex tests.test_keirin_permissioned_owner tests.test_keirin_preflight
          python -m compileall -q scripts/keirin_github_production_archive.py scripts/keirin_github_production_bundle.py scripts/keirin_existing_archive_verify.py scripts/keirin_existing_asset_preflight.py race_ai/keirin_variable_selection.py race_ai/keirin_variable_integration.py race_ai/keirin_private_spool.py race_ai/keirin_reference_history_recheck.py race_ai/keirin_real_rider_shadow.py race_ai/keirin_real_shadow_intake.py race_ai/keirin_shadow_variable_pair.py race_ai/keirin_mansha_rank_audit.py race_ai/keirin_pr71_four_model_rank.py race_ai/keirin_historical_asof_replay.py race_ai/keirin_existing_asset_reuse.py race_ai/keirin_shadow_variable_intake.py race_ai/keirin_owner_odds_csv.py race_ai/keirin_licensed_odds_export.py race_ai/keirin_licensed_api_ingest.py scripts/keirin_private_agent.py scripts/keirin_permissioned_owner_agent.py scripts/keirin_reference_history_audit.py scripts/keirin_saved_historical_replay.py scripts/keirin_variable_reconcile_private.py
