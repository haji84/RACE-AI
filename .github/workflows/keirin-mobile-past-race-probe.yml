name: KEIRIN legacy historic video archive metadata check

on:
  pull_request:
    paths:
      - 'scripts/keirin_mobile_past_race_probe.py'
      - '.github/workflows/keirin-mobile-past-race-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historic-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Inspect one previously listed public historic race
        run: |
          python scripts/keirin_mobile_past_race_probe.py "$RUNNER_TEMP/past-race-metadata.json"
      - name: Keep only public page metadata
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"past-race-metadata.json"
          x=json.loads(p.read_text()) if p.exists() else {}
          lines=["## Historical race candidate: metadata only",
             f"- HTTP: {x.get('http_code','UNKNOWN')}",
             f"- Title: {x.get('title','UNKNOWN')}",
             f"- Video tag count: {x.get('evidence',{}).get('video_count','UNKNOWN')}",
             f"- Race links: {len(x.get('evidence',{}).get('race_links',[]))}",
             f"- Video durations: {x.get('evidence',{}).get('videos',[])}",
             "- No full-four-lap identity, usage permission or media copying claimed."]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
