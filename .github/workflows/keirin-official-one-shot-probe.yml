name: KEIRIN official single-page transport check
# One additional diagnostic GET after the first HTTPError; no continuous polling.
on:
  push:
    branches:
      - feat/p0-offline-discovery-gate-20261022
    paths:
      - '.github/workflows/keirin-official-one-shot-probe.yml'

permissions:
  contents: read

jobs:
  keirin_one_page:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify result transport offline with invented HTML
        run: python -m unittest discover -s tests -p 'test_keirin_official_result_page.py' -v
      - name: Single GET of verified linked KEIRIN.JP historical result page, no raw HTML retained
        run: |
          python -m scripts.keirin_official_result_probe_once \
            --kcd 81 --ymd 20260321 --rno 11 \
            --ack-private-research-single-get
