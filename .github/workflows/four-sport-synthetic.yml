name: Four sport synthetic E2E
on:
  push:
    branches: ['codex/actions-four-sport-e2e']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    name: Synthetic E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check runner and runtime
        shell: bash
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3,10)"
          git rev-parse HEAD
      - name: Test odds isolation, deadlines and recovery (synthetic only)
        run: python -m unittest discover -s tests -v
      - name: Run four sport synthetic vertical E2E
        run: python -m race_ai.synthetic_e2e

