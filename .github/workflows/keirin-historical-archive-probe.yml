name: KEIRIN public historical replay metadata audit

on:
  pull_request:
    paths:
      - 'scripts/keirin_historical_archive_probe.py'
      - '.github/workflows/keirin-historical-archive-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-archive-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Check source imports without touching a media file
        run: python -m py_compile scripts/keirin_historical_archive_probe.py
      - name: Inspect historical public archive page metadata
        run: |
          python scripts/keirin_historical_archive_probe.py "$RUNNER_TEMP/historical-archives.json"
      - name: Print bounded discovery outcome (no video bytes)
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json
          p=Path(os.environ["RUNNER_TEMP"])/"historical-archives.json"
          rows=json.loads(p.read_text())["pages"] if p.exists() else []
          items=["## Historical full-race archive discovery","Not evidence that old videos include all four laps."]
          for row in rows:
              items += ["### "+row["source"],
                        "HTTP status: "+str(row.get("http_code")),
                        "Title: "+str(row.get("title")),
                        "Video elements: "+str(row.get("metadata",{}).get("video_count")),
                        "Video evidence: "+json.dumps(row.get("metadata",{}).get("videos",[]),ensure_ascii=False),
                        "Error: "+str(row.get("error_type"))]
          items.append("No raw footage, authorization tokens, or user video uploaded.")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(items)+"\n")
          print("\n".join(items))
          PY
