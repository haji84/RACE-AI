name: WINTICKET Matsuyama 1R browser playback probe

on:
  pull_request:
    paths:
      - 'scripts/keirin_winticket_replay_probe.py'
      - '.github/workflows/keirin-winticket-replay-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-race-metadata-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            docs
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Validate probe syntax
        run: python -m py_compile scripts/keirin_winticket_replay_probe.py
      - name: Probe public live and existing Matsuyama 1R result replay
        id: probe
        continue-on-error: true
        run: |
          python scripts/keirin_winticket_replay_probe.py --report "$RUNNER_TEMP/winticket-replay-probe.json"
      - name: Publish technical evidence without footage
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ["RUNNER_TEMP"])/"winticket-replay-probe.json"
          data=json.loads(p.read_text()) if p.exists() else {}
          lines=["## Matsuyama 2026-11-08 1R WINTICKET feasibility",
                 "- Live page: https://www.winticket.jp/keirin/matsuyama/live",
                 "- Completed race 1R page: https://www.winticket.jp/keirin/matsuyama/raceresult/2026110875/1/1",
                 "- Only public UI/player metadata tested. No video downloaded, copied, or published.",
                 "- Video accessible does NOT establish four complete laps."]
          for name,p in data.get("pages",{}).items():
              lines.append("### "+name)
              lines.append("- Browser status: "+str(p.get("status")))
              lines.append("- HTTP status: "+str(p.get("http_code")))
              lines.append("- Replay clicked: "+str(p.get("replay_clicked")))
              lines.append("- Player before: "+json.dumps(p.get("before",{}),ensure_ascii=False))
              lines.append("- Player after: "+json.dumps(p.get("after",{}),ensure_ascii=False))
              lines.append("- Player later: "+json.dumps(p.get("later",{}),ensure_ascii=False))
              lines.append("- Player advanced: "+str(p.get("video_time_advanced")))
              lines.append("- Error type: "+str(p.get("error_type")))
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
      - name: Fail closed if no page was inspected
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json
          p=Path(os.environ["RUNNER_TEMP"])/"winticket-replay-probe.json"
          o=json.loads(p.read_text()) if p.exists() else {}
          if not any(x.get("status")=="PROBE_COMPLETE" for x in o.get("pages",{}).values()):
              raise SystemExit("NO_WINTICKET_BROWSER_PAGE_INSPECTED")
          print("Page inspection done, not a race recording or four-lap verification.")
          PY
