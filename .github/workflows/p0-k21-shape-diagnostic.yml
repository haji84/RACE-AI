name: P0 diagnose malformed K 2026-10-21 aggregate only
on:
  push:
    branches:
      - 'p0-k21-shape-20261024'
    paths:
      - 'docs/evidence/p0-k21-shape-trigger-20261024.txt'
permissions:
  contents: read
jobs:
  one_k21_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      RACE_AI_K21_SHAPE: K21-ONE-DIAGNOSTIC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-parser-reference
      - name: One K archive redacted whole-vs-partial parse diagnostic
        run: python -m scripts.p0_one_shot_k21_shape_diagnostic
