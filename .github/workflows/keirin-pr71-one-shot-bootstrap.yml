# One-time opt-in bootstrap only. Does not replace or claim schedule success.
# Production PR71 keeps its main + schedule/workflow_dispatch gate.
name: KEIRIN PR71 one-shot production diagnosis
on:
  pull_request:
    paths:
      - '.github/workflows/keirin-pr71-one-shot-bootstrap.yml'
      - 'tests/test_keirin_pr71_one_shot_bootstrap.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-pr71-one-shot-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: keirin-pr71-one-shot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: One-shot controls and privilege boundary
        run: python -m unittest discover -s tests -p 'test_keirin_pr71_one_shot_bootstrap.py' -v

  one-time-dispatch:
    # Exact explicit merge-commit title acts as additional opt-in. Not on PR.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'haji84/RACE-AI' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'haji84' &&
      startsWith(github.event.head_commit.message, 'test(keirin): one-shot-PR71-bootstrap-20261110')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check exact trusted main and existing PR71 workflow state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha="$(gh api repos/haji84/RACE-AI/branches/main --jq '.commit.sha')"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo 'HOLD_MAIN_MOVED_BEFORE_DIAGNOSTIC'
            exit 2
          fi
          status="$(gh api repos/haji84/RACE-AI/actions/workflows/keirin-pr71-owner-autonomous.yml --jq '.state')"
          if [[ "$status" != "active" ]]; then
            echo 'HOLD_PR71_WORKFLOW_NOT_ACTIVE'
            exit 2
          fi
          echo 'Trusted main and active pre-existing producer confirmed.'

      - name: Dispatch pre-existing trusted main PR71 once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/haji84/RACE-AI/actions/workflows/keirin-pr71-owner-autonomous.yml/dispatches \
            -f ref=main --silent
          {
            echo '### Existing PR71 workflow dispatched'
            echo 'This is one diagnostic workflow_dispatch, NOT a schedule run.'
            echo 'The producer still refuses absent AES keys, unauthorized feeds,'
            echo 'incomplete model inputs and forecasts after the cutoff.'
            echo 'Do not treat a 204 dispatch acknowledgement as a completed production cycle.'
          } >> "$GITHUB_STEP_SUMMARY"
