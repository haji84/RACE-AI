name: KEIRIN Sasebo historic official archive discovery

on:
  pull_request:
    paths:
      - 'scripts/keirin_sasebo_official_archive_probe.py'
      - '.github/workflows/keirin-sasebo-archive-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-shot-public-source-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Syntax check
        run: python -m py_compile scripts/keirin_sasebo_official_archive_probe.py
      - name: Inspect operator historic index and two full-day broadcast pages
        run: |
          python scripts/keirin_sasebo_official_archive_probe.py "$RUNNER_TEMP/sasebo-historic-sources.json"
      - name: Publish metadata only
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ['RUNNER_TEMP'])/'sasebo-historic-sources.json'
          data=json.loads(f.read_text()) if f.exists() else {}
          lines=['## Sasebo historical full broadcast discovery',
                 'Media recorded/downloaded: NO',
                 'JCI video re-use rights verified: NO',
                 'Full 4-lap real racing content verified: NO']
          for item in data.get('candidates',[]):
              lines.append('- '+item['source_id']+
                           ': http='+str(item.get('http_status'))+
                           ' player='+str(item.get('player',{}).get('player_status'))+
                           ' channel='+str(item.get('player',{}).get('channel_id')))
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
