name: BOAT owner-formal live Pages HTTP proof (source-free)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/boat-owner-formal-live-pages-proof.yml
      - scripts/boat_native_safari_acceptance.py
      - tests/test_boat_native_safari_acceptance.py
  push:
    branches: [main]
    paths:
      - .github/workflows/boat-owner-formal-live-pages-proof.yml
      - scripts/boat_native_safari_acceptance.py
      - tests/test_boat_native_safari_acceptance.py
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Keep the existing HTTP proof, or additionally verify native desktop Safari (not an iPhone)'
        type: choice
        options: [current-http, native-safari]
        default: current-http
permissions:
  contents: read
concurrency:
  group: boat-owner-formal-live-pages-http-proof
  cancel-in-progress: false
jobs:
  verify_live_http:
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'gh-pages' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    # Standard macOS compute is free in this public repo. No matrix or extra job.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari' && 'macos-15-intel' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari' && 20 || 6 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f60308ef7443ca13b5ca23c4896e15ffc67b0427
          persist-credentials: false
      - name: Match GitHub Pages HTTP response bytes to deployed SHA and manifest
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,urllib.parse
          from pathlib import Path
          base='https://haji84.github.io/RACE-AI/'
          manifest=json.loads(Path('site-build.json').read_bytes())
          assert manifest['schema']=='RACE_AI_SAVED_PAGES_BUILD_V1'
          assert manifest['forecast_sha256']=='4169db99a1d99bbcf96c8fa1bfb076ed2d2fb1f434fc64cf7e43b38e55f5adda'
          selected=('index.html','app.js','saved-performance.js','saved-view-crypto.js')
          index=Path('index.html').read_text()
          for path in selected:
              local=Path(path).read_bytes()
              digest=hashlib.sha256(local).hexdigest()
              assert manifest['files'][path]=={'bytes':len(local),'sha256':digest},'SAVED_PAGES_MANIFEST_MISMATCH'
              if path.endswith('.js'):
                  assert './'+path+'?v='+digest[:12] in index,'INDEX_SCRIPT_VERSION_MISMATCH'
              url=base+path+'?verify=f60308ef7443ca13b5ca23c4896e15ffc67b0427'
              request=urllib.request.Request(url,headers={
                  'User-Agent':'RACE-AI-owner-pages-public-proof/1',
                  'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=24) as response:
                  assert response.status==200,'LIVE_PAGES_HTTP_UNAVAILABLE'
                  final=urllib.parse.urlsplit(response.url)
                  assert final.hostname=='haji84.github.io' and final.path=='/RACE-AI/'+path, 'LIVE_PAGES_HOST_OR_PATH_CHANGED'
                  body=response.read(len(local)+1)
              assert body==local and hashlib.sha256(body).hexdigest()==digest,'LIVE_PAGES_BYTES_DIFFER'
          assert '<section id="boat-owner-formal-proof"' in index
          assert 'owner-formal.js' not in index and 'owner-formal.js' not in manifest['files']
          assert b'RaceOwnerFormal' in Path('app.js').read_bytes()
          assert 'app.js?v=b7968390d2a9' in index
          print(json.dumps({
              'status':'BOAT_HARDENED_LIVE_PAGES_HTTP_MATCH',
              'paths_checked':list(selected),
              'page_sha':'f60308ef7443ca13b5ca23c4896e15ffc67b0427',
              'original_encrypted_forecasts_unchanged':True,
              'official_racing_provider_gets':0},sort_keys=True))
          PY
      - name: Checkout the exact proposed Safari acceptance adapter and tests
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari')
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .native-safari-tools
          persist-credentials: false
      - name: Use the existing supported Python for authenticated saved-view reads
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exercise source-free Safari privacy and identity boundaries
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari')
        working-directory: .native-safari-tools
        run: python3 -m unittest discover -s tests -p 'test_boat_native_safari_acceptance.py' -v
      - name: Checkout the immutable read-only P1 context code
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: eff296f6d54ad4be297d93e32f1ee0d4592ad9e3
          path: .native-safari-source
          persist-credentials: false
      - name: Install only existing pinned saved-view AES dependencies
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari'
        run: python3 -m pip install --disable-pip-version-check -r .native-safari-source/requirements-history.txt
      - name: Install the existing immutable parser used by the authenticated reader
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: .native-safari-source/pr64-reference
          persist-credentials: false
      - name: Install the existing immutable adapters used by the authenticated reader
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: .native-safari-source/pr72-reference
          persist-credentials: false
      - name: Verify real desktop Safari with authenticated originals and private loopback transport
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari'
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          # Read-only context code installs its own repository-scoped credential.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ''
        run: |
          python3 .native-safari-tools/scripts/boat_native_safari_acceptance.py \
            --source-root .native-safari-source --public-root .
      # A separate process starts only after every real-data Safari context and
      # loopback server above has closed. It has no owner credentials or URLs.
      - name: Checkout the exact reviewed UI candidate for synthetic capture only
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f723f0e8b94a87a6d6a7b414b1bb30954541925e
          path: .native-safari-ui-candidate
          persist-credentials: false
      - name: Capture pinned UI candidate in seven pages and four widths
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari'
        run: |
          env -i PATH="$PATH" HOME="$HOME" LANG="${LANG:-en_US.UTF-8}" TMPDIR="${TMPDIR:-/tmp}" \
            python3 .native-safari-tools/scripts/boat_native_safari_acceptance.py \
            --public-root .native-safari-ui-candidate/web --synthetic-only --candidate-ui \
            --output "$RUNNER_TEMP/race-ai-ui-candidate-safari"
          env -i PATH="$PATH" HOME="$HOME" LANG="${LANG:-en_US.UTF-8}" TMPDIR="${TMPDIR:-/tmp}" \
            python3 .native-safari-tools/scripts/boat_native_safari_acceptance.py \
            --public-root .native-safari-ui-candidate/web --candidate-ui \
            --verify-synthetic-artifacts "$RUNNER_TEMP/race-ai-ui-candidate-safari"
      - name: Retain only verified synthetic Safari screenshots
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.browser == 'native-safari'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: race-ai-ui-candidate-safari-f723f0e8-${{ github.sha }}
          path: ${{ runner.temp }}/race-ai-ui-candidate-safari/*.png
          if-no-files-found: error
          retention-days: 7
