    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      capture: ${{ steps.window.outputs.capture }}
      settle: ${{ steps.window.outputs.settle }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
