      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: keirin-form-canary-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/keirin-form-canary-readback
      - name: Verify both committed ciphertext originals on a separate runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5'
          python -m scripts.keirin_github_only_ab_readback \
