            --out "$RUNNER_TEMP/keirin-git-independent.json" \
            > "$RUNNER_TEMP/keirin-git-independent-safe.json"
          cat "$RUNNER_TEMP/keirin-git-independent-safe.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-github-only-ab-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/keirin-git-independent.json
          if-no-files-found: error
