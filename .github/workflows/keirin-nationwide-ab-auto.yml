      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: keirin-github-only-ab-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/keirin-ab-independent
      - name: Verify actual committed Git ciphertext on separate runner
        shell: bash
        run: |
