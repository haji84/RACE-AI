          cat "$RUNNER_TEMP/kochi5-nonpii-shape.json"
          cat "$RUNNER_TEMP/kochi5-nonpii-shape.json" >> "$GITHUB_STEP_SUMMARY"

  owner-auto-generate:
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      github.ref == 'refs/heads/main' &&
      vars.RACE_AI_KEIRIN_AB_AUTOGEN_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'run'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      ready: ${{ steps.registry_gate.outputs.ready }}
    env:
      PUBLIC_CAPTURE_ENABLED: ${{ vars.RACE_AI_AB_PUBLIC_CAPTURE_ENABLED }}
      AWS_ACCESS_KEY_ID: ${{ secrets.RACE_AI_AB_SOURCE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.RACE_AI_AB_SOURCE_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.RACE_AI_AB_SOURCE_REGION }}
      AWS_ENDPOINT_URL: ${{ vars.RACE_AI_AB_SOURCE_ENDPOINT }}
      SOURCE_S3_PREFIX: ${{ vars.RACE_AI_AB_SOURCE_S3_PREFIX }}
      OWNER_RSA_PUBLIC_PEM_B64: ${{ vars.RACE_AI_AB_RSA_PUBLIC_PEM_B64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare source and ciphertext only in runner private storage
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          day="$(TZ=Asia/Tokyo date +%F)"
          root="$RUNNER_TEMP/keirin-nationwide-ab-$GITHUB_RUN_ID"
          mkdir -m 700 -p "$root" "$root/cards" "$root/raw" "$root/sealed" "$root/registry" "$root/manifests"
          chmod 700 "$root" "$root/cards" "$root/raw" "$root/sealed" "$root/registry" "$root/manifests"
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Read already-owner-approved private pre-race source bundle
        id: ingest
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_S3_PREFIX" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || \
             [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$AWS_DEFAULT_REGION" ] || \
             [ -z "$OWNER_RSA_PUBLIC_PEM_B64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "HOLD: private source feed or existing owner public RSA key is not configured" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$SOURCE_S3_PREFIX" in
            s3://*) ;;
            *) echo "HOLD: source must be an owner-controlled S3 URI"; exit 1 ;;
          esac
          python -m pip install --disable-pip-version-check awscli 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5'
          day="${{ steps.storage.outputs.day }}"
          root="${{ steps.storage.outputs.root }}"
          # Source pages, line hypotheses, rider data remain private.
          aws s3 sync "$SOURCE_S3_PREFIX/$day/cards/" "$root/cards/" --only-show-errors --no-progress
          aws s3 sync "$SOURCE_S3_PREFIX/$day/raw/" "$root/raw/" --only-show-errors --no-progress
          aws s3 sync "$SOURCE_S3_PREFIX/$day/registry/" "$root/registry/" --only-show-errors --no-progress
          if [ "$PUBLIC_CAPTURE_ENABLED" = 'true' ]; then
            aws s3 sync "$SOURCE_S3_PREFIX/$day/manifests/" "$root/manifests/" --only-show-errors --no-progress
          fi
          python - <<'PY'
          import os,base64
          from pathlib import Path
          from race_ai.keirin_nationwide_auto_storage import checked_public_key
          root=Path(os.environ["RUNNER_TEMP"])/("keirin-nationwide-ab-"+os.environ["GITHUB_RUN_ID"])
          data=base64.b64decode(os.environ["OWNER_RSA_PUBLIC_PEM_B64"],validate=True)
          checked_public_key(data)
          dest=root/"owner-public.pem"
          fd=os.open(dest,os.O_CREAT|os.O_EXCL|os.O_WRONLY|getattr(os,"O_NOFOLLOW",0),0o600)
          with os.fdopen(fd,"wb") as h:h.write(data)
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Register current JST day from observed public links when owner registry is absent
        if: steps.ingest.outputs.ready == 'true' && vars.RACE_AI_AB_PUBLIC_CAPTURE_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.storage.outputs.root }}"
          day="${{ steps.storage.outputs.day }}"
          if [ "$day" != '2026-11-18' ] && [ ! -s "$root/registry/$day.json" ]; then
            # Only observed calendar -> meeting -> race anchors can enter this
            # roster. A partial provider list remains UNVERIFIED, not national.
            if python -m scripts.keirin_register_public_day \
              --day "$day" \
              --private-raw-dir "$root/raw" \
              --registry "$root/registry/$day.json" \
              --manifest "$root/manifests/day.json" \
              --safe-report "$root/registry-safe-report.json" \
              > "$RUNNER_TEMP/registry-safe-counts.json"; then
              cat "$RUNNER_TEMP/registry-safe-counts.json" >> "$GITHUB_STEP_SUMMARY"
              aws s3 cp "$root/registry/$day.json" "$SOURCE_S3_PREFIX/$day/registry/$day.json" --only-show-errors
              aws s3 cp "$root/manifests/day.json" "$SOURCE_S3_PREFIX/$day/manifests/day.json" --only-show-errors
              aws s3 sync "$root/raw/" "$SOURCE_S3_PREFIX/$day/raw/" --only-show-errors --no-progress
              echo "REGISTRY_PARTIAL_PUBLIC_LINKS_NATIONAL_UNIVERSE_UNVERIFIED" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "HOLD_NEW_DAY_REGISTRY_SOURCE_UNAVAILABLE" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Verify real current-day registry before creating any forecast
        if: steps.ingest.outputs.ready == 'true'
        id: registry_gate
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.storage.outputs.root }}"
          day="${{ steps.storage.outputs.day }}"
          if [ "$day" = '2026-11-18' ]; then
            registry="$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_all79_nationwide_AB_registered_v1.json"
          else
            registry="$root/registry/$day.json"
          fi
          if [ ! -s "$registry" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "HOLD_CURRENT_JST_DAY_REGISTRY_MISSING" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if python - "$registry" "$day" <<'PY'
          import json,sys
          from scripts.keirin_nationwide_auto_forecast import registered_race_ids
          path,day=sys.argv[1:]
          with open(path,encoding="utf-8") as stream:
              doc=json.load(stream)
          if doc.get("day_jst")!=day:
              raise ValueError("REGISTRY_DAY_NOT_CURRENT_JST_DAY")
          ids=registered_race_ids(doc)
          if not ids:
              raise ValueError("DAY_NO_REGISTERED_RACES")
          if doc.get("national_universe_unverified_hold"):
              print("PARTIAL_ROSTER_NATIONAL_COVERAGE_UNVERIFIED")
          else:
              print("ROSTER_INPUT_CHECKED_NOT_A_LIVE_FORECAST_PROOF")
          PY
          then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "HOLD_CURRENT_DAY_REGISTRY_INVALID" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Capture approved ordinary public racecards and automatically normalize all available data
        if: steps.registry_gate.outputs.ready == 'true' && vars.RACE_AI_AB_PUBLIC_CAPTURE_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.storage.outputs.root }}"
          day="${{ steps.storage.outputs.day }}"
          if [ "$day" = '2026-11-18' ]; then
            registry="$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_all79_nationwide_AB_registered_v1.json"
          else
            registry="$root/registry/$day.json"
          fi
          manifest="$root/manifests/day.json"
          if [ ! -f "$manifest" ]; then
            # Kdreams public calendar and meeting HTML anchors, not fabricated
            # direct URLs. If the ordinary GET is denied, leave HOLD.
            if python -m scripts.keirin_discover_public_race_links \
              --day "$day" \
              --registry "$registry" \
              --manifest "$manifest" \
              --safe-report "$root/day-link-discovery.json" > "$RUNNER_TEMP/day-link-safe.json"; then
              cat "$RUNNER_TEMP/day-link-safe.json" >> "$GITHUB_STEP_SUMMARY"
              aws s3 cp "$manifest" "$SOURCE_S3_PREFIX/$day/manifests/day.json" --only-show-errors
            else
              echo "HOLD_DAY_RACE_DETAIL_URLS_NOT_LINKED_OR_ACCESS_DENIED" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ -f "$manifest" ]; then
            python -m scripts.keirin_capture_public_two_sources \
              --day-manifest "$manifest" \
              --registry "$registry" \
              --private-cards-dir "$root/cards" \
              --private-raw-dir "$root/raw" \
              --max-races 8 \
              --report "$root/capture-summary.json" > "$RUNNER_TEMP/capture-safe-counts.json"
            cat "$RUNNER_TEMP/capture-safe-counts.json" >> "$GITHUB_STEP_SUMMARY"
            # Owner-only private persistent source cache across 10-min jobs.
            # No source or rider content is copied to a public artifact.
            aws s3 sync "$root/raw/" "$SOURCE_S3_PREFIX/$day/raw/" --only-show-errors --no-progress
            aws s3 sync "$root/cards/" "$SOURCE_S3_PREFIX/$day/cards/" --only-show-errors --no-progress
          fi
      - name: Automatically generate A/B for every available race and seal with owner RSA/AES
        if: steps.registry_gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.storage.outputs.root }}"
          day="${{ steps.storage.outputs.day }}"
          if [ "$day" = '2026-11-18' ]; then
            registry="$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_all79_nationwide_AB_registered_v1.json"
          else
            registry="$root/registry/$day.json"
          fi
          python -m scripts.keirin_nationwide_auto_forecast \
            --registry "$registry" \
            --private-racecards-dir "$root/cards" \
            --raw-pages-dir "$root/raw" \
            --private-output-dir "$root/sealed" \
            --owner-rsa-public-pem "$root/owner-public.pem" \
            --safe-summary "$root/producer-summary.json" > "$RUNNER_TEMP/ab-safe-counts.json"
          cat "$RUNNER_TEMP/ab-safe-counts.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload encrypted ONLY, plus safe readback receipts
        if: steps.registry_gate.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-auto-ab-cipher-${{ github.run_id }}
          path: |
            ${{ steps.storage.outputs.root }}/sealed/*.sealed.json
            ${{ steps.storage.outputs.root }}/producer-summary.json
          if-no-files-found: error
          retention-days: 21
      - name: Remove private racecard and owner source from temporary disk
        if: always()
        shell: bash
        run: |
          root="${{ steps.storage.outputs.root }}"
          if [ -n "$root" ] && [ -d "$root" ] && [[ "$root" == "$RUNNER_TEMP"/keirin-nationwide-ab-* ]]; then
            rm -rf -- "$root"
          fi

  independent-cipher-readback:
