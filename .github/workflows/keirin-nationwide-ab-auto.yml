            --owner-public-pem "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem" \
            --report "$root/safe/summary.json" > "$root/counts.json" || status=$?
          cat "$root/counts.json" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / ('keirin-form-canary-' + os.environ['GITHUB_RUN_ID']) / 'safe/summary.json'
          report = json.loads(path.read_text())
          ready = report.get('new_A_B_git_archived') == 1 and report.get('new_conditioned_A_B_git_archived') == 1
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('archived=' + str(ready).lower() + '\n')
