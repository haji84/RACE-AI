        id: window
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import os
          from race_ai.keirin_github_origin_evidence import form_canary_window
          window = form_canary_window(datetime.now(timezone.utc))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('capture', 'settle'):
                  output.write(key + '=' + str(window[key]).lower() + '\n')
          PY

