name: KEIRIN nationwide automated A and B research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-nationwide-ab-auto.yml'
      - 'scripts/keirin_official_readiness.py'
      - 'scripts/keirin_official_saved_check.py'
      - 'scripts/keirin_official_day_pipeline.py'
      - 'scripts/keirin_official_form_canary.py'
      - 'race_ai/keirin_provider_reconciliation.py'
      - 'race_ai/keirin_official_source_continuation.py'
      - 'race_ai/keirin_official_nationwide_*.py'
      - 'race_ai/keirin_official_condition_trial.py'
      - 'race_ai/keirin_official_class_evidence.py'
      - 'tests/test_keirin_official_class_evidence.py'
      - 'race_ai/keirin_nationwide_forecast_view.py'
      - 'scripts/keirin_official_nationwide_continuation.py'
      - 'tests/test_keirin_official_continuation_workflow.py'
      - 'scripts/keirin_capture_official_form_history.py'
      - 'race_ai/keirin_nationwide_auto_storage.py'
      - 'scripts/keirin_runtime_selection.py'
      - 'tests/test_keirin_runtime_exclusion.py'
      - 'tests/test_keirin_official_readiness.py'
      - 'tests/test_keirin_official_saved_check.py'
      - 'tests/test_keirin_official_workflow.py'
  pull_request:
    paths:
      - 'race_ai/keirin_nationwide_auto_*.py'
      - 'race_ai/keirin_nationwide_forecast_view.py'
      - 'race_ai/keirin_public_forecast_*.py'
      - 'tests/test_keirin_nationwide_forecast_view.py'
      - 'tests/test_keirin_public_forecast_*.py'
      - 'scripts/keirin_publish_forecast_*.py'
      - 'scripts/keirin_publish_mac_operations.py'
      - 'tests/test_keirin_publish_mac_operations.py'
      - 'race_ai/keirin_rider_form_evidence.py'
      - 'race_ai/keirin_form_fall_shadow.py'
      - 'race_ai/keirin_form_history_admission.py'
      - 'race_ai/keirin_form_fall_blind_pdca.py'
      - 'tests/test_keirin_rider_form_evidence.py'
      - 'scripts/keirin_form_fall_owner_view.py'
      - 'tests/test_keirin_form_fall_owner_view.py'
      - 'tests/test_keirin_form_history_admission.py'
      - 'tests/test_keirin_form_fall_blind_pdca.py'
      - 'tests/test_keirin_form_canary_*.py'
      - 'scripts/keirin_capture_official_form_history.py'
      - 'scripts/keirin_nationwide_auto_forecast.py'
      - 'scripts/keirin_register_public_day.py'
      - 'scripts/keirin_github_only_ab_*.py'
      - 'tests/test_keirin_github_only_ab_day.py'
      - 'race_ai/keirin_github_provider_stop.py'
      - 'race_ai/keirin_provider_reconciliation.py'
      - 'tests/test_keirin_provider_reconciliation.py'
      - 'race_ai/keirin_github_capture_selection.py'
      - 'tests/test_keirin_github_capture_selection.py'
      - 'tests/test_keirin_github_provider_stop.py'
      - 'race_ai/keirin_secondary_result_consensus.py'
      - 'scripts/keirin_secondary_result_poll.py'
      - 'tests/test_keirin_secondary_result_consensus.py'
      - 'scripts/keirin_github_only_result_day.py'
      - 'tests/test_keirin_github_only_result_day.py'
      - 'tests/test_keirin_register_public_day.py'
      - 'scripts/keirin_nationwide_independent_cipher_readback.py'
      - 'tests/test_keirin_nationwide_auto_*.py'
      - 'race_ai/keirin_official_*.py'
      - 'tests/test_keirin_official_condition_trial.py'
      - 'race_ai/keirin_github_evidence_client.py'
      - 'race_ai/keirin_github_origin_evidence.py'
      - 'race_ai/keirin_nationwide_cipher_history.py'
      - 'race_ai/keirin_dynamic_nationwide_registry.py'
      - 'scripts/keirin_official_*.py'
      - 'tests/test_keirin_official_*.py'
      - 'tests/test_keirin_github_evidence_client.py'
      - 'tests/test_keirin_github_origin_evidence.py'
      - 'tests/test_keirin_nationwide_cipher_history.py'
      - 'tests/test_keirin_dynamic_nationwide_registry.py'
      - 'scripts/keirin_runtime_selection.py'
      - 'tests/test_keirin_runtime_exclusion.py'
      - 'race_ai/keirin_legacy_evening_replay.py'
      - 'scripts/keirin_legacy_evening_audit.py'
      - 'tests/test_keirin_legacy_evening_replay.py'
      - '.github/workflows/keirin-nationwide-ab-auto.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: test
        options: [test, readiness, saved-only, run, form-canary, form-canary-reconcile, official-continue]
  schedule:
    # Can be delayed, so published cutoff is checked again at actual save.
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: keirin-nationwide-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-free-tests:
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.mode == 'test' || inputs.mode == 'readiness' || inputs.mode == 'saved-only' || inputs.mode == 'form-canary' || inputs.mode == 'form-canary-reconcile' || inputs.mode == 'official-continue'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify executable prediction and real ephemeral AES/RSA safety
        run: |
          python -m pip install --disable-pip-version-check 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5'
          python -m unittest -v \
            tests.test_keirin_nationwide_auto_generator \
            tests.test_keirin_rider_form_evidence \
            tests.test_keirin_form_fall_owner_view \
            tests.test_keirin_form_history_admission \
            tests.test_keirin_form_fall_blind_pdca \
            tests.test_keirin_form_canary_origin \
            tests.test_keirin_form_canary_workflow \
            tests.test_keirin_form_canary_backfill \
            tests.test_keirin_provider_reconciliation \
            tests.test_keirin_form_canary_reconciliation \
            tests.test_keirin_official_form_history \
            tests.test_keirin_official_canary_card \
            tests.test_keirin_official_canary_join \
            tests.test_keirin_official_nationwide_extension \
            tests.test_keirin_official_source_continuation \
            tests.test_keirin_official_class_evidence \
            tests.test_keirin_official_nationwide_continuation \
            tests.test_keirin_official_condition_trial \
            tests.test_keirin_official_nationwide_sources \
            tests.test_keirin_official_nationwide_records \
            tests.test_keirin_official_continuation_workflow \
            tests.test_keirin_nationwide_forecast_view \
            tests.test_keirin_official_public_card_details \
            tests.test_keirin_public_forecast_details \
            tests.test_keirin_public_forecast_odds \
            tests.test_keirin_publish_mac_operations \
            tests.test_keirin_public_forecast_updates \
            tests.test_keirin_result_unread_racecard \
            tests.test_keirin_official_form_canary \
            tests.test_keirin_nationwide_auto_storage \
            tests.test_keirin_nationwide_auto_runner \
            tests.test_keirin_nationwide_auto_settlement \
            tests.test_keirin_nationwide_cipher_history \
            tests.test_keirin_public_two_source_normalizer \
            tests.test_keirin_capture_public_two_sources \
            tests.test_keirin_utsunomiya1r_real_auto_cipher_freeze \
            tests.test_keirin_evening_national_real_AB_20261118 \
            tests.test_keirin_discover_public_race_links \
            tests.test_keirin_register_public_day \
            tests.test_keirin_nationwide_auto_day_registry_workflow \
            tests.test_keirin_github_only_ab_day \
            tests.test_keirin_github_provider_stop \
            tests.test_keirin_github_capture_selection \
            tests.test_keirin_secondary_result_consensus \
            tests.test_keirin_github_only_result_day \
            tests.test_keirin_dynamic_nationwide_registry \
            tests.test_keirin_github_evidence_client \
            tests.test_keirin_github_origin_evidence \
            tests.test_keirin_official_public_source \
            tests.test_keirin_official_cohort \
            tests.test_keirin_official_poll_progress \
            tests.test_keirin_official_run_history \
            tests.test_keirin_official_day_pipeline \
            tests.test_keirin_official_runtime_integration \
            tests.test_keirin_official_backlog_days \
            tests.test_keirin_official_owner_report \
            tests.test_keirin_official_owner_view \
            tests.test_keirin_official_workflow \
            tests.test_keirin_runtime_exclusion \
            tests.test_keirin_official_readiness \
            tests.test_keirin_official_saved_check \
            tests.test_keirin_official_reviewed_pdf \
            tests.test_keirin_legacy_evening_replay \
            tests.test_keirin_official_refund_notice
          python -m py_compile \
            race_ai/keirin_nationwide_auto_generator.py \
            race_ai/keirin_rider_form_evidence.py \
            race_ai/keirin_form_fall_shadow.py \
            race_ai/keirin_form_history_admission.py \
            race_ai/keirin_form_fall_blind_pdca.py \
            scripts/keirin_form_fall_owner_view.py \
            scripts/keirin_capture_official_form_history.py \
            scripts/keirin_official_form_canary.py \
            race_ai/keirin_nationwide_auto_storage.py \
            race_ai/keirin_nationwide_auto_settlement.py \
            race_ai/keirin_nationwide_cipher_history.py \
            scripts/keirin_nationwide_auto_forecast.py \
            scripts/keirin_nationwide_independent_cipher_readback.py \
            race_ai/keirin_public_two_source_normalizer.py \
            scripts/keirin_capture_public_two_sources.py \
            scripts/keirin_discover_public_race_links.py \
            scripts/keirin_register_public_day.py \
            scripts/keirin_github_only_ab_day.py \
            race_ai/keirin_github_provider_stop.py \
            race_ai/keirin_github_capture_selection.py \
            scripts/keirin_github_only_ab_readback.py \
            race_ai/keirin_secondary_result_consensus.py \
            scripts/keirin_secondary_result_poll.py \
            scripts/keirin_github_only_result_day.py \
            scripts/keirin_real_nationwide_day_link_smoke.py \
            scripts/keirin_real_source_to_aes_one_run.py \
            scripts/keirin_evening_national_real_AB_20261118.py \
            scripts/keirin_kochi5r_line_source_diagnostic.py \
            scripts/keirin_real_public_source_smoke.py \
            scripts/keirin_runtime_selection.py \
            race_ai/keirin_legacy_evening_replay.py \
            scripts/keirin_legacy_evening_audit.py
          python -m py_compile race_ai/keirin_official_*.py \
            race_ai/keirin_github_evidence_client.py \
            race_ai/keirin_github_origin_evidence.py \
            scripts/keirin_official_*.py

  source-free-readiness:
    # This job checks existing configuration only. No provider GET, capture,
    # settlement, state creation or production opt-in is performed here.
    needs: source-free-tests
    if: >-
      needs.source-free-tests.result == 'success' &&
      github.repository == 'haji84/RACE-AI' &&
      github.repository_id == '1416489937' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'readiness'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing key-validation dependencies
        run: python -m pip install --disable-pip-version-check 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5'
      - name: Verify owner-key pin and existing Git state without provider access
        env:
          RACE_AI_KEIRIN_PRIVATE_RSA_PEM: ${{ secrets.RACE_AI_KEIRIN_PRIVATE_RSA_PEM }}
          RACE_AI_KEIRIN_AB_AUTOGEN_ENABLED: ${{ vars.RACE_AI_KEIRIN_AB_AUTOGEN_ENABLED }}
          RACE_AI_AB_PUBLIC_CAPTURE_ENABLED: ${{ vars.RACE_AI_AB_PUBLIC_CAPTURE_ENABLED }}
          RACE_AI_KEIRIN_AB_GIT_STORE_ENABLED: ${{ vars.RACE_AI_KEIRIN_AB_GIT_STORE_ENABLED }}
          RACE_AI_AB_SOURCE_S3_PREFIX: ${{ vars.RACE_AI_AB_SOURCE_S3_PREFIX }}
          RACE_AI_KEIRIN_OFFICIAL_SOURCE_ENABLED: ${{ vars.RACE_AI_KEIRIN_OFFICIAL_SOURCE_ENABLED }}
          RACE_AI_KEIRIN_READINESS_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python -m scripts.keirin_official_readiness --repo "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/keirin-readiness-safe.json" || status=$?
          cat "$RUNNER_TEMP/keirin-readiness-safe.json"
          cat "$RUNNER_TEMP/keirin-readiness-safe.json" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  saved-only-replay:
    # An explicit main dispatch can verify existing encrypted evidence with
    # live opt-ins disabled. No provider, missing-bundle fetch or state writer.
    needs: source-free-tests
    if: >-
      needs.source-free-tests.result == 'success' &&
      github.repository == 'haji84/RACE-AI' &&
      github.repository_id == '1416489937' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'saved-only'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing evidence validation dependencies
        run: python -m pip install --disable-pip-version-check 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5'
      - name: Replay saved evidence and encrypt the owner view
        shell: bash
        env:
          RACE_AI_KEIRIN_PRIVATE_RSA_PEM: ${{ secrets.RACE_AI_KEIRIN_PRIVATE_RSA_PEM }}
          RACE_AI_KEIRIN_SAVED_CHECK_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          status=0
          python -m scripts.keirin_official_saved_check --repo "$GITHUB_WORKSPACE" \
            --private-root "$RUNNER_TEMP/keirin-saved-only-$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/keirin-saved-only-counts-$GITHUB_RUN_ID.json" || status=$?
          cat "$RUNNER_TEMP/keirin-saved-only-counts-$GITHUB_RUN_ID.json"
          cat "$RUNNER_TEMP/keirin-saved-only-counts-$GITHUB_RUN_ID.json" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Preserve only safe saved-evidence receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-saved-only-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/keirin-saved-only-${{ github.run_id }}/*/safe.json
            ${{ runner.temp }}/keirin-saved-only-${{ github.run_id }}/batch-safe.json
          retention-days: 21
          if-no-files-found: warn
      - name: Preserve only existing-owner RSA encrypted views
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-saved-only-owner-views-${{ github.run_id }}
          path: ${{ runner.temp }}/keirin-saved-only-${{ github.run_id }}/*/owner-view.sealed.json
          retention-days: 21
          if-no-files-found: warn
      - name: Destroy temporary saved-evidence outputs
        if: always()
        shell: bash
        run: |
          root="$RUNNER_TEMP/keirin-saved-only-$GITHUB_RUN_ID"
          if [ -d "$root" ] && [[ "$root" == "$RUNNER_TEMP"/keirin-saved-only-* ]]; then
            rm -rf -- "$root"
          fi
          rm -f -- "$RUNNER_TEMP/keirin-saved-only-counts-$GITHUB_RUN_ID.json"

  real-public-utsunomiya1r-smoke:
    # This is a one-day, two-GET read-only check of a published future race.
    # Never a claim that the nationwide collector or AES stage is live.
    # Historical receipts are retained; a code push must not repeat provider GETs.
    if: false && github.event_name == 'pull_request' && github.event.pull_request.number == 291
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Attempt only two ordinary public URLs; report safe HOLD if blocked
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4>=4.12,<5' 'cryptography>=44,<48'
          python -m scripts.keirin_real_public_source_smoke > "$RUNNER_TEMP/keirin-real-source-safe.json"
          cat "$RUNNER_TEMP/keirin-real-source-safe.json"
          cat "$RUNNER_TEMP/keirin-real-source-safe.json" >> "$GITHUB_STEP_SUMMARY"

  real-public-national-day-links-smoke:
    # At most one day calendar + eight linked public racecard GETs.
    # Only safe counts, no URLs or rider values are logged.
    # Historical receipts are retained; a code push must not repeat provider GETs.
    if: false && github.event_name == 'pull_request' && github.event.pull_request.number == 291
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Source-only linked Kdreams meeting inventory (no invented race URLs)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4>=4.12,<5' 'cryptography>=44,<48'
          python -m scripts.keirin_real_nationwide_day_link_smoke > "$RUNNER_TEMP/national-day-links-safe.json"
          cat "$RUNNER_TEMP/national-day-links-safe.json"
          cat "$RUNNER_TEMP/national-day-links-safe.json" >> "$GITHUB_STEP_SUMMARY"


  real-source-to-owner-aes-one-run:
    # A single real unpublished race, not a synthetic prediction test.
    # Guard prior GitHub ciphertext artifact to prevent replay/duplicate
    # forecast variants in later PR runs. Never puts source HTML in artifact.
    # Historical receipts are retained; a code push must not repeat provider GETs.
    if: false && github.event_name == 'pull_request' && github.event.pull_request.number == 291
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    outputs:
      sealed: ${{ steps.run.outputs.sealed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Refuse second prediction if genuine race cipher already exists as GitHub artifact
        id: prior
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=keirin-real-202611182401-source-AB-AES-20261118&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | length')"
          if [ "$existing" -gt 0 ]; then
            echo "prior=true" >> "$GITHUB_OUTPUT"
            echo "HOLD_ALREADY_FROZEN_RACE_CIPHER: no second A/B prediction created" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "prior=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create owner-private 0700 source and ciphertext folders
        if: steps.prior.outputs.prior == 'false'
        id: private
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/keirin-real-aes-202611182401"
          mkdir -m 700 -p "$root" "$root/cards" "$root/raw" "$root/sealed"
          chmod 700 "$root" "$root/cards" "$root/raw" "$root/sealed"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Real two-source GET, six-phase A/B generation and owner RSA/AES authenticated seal in SAME RUN
        if: steps.prior.outputs.prior == 'false'
        id: run
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5'
          root="${{ steps.private.outputs.root }}"
          python -m scripts.keirin_real_source_to_aes_one_run \
            --root "$root" \
            --registry "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_all79_nationwide_AB_registered_v1.json" \
            --rsa-public-pem "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem" \
            > "$RUNNER_TEMP/one-real-safe-status.json"
          cat "$RUNNER_TEMP/one-real-safe-status.json" >> "$GITHUB_STEP_SUMMARY"
          actual="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["state"])' "$RUNNER_TEMP/one-real-safe-status.json")"
          if [ "$actual" = 'REAL_ONE_RUN_A_B_AES_CREATED' ]; then
            echo "sealed=true" >> "$GITHUB_OUTPUT"
          else
            echo "sealed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain ciphertext only and cross-checkable A/B receipts in GitHub
        if: steps.run.outputs.sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-real-202611182401-source-AB-AES-20261118
          path: |
            ${{ steps.private.outputs.root }}/sealed/*.sealed.json
            ${{ steps.private.outputs.root }}/producer-summary.json
            ${{ steps.private.outputs.root }}/one-run-safe-summary.json
          if-no-files-found: error
          retention-days: 21
      - name: Remove private source HTML and unencrypted temporary cards
        if: always()
        shell: bash
        run: |
          root="${{ steps.private.outputs.root }}"
