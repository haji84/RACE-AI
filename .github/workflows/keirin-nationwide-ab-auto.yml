            --repo "$GITHUB_WORKSPACE" \
            --private-root "${{ steps.private.outputs.root }}" \
            --owner-public-pem "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem" \
            --report "${{ steps.private.outputs.root }}/safe/summary.json" \
            --max-races 8 \
            > "$RUNNER_TEMP/keirin-live-safe.json"
          cat "$RUNNER_TEMP/keirin-live-safe.json" >> "$GITHUB_STEP_SUMMARY"
          echo "archived=true" >> "$GITHUB_OUTPUT"
      - name: Keep only safe SHA/status receipt for second GitHub runner
        if: steps.run.outputs.archived == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-github-only-ab-receipt-${{ github.run_id }}
          path: ${{ steps.private.outputs.root }}/safe/summary.json
          retention-days: 21
          if-no-files-found: error
      - name: Destroy private source HTML and raw cards
        if: always()
        shell: bash
        run: |
          root="${{ steps.private.outputs.root }}"
          if [ -n "$root" ] && [ -d "$root" ] && [[ "$root" == "$RUNNER_TEMP"/keirin-git-only-* ]]; then
            rm -rf -- "$root"
          fi

