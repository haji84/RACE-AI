      contents: write
    env:
      RACE_AI_KEIRIN_AB_GIT_STORE_ENABLED: ${{ vars.RACE_AI_KEIRIN_AB_GIT_STORE_ENABLED }}
      RACE_AI_KEIRIN_OFFICIAL_SOURCE_ENABLED: ${{ vars.RACE_AI_KEIRIN_OFFICIAL_SOURCE_ENABLED }}
    outputs:
      archived: ${{ steps.run.outputs.archived }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare private ephemeral workspace
        id: private
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/keirin-git-only-$GITHUB_RUN_ID"
          mkdir -m 700 -p "$root/safe"
          chmod 700 "$root"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "day=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Collect current JST roster, capture real cards and append sealed A/B to existing Git branch
        id: run
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5'
          # Independent owner-imported display profile; the old controller's
          # provider stop and formal admission remain unchanged below.
          if ! env -u RACE_AI_STATE_KEY python -m scripts.keirin_note_feed_cycle --repo "$GITHUB_WORKSPACE"; then
            echo 'NOTE_SOURCE_OR_ENCRYPTED_DISPLAY_HOLD; existing controller continues.' >> "$GITHUB_STEP_SUMMARY"
          fi
