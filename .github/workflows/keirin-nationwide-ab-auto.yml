  github-only-owner-capture:
    # Opt-in, existing GitHub ONLY; never requires or silently creates S3.
    # Mutually exclusive with the older externally sourced owner-auto-generate.
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      github.ref == 'refs/heads/main' &&
      vars.RACE_AI_KEIRIN_AB_AUTOGEN_ENABLED == 'true' &&
      vars.RACE_AI_AB_PUBLIC_CAPTURE_ENABLED == 'true' &&
