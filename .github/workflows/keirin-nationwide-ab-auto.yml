  form-canary-window:
    # Owner authorized one future live race before nationwide expansion.
    # Capture stays fixed to 2026-11-20; saved-race settlement through 11-21 JST.
    # No repository variable, secret, permission or global opt-in is changed.
    needs: source-free-tests
