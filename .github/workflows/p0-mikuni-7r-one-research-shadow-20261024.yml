          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-parser-reference
          persist-credentials: false
      - name: Compute only a distinct nonformal research Top8 from bounded B facts
        run: python -m scripts.p0_mikuni_7r_unadmitted_research_shadow_20261024
