    branches:
      - 'p0-mikuni-7r-shadow-20261024'
    paths:
      - 'docs/evidence/p0-mikuni-7r-shadow-trigger-20261024.txt'
permissions:
  contents: read
jobs:
  research_preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      RACE_AI_RESEARCH_ONE_SHOT: ONE-MIKUNI-7R-RESEARCH-20261024
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
