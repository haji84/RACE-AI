name: RACE AI public source smoke (metadata only)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One GET / metadata only / no raw API storage
        run: |
          python -m race_ai.public_day_feed --date 2026-10-13 --probe-only
