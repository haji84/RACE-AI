name: KEIRIN persistent private model runtime CI

on:
  push:
    branches: [feat/keirin-private-persistent-core-20261103]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  keirin_core:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Independent source and result attestation contracts
        run: |
          python -m unittest discover -s tests -p 'test_keirin_result_reactor.py' -v
          python -m unittest discover -s tests -p 'test_keirin_next_forecast_worker.py' -v
      - name: Genuine persistent disk across connections, strict results and missing-race ledger
        run: python -m unittest discover -s tests -p 'test_keirin_owner_sqlite.py' -v
      - name: Actual pinned PR71 scenario model, no odds and no invented fields
        run: python -m unittest discover -s tests -p 'test_keirin_pr71_model_adapter.py' -v
      - name: Real PR71 prediction into SQLite and restart from file
        run: python -m unittest discover -s tests -p 'test_keirin_owner_sqlite_pr71_e2e.py' -v
      - name: Protect original daily discovery
        run: |
          python -m unittest discover -s tests -p 'test_keirin_discovery.py' -v
          python -m unittest discover -s tests -p 'test_keirin_daily_ledger.py' -v
      - name: Result-unread scenarios and independent ticket counts
        run: |
          python -m unittest tests.test_keirin_evidence_selection tests.test_keirin_forward_scenarios tests.test_keirin_result_unread_method tests.test_keirin_nationwide_auto_generator -v
          python -m unittest tests.test_keirin_rider_context tests.test_keirin_rider_context_study tests.test_keirin_ranking_adjustment tests.test_keirin_small_ticket_budget -v
          python -m unittest tests.test_keirin_confidence tests.test_keirin_authored_confidence tests.test_keirin_confidence_storage -v
          python scripts/keirin_generate_result_unread_analysis.py --self-check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exercise dated rider features and conditional ranking
        run: |
          python -m venv "$RUNNER_TEMP/keirin-rider-profile-tests"
          "$RUNNER_TEMP/keirin-rider-profile-tests/bin/python" -m pip install --disable-pip-version-check \
            numpy==2.2.6 scipy==1.17.0 'cryptography>=44,<48'
          "$RUNNER_TEMP/keirin-rider-profile-tests/bin/python" -m unittest \
            tests.test_keirin_line_history_study tests.test_keirin_rider_profile_study \
            tests.test_keirin_joint_finish tests.test_keirin_tactical_observations tests.test_keirin_pair_structure_study \
            tests.test_keirin_form_fall_blind_pdca tests.test_keirin_rider_variation_study -v
      - name: Test historical replay census, evidence and rider learning with offline fixtures
        run: |
          runner_python="$RUNNER_TEMP/keirin-rider-profile-tests/bin/python"
          "$runner_python" -m pip install --disable-pip-version-check beautifulsoup4==4.13.4 lxml==6.0.2 pillow==12.1.1
          "$runner_python" -m unittest \
            tests.test_keirin_video_census tests.test_keirin_video_archive_index tests.test_keirin_video_sources \
            tests.test_keirin_video_media tests.test_keirin_video_review \
            tests.test_keirin_video_corpus tests.test_keirin_video_rider_learning -v
          "$runner_python" -m unittest \
            tests.test_keirin_flow_evaluation tests.test_keirin_race_development \
            tests.test_keirin_forward_score tests.test_keirin_research_ledger \
            tests.test_keirin_research_cohort_score tests.test_keirin_official_owner_view -v
          "$runner_python" -m unittest \
            tests.test_keirin_archive_study tests.test_keirin_accuracy_study \
            tests.test_keirin_joint_forecast -v

  comparison-cipher-independent-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Independently read the frozen research ciphertext, without private keys
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('docs/evidence/keirin-live-accuracy-closure-20261125/prospective-publication.json')
          if not path.exists():
              raise SystemExit('No joint comparison receipt on this source revision')
          receipt = json.loads(path.read_bytes())
          commit = receipt['publication']['source_commit']
          cipher = receipt['cipher_sha256']
          assert len(commit) == 40 and all(c in '0123456789abcdef' for c in commit)
          assert len(cipher) == 64 and all(c in '0123456789abcdef' for c in cipher)
          base = 'https://raw.githubusercontent.com/haji84/RACE-AI/' + commit + '/'
          def read(name, bound):
              with urllib.request.urlopen(base + name, timeout=60) as response:
                  assert response.status == 200
                  raw = response.read(bound + 1)
              assert 0 < len(raw) <= bound
              return raw
          index = json.loads(read('index.json', 2000000))
          assert index['recipient_id'] == receipt['recipient_id']
          entry = [x for x in index['entries'] if x['cipher_sha256'] == cipher]
          assert len(entry) == 1 and entry[0]['kind'] == 'research'
          raw = read('views/' + cipher + '.json', 90000000)
          assert hashlib.sha256(raw).hexdigest() == cipher
          doc = json.loads(raw)
          assert doc['header']['source_content_sha256'] == entry[0]['source_content_sha256']
          now = datetime.now(timezone.utc)
          future = sum(now < datetime.fromisoformat(cutoff) for cutoff in receipt['cutoffs'].values())
          safe = dict(state='INDEPENDENT_RUNNER_CIPHER_SHA_READBACK_VERIFIED',
              cipher_sha256=cipher, cipher_bytes=len(raw), archive_commit=commit,
              observed_at=now.isoformat(), still_pre_cutoff_races=future,
              registered_comparison_races=len(receipt['cutoffs']),
              source_pages_requested=0, private_key_used=False, plaintext_decrypted=False,
              formal_pre_cutoff_original_authenticated=False, accuracy_improvement_proven=False)
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write(json.dumps(safe, sort_keys=True) + '\n')
          print(json.dumps(safe, sort_keys=True))
          PY
