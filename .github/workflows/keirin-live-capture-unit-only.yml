name: KEIRIN live recording timing and four-lap evidence contracts

on:
  pull_request:
    paths:
      - 'scripts/keirin_winticket_9r_live_capture.py'
      - 'tests/test_keirin_winticket_live_capture.py'
      - '.github/workflows/keirin-live-capture-unit-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-time import dependencies only
        run: python -m pip install playwright==1.56.0
      - name: Ensure actual tests are discovered
        run: |
          python -m unittest discover -s tests -p 'test_keirin_winticket_live_capture.py' -v
      - name: Check source parses cleanly
        run: |
          python -m py_compile scripts/keirin_winticket_9r_live_capture.py
          python -m py_compile scripts/keirin_winticket_replay_probe.py
      - name: Clearly separate synthetic tests from real recording
        run: |
          echo "Offline contracts passed: NOT a new real capture or automatic four-lap verification." >> "$GITHUB_STEP_SUMMARY"
