name: KEIRIN ChatGPT DT-R1 research contracts

on:
  push:
    branches:
      - research/chatgpt-dt-r1-pipeline-20261128
    paths:
      - research/chatgpt_dt_r1/**
      - .github/workflows/keirin-chatgpt-dt-r1.yml
  pull_request:
    branches: [main]
    paths:
      - research/chatgpt_dt_r1/**
      - .github/workflows/keirin-chatgpt-dt-r1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dt-r1-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned research dependencies
        run: python -m pip install -r research/chatgpt_dt_r1/requirements.txt
      - name: Verify research, privacy, temporal and missing-evidence contracts
        run: python -m unittest discover -s research/chatgpt_dt_r1 -p 'test_*.py' -v
      - name: Verify documented command interface
        run: |
          python -m research.chatgpt_dt_r1.cli --help
          python -m research.chatgpt_dt_r1.bundle --help
      - name: Verify aggregate dashboard in desktop and mobile browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m research.chatgpt_dt_r1.browser_check --output-dir "$RUNNER_TEMP/dt-r1-browser-check"
      - name: Retain aggregate dashboard verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dt-r1-browser-${{ github.sha }}
          path: ${{ runner.temp }}/dt-r1-browser-check/
          if-no-files-found: error
          retention-days: 7

  owner-pinned-archive-retrain:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/chatgpt-dt-r1-pipeline-20261128' && (github.event.head_commit.message == 'Run owner-requested pinned agari archive retraining' || github.event.head_commit.message == 'Implement five DT-R1 abilities and run pinned archive study')
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned research dependencies
        run: python -m pip install -r research/chatgpt_dt_r1/requirements.txt
      - name: Authenticate fixed archives and run chronological study
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$(mktemp -d "$RUNNER_TEMP/dt-r1-archive.XXXXXX")"
          trap 'rm -rf -- "$private"' EXIT
          python -m research.chatgpt_dt_r1.owner_retrain "$private" \
            --bundle-dir "$RUNNER_TEMP/dt-r1-evidence" \
            --owner-public-key "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem"
      - name: Preserve only verified public aggregates and owner-encrypted study
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dt-r1-study-${{ github.sha }}
          path: ${{ runner.temp }}/dt-r1-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

# No scheduled source scraping, raw archive upload, secret access, cache,
# prediction publishing, active-model promotion or competing cron is added.
# Artifacts are a short-lived transfer only. Durable retention requires the
# externally pinned encrypted bundle to be preserved in Git, not a new runner.
