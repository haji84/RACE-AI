name: KEIRIN ChatGPT DT-R1 research contracts

on:
  push:
    branches:
      - research/chatgpt-dt-r1-pipeline-20261128
    paths:
      - research/chatgpt_dt_r1/**
      - .github/workflows/keirin-chatgpt-dt-r1.yml
  pull_request:
    branches: [main]
    paths:
      - research/chatgpt_dt_r1/**
      - .github/workflows/keirin-chatgpt-dt-r1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dt-r1-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned research dependencies
        run: python -m pip install -r research/chatgpt_dt_r1/requirements.txt
      - name: Verify research, privacy, temporal and missing-evidence contracts
        run: python -m unittest discover -s research/chatgpt_dt_r1 -p 'test_*.py' -v
      - name: Verify documented command interface
        run: python -m research.chatgpt_dt_r1.cli --help

# No scheduled source scraping, raw archive upload, secret access, cache,
# prediction publishing, active-model promotion or competing cron is added.
