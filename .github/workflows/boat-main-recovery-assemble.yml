name: Assemble main recovery wiring on isolated candidate
on:
  push:
    branches: [fix/boat-main-durable-recovery-20261114]
permissions:
  contents: write
jobs:
  assemble:
    if: startsWith(github.event.head_commit.message, 'assemble(boat-main)')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Apply exact tested-source wiring only on this isolated branch
        run: python scripts/_assemble_main_recovery.py
      - name: Test all main gate and recovery admission guards without source requests
        run: python -m unittest tests.test_boat_recovery_dispatch_gate tests.test_boat_main_dispatch_gate tests.test_boat_first_p0_recovery_gate -v
      - name: Check workflow wiring and commit only the intended files
        env:
          EXPECTED_BRANCH: fix/boat-main-durable-recovery-20261114
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$EXPECTED_BRANCH"
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/boat-racer-daily.yml').read_text()
          job=text.split('  owner_p0_p1_dispatch:\n',1)[1]
          assert job.count('scripts.boat_recover_failed_owner')==1
          assert job.count('scripts.boat_recovery_dispatch_gate')==2
          assert job.index('id: owner_recovery')<job.index('id: recovered_gate')<job.index('Dispatch only the existing owner')
          assert "if: steps.owner_recovery.outcome == 'success'" in job
          assert 'continue-on-error' not in job
          assert job.count('RACE_AI_STATE_KEY:')==1
          assert 'group: boat-main-launcher-source-free' in job
          assert 'gh run rerun' not in job
          print('MAIN_SOURCE_FREE_RECOVERY_WIRING_VERIFIED')
          PY
          git diff --check
          git add -- scripts/boat_main_dispatch_gate.py .github/workflows/boat-racer-daily.yml scripts/_assemble_main_recovery.py .github/workflows/boat-main-recovery-assemble.yml
          git -c user.name='RACE-AI candidate assembly' -c user.email='race-ai-state@users.noreply.github.com' commit -m 'fix(boat): resume scheduled owner only after durable failed-round recovery'
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
