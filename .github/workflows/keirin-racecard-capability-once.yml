name: KEIRIN one-card and one-result technical check
on:
  push:
    branches: [feat/keirin-fullcycle-worker-20261103]
    paths: ['.github/workflows/keirin-racecard-capability-once.yml']
permissions:
  contents: read
jobs:
  two_page_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: One racecard and one result page, metadata only
        run: python -m scripts.keirin_racecard_capabilities_once
