name: KEIRIN one-day identity coverage proof
on:
  push:
    branches: [feat/keirin-fullcycle-worker-20261103]
    paths:
      - '.github/workflows/keirin-discovery-once.yml'
permissions:
  contents: read
jobs:
  bounded_discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify synthetic day/venue/race identity parsing
        run: python -m unittest discover -s tests -p 'test_keirin_discovery.py' -v
      - name: One GET for actual 2026-11-03 index, public counts only
        run: python -m scripts.keirin_discovery_once
