          EXPECTED_SOURCE_CIPHER: '${{ needs.fresh_result.outputs.result_cipher }}'
          EXPECTED_BEFORE_FINAL: '${{ needs.fresh_result.outputs.before_final }}'
          EXPECTED_AFTER_FINAL: '${{ needs.fresh_result.outputs.after_final }}'
          EXPECTED_RESULT_DIGEST: '${{ needs.fresh_result.outputs.result_digest }}'
          EXPECTED_INVENTORY_DIGEST: '${{ needs.fresh_result.outputs.inventory_digest }}'
          EXPECTED_SCOPE_DAYS: '${{ needs.fresh_result.outputs.scope_days }}'
          EXPECTED_BACKFILL_DAY: '${{ needs.fresh_result.outputs.backfill_day }}'
          EXPECTED_NEW_FINAL_DAY: '${{ needs.fresh_result.outputs.new_final_day }}'
          EXPECTED_NEW_DAY_BEFORE: '${{ needs.fresh_result.outputs.new_day_before }}'
          EXPECTED_NEW_DAY_AFTER: '${{ needs.fresh_result.outputs.new_day_after }}'
        run: |
          python - <<'PY'
          import json,race_ai,hashlib,os,datetime
          from pathlib import Path
          for folder in ('pr64-reference','pr72-reference'):
              package=Path(folder,'race_ai').resolve()
              assert package.is_dir(), 'PINNED_OFFICIAL_ADAPTER_MISSING'
