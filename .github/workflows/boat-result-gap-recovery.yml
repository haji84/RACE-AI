              for target in bridge.targets())
          wait=(control.get('waits') or {}).get('boatrace') or {}
          final=sum((row.get('result') or {}).get('status')=='final' for row in bridge.rows)
          inventory=F.inventory_sha(dict(schema='RACE_AI_PRIVATE_CYCLE_VIEW_V1',records=bridge.rows))
