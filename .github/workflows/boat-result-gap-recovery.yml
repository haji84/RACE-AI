name: BOAT schedule-gap retained-result recovery (zero provider GET)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/boat-result-gap-recovery.yml
      - scripts/boat_result_gap_audit.py
      - tests/test_boat_result_gap_audit.py
      - scripts/boat_result_gap_fresh_gate.py
      - tests/test_boat_result_gap_fresh_gate.py
  push:
    branches: [main]
    paths:
      - docs/evidence/boat-gap-replay-trigger.txt
  workflow_dispatch:
    inputs:
      cycle:
        required: true
        type: choice
        options: ['2']
        description: 'One bounded follow-up audit; no official provider GET'
  # A single authenticated source-failure diagnosis does not alter GET limits.
  # Backup polling only. Original BOAT 5-minute schedule remains the primary
  # source. This is never a bypass of 12 GET/run or the 30-minute replay gate.
  # GitHub may delay or skip schedule events: timestamps are not an SLA.
  schedule:
    - cron: '11,26,41,56 0-14,22-23 * * *'
  workflow_run:
    workflows: ['KEIRIN PR71 GitHub-only forecast and PDCA', 'KEIRIN hourly personal research canary']
    types: [completed]
    branches: [main]

permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && 'boat-gap-sourcefree-pr-check' || 'boat-racer-daily-statistics' }}
  cancel-in-progress: false

jobs:
  source_free_git_probe:
    name: BOAT encrypted-state Git write dry-run (zero provider GET)
    if: >-
      github.repository == 'haji84/RACE-AI' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message,'boat-git-probe: readonly-git-20261112')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6327bc5675aee2da94ac13397f1f86f39b27d8fd
          path: source-reader
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -r source-reader/requirements-history.txt
      - name: Verify original Git credentials with new local commit, only dry-run remotely
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
        run: |
          python - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('source-reader').resolve()))
          import race_ai
          for sibling in ('pr64-reference','pr72-reference'):
              package=Path(sibling,'race_ai').resolve()
              assert package.is_dir()
              race_ai.__path__.append(str(package))
          phase='import'
          try:
              from scripts.boat_private_original_vault import _environment
              from race_ai.boat_pdca_github_handoff import GitStateRepository,TRANSFER_REF
              phase='environment'
              repo=_environment(Path('source-reader').resolve())
              phase='remote'
              gate=GitStateRepository(repo,ref=TRANSFER_REF)
              phase='ls-remote'
              parent=gate.head()
              assert parent and re.fullmatch('[a-f0-9]{40}',parent)
              phase='fetch'
              gate.fetch(parent)
              phase='local-commit'
              candidate=gate.commit({},parent)
              assert re.fullmatch('[a-f0-9]{40}',candidate) and candidate!=parent
              phase='dry-run'
              status=subprocess.run(['git','push','--dry-run',gate.push_url,
                  candidate+':refs/heads/'+gate.ref],cwd=repo,
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=50)
              phase='verify-remote'
              unchanged=gate.head()==parent
              print(json.dumps(dict(status='BOAT_GIT_WRITE_DRY_RUN_DIAGNOSTIC',
                  dry_run_exit_zero=status.returncode==0,remote_unchanged=unchanged,
                  official_source_gets=0,remote_state_written=False),sort_keys=True))
              assert unchanged
          except Exception as e:
              reason=(str(e) if type(e) is ValueError and
                      re.fullmatch('[A-Z0-9_]{3,100}',str(e))
                      else 'BOAT_GIT_DIAGNOSTIC_UNKNOWN')
              trace=[]
              tb=e.__traceback__
              while tb:
                  frame=tb.tb_frame.f_code
                  file=Path(frame.co_filename).name
                  if re.fullmatch('[a-zA-Z0-9_]+\\.py',file):
                      trace.append(file+':'+str(tb.tb_lineno))
                  tb=tb.tb_next
              print(json.dumps(dict(status='BOAT_GIT_WRITE_DRY_RUN_HOLD',
                  phase=phase,exception_type=type(e).__name__[:32],
                  code_trace=trace[-3:],reason=reason,official_source_gets=0,
                  remote_state_written=False),sort_keys=True))
              raise SystemExit(2)
          PY
  source_free_diagnostic:
    name: Pinned BOAT collector source-free diagnosis
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message,
                 'boat-gap-diagnostic: pinned-readonly-20261112')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6327bc5675aee2da94ac13397f1f86f39b27d8fd
          path: source-reader
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -r source-reader/requirements-history.txt
      - name: Diagnose exact original source reader without racing-provider GET
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          from pathlib import Path
          import sys,json,re,traceback
          sys.path.insert(0,str(Path('source-reader').resolve()))
          import race_ai
          for folder in ('pr64-reference','pr72-reference'):
              package=Path(folder,'race_ai').resolve()
              assert package.is_dir()
              race_ai.__path__.append(str(package))
          from scripts.boat_private_original_vault import _environment
          from race_ai.racer_daily_handoff import load_daily
          from race_ai.racer_intraday_handoff import load_intraday
          from race_ai.racer_result_bridge import SavedResultBridge
          from race_ai.racer_intraday import build_catalogue
          from race_ai.racer_daily import sha,wire
          repo=_environment(Path('source-reader').resolve())
          now=datetime.now(timezone.utc)
          stage='init'
          base=None
          try:
              stage='daily_load'
              loaded=load_daily(repo,now=now)
              base=loaded['store']
              stage='source_load'
              intraday=load_intraday(repo,now=now)
              stage='results_load'
              result_bridge=SavedResultBridge(repo,now=now)
              stage='source_free_projection'
              roster=json.loads((Path('source-reader')/'web/data/racer-profiles.json').read_text())['people']
              result=build_catalogue(base,intraday['state'],roster,now=now,
                                     base_sha=loaded['previous']['cipher_sha256'])
              assert result['status']=='READY'
              print(json.dumps(dict(status='BOAT_SOURCE_FREE_DIAGNOSTIC_PASSED',
                  source_gets=0,result_row_count=len(result_bridge.rows),
                  public_profiles=len(result['people']),diagnosed_steps=4),sort_keys=True))
          except Exception as exc:
              reason=(str(exc) if type(exc) is ValueError and
                      re.fullmatch('[A-Z0-9_]{3,100}',str(exc))
                      else 'SOURCE_FREE_DIAGNOSTIC_FAILED')
              print(json.dumps(dict(status='BOAT_SOURCE_FREE_DIAGNOSTIC_HOLD',
                  source_gets=0,stage=stage,reason=reason,
                  exception_type=type(exc).__name__ if type(exc).__name__ in
                      ('ValueError','RuntimeError','KeyError','TypeError','AssertionError') else 'Error'),
                  sort_keys=True))
              raise SystemExit(2)
          finally:
              if base is not None:base.close()
          PY

  unit:
    name: unit
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          persist-credentials: false
      - name: Test actual schedule-gap and bounded fresh-result admission
        run: python -m unittest tests.test_boat_result_gap_audit tests.test_boat_result_gap_fresh_gate -v
      - name: Assert only the new guarded source step can use provider GET
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/boat-result-gap-recovery.yml').read_text()
          replay=text.split('\n  observed_gap:\n',1)[1].split('\n  fresh_result:\n',1)[0]
          fresh=text.split('\n  fresh_result:\n',1)[1]
          assert '--replay-retained-results' in replay and '--sync-results' not in replay
          assert '--sync-results' in fresh and '--sync-beforeinfo' not in fresh
          assert 'gh auth setup-git' in fresh
          assert "if: steps.source_gate.outputs.admitted == 'true'" in fresh
          assert 'AUTHENTICATED_GIT_STATE_WRITE_PATH_CONFIGURED_NO_PROVIDER_GET' in fresh
          assert fresh.index('gh auth setup-git') < fresh.index('--sync-results')
          assert "persist-credentials: false" in fresh
          assert 'credential\\..*\\.helper' in fresh
          assert 'git -C source-reader ls-remote --heads' in fresh
          assert '6327bc5675aee2da94ac13397f1f86f39b27d8fd' in fresh
          assert 'needs: observed_gap' in fresh
          assert "github.event.workflow_run.event == 'schedule'" in fresh
          assert "github.event.workflow_run.name == 'KEIRIN hourly personal research canary'" in fresh
          assert 'github.event.workflow_run.run_attempt == 1' in fresh
          assert "new_results: ${{ steps.new_result.outputs.new_results }}" in fresh
          assert "outputs.new_results == 'true'" in text
          assert 'boat-gap-fresh-proof: single-bounded-intake-20261112' in replay
          assert 'boat-gap-fresh-proof: single-bounded-intake-20261112' in fresh
          assert "github.ref == 'refs/heads/main'" in fresh
          assert 'github.event.workflow_run.run_attempt == 1' in fresh
          assert "github.event.schedule == '11,26,41,56 0-14,22-23 * * *'" in replay
          assert "github.event.schedule == '11,26,41,56 0-14,22-23 * * *'" in fresh
          assert "github.event_name == 'schedule'" in replay
          assert "github.event_name == 'schedule'" in fresh
          assert 'FRESH_OFFICIAL_FINAL_INCREASE_VERIFIED' in text
          assert 'exact_result_digest_matched' in text
          assert 'original_inventory_unchanged' in text
          assert 'sanitized_source_trace=safe' in text
          assert 'BOAT_SOURCE_FREE_DIAGNOSTIC_PASSED' in text
          assert 'BOAT_GIT_WRITE_DRY_RUN_DIAGNOSTIC' in text
          probe=text.split('  source_free_git_probe:',1)[1].split('  source_free_diagnostic:',1)[0]
          assert 'pr64-reference' in probe and 'pr72-reference' in probe
          assert 'race_ai.__path__.append(str(package))' in probe
          assert 'code_trace=trace[-3:]' in text
          assert "phase='dry-run'" in text
          assert "boat-git-probe: readonly-git-20261112" in text
          assert "'--dry-run'" in text
          assert 'boat-gap-diagnostic: pinned-readonly-20261112' in text
          import ast,textwrap
          block=text.split('      - name: Diagnose exact original source reader without racing-provider GET',1)[1].split("python - <<'PY'\n",1)[1].split('\n          PY',1)[0]
          ast.parse(textwrap.dedent(block),filename='read_only_diagnostic')
          assert '--sync-results' not in text.split('  source_free_diagnostic:',1)[1].split('  unit:',1)[0]
          assert 'cancel-in-progress: false' in text
          print('FRESH_RESULT_GAP_SOURCE_BOUNDARY_UNIT_VERIFIED')
          PY
  offline_contract:
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha }}'}
      - name: Verify event freshness decisions and zero-source bounds
        run: python -m unittest tests.test_boat_result_gap_audit -v
      - name: Confirm replay command cannot become a racing provider acquisition
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/boat-result-gap-recovery.yml').read_text()
          assert '--replay-retained-results' in t
          assert 'race_ai.__path__.append(str(package))' in t
          assert '761247bee0209e37b1af6b8885e92cad3e9260a5' in t
          assert '7a432e5acc4d3495a0e82bd79726929e2f8085fe' in t
          import re
          assert not re.search(r'^\s+--sync-(?:results|beforeinfo)\b',t,re.MULTILINE)
          assert 'gh workflow run boat-result-gap-recovery.yml' in t
          assert "inputs.cycle == '2'" in t
          assert "github.event.workflow_run.event == 'schedule'" in t
          assert 'cancel-in-progress: false' in t
          print('SOURCE_FREE_GAP_RECOVERY_CONTRACT_VERIFIED')
          PY

  observed_gap:
    if: >-
      github.repository == 'haji84/RACE-AI' && (
        (github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
         github.event.schedule == '11,26,41,56 0-14,22-23 * * *') ||
        (github.event_name == 'push' &&
         github.ref == 'refs/heads/main' &&
         (startsWith(github.event.head_commit.message,
                     'boat-gap-audit: two-sourcefree-passes-20261112') ||
          startsWith(github.event.head_commit.message,
                     'boat-gap-fresh-proof: single-bounded-intake-20261112'))) ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == 'refs/heads/main' && inputs.cycle == '2') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'schedule' &&
         (github.event.workflow_run.conclusion == 'success' ||
         (github.event.workflow_run.name == 'KEIRIN hourly personal research canary' &&
          github.event.workflow_run.conclusion == 'failure')) &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    outputs:
      gap: ${{ steps.audit.outputs.gap }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Check out pinned original result reader without changing it
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6327bc5675aee2da94ac13397f1f86f39b27d8fd
          path: source-reader
          persist-credentials: false
      - name: Install immutable original official parser separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - name: Install immutable original result adapter separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -r source-reader/requirements-history.txt
      - name: Read actual GitHub schedule history only
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/boat-racer-daily.yml/runs?event=schedule&per_page=100" \
            > "$RUNNER_TEMP/boat-schedule-runs.json"
      - name: Audit source-free recovery eligibility
        id: audit
        run: |
          python scripts/boat_result_gap_audit.py \
            --runs "$RUNNER_TEMP/boat-schedule-runs.json" \
            --output "$RUNNER_TEMP/boat-gap-evidence.json"
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ['RUNNER_TEMP'])/'boat-gap-evidence.json'
          data=json.loads(p.read_text())
          assert data['requested_source_gets']==0 and data['source_budget_extended'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('gap=' + str(data['status']=='SCHEDULE_GAP_CONFIRMED').lower() + '\n')
          PY
      - name: Recover already retained authenticated results only, no source GET
        if: steps.audit.outputs.gap == 'true'
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
        working-directory: source-reader
        run: |
          python - <<'PY_REPLAY' > "$RUNNER_TEMP/boat-gap-replay.json"
          import os
          from pathlib import Path
          import race_ai
          for folder in ('../pr64-reference', '../pr72-reference'):
              package=Path(folder, 'race_ai').resolve()
              assert package.is_dir(), 'PINNED_OFFICIAL_ADAPTER_MISSING'
              race_ai.__path__.append(str(package))
          from scripts.racer_intraday_refresh import main
          raise SystemExit(main(['--private-dir',
              os.path.join(os.environ['RUNNER_TEMP'],'boat-gap-sourcefree'),
              '--replay-retained-results']))
          PY_REPLAY
          python - <<'PY'
          from pathlib import Path
          import json,os
          doc=json.loads((Path(os.environ['RUNNER_TEMP'])/'boat-gap-replay.json').read_text())
          assert doc['status']=='RETAINED_RESULTS_REPLAYED'
          assert doc['source_requests']==0 and doc['originals_changed'] is False
          assert doc['source_state_saved'] is False
          assert doc['forecasting_performed'] is False
          assert doc['readback_verified'] is True
          print(json.dumps({'status':'RETAINED_GAP_RECOVERY_VERIFIED',
                'source_requests':0,'changed_races':doc['changed_races'],
                'originals_changed':False,'readback_verified':True},sort_keys=True))
          PY
      - name: Upload count-only audit proof
        if: always() && steps.audit.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-result-gap-sourcefree-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/boat-gap-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Request only the second bounded source-free proof and then stop
        if: >-
          success() && github.event_name == 'push' &&
          startsWith(github.event.head_commit.message,
                     'boat-gap-audit: two-sourcefree-passes-20261112')
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh workflow run boat-result-gap-recovery.yml --ref main -f cycle=2
          echo 'BOAT_GAP_SECOND_PROOF_DISPATCHED_NO_PROVIDER_GET'

  fresh_result:
    name: Fresh bounded official result intake
    needs: observed_gap
    outputs:
      result_cipher: ${{ steps.new_result.outputs.result_cipher }}
      new_results: ${{ steps.new_result.outputs.new_results }}
      before_final: ${{ steps.new_result.outputs.before_final }}
      after_final: ${{ steps.new_result.outputs.after_final }}
      result_digest: ${{ steps.new_result.outputs.result_digest }}
      inventory_digest: ${{ steps.new_result.outputs.inventory_digest }}
      scope_days: ${{ steps.new_result.outputs.scope_days }}
    if: >-
      needs.observed_gap.result == 'success' && needs.observed_gap.outputs.gap == 'true' &&
      github.repository == 'haji84/RACE-AI' &&
      ((github.event_name == 'schedule' &&
        github.ref == 'refs/heads/main' &&
        github.event.schedule == '11,26,41,56 0-14,22-23 * * *') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.run_attempt == 1 &&
        (github.event.workflow_run.conclusion == 'success' ||
         (github.event.workflow_run.name == 'KEIRIN hourly personal research canary' &&
          github.event.workflow_run.conclusion == 'failure')) &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message,
          'boat-gap-fresh-proof: single-bounded-intake-20261112')))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Install unmodified bounded result collector separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6327bc5675aee2da94ac13397f1f86f39b27d8fd
          path: source-reader
          persist-credentials: false
      - name: Install immutable original official parser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - name: Install immutable original result adapter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - name: Install existing source reader dependencies
        run: python -m pip install --disable-pip-version-check -r source-reader/requirements-history.txt
      - name: Read sealed source freshness and genuinely due result count without provider GET
        working-directory: source-reader
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
        run: |
          python - <<'PY' > "$RUNNER_TEMP/boat-gap-fresh-sealed-health.json"
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          import json,race_ai
          for folder in ('../pr64-reference','../pr72-reference'):
              package=Path(folder,'race_ai').resolve()
              assert package.is_dir(), 'PINNED_OFFICIAL_ADAPTER_MISSING'
              race_ai.__path__.append(str(package))
          from scripts.boat_private_original_vault import _environment
          from race_ai.racer_intraday_handoff import load_intraday
          from race_ai.racer_result_bridge import SavedResultBridge
          from race_ai.racer_daily import clock
          from race_ai import saved_view_feed as F
