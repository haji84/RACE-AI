          digest=hashlib.sha256(json.dumps(finals,sort_keys=True,
              separators=(',',':')).encode()).hexdigest()
          assert digest==os.environ['EXPECTED_RESULT_DIGEST']
          day=os.environ['EXPECTED_NEW_FINAL_DAY']
          assert day in bridge.days
          day_final=sum((r.get('result') or {}).get('status')=='final' and r['event_date_jst']==day for r in bridge.rows)
          assert day_final==int(os.environ['EXPECTED_NEW_DAY_AFTER'])>int(os.environ['EXPECTED_NEW_DAY_BEFORE'])
          print(json.dumps(dict(status='FRESH_RESULT_INDEPENDENT_AES_READBACK_VERIFIED',
              provider_gets=0,new_final_count=final-before,
              exact_source_cipher_matched=True,exact_result_digest_matched=True,
              original_inventory_unchanged=True,new_final_day_verified=True),sort_keys=True))
          PY

  fresh_pdca_stage:
    name: BOAT source-free model PDCA stage after new official final
    needs: [fresh_result, fresh_readback]
    if: needs.fresh_readback.result == 'success' && needs.fresh_result.outputs.new_results == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0796b52c2804177976e4c2e5ab9b65f32589720b
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Score retained original models with existing source-free scorer
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
        run: |
          python -m scripts.racer_intraday_refresh --private-dir "$RUNNER_TEMP/boat-fresh-pdca" --stage-existing-pdca > "$RUNNER_TEMP/boat-fresh-pdca.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          doc=json.loads((Path(os.environ['RUNNER_TEMP'])/'boat-fresh-pdca.json').read_text())
          assert doc['status']=='STAGED_NEEDS_INDEPENDENT_READBACK'
          assert doc['source_requests']==doc['source_provider_requests']==0
          assert doc['forecast_rewrites']==0 and doc['actual_purchases'] is False
          assert doc['formally_scored_forecasts']>0
          print(json.dumps(dict(status='BOAT_EXISTING_MODEL_PDCA_STAGED',source_gets=0,
               scored_forecasts=doc['formally_scored_forecasts'],originals_changed=False),
               sort_keys=True))
          PY

  fresh_pdca_readback:
