                              safe.append(m.group(1)+':'+m.group(2)+':'+m.group(3))
              print(json.dumps(dict(status='BOAT_FRESH_SOURCE_FAILED',
                  reason=reason,source_status=stage,exception_type=kind,
                  sanitized_source_trace=safe,
                  provider_requests_verified=False),sort_keys=True))
          except Exception:
              print(json.dumps(dict(status='BOAT_FRESH_SOURCE_FAILED',
                  reason='NO_SANITIZABLE_PRIVATE_REPORT',
                  provider_requests_verified=False),sort_keys=True))
          PY

      - name: Require actual new official result and no source-limit bypass
        if: steps.source_gate.outputs.admitted == 'true'
        id: new_result
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
        run: |
          python - <<'PY'
          import json,os,sys,hashlib,datetime
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'boat-gap-fresh-result-private.json').read_text())
          assert report['schema']=='RACE_AI_RACER_INTRADAY_RUN_V1'
          assert report['status']=='INTRADAY_REFRESHED'
          assert 0<report['source_requests']<=12
          assert report['retained']['status']=='INTRADAY_ENCRYPTED_DELTA_RETAINED'
          assert report['retained']['new_capture_count']>0
          assert report['result_sync']['changed_races']>0
          assert report['result_sync']['state']=='READY'
          assert report['forecast_inputs_changed'] is False
          assert report['private_sources_published'] is False
          baseline=json.loads((Path(os.environ['RUNNER_TEMP'])/'boat-gap-fresh-sealed-health.json').read_text())
          sys.path.insert(0,str(Path('source-reader').resolve()))
          import race_ai
          for folder in ('pr64-reference','pr72-reference'):
              package=Path(folder,'race_ai').resolve()
              assert package.is_dir()
              race_ai.__path__.append(str(package))
          from scripts.boat_private_original_vault import _environment
          from race_ai.racer_result_bridge import SavedResultBridge
          from race_ai import saved_view_feed as F
          bridge=SavedResultBridge(_environment(Path('source-reader').resolve()),
              now=datetime.datetime.now(datetime.timezone.utc))
          rows=bridge.rows
          after_final=sum((r.get('result') or {}).get('status')=='final' for r in rows)
          assert sorted(bridge.days)==baseline['scope_days']
          assert len(rows)==baseline['baseline_races']
          assert after_final>baseline['before_final']
          inventory=F.inventory_sha(dict(schema='RACE_AI_PRIVATE_CYCLE_VIEW_V1',records=rows))
          assert inventory==baseline['inventory_digest']
          finals=sorted((r['race_id'],r['result']) for r in rows
              if (r.get('result') or {}).get('status')=='final')
          digest=hashlib.sha256(json.dumps(finals,sort_keys=True,
              separators=(',',':')).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('new_results=true\n')
              stream.write('result_cipher='+report['retained']['cipher_sha256']+'\n')
              stream.write('before_final='+str(baseline['before_final'])+'\n')
              stream.write('after_final='+str(after_final)+'\n')
              stream.write('result_digest='+digest+'\n')
              stream.write('inventory_digest='+inventory+'\n')
              stream.write('scope_days='+','.join(bridge.days)+'\n')
          print(json.dumps(dict(status='FRESH_OFFICIAL_FINAL_INCREASE_VERIFIED',
              provider_gets=report['source_requests'],
              changed_races=report['result_sync']['changed_races'],
              new_final_count=after_final-baseline['before_final'],
              source_cipher_retained=True,forecast_inputs_changed=False),
              sort_keys=True))
          PY

  fresh_readback:
    name: Independently reopen fresh results on different runner (zero GET)
    needs: fresh_result
    if: needs.fresh_result.result == 'success' && needs.fresh_result.outputs.new_results == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6327bc5675aee2da94ac13397f1f86f39b27d8fd
          persist-credentials: false
      - name: Install immutable official parser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - name: Install immutable result adapter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Reopen actual saved AES result and verify unchanged prediction inventory
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
          EXPECTED_SOURCE_CIPHER: '${{ needs.fresh_result.outputs.result_cipher }}'
          EXPECTED_BEFORE_FINAL: '${{ needs.fresh_result.outputs.before_final }}'
          EXPECTED_AFTER_FINAL: '${{ needs.fresh_result.outputs.after_final }}'
          EXPECTED_RESULT_DIGEST: '${{ needs.fresh_result.outputs.result_digest }}'
          EXPECTED_INVENTORY_DIGEST: '${{ needs.fresh_result.outputs.inventory_digest }}'
          EXPECTED_SCOPE_DAYS: '${{ needs.fresh_result.outputs.scope_days }}'
        run: |
          python - <<'PY'
          import json,race_ai,hashlib,os,datetime
          from pathlib import Path
          for folder in ('pr64-reference','pr72-reference'):
              package=Path(folder,'race_ai').resolve()
              assert package.is_dir(), 'PINNED_OFFICIAL_ADAPTER_MISSING'
              race_ai.__path__.append(str(package))
          from scripts.boat_private_original_vault import _environment
          from race_ai.racer_intraday_handoff import load_intraday
          from race_ai.racer_result_bridge import SavedResultBridge
          from race_ai import saved_view_feed as F
          repo=_environment(Path('.').resolve())
          loaded=load_intraday(repo)
          assert loaded['previous']['head']['cipher_sha256']==os.environ['EXPECTED_SOURCE_CIPHER']
          bridge=SavedResultBridge(repo,now=datetime.datetime.now(datetime.timezone.utc))
          assert ','.join(bridge.days)==os.environ['EXPECTED_SCOPE_DAYS']
          final=sum((row.get('result') or {}).get('status')=='final' for row in bridge.rows)
          before=int(os.environ['EXPECTED_BEFORE_FINAL'])
          assert final==int(os.environ['EXPECTED_AFTER_FINAL']) and final>before
          inventory=F.inventory_sha(dict(schema='RACE_AI_PRIVATE_CYCLE_VIEW_V1',
                                         records=bridge.rows))
          assert inventory==os.environ['EXPECTED_INVENTORY_DIGEST']
          finals=sorted((r['race_id'],r['result']) for r in bridge.rows
              if (r.get('result') or {}).get('status')=='final')
          digest=hashlib.sha256(json.dumps(finals,sort_keys=True,
              separators=(',',':')).encode()).hexdigest()
          assert digest==os.environ['EXPECTED_RESULT_DIGEST']
          print(json.dumps(dict(status='FRESH_RESULT_INDEPENDENT_AES_READBACK_VERIFIED',
              provider_gets=0,new_final_count=final-before,
              exact_source_cipher_matched=True,exact_result_digest_matched=True,
              original_inventory_unchanged=True),sort_keys=True))
          PY
