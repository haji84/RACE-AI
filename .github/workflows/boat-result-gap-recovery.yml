          PY

      - name: Report whitelisted source-error reason without original or key
        if: failure() && steps.source_gate.outputs.admitted == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,re
          path=Path(os.environ['RUNNER_TEMP'])/'boat-gap-fresh-result-private.json'
          try:
              data=json.loads(path.read_text())
              assert type(data) is dict
