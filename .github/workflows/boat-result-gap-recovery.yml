          assert loaded['previous']['head']['cipher_sha256']==os.environ['EXPECTED_SOURCE_CIPHER']
          bridge=SavedResultBridge(repo,now=datetime.datetime.now(datetime.timezone.utc))
          if os.environ.get('EXPECTED_BACKFILL_DAY'):
