      - name: Audit source-free recovery eligibility
        id: audit
        run: |
          python scripts/boat_result_gap_audit.py \
            --runs "$RUNNER_TEMP/boat-schedule-runs.json" \
            --output "$RUNNER_TEMP/boat-gap-evidence.json"
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ['RUNNER_TEMP'])/'boat-gap-evidence.json'
          data=json.loads(p.read_text())
          assert data['requested_source_gets']==0 and data['source_budget_extended'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('gap=' + str(data['status']=='SCHEDULE_GAP_CONFIRMED').lower() + '\n')
          PY
      - name: Recover already retained authenticated results only, no source GET
        if: steps.audit.outputs.gap == 'true'
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
        working-directory: source-reader
        run: |
          python - <<'PY_REPLAY' > "$RUNNER_TEMP/boat-gap-replay.json"
          import os
          from pathlib import Path
          import race_ai
          for folder in ('../pr64-reference', '../pr72-reference'):
              package=Path(folder, 'race_ai').resolve()
              assert package.is_dir(), 'PINNED_OFFICIAL_ADAPTER_MISSING'
              race_ai.__path__.append(str(package))
          from scripts.racer_intraday_refresh import main
          raise SystemExit(main(['--private-dir',
              os.path.join(os.environ['RUNNER_TEMP'],'boat-gap-sourcefree'),
              '--replay-retained-results']))
          PY_REPLAY
          python - <<'PY'
          from pathlib import Path
          import json,os
          doc=json.loads((Path(os.environ['RUNNER_TEMP'])/'boat-gap-replay.json').read_text())
          assert doc['status']=='RETAINED_RESULTS_REPLAYED'
          assert doc['source_requests']==0 and doc['originals_changed'] is False
          assert doc['source_state_saved'] is False
          assert doc['forecasting_performed'] is False
          assert doc['readback_verified'] is True
          print(json.dumps({'status':'RETAINED_GAP_RECOVERY_VERIFIED',
                'source_requests':0,'changed_races':doc['changed_races'],
                'originals_changed':False,'readback_verified':True},sort_keys=True))
          PY
      - name: Upload count-only audit proof
        if: always() && steps.audit.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-result-gap-sourcefree-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/boat-gap-evidence.json
          if-no-files-found: error
          retention-days: 90
      - name: Request only the second bounded source-free proof and then stop
        if: >-
          success() && github.event_name == 'push' &&
          startsWith(github.event.head_commit.message,
                     'boat-gap-audit: two-sourcefree-passes-20261112')
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          gh workflow run boat-result-gap-recovery.yml --ref main -f cycle=2
          echo 'BOAT_GAP_SECOND_PROOF_DISPATCHED_NO_PROVIDER_GET'

  fresh_result:
    name: Fresh bounded official result intake
    needs: observed_gap
    outputs:
      result_cipher: ${{ steps.new_result.outputs.result_cipher }}
      new_results: ${{ steps.new_result.outputs.new_results }}
      before_final: ${{ steps.new_result.outputs.before_final }}
      after_final: ${{ steps.new_result.outputs.after_final }}
      result_digest: ${{ steps.new_result.outputs.result_digest }}
      inventory_digest: ${{ steps.new_result.outputs.inventory_digest }}
      scope_days: ${{ steps.new_result.outputs.scope_days }}
      backfill_day: ${{ steps.new_result.outputs.backfill_day }}
      new_final_day: ${{ steps.new_result.outputs.new_final_day }}
      new_day_before: ${{ steps.new_result.outputs.new_day_before }}
      new_day_after: ${{ steps.new_result.outputs.new_day_after }}
    if: >-
      needs.observed_gap.result == 'success' && needs.observed_gap.outputs.gap == 'true' &&
      github.repository == 'haji84/RACE-AI' &&
      ((github.event_name == 'schedule' &&
        github.ref == 'refs/heads/main' &&
        github.event.schedule == '11,26,41,56 0-14,22-23 * * *') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.run_attempt == 1 &&
        (github.event.workflow_run.conclusion == 'success' ||
         (github.event.workflow_run.name == 'KEIRIN hourly personal research canary' &&
          github.event.workflow_run.conclusion == 'failure')) &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message,
          'boat-gap-fresh-proof: single-bounded-intake-20261112')) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && inputs.cycle == 'catchup'))
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Install unmodified bounded result collector separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b123b2438b7d1d7d3e912b673fa30cd24c6c8578
          path: source-reader
          persist-credentials: false
      - name: Install immutable original official parser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - name: Install immutable original result adapter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - name: Install existing source reader dependencies
        run: python -m pip install --disable-pip-version-check -r source-reader/requirements-history.txt
      - name: Read sealed source freshness and genuinely due result count without provider GET
        id: source_scope
        working-directory: source-reader
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
        run: |
          python - <<'PY' > "$RUNNER_TEMP/boat-gap-fresh-sealed-health.json"
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          import json,os,race_ai
          for folder in ('../pr64-reference','../pr72-reference'):
              package=Path(folder,'race_ai').resolve()
              assert package.is_dir(), 'PINNED_OFFICIAL_ADAPTER_MISSING'
              race_ai.__path__.append(str(package))
          from scripts.boat_private_original_vault import _environment
          from race_ai.racer_intraday_handoff import load_intraday
          from race_ai.racer_result_bridge import SavedResultBridge
          from race_ai.racer_daily import clock
          from race_ai import saved_view_feed as F
          repo=_environment(Path('.').resolve())
          control=load_intraday(repo)['state'].control
          bridge=SavedResultBridge(repo,now=datetime.now(timezone.utc))
          older=bridge.choose_older_pending_day()
          if older:bridge.include_backfill_day(older)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('backfill_day='+str(older or '')+'\n')
          now=datetime.now(timezone.utc)
          retry=control.get('settlement_next') or {}
          assert isinstance(retry,dict), 'UNVERIFIED_RESULT_RETRY_CLOCKS'
          due=sum(target['pending'] and target['cutoff_at'] is not None and
              clock(target['cutoff_at'])+timedelta(minutes=5)<=now and
              (target['race_id'] not in retry or clock(retry[target['race_id']])<=now)
              for target in bridge.targets())
          wait=(control.get('waits') or {}).get('boatrace') or {}
          final=sum((row.get('result') or {}).get('status')=='final' for row in bridge.rows)
          before_by_day={day:sum((row.get('result') or {}).get('status')=='final' and row['event_date_jst']==day for row in bridge.rows) for day in bridge.days}
          inventory=F.inventory_sha(dict(schema='RACE_AI_PRIVATE_CYCLE_VIEW_V1',records=bridge.rows))
          print(json.dumps(dict(last_checked_at=control.get('last_checked_at'),
              due_count=due,boatrace_hold_until=wait.get('until'),
              before_final=final,before_by_day=before_by_day,baseline_races=len(bridge.rows),
              scope_days=sorted(bridge.days),backfill_day=older,
              inventory_digest=inventory),sort_keys=True))
          PY
      - name: Revalidate trusted schedules, all prior source attempts and sealed budget
        id: source_gate
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          python scripts/boat_result_gap_fresh_gate.py \
            --source "$RUNNER_TEMP/boat-gap-fresh-sealed-health.json" \
            --output "$RUNNER_TEMP/boat-gap-fresh-admission.json"
      - name: Prepare authenticated Git-only state writes before any provider GET
        if: steps.source_gate.outputs.admitted == 'true'
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          # Existing source checkout is read-only by design. Configure the
          # standard GitHub CLI credential helper only after all GET gates pass.
          gh auth setup-git
          if git config --get-regexp '^url\\..*\\.(insteadof|pushinsteadof)$' >/dev/null; then
            echo 'HOLD_GIT_URL_REWRITE'
            exit 2
          fi
          # A credential-helper *key* may be "credential.helper" or
          # URL-scoped. Verify its actual answer without logging the token.
          GIT_TERMINAL_PROMPT=0 python - <<'PY'
          import subprocess
          request=b'protocol=https\nhost=github.com\n\n'
          response=subprocess.run(['git','-C','source-reader','credential','fill'],
              input=request,capture_output=True,timeout=15)
          values=dict(line.split('=',1) for line in response.stdout.decode('utf-8').splitlines()
                      if '=' in line)
          if response.returncode!=0 or not values.get('username') or not values.get('password'):
              raise SystemExit('HOLD_GIT_CREDENTIAL_UNAVAILABLE')
          print('AUTHENTICATED_GIT_CREDENTIAL_AVAILABLE_NO_PROVIDER_GET')
          PY
          git -C source-reader ls-remote --heads origin 'refs/heads/state/boat-pdca-transfer' >/dev/null
          echo 'AUTHENTICATED_GIT_STATE_WRITE_PATH_CONFIGURED_NO_PROVIDER_GET'
      - name: Consume at most 36 owner-admitted official-result GETs once per durable admission
        if: steps.source_gate.outputs.admitted == 'true'
        working-directory: source-reader
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
          RACE_AI_BOAT_BACKFILL_DAY: '${{ steps.source_scope.outputs.backfill_day }}'
          RACE_AI_BOAT_RESULT_CATCHUP_ADMITTED: '${{ steps.source_gate.outputs.admitted }}'
          RACE_AI_BOAT_RESULT_GET_CAP: '${{ steps.source_gate.outputs.source_get_cap }}'
        run: |
          python - <<'PY' > "$RUNNER_TEMP/boat-gap-fresh-result-private.json"
          import os,race_ai
          from pathlib import Path
          for folder in ('../pr64-reference','../pr72-reference'):
              package=Path(folder,'race_ai').resolve()
              assert package.is_dir(), 'PINNED_OFFICIAL_ADAPTER_MISSING'
              race_ai.__path__.append(str(package))
          from scripts.racer_intraday_refresh import main
          raise SystemExit(main(['--private-dir',
              os.path.join(os.environ['RUNNER_TEMP'],'boat-gap-fresh'),
              '--sync-results']))
          PY

      - name: Report whitelisted source-error reason without original or key
        if: failure() && steps.source_gate.outputs.admitted == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,re
          path=Path(os.environ['RUNNER_TEMP'])/'boat-gap-fresh-result-private.json'
          try:
              data=json.loads(path.read_text())
              assert type(data) is dict
              reason=data.get('reason')
              if not isinstance(reason,str) or not re.fullmatch('[A-Z0-9_]{3,100}',reason):
                  reason='UNKNOWN_UNEXPOSED_ERROR'
              stage=data.get('status')
              if stage not in ('HOLD','SOURCE_WAIT','INTRADAY_REFRESHED'):
                  stage='UNKNOWN'
              kind=data.get('exception_type')
              if kind not in ('ValueError','RuntimeError','KeyError','TypeError','AssertionError'):
                  kind='UNKNOWN'
              frames=data.get('code_trace')
              safe=[]
              allowed={'boat_pdca_github_handoff.py','racer_intraday_handoff.py',
                       'racer_daily_handoff.py','racer_intraday_refresh.py',
                       'racer_result_bridge.py','saved_view_feed.py','saved_pages.py',
                       'boat_private_original_vault.py'}
              if isinstance(frames,list) and len(frames)<=8:
                  for frame in frames:
                      if isinstance(frame,str) and len(frame)<=150:
                          m=re.fullmatch(r'([a-zA-Z0-9_]+\.py):([0-9]{1,5}):([a-zA-Z0-9_]{1,65})',frame)
                          if m and m.group(1) in allowed:
                              safe.append(m.group(1)+':'+m.group(2)+':'+m.group(3))
              print(json.dumps(dict(status='BOAT_FRESH_SOURCE_FAILED',
                  reason=reason,source_status=stage,exception_type=kind,
                  sanitized_source_trace=safe,
                  provider_requests_verified=False),sort_keys=True))
          except Exception:
              print(json.dumps(dict(status='BOAT_FRESH_SOURCE_FAILED',
                  reason='NO_SANITIZABLE_PRIVATE_REPORT',
                  provider_requests_verified=False),sort_keys=True))
          PY

      - name: Require actual new official result and no source-limit bypass
        if: steps.source_gate.outputs.admitted == 'true'
        id: new_result
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
          EXPECTED_SOURCE_GET_CAP: '${{ steps.source_gate.outputs.source_get_cap }}'
        run: |
          python - <<'PY'
          import json,os,sys,hashlib,datetime
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'boat-gap-fresh-result-private.json').read_text())
          assert report['schema']=='RACE_AI_RACER_INTRADAY_RUN_V1'
          assert report['status']=='INTRADAY_REFRESHED'
          assert 0<report['source_requests']<=int(os.environ['EXPECTED_SOURCE_GET_CAP'])<=36
          assert report['retained']['status']=='INTRADAY_ENCRYPTED_DELTA_RETAINED'
          assert report['retained']['new_capture_count']>0
          assert report['result_sync']['changed_races']>0
          assert report['result_sync']['state']=='READY'
          assert report['forecast_inputs_changed'] is False
          assert report['private_sources_published'] is False
          baseline=json.loads((Path(os.environ['RUNNER_TEMP'])/'boat-gap-fresh-sealed-health.json').read_text())
          sys.path.insert(0,str(Path('source-reader').resolve()))
          import race_ai
          for folder in ('pr64-reference','pr72-reference'):
              package=Path(folder,'race_ai').resolve()
              assert package.is_dir()
              race_ai.__path__.append(str(package))
          from scripts.boat_private_original_vault import _environment
          from race_ai.racer_result_bridge import SavedResultBridge
          from race_ai import saved_view_feed as F
          bridge=SavedResultBridge(_environment(Path('source-reader').resolve()),
              now=datetime.datetime.now(datetime.timezone.utc))
          bridge.include_backfill_day(baseline.get('backfill_day'))
          rows=bridge.rows
          after_final=sum((r.get('result') or {}).get('status')=='final' for r in rows)
          assert sorted(bridge.days)==baseline['scope_days']
          assert len(rows)==baseline['baseline_races']
          assert after_final>baseline['before_final']
          inventory=F.inventory_sha(dict(schema='RACE_AI_PRIVATE_CYCLE_VIEW_V1',records=rows))
          assert inventory==baseline['inventory_digest']
          finals=sorted((r['race_id'],r['result']) for r in rows
              if (r.get('result') or {}).get('status')=='final')
          digest=hashlib.sha256(json.dumps(finals,sort_keys=True,
              separators=(',',':')).encode()).hexdigest()
          after_by_day={day:sum((r.get('result') or {}).get('status')=='final' and r['event_date_jst']==day for r in rows) for day in bridge.days}
          assert set(after_by_day)==set(baseline['before_by_day'])
          new_days=sorted(day for day in after_by_day if after_by_day[day]>baseline['before_by_day'][day])
          assert new_days, 'NO_NEW_OFFICIAL_FINAL_DAY'
          new_day=new_days[-1]
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('new_results=true\n')
              stream.write('result_cipher='+report['retained']['cipher_sha256']+'\n')
              stream.write('before_final='+str(baseline['before_final'])+'\n')
              stream.write('after_final='+str(after_final)+'\n')
              stream.write('result_digest='+digest+'\n')
              stream.write('inventory_digest='+inventory+'\n')
              stream.write('scope_days='+','.join(bridge.days)+'\n')
              stream.write('backfill_day='+str(baseline.get('backfill_day') or '')+'\n')
              stream.write('new_final_day='+new_day+'\n')
              stream.write('new_day_before='+str(baseline['before_by_day'][new_day])+'\n')
              stream.write('new_day_after='+str(after_by_day[new_day])+'\n')
          print(json.dumps(dict(status='FRESH_OFFICIAL_FINAL_INCREASE_VERIFIED',
              provider_gets=report['source_requests'],
              changed_races=report['result_sync']['changed_races'],
              new_final_count=after_final-baseline['before_final'],
              source_cipher_retained=True,forecast_inputs_changed=False),
              sort_keys=True))
          PY

  fresh_readback:
