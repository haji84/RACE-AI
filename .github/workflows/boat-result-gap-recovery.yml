                  stage='UNKNOWN'
              kind=data.get('exception_type')
              if kind not in ('ValueError','RuntimeError','KeyError','TypeError','AssertionError'):
                  kind='UNKNOWN'
              frames=data.get('code_trace')
              safe=[]
              allowed={'boat_pdca_github_handoff.py','racer_intraday_handoff.py',
                       'racer_daily_handoff.py','racer_intraday_refresh.py',
                       'racer_result_bridge.py','saved_view_feed.py','saved_pages.py',
                       'boat_private_original_vault.py'}
              if isinstance(frames,list) and len(frames)<=8:
