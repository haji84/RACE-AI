  fresh_site_browser:
    name: BOAT live Pages original-model result comparison after AES verification
    needs: [fresh_result, fresh_readback, fresh_pdca_readback]
    if: needs.fresh_readback.result == 'success' && needs.fresh_pdca_readback.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0796b52c2804177976e4c2e5ab9b65f32589720b
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - run: npm install --prefix "$RUNNER_TEMP/result-site-tools" --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Authenticate actual updated saved result and private browser probe
        env:
          GH_TOKEN: '${{ github.token }}'
          RACE_AI_STATE_KEY: '${{ secrets.RACE_AI_STATE_KEY }}'
          TARGET_DAY: '${{ needs.fresh_result.outputs.new_final_day }}'
          NODE_PATH: ${{ runner.temp }}/result-site-tools/node_modules
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ''
        run: |
          python - <<'PY'
          import datetime,os,re
          from pathlib import Path
          day=os.environ['TARGET_DAY']
          assert re.fullmatch(r'20[0-9]{2}-[01][0-9]-[0-3][0-9]',day)
          assert datetime.date.fromisoformat(day).isoformat()==day
          PY
          python -m scripts.boat_saved_site_context --output "$RUNNER_TEMP/boat-saved-site-context.json" --day "$TARGET_DAY" --stage P0 > "$RUNNER_TEMP/boat-fresh-site-context-summary.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.boat_private_original_vault import _environment
          from scripts.boat_saved_view_feed import git_auth
          from race_ai.racer_result_bridge import SavedResultBridge
          from datetime import datetime,timezone
          base=Path(os.environ['RUNNER_TEMP'])
          context=json.loads((base/'boat-saved-site-context.json').read_text())
          assert context['day']==os.environ['TARGET_DAY'] and context['minimum_results']>0
          assert context['stage']=='P0' and context['native_p0_groups']>0
          git_auth()
          bridge=SavedResultBridge(_environment(Path('.').resolve()),now=datetime.now(timezone.utc))
          if context['day'] in bridge.days:
              selected_rows=bridge.rows
          else:
              from race_ai import saved_view_feed as F
              selected_rows=F.current_view(bridge.git,bridge.bootstrap,day=context['day'])[3]['records']
          choices=[r['race_id'] for r in selected_rows if r['event_date_jst']==context['day']
                   and (r.get('result') or {}).get('status')=='final'
                   and any(p and p.get('stage')=='P0' and p.get('external_receipt_verified') is True
                           and p.get('eligible_pre_cutoff',True) is True
                           for p in [r.get('prediction'),*(r.get('comparison_predictions') or [])])]
          assert choices, 'NO_FINAL_WITH_SAVED_PRE_RACE_MODEL'
          path=base/'boat-fresh-result-probe-id'
          fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'w') as out:out.write(sorted(choices)[0])
          print(json.dumps(dict(status='BOAT_PRIVATE_FINAL_MODEL_PROBE_READY',
               source_gets=0,eligible_final_model_races=len(choices)),sort_keys=True))
          PY
          PROBE_RACE="$(cat "$RUNNER_TEMP/boat-fresh-result-probe-id")"
          env -u RACE_AI_STATE_KEY -u GH_TOKEN -u GITHUB_TOKEN node scripts/boat_saved_site_check.cjs "$RUNNER_TEMP/boat-saved-site-context.json" --compact-results "--race-id=$PROBE_RACE" > "$RUNNER_TEMP/boat-fresh-browser.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          expected=json.loads((base/'boat-saved-site-context.json').read_text())
          browser=json.loads((base/'boat-fresh-browser.json').read_text())
          assert browser['status']=='LIVE_OWNER_SITE_VERIFIED'
          assert browser['feed_generation']>=expected['generation']
          assert browser['selected_saved_day']==expected['day']
          assert browser['checked_day_results']>=expected['minimum_results']>0
          assert browser['probe_result_matched'] is True
          assert browser['ai_results_navigation_verified'] is True
          assert browser['hit_miss_rate_roi_and_settled_pending_net_visible'] is True
          assert browser['key_in_requests_or_storage'] is False
          assert browser['official_source_requests']==0 and browser['plaintext_published'] is False
          print(json.dumps(dict(status='FRESH_OFFICIAL_RESULT_MODEL_MATCH_LIVE_PAGES_VERIFIED',
               verified_date=expected['day'],source_gets=0,
               browser_generation=browser['feed_generation'],
               verified_result_count=browser['checked_day_results'],
               model_comparison_visible=True,plaintext_published=False),sort_keys=True))
          PY

  source_free_followup:
    name: BOAT source-free dispatch only after independently verified new results
    needs: [fresh_result, fresh_readback]
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      github.ref == 'refs/heads/main' &&
      needs.fresh_result.outputs.new_results == 'true' &&
      needs.fresh_readback.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Queue another independently gated catch-up, not a source GET
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          # The new workflow MUST revalidate actual due targets, provider
          # hold, rolling 96 GET/hour, and the single-writer concurrency.
          # A failed or no-new-results run cannot trigger another cycle.
          gh workflow run boat-result-gap-recovery.yml --repo "$GITHUB_REPOSITORY" --ref main -f cycle=catchup
          echo 'BOAT_NEXT_CATCHUP_QUEUED_WITHOUT_PROVIDER_GET'
