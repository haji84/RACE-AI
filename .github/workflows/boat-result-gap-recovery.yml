          assert report['retained']['new_capture_count']>0
          assert report['result_sync']['changed_races']>0
          assert report['result_sync']['state']=='READY'
          assert report['forecast_inputs_changed'] is False
          assert report['private_sources_published'] is False
          baseline=json.loads((Path(os.environ['RUNNER_TEMP'])/'boat-gap-fresh-sealed-health.json').read_text())
          sys.path.insert(0,str(Path('source-reader').resolve()))
          import race_ai
          for folder in ('pr64-reference','pr72-reference'):
              package=Path(folder,'race_ai').resolve()
              assert package.is_dir()
              race_ai.__path__.append(str(package))
          from scripts.boat_private_original_vault import _environment
          from race_ai.racer_result_bridge import SavedResultBridge
          from race_ai import saved_view_feed as F
          bridge=SavedResultBridge(_environment(Path('source-reader').resolve()),
              now=datetime.datetime.now(datetime.timezone.utc))
          rows=bridge.rows
          after_final=sum((r.get('result') or {}).get('status')=='final' for r in rows)
          assert sorted(bridge.days)==baseline['scope_days']
          assert len(rows)==baseline['baseline_races']
          assert after_final>baseline['before_final']
          inventory=F.inventory_sha(dict(schema='RACE_AI_PRIVATE_CYCLE_VIEW_V1',records=rows))
          assert inventory==baseline['inventory_digest']
          finals=sorted((r['race_id'],r['result']) for r in rows
              if (r.get('result') or {}).get('status')=='final')
          digest=hashlib.sha256(json.dumps(finals,sort_keys=True,
              separators=(',',':')).encode()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('new_results=true\n')
