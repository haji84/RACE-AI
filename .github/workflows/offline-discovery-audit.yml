      - 'docs/P0_DISCOVERY_AUDIT_CLI_20261022.md'
      - '.github/workflows/offline-discovery-audit.yml'
permissions:
  contents: read
jobs:
  offline_audit_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify checked-out head and python version
        run: |
          git rev-parse HEAD
          python --version
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v

      - name: Checkout pinned PR71 research models for fictional contract joining
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 5d4be4326b4fba321507a08f09e1eb7b661d027e
          path: pr71-contract-reference
          persist-credentials: false
      - name: Cross-branch PR71 model-delivery to PR72 source binding (synthetic)
        run: python scripts/verify_pr71_crossbranch_synthetic.py
      - name: Audit real observed Oct-24 biwako racer facts against pinned model requirements
        run: python scripts/verify_actual_boat_readiness.py
      - name: Checkout separately pinned PR71 head for independent feature contract review
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 83dcd8a1af7a4e8611732c60d2b461c970164403
          path: pr71-feature-review-reference
          persist-credentials: false
      - name: Audit full 20 distinct keys and 75 required boat input slots
        run: python -m scripts.review_boat_feature_gate
      - name: Checkout pinned PR64 full K-history package (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-existing-reference
          persist-credentials: false
      - name: Checkout pinned PR71 existing boat models and adapter (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 39d888329d18a5ed517de7c6b25ae3ca52257255
          path: pr71-existing-reference
          persist-credentials: false
      - name: Prove existing PR64 K -> PR71 multi-model wiring on synthetic records
        run: python -m unittest discover -s tests -p test_boat_existing_asset_integration.py -v
      - name: Test one same-race K/B/preview/weather source joining and NO_FORECAST gating
        run: python -m unittest discover -s tests -p test_p0_mikuni9_same_race_full_join_20261024.py -v
