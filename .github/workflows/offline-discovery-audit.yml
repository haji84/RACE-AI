name: Offline race discovery audit gate
on:
  pull_request:
    branches:
      - codex/actions-four-sport-e2e
    paths:
      - 'race_ai/discovery_audit_cli.py'
      - 'race_ai/operator_export_intake.py'
      - 'race_ai/nar_racelist_adapter.py'
      - 'race_ai/nar_payback_adapter.py'
      - 'race_ai/nar_daily_bundle_audit.py'
      - 'race_ai/boat_official_web_adapter.py'
      - 'race_ai/pr71_delivery_binding.py'
      - 'race_ai/race_bound_freeze_receipt.py'
      - 'race_ai/append_only_freeze_writer.py'
      - 'race_ai/proof_aware_settlement.py'
      - 'tests/test_proof_aware_settlement.py'
      - 'docs/P0_PROOF_AWARE_SETTLEMENT_20261023.md'
      - 'tests/test_append_only_freeze_writer.py'
      - 'docs/P0_APPEND_ONLY_FREEZE_WRITER_20261023.md'
      - 'tests/test_race_bound_freeze_receipt.py'
      - 'docs/P0_RACE_BOUND_FREEZE_RECEIPT_20261023.md'
      - 'scripts/verify_pr71_crossbranch_synthetic.py'
      - 'tests/test_pr71_delivery_binding.py'
      - 'docs/P0_PR71_DELIVERY_BINDING_20261023.md'
      - 'tests/test_boat_official_web_adapter.py'
      - 'docs/P0_BOAT_OFFICIAL_WEB_INTAKE_20261023.md'
      - 'tests/test_nar_daily_bundle_audit.py'
      - 'docs/P0_NAR_DAILY_BUNDLE_AUDIT_20261023.md'
      - 'tests/test_nar_payback_adapter.py'
      - 'docs/P0_NAR_PAYBACK_LOCAL_AUDIT_20261023.md'
      - 'tests/test_nar_racelist_adapter.py'
      - 'tests/test_operator_export_intake.py'
      - 'docs/P0_OFFLINE_EXPORT_INTAKE_20261023.md'
      - 'race_ai/discovery_reconcile.py'
      - 'tests/test_discovery_audit_cli.py'
      - 'docs/P0_DISCOVERY_AUDIT_CLI_20261022.md'
      - '.github/workflows/offline-discovery-audit.yml'
permissions:
  contents: read
jobs:
  offline_audit_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify checked-out head and python version
        run: |
          git rev-parse HEAD
          python --version
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v

      - name: Checkout pinned PR71 research models for fictional contract joining
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 5d4be4326b4fba321507a08f09e1eb7b661d027e
          path: pr71-contract-reference
          persist-credentials: false
      - name: Cross-branch PR71 model-delivery to PR72 source binding (synthetic)
        run: python scripts/verify_pr71_crossbranch_synthetic.py
