      - 'p0-b-live-gate-20261024'
    paths:
      - 'docs/evidence/p0-b-live-gate-trigger-20261024.txt'
permissions:
  contents: read
jobs:
  one_future_race_source_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      RACE_AI_B_LIVE_ONE_SHOT: 20261024-BIWAKO11R-ONE
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
