      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-parser-reference
      - name: Validate one real daily B file in memory for future biwako 11R
        run: python -m scripts.p0_single_future_boat_gate_20261024
