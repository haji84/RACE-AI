name: BOAT all-model recovery offline verification
on:
  push:
    branches: [fix/boat-all-model-recovery-20261110]
permissions:
  contents: read
concurrency:
  group: boat-all-model-recovery-offline-20261110
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install existing offline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Record code-only model inventory and exact repaired source
        run: |
          mkdir -p "$RUNNER_TEMP/boat-recovery-evidence"
          python - <<'PY_INVENTORY'
          import json, os
          from pathlib import Path
          from race_ai.existing_model_coverage import catalog, active_catalog, RETIRED_MODEL_IDS
          from race_ai.existing_model_dispatch import GROUPS
          value = dict(schema='RACE_AI_BOAT_RECOVERY_CODE_INVENTORY_V1', code_sha=os.environ['GITHUB_SHA'], catalogue=catalog(), active_boat=[s for s in active_catalog() if 'boat' in s['applicable_sports']], retired=sorted(RETIRED_MODEL_IDS), dispatch_groups=[dict(group=g, model_ids=list(ids)) for g, ids in GROUPS], real_forecasts_executed=False, official_source_get_count=0, owner_data_accessed=False)
          Path(os.environ['RUNNER_TEMP'],'boat-recovery-evidence','inventory.json').write_text(json.dumps(value,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY_INVENTORY
          cp race_ai/boat_post_exhibition_ab_handoff.py tests/test_boat_post_exhibition_ab_handoff.py docs/BOAT_ALL_MODEL_CONNECTION_AUDIT_20261110.md "$RUNNER_TEMP/boat-recovery-evidence/"
          python -m pip download --disable-pip-version-check --no-deps --no-binary=:all: lhafile==0.3.1 --dest "$RUNNER_TEMP/boat-recovery-evidence"
      - name: Verify all native families, preservation, readback and model PDCA contracts
        run: |
          set -o pipefail
          python - <<'PY_TEST' 2>&1 | tee "$RUNNER_TEMP/boat-recovery-evidence/targeted-python.log"
          from pathlib import Path
          import unittest, race_ai
          race_ai.__path__.extend(str(Path(root)/'race_ai') for root in ('pr64-reference','pr72-reference'))
          names=['test_existing_model_coverage','test_existing_model_dispatch','test_boat_all_model_inputs','test_boat_all_model_cycle','test_boat_all_model_cycle_cli','test_boat_all_model_native_capsules','test_boat_all_model_observed_connection','test_boat_all_model_recovery','test_boat_all_model_store','test_dispatch_product_projection','test_seller_retirement','test_boat_post_exhibition_ab_handoff','test_boat_post_exhibition_ab_coverage','test_all_existing_model_generation_clock','test_all_existing_model_cycle_connection','test_all_existing_model_cash_pdca','test_boat_venue_future_grid','test_boat_video_forward']
          suite=unittest.defaultTestLoader.loadTestsFromNames(['tests.'+n for n in names])
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY_TEST
      - name: Verify existing product selection and financial contracts
        if: always()
        run: |
          set -o pipefail
          node --test tests/product_data.test.cjs tests/model_catalog.test.cjs tests/existing_pdca_offline.test.mjs tests/saved_performance.test.cjs 2>&1 | tee "$RUNNER_TEMP/boat-recovery-evidence/targeted-node.log"
      - name: Retain public code and synthetic test evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-recovery-offline-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/boat-recovery-evidence/
          retention-days: 3
          if-no-files-found: error
  python_suite_shard:
    name: BOAT Python full-suite verification (shard ${{ matrix.shard }}/4)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          fetch-tags: false
      - name: Checkout pinned PR64 parser for offline tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - name: Checkout pinned PR72 adapters for offline tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
      - name: Use Node24 for Python subprocess contracts
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install existing offline dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Execute deterministic full-suite shard
        run: python -m scripts.ci_unittest_shard --index '${{ matrix.shard }}' --count 4

