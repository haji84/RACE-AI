name: KEIRIN owner-private auto spool E2E

on:
  push:
    branches: [feat/keirin-private-spool-runner-20261103]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  private_two_race_cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Actual PR71 forecast -> durable SQLite -> settlement -> subsequent actual PR71
        run: python -m unittest discover -s tests -p test_keirin_private_spool.py -v
      - name: Guard SQLite immutable original and revisions
        run: python -m unittest discover -s tests -p test_keirin_owner_sqlite.py -v
      - name: Guard source-to-model integrity
        run: python -m unittest discover -s tests -p test_keirin_pr71_model_adapter.py -v
      - name: All-factor KEIRIN pre-race audit and real-model fail-closed gate
        run: python -m unittest discover -s tests -p test_keirin_preflight.py -v
      - name: Verify permissioned source delivery -> exhaustive audit -> actual PR71
        run: python -m unittest discover -s tests -p test_keirin_allowed_delivery.py -v
      - name: SHA-checked owner licence manifest, private authorized-inbox staging and real PR71
        run: python -m unittest discover -s tests -p test_keirin_permissioned_owner.py -v
      - name: One GET only if provider explicitly grants machine access; no site crawl
        run: python -m unittest discover -s tests -p test_keirin_license_api_ingest.py -v
      - name: Personal owner-captured 347-field input without provider API or licence contract
        run: python -m unittest discover -s tests -p test_keirin_owner_manual.py -v
      - name: Distinguish published facts from 347 audit/derived/scenario checks
        run: python -m unittest discover -s tests -p test_keirin_field_acquisition.py -v
      - name: Non-Rakuten owner-saved racecard CSV -> 347 field audit / no invention
        run: python -m unittest discover -s tests -p test_keirin_owner_saved_csv.py -v
      - name: Operator-private service CLI and no unauthenticated provider access
        run: python -m unittest discover -s tests -p test_keirin_private_agent.py -v
