        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-parser-reference
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: 39d888329d18a5ed517de7c6b25ae3ca52257255
          path: pr71-existing-reference
      - name: One bounded real six-day K plus one-day B audit and old PR71 rating
