name: KEIRIN daily-source single capability probe
on:
  push:
    branches: [feat/keirin-fullcycle-worker-20261103]
    paths: ['.github/workflows/keirin-source-capabilities-once.yml']
permissions:
  contents: read
jobs:
  read_two_pages_max:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect two index pages once, print only technical metadata
        run: python -m scripts.keirin_source_capabilities_once
