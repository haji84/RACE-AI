name: BOAT nationwide cutoff-ordered A/B research (no Vercel)
on:
  push:
    branches:
      - feat/four-sport-forecast-audit-view-20261022
    paths:
      - docs/evidence/boat-nationwide-pilot-trigger.txt
      - .github/workflows/boat-nationwide-ab-one-shot.yml
permissions:
  contents: read
concurrency:
  group: boat-nationwide-cutoff-20261103
  cancel-in-progress: false
jobs:
  official_national:
    name: Official 24-venue day discovery and cutoff-ordered model A/B
    if: github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RACE_AI_NATIONWIDE_OWNER_SOURCE_REVIEWED: 'true'
    steps:
      - name: Checkout exact research branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Checkout pinned official parser, no PR64 modification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - name: Preserve code-only reproducibility bundle, no credentials or source data
        run: |
          mkdir -p audit_source
          git archive --format=tar.gz HEAD race_ai scripts tests workers .github docs > audit_source/pr71-source.tar.gz
          git -C pr64-reference archive --format=tar.gz HEAD race_ai scripts tests > audit_source/pr64-source.tar.gz
          sha256sum audit_source/*.tar.gz > audit_source/SHA256SUMS
      - name: Save exact code snapshot for offline verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: race-code-snapshot-${{ github.run_id }}
          path: audit_source/
          retention-days: 7
      - name: Check queue, A/B models and historic profiles
        run: |
          python -m unittest tests.test_boat_deadline_queue tests.test_boat_ab_shadow tests.test_boat_racer_tendencies -v
      - name: Discover today's active official venues, order all cutoffs, freeze eligible A/B
        run: python scripts/boat_nationwide_ab_pilot.py
      - name: Preserve derived forecast and all official cutoff ids, never source HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-national-cutoff-${{ github.run_id }}
          path: boat_nationwide_output/national.json
          if-no-files-found: warn
          retention-days: 7
