name: BOAT nationwide cutoff-ordered A/B research (no Vercel)
on:
  push:
    branches: [feat/four-sport-forecast-audit-view-20261022]
    paths:
      - docs/evidence/boat-nationwide-pilot-trigger.txt
      - .github/workflows/boat-nationwide-ab-one-shot.yml
permissions:
  contents: read
concurrency:
  group: boat-nationwide-cutoff-20261103
  cancel-in-progress: false
jobs:
  official_national:
    name: Existing P0 race-isolated parser and exhibition P1 models
    if: github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RACE_AI_NATIONWIDE_OWNER_SOURCE_REVIEWED: 'true'
    steps:
      - name: Exact PR71 code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Pinned official parser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 761247bee0209e37b1af6b8885e92cad3e9260a5, path: pr64-reference}
      - name: Reuse pinned integration adapters, no modification of PR72
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe, path: pr72-reference}
      - name: Check existing models and new orchestration, no source HTTP
        run: |
          python -m unittest tests.test_existing_day_program tests.test_program_race_isolation tests.test_boat_observed_pairwise_models tests.test_boat_deadline_queue tests.test_boat_ab_shadow tests.test_boat_racer_tendencies -v
          (cd pr72-reference && python -m unittest discover -s tests -p test_boat_observed_program_bridge.py -v)
      - name: Current-day morning forecasts, never wait for exhibition
        id: morning
        continue-on-error: true
        run: python scripts/existing_day_program.py
      - name: Preserve morning originals before any outcome collection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-p0-existing-${{ github.run_id }}
          path: boat_all_day_output/forecasts.json
          if-no-files-found: warn
          retention-days: 7
      - name: Current-day exhibition A/B and C-lite
        run: python scripts/boat_nationwide_ab_pilot.py
      - name: Preserve exhibition originals separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-national-cutoff-${{ github.run_id }}
          path: boat_nationwide_output/national.json
          if-no-files-found: warn
          retention-days: 7
      - name: Report component completion rather than treating CI green as predictions
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          lines=['## Existing-model actual execution','No wagering; no claim of complete four-sport coverage.']
          for path in ('boat_all_day_output/forecasts.json','boat_nationwide_output/national.json'):
              p=Path(path)
              if not p.exists():lines.append(path+': OUTPUT_MISSING');continue
              x=json.loads(p.read_text())
              lines.append(path+': '+str(x.get('state'))+', forecast races='+str(x.get('race_count',x.get('paired_forecast_count',0)))+', reason='+str(x.get('reason')))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n\n'.join(lines)+'\n')
          PY
