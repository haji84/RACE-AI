name: BOAT nationwide cutoff-ordered A/B research (no Vercel)
on:
  push:
    branches: [feat/four-sport-forecast-audit-view-20261022]
    paths:
      - docs/evidence/boat-nationwide-pilot-trigger.txt
      - .github/workflows/boat-nationwide-ab-one-shot.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: boat-nationwide-cutoff-20261103
  cancel-in-progress: false
jobs:
  official_national:
    name: Existing frozen P0, exhibition P1, separate official results and PDCA
    if: github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RACE_AI_NATIONWIDE_OWNER_SOURCE_REVIEWED: 'true'
    steps:
      - name: Exact PR71 code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Pinned official parser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 761247bee0209e37b1af6b8885e92cad3e9260a5, path: pr64-reference}
      - name: Pinned existing integration adapters
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe, path: pr72-reference}
      - name: Test originals, pending results, tampering and unchanged models
        run: |
          python -m unittest tests.test_first_receipt_continuity tests.test_cycle_recovery tests.test_existing_model_coverage tests.test_frozen_day_cycle tests.test_existing_day_program tests.test_program_race_isolation tests.test_boat_observed_pairwise_models tests.test_boat_ab_shadow tests.test_requested_public_cards -v
      - name: Reuse first morning original, never silently regenerate it
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/github_existing_cycle.py restore
      - name: Create only absent future P0 forecasts after parser repair
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/github_existing_cycle.py supplement
      - name: Freeze missing-only P0 supplement before any outcome input
        id: p0supplement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-p0-existing-${{ github.run_id }}
          path: p0_supplement_output/forecasts.json
          if-no-files-found: error
          retention-days: 7
      - name: Current-day exhibition A/B and C-lite
        run: python scripts/github_existing_cycle.py forecast
      - name: Freeze exhibition before reading outcomes
        id: p1freeze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-national-cutoff-${{ github.run_id }}
          path: boat_nationwide_output/national.json
          if-no-files-found: error
          retention-days: 7
      - name: Independently read server receipts and later official outcomes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/github_existing_cycle.py audit --p1-artifact '${{ steps.p1freeze.outputs.artifact-id }}' --p0-supplement '${{ steps.p0supplement.outputs.artifact-id }}'
      - name: Save queryable status, tickets, source receipts and diagnostic candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: race-existing-cycle-${{ github.run_id }}
          path: existing_cycle_output/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve verified continuity journal without public source pages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: race-cycle-continuity-${{ github.run_id }}
          path: cycle_recovery_output/
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare exact source verification bundle, no data or credentials
        if: always()
        run: tar -czf source-bundle.tar.gz --exclude='.git' --exclude='__pycache__' race_ai scripts tests .github pr64-reference/race_ai pr72-reference/race_ai
      - name: Retain reproducible source for independent local testing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: existing-cycle-source-${{ github.run_id }}
          path: source-bundle.tar.gz
          retention-days: 1
