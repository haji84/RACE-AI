      - name: Build compact sealed handoff without retained original ZIP archives
        if: always()
        run: python -m race_ai.continuity_checkpoint --source-dir cycle_recovery_output --out-dir cycle_checkpoint_output --expected-run '${{ github.run_id }}'
      - name: Preserve verified continuity journal without public source pages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: race-cycle-continuity-${{ github.run_id }}
          path: cycle_checkpoint_output/
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare exact source verification bundle, no data or credentials
        if: always()
        run: tar -czf source-bundle.tar.gz --exclude='.git' --exclude='__pycache__' race_ai scripts tests .github pr64-reference/race_ai pr72-reference/race_ai
