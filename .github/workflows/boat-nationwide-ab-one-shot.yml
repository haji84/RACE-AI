name: BOAT nationwide cutoff-ordered A/B research (no Vercel)
on:
  push:
    branches: [feat/four-sport-forecast-audit-view-20261022]
    paths:
      - docs/evidence/boat-nationwide-pilot-trigger.txt
      - .github/workflows/boat-nationwide-ab-one-shot.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: boat-nationwide-cutoff-20261103
  cancel-in-progress: false
jobs:
  official_national:
    name: Existing frozen P0, exhibition P1, separate official results and PDCA
    if: github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RACE_AI_NATIONWIDE_OWNER_SOURCE_REVIEWED: 'true'
    steps:
      - name: Exact PR71 code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Pinned official parser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 761247bee0209e37b1af6b8885e92cad3e9260a5, path: pr64-reference}
      - name: Pinned existing integration adapters
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe, path: pr72-reference}
      - name: Test originals, pending results, tampering and unchanged models
        run: |
          python -m unittest tests.test_frozen_day_cycle tests.test_existing_day_program tests.test_program_race_isolation tests.test_boat_observed_pairwise_models tests.test_boat_ab_shadow -v
      - name: Reuse first morning original, never silently regenerate it
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/github_existing_cycle.py restore
      - name: Current-day exhibition A/B and C-lite
        run: python scripts/boat_nationwide_ab_pilot.py
      - name: Freeze exhibition before reading outcomes
        id: p1freeze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-national-cutoff-${{ github.run_id }}
          path: boat_nationwide_output/national.json
          if-no-files-found: error
          retention-days: 7
      - name: Independently read server receipts and later official outcomes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/github_existing_cycle.py audit --p1-artifact '${{ steps.p1freeze.outputs.artifact-id }}'
      - name: Save queryable status, tickets, source receipts and diagnostic candidates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: race-existing-cycle-${{ github.run_id }}
          path: existing_cycle_output/
          if-no-files-found: warn
          retention-days: 7
      - name: Bounded November 4 public racecard evidence for requested missing forecasts
        if: always()
        run: |
          python - <<'PY'
          from datetime import datetime,timezone,timedelta
          from html.parser import HTMLParser
          from urllib.request import Request,urlopen
          from urllib.parse import urljoin,urlparse
          from pathlib import Path
          import hashlib,json,re,time
          JST=timezone(timedelta(hours=9))
          if datetime.now(JST).date().isoformat()!='2026-11-04': raise SystemExit('DATE_SCOPE_ENDED')
          class Visible(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=True);self.skip=0;self.text=[];self.links=[];self.js=[];self.active=False
              def handle_starttag(self,t,a):
                  a=dict(a)
                  if t=='a' and a.get('href'):self.links.append(a['href'])
                  if t in ('style','script','noscript'):
                      self.skip+=1
                      if t=='script' and (a.get('id')=='__NEXT_DATA__' or a.get('type')=='application/json'):self.active=True
              def handle_endtag(self,t):
                  if t in ('style','script','noscript'):self.skip=max(0,self.skip-1);self.active=False
              def handle_data(self,d):
                  if self.active:self.js.append(d)
                  if not self.skip and d.strip():self.text.append(d.strip())
          urls=[
            'https://www.boatrace.jp/owpc/pc/race/racelist?hd=20261104&jcd=17&rno=8',
            'https://www.boatrace.jp/owpc/pc/race/racelist?hd=20261104&jcd=17&rno=12',
            'https://www.winticket.jp/keirin/racecard/20261104',
            'https://www.winticket.jp/autorace/racecard/20261104',
            'https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/RaceList?k_babaCode=27&k_raceDate=2026%2F11%2F04',
            'https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/RaceList?k_babaCode=10&k_raceDate=2026%2F11%2F04',
            'https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/RaceList?k_babaCode=22&k_raceDate=2026%2F11%2F04',
            'https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/RaceList?k_babaCode=36&k_raceDate=2026%2F11%2F04',
            'https://www.keiba.go.jp/KeibaWeb/TodayRaceInfo/RaceList?k_babaCode=19&k_raceDate=2026%2F11%2F04']
          seen=set();out=[]
          while urls and len(seen)<16:
              u=urls.pop(0)
              if u in seen:continue
              seen.add(u)
              try:
                  req=Request(u,headers={'User-Agent':'RACE-AI-owner-private-one-shot/1.0','Accept':'text/html'})
                  with urlopen(req,timeout=15) as r:
                      raw=r.read(2500001);ct=r.headers.get('Content-Type','');final=r.geturl();status=r.status
                  if len(raw)>2500000:raise ValueError('SIZE_LIMIT')
                  enc=re.search(r'charset=([\w-]+)',ct,re.I)
                  choices=[enc[1] if enc else 'utf-8','utf-8','cp932','euc-jp']
                  text=None
                  for encoding in choices:
                      try:text=raw.decode(encoding);break
                      except (UnicodeDecodeError,LookupError):pass
                  if text is None:raise ValueError('ENCODING_UNVERIFIED')
                  p=Visible();p.feed(text)
                  links=sorted(set(urljoin(final,a) for a in p.links))
                  row={'url':u,'final_url':final,'observed_at':datetime.now(timezone.utc).isoformat(),'status':status,'sha256':hashlib.sha256(raw).hexdigest(),'visible_text':'\n'.join(p.text),'links':[a for a in links if any(t in a for t in ('racecard','DebaTable','RaceList','program','pdf'))],'json_scripts':p.js}
                  out.append(row)
                  if 'winticket.jp' in u and len([a for a in seen if 'winticket.jp' in a])<6:
                      candidates=[a for a in links if re.search(r'/(keirin|autorace)/[^/]+/racecard/20\d{6}',a)]
                      urls.extend(candidates[:2])
                  print('FACTS',status,len(raw),len(p.text),len(p.js),u)
              except Exception as e:
                  out.append({'url':u,'state':'SOURCE_UNAVAILABLE','error_class':type(e).__name__,'error':str(e)[:180]});print('UNAVAILABLE',type(e).__name__,u)
              time.sleep(.5)
          dest=Path('public_card_evidence');dest.mkdir(exist_ok=True)
          (dest/'cards.json').write_text(json.dumps({'research_only':True,'prediction_count':0,'requests':len(seen),'sources':out},ensure_ascii=False),encoding='utf-8')
          PY
      - name: Preserve bounded source observations separately from predictions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-card-observations-${{ github.run_id }}
          path: public_card_evidence/cards.json
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare exact source verification bundle, no data or credentials
        if: always()
        run: tar -czf source-bundle.tar.gz --exclude='.git' --exclude='__pycache__' race_ai scripts tests .github pr64-reference/race_ai pr72-reference/race_ai
      - name: Retain reproducible source for independent local testing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: existing-cycle-source-${{ github.run_id }}
          path: source-bundle.tar.gz
          retention-days: 1
