# Registration only: the actual owner P0/P1 producer lives on the
# separately reviewed production/boat-p0-p1-20261111 branch.
# Initial reviewed owner-release code SHA:
# a60b8493ee67f8cf1006d3c240ffd121a5f359ce
# GitHub requires a workflow_dispatch workflow to exist on default branch.
# Never run source collection, scoring, or access private AES keys from this stub.
name: BOAT nationwide cutoff-ordered A/B research (no Vercel)
on:
  workflow_dispatch:
    inputs:
      production_scope:
        required: true
        type: choice
        description: 'Use the original owner P0/P1 source and scorer'
        options: [existing-owner-p0-p1]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/boat-nationwide-ab-one-shot.yml
      - tests/test_boat_owner_workflow_registry.py

permissions:
  contents: read
jobs:
  source_free_registry_contract:
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify owner-only production workflow registration and no source reads
        run: python -m unittest tests.test_boat_owner_workflow_registry -v

  never_issue_from_main:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Refuse default-branch forecast issuance
        run: |
          echo 'HOLD_OWNER_P0_P1_RELEASE_REF_REQUIRED'
          exit 2
