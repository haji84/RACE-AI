name: P0 one-shot first-party HTML source test
on:
  push:
    branches:
      - 'p0-source-smoke-20261024'
    paths:
      - 'docs/evidence/p0-smoke-trigger-20261024.txt'
permissions:
  contents: read
jobs:
  once:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RACE_AI_SINGLE_GET_ALLOWED: 20261025-jcd11-rno1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Exactly one first-party HTML GET; report only sanitized metadata
        run: python -m scripts.p0_single_source_smoke
