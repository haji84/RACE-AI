name: KEIRIN real SQLite private journal regression
on:
  push:
    branches:
      - feat/p0-offline-discovery-gate-20261022
    paths:
      - '.github/workflows/keirin-private-sqlite-regression.yml'
  pull_request:
    branches:
      - codex/actions-four-sport-e2e

permissions:
  contents: read

jobs:
  private_journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify real SQLite filesystem and cross-process durable readback
        run: python -m unittest discover -s tests -p 'test_keirin_owner_sqlite.py' -v
      - name: Verify result event to durable intent contract
        run: python -m unittest discover -s tests -p 'test_keirin_result_reactor.py' -v
      - name: Verify guarded private top8 model worker
        run: python -m unittest discover -s tests -p 'test_keirin_next_forecast_worker.py' -v
