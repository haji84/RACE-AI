name: BOAT daily athlete statistics
on:
  push:
    branches: [feat/four-sport-forecast-audit-view-20261022]
    paths: [docs/evidence/racer-daily-refresh-trigger.txt]
  schedule:
    - cron: '20 21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boat-racer-daily-statistics
  cancel-in-progress: false
jobs:
  daily:
    if: github.repository == 'haji84/RACE-AI' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'de5e25eefb4f62b9a78d6c8c407d6b02c03348f6' }}
          persist-credentials: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Refresh daily aggregates and retain only encrypted source history
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          INITIALIZE: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'racer-daily-refresh: initialize') }}
        shell: bash
        run: |
          args=()
          if [[ "$INITIALIZE" == 'true' ]]; then args+=(--initialize); fi
          python -m scripts.racer_daily_refresh --private-dir "$RUNNER_TEMP/racer-daily" --verify-public "${args[@]}"
