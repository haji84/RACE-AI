  owner_p0_p1_dispatch:
    name: Gate-and-dispatch original BOAT owner P0/P1 (no scorer duplication)
    # Reuse the existing BOAT result schedule. It already covers JST 06:20
    # and 07:02-08:57, leaving the first future race to the original worker.
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' &&
        (github.event.schedule == '20 21 * * *' ||
         github.event.schedule == '2-59/5 22-23 * * *' ||
         github.event.schedule == '2-59/5 0-14 * * *')) ||
       (github.event_name == 'push' &&
        startsWith(github.event.head_commit.message,
                   'boat-owner-release: single-real-session-20261111')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: boat-main-launcher-source-free
      cancel-in-progress: false
    # Already approved by owner on 2026-11-11. Permission is restricted
    # to this exact release-dispatch job; never granted to the result scorer.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read pinned release source only for authenticated successor proof
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 0796b52c2804177976e4c2e5ab9b65f32589720b
          path: boat-owner-reader
      - name: Verify registered owner release SHA, source-owner gate, existing runs
        id: owner_gate
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/boat-owner-reader
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production/boat-p0-p1-20261111" > "$RUNNER_TEMP/boat-owner-release.json"
          gh api "repos/$GITHUB_REPOSITORY/contents/docs/RACE_AI_LATEST_STATUS.md?ref=production%2Fboat-p0-p1-20261111" > "$RUNNER_TEMP/boat-owner-policy.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/boat-nationwide-ab-one-shot.yml/runs?branch=production%2Fboat-p0-p1-20261111&per_page=100" > "$RUNNER_TEMP/boat-owner-runs.json"
          retry_args=()
          # Only the actual pre-source CI failure on 2026-11-11 may be
          # retried. Independently check GitHub job steps and artifacts.
          # No general repeat-after-failure bypass and no source GET here.
          if [[ "$(TZ=Asia/Tokyo date +%F)" == "2026-11-11" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/42993305843" > "$RUNNER_TEMP/boat-earlier-failure.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/42993305843/jobs?per_page=100" > "$RUNNER_TEMP/boat-earlier-jobs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/42993305843/artifacts?per_page=100" > "$RUNNER_TEMP/boat-earlier-artifacts.json"
            python - <<'PY_RETRY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          names=('failure','jobs','artifacts')
          obj={'run':json.loads((root/'boat-earlier-failure.json').read_text()),
               'jobs':json.loads((root/'boat-earlier-jobs.json').read_text()),
               'artifacts':json.loads((root/'boat-earlier-artifacts.json').read_text())}
          (root/'boat-earlier-source-free-proof.json').write_text(
              json.dumps(obj,separators=(',',':')))
          print(json.dumps({'status':'VERIFY_EARLIER_PRE_SOURCE_FAILURE_ONLY',
                            'run_id':42993305843,'provider_requests':0,
                            'actual_forecast_proven':False},sort_keys=True))
          PY_RETRY
            retry_args+=(--retry-proof "$RUNNER_TEMP/boat-earlier-source-free-proof.json")
          fi
          python -m scripts.boat_main_dispatch_gate \
            --release "$RUNNER_TEMP/boat-owner-release.json" \
            --owner-doc "$RUNNER_TEMP/boat-owner-policy.json" \
            --history "$RUNNER_TEMP/boat-owner-runs.json" \
            --verify-source-handoff \
            "${retry_args[@]}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Dispatch only the existing owner P0/P1 workflow
        if: steps.owner_gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run boat-nationwide-ab-one-shot.yml \
            --ref production/boat-p0-p1-20261111 \
            -f production_scope=existing-owner-p0-p1
          echo 'DISPATCH_REQUESTED_REAL_P0_P1_NOT_YET_PROVEN'
