name: BOAT per-race results and athlete statistics
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/boat-racer-daily.yml]
  push:
    branches: [main]
    paths: [docs/evidence/racer-daily-refresh-trigger.txt, docs/evidence/racer-intraday-refresh-trigger.txt, docs/evidence/owner-pdca-main-trigger.txt]
  workflow_run:
    workflows: ['BOAT nationwide cutoff-ordered A/B research (no Vercel)']
    types: [completed]
    branches: [production/boat-p0-p1-20261111]
  schedule:
    # Identical existing UTC minute coverage, separated only so the BOAT
    # owner launcher can select JST 07:02-08:57 without daily extra jobs.
    - cron: '2-59/5 0-14 * * *'
    - cron: '2-59/5 22-23 * * *'
    - cron: '20 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '結果ごとの更新 / 日次資料との照合'
        type: choice
        options: [intraday, daily]
        default: intraday
      verify_site:
        description: '公開画面の結果をブラウザで確認（通常巡回では実行しない）'
        type: boolean
        default: false
      check_current_day:
        description: '公開画面確認時に当日のレース前・結果待ちの区別も確認'
        type: boolean
        default: false
      check_beforeinfo:
        description: '公開画面の直前情報・展示タイム・気象情報も確認'
        type: boolean
        default: false
      probe_race_id:
        description: '画面で照合するレースID（確認する場合だけ指定）'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # PR-only offline CI must never queue the real intraday result collector.
  group: ${{ github.event_name == 'pull_request' && 'boat-mirror-sourcefree-pr-ci' || 'boat-racer-daily-statistics' }}
  cancel-in-progress: false
jobs:
  mirror_contract:
    name: BOAT mirror source-free PR regression
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 08a166d982e8e7d16aa347be41f79f67be2ccdf3
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - name: Install pinned offline-only test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Verify HMAC envelopes, immutable mirror CAS and denied-source state
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          import race_ai
          for root in ('pr64-reference', 'pr72-reference'):
              package = Path(root, 'race_ai').resolve()
              assert package.is_dir(), 'PINNED_PARSER_NOT_INSTALLED'
              race_ai.__path__.append(str(package))
          suite = unittest.defaultTestLoader.loadTestsFromNames(['tests.test_boat_source_control_mirror',
                  'tests.test_boat_all_period_no_age_cutoff',
                  'tests.test_source_free_model_pdca_stage',
                  'tests.test_verify_all_history_pdca_readback'])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposed-workflow
          persist-credentials: false
      - name: Test canonical owner dispatch gate with no source requests
        working-directory: proposed-workflow
        run: python -m unittest tests.test_boat_main_dispatch_gate -v
      - name: Read-only confirmation of approved owner release and canonical SHA
        working-directory: proposed-workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production/boat-p0-p1-20261111" > "$RUNNER_TEMP/boat-release-ref.json"
          gh api "repos/$GITHUB_REPOSITORY/contents/docs/RACE_AI_LATEST_STATUS.md?ref=production%2Fboat-p0-p1-20261111" > "$RUNNER_TEMP/boat-release-status.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/boat-nationwide-ab-one-shot.yml/runs?branch=production%2Fboat-p0-p1-20261111&per_page=100" > "$RUNNER_TEMP/boat-release-runs.json"
          python -m scripts.boat_main_dispatch_gate \
            --release "$RUNNER_TEMP/boat-release-ref.json" \
            --owner-doc "$RUNNER_TEMP/boat-release-status.json" \
            --history "$RUNNER_TEMP/boat-release-runs.json" > "$RUNNER_TEMP/boat-main-real-release-gate.json"
          python - <<'PY_BOAT_AUDIT'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'boat-main-real-release-gate.json').read_text())
          # This PR CI makes no dispatch and no official source GET.
          # Once user-approved fixed boundary is lifted, only an active/same-day
          # worker or missing API evidence may legitimately keep the gate HOLD.
          allowed={
              'READY_EXISTING_OWNER_WORKFLOW_ONLY',
              'HOLD_ALREADY_DISPATCHED_FOR_JST_DAY',
              'HOLD_ACTIVE_OWNER_WORKFLOW',
              'HOLD_INCOMPLETE_RUN_HISTORY'}
          assert report['status'] in allowed, report['status']
          assert report['new_model_or_scorer_added'] is False
          assert report['official_source_requests']==0
          assert report['future_real_forecast_proven'] is False
          print(json.dumps({'status':report['status'],
                            'release_scope_verified':True,
                            'dispatch_requested_from_pr':False,
                            'real_forecast_proven':False,'new_source_requests':0},sort_keys=True))
          PY_BOAT_AUDIT
      - name: Verify wiring without running any provider request
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path('proposed-workflow/.github/workflows/boat-racer-daily.yml').read_text()
          mirror = content.split('  source_mirror:\n', 1)[1].split('  daily:\n', 1)[0]
          daily = content.split('  daily:\n', 1)[1]
          header = content.split('jobs:\n', 1)[0]
          assert mirror.count('Reconcile verified completed BOAT source handoff') == 1
          assert 'needs: source_mirror' in daily
          assert '!cancelled()' in daily
          assert 'actions: read' in mirror
          assert 'contents: write' in mirror
          assert 'from scripts.boat_source_control_mirror import main' in mirror
          assert "['latest-closed', '--repo-root', '.', '--output', output]" in mirror
          assert mirror.count('race_ai.__path__.append(str(package))') == 1
          assert "github.event.workflow_run.conclusion == 'success'" in mirror
          assert "github.event.workflow_run.event == 'workflow_dispatch'" in mirror
          assert "github.event.workflow_run.head_branch == 'production/boat-p0-p1-20261111'" in mirror
          assert "github.event.workflow_run.head_sha == 'e24f09f150e2318dd16a96bdc6db1d8c1317b9ae'" in mirror
          assert "needs.source_mirror.result == 'success'" in daily
          assert "github.event.schedule == '20 21 * * *'" in mirror
          assert 'continue-on-error: true' not in mirror
          assert "'boat-mirror-sourcefree-pr-ci' || 'boat-racer-daily-statistics'" in header
          pin = "ref: $" + "{{ github.event_name == 'push' && github.sha || '914941a6244364480370ac392441ad4bb5781f83' }}"
          assert pin in daily
          PY
  source_mirror:
    name: Reconcile authenticated completed BOAT source (no provider GET)
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'production/boat-p0-p1-20261111' &&
        github.event.workflow_run.head_sha == 'e24f09f150e2318dd16a96bdc6db1d8c1317b9ae' &&
        github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 914941a6244364480370ac392441ad4bb5781f83
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - name: Install pinned mirror readback dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Reconcile verified completed BOAT source handoff (GitHub-only; no provider GET)
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import race_ai
          for root in ('pr64-reference', 'pr72-reference'):
              package = Path(root, 'race_ai').resolve()
              if not package.is_dir():
                  raise SystemExit('SOURCE_MIRROR_PINNED_DEPENDENCY_MISSING')
              race_ai.__path__.append(str(package))
          from scripts.boat_source_control_mirror import main
          output = str(Path(os.environ['RUNNER_TEMP']) / 'boat-last-closed-control.json')
          raise SystemExit(main(['latest-closed', '--repo-root', '.', '--output', output]))
          PY
  daily:
    needs: source_mirror
    if: >-
      !cancelled() &&
      github.repository == 'haji84/RACE-AI' && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'production/boat-p0-p1-20261111' &&
        github.event.workflow_run.head_sha == 'e24f09f150e2318dd16a96bdc6db1d8c1317b9ae' &&
        github.event.workflow_run.conclusion == 'success' &&
        needs.source_mirror.result == 'success')) &&
      (github.event_name != 'push' ||
       (github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'push' && github.sha || '914941a6244364480370ac392441ad4bb5781f83' }}
          persist-credentials: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install original BOAT result collector dependencies
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Reflect confirmed races and retain encrypted incremental source packets
        # Main's one-time owner PDCA verification does not make any provider GET.
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          INITIALIZE: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'racer-intraday-refresh: initialize') }}"
          DAILY_RECONCILE: "${{ (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'racer-daily-refresh:')) }}"
        shell: bash
        run: |
          args=()
          if [[ "$INITIALIZE" == 'true' ]]; then args+=(--initialize); fi
          if [[ "$DAILY_RECONCILE" == 'true' ]]; then args+=(--daily-reconcile); fi
          python -m scripts.racer_intraday_refresh --private-dir "$RUNNER_TEMP/racer-intraday" --verify-public --sync-results --sync-beforeinfo "${args[@]}"
      - name: Install browser check only for an explicit verification run
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.verify_site) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'racer-intraday-refresh: verify-results'))
        run: npm install --prefix "$RUNNER_TEMP/result-site-tools" --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Verify private result display without publishing owner data
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.verify_site) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'racer-intraday-refresh: verify-results'))
        timeout-minutes: 9
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          NODE_PATH: ${{ runner.temp }}/result-site-tools/node_modules
          RESULT_PROBE_RACE: ${{ inputs.probe_race_id || '' }}
          CHECK_CURRENT_DAY: ${{ inputs.check_current_day || 'false' }}
          CHECK_BEFOREINFO: ${{ inputs.check_beforeinfo || 'false' }}
          # The context installs its own repository-scoped credential.
          # Clear checkout's host header for this read-only step only.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ''
        run: |
          site_context_args=(--latest-saved-day)
          if [[ -n "$RESULT_PROBE_RACE" ]]; then
            [[ "$RESULT_PROBE_RACE" =~ ^[0-9]{8}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
            site_context_args=(--day "${RESULT_PROBE_RACE:0:4}-${RESULT_PROBE_RACE:4:2}-${RESULT_PROBE_RACE:6:2}")
          fi
          python -m scripts.boat_saved_site_context --output "$RUNNER_TEMP/boat-saved-site-context.json" "${site_context_args[@]}"
          probe=()
          if [[ -n "$RESULT_PROBE_RACE" ]]; then probe+=("--race-id=$RESULT_PROBE_RACE"); fi
          if [[ "$CHECK_CURRENT_DAY" == 'true' ]]; then probe+=(--check-current-day); fi
          if [[ "$CHECK_BEFOREINFO" == 'true' ]]; then probe+=(--check-beforeinfo); fi
          env -u RACE_AI_STATE_KEY -u GH_TOKEN -u GITHUB_TOKEN node scripts/boat_saved_site_check.cjs "$RUNNER_TEMP/boat-saved-site-context.json" --compact-results "${probe[@]}"
      # Only source-free CODE+AES replay uses the verified no-age-limit code.
      # Keep the official-result collector above pinned to its old source-bound code.
      - name: Checkout certified full-period model PDCA code (no source GET)
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca'))
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 08a166d982e8e7d16aa347be41f79f67be2ccdf3
          path: pdca-verified
          persist-credentials: false
      - name: Checkout original BOAT parser for existing full-period scorer
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca'))
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pdca-verified/pr64-reference
          persist-credentials: false
      - name: Checkout original result adapter for existing full-period scorer
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca'))
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pdca-verified/pr72-reference
          persist-credentials: false
      - name: Set up verified source-free PDCA dependencies
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca'))
        run: python -m pip install --disable-pip-version-check -r pdca-verified/requirements-history.txt
      - name: Seal authenticated full-period historical Top8 by original scorer
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca'))
        working-directory: pdca-verified
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.racer_intraday_refresh --private-dir "$RUNNER_TEMP/racer-intraday" --stage-existing-pdca
      - name: Independently decrypt AES Git and verify every indexed historical result
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca'))
        working-directory: pdca-verified
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.verify_all_history_pdca_readback --repository-root .

  owner_p0_p1_dispatch:
    name: Gate-and-dispatch original BOAT owner P0/P1 (no scorer duplication)
    # Reuse the existing BOAT result schedule. It already covers JST 06:20
    # and 07:02-08:57, leaving the first future race to the original worker.
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' &&
        (github.event.schedule == '20 21 * * *' ||
         github.event.schedule == '2-59/5 22-23 * * *')) ||
       (github.event_name == 'push' &&
        startsWith(github.event.head_commit.message,
                   'boat-owner-release: single-real-session-20261111')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: boat-main-launcher-source-free
      cancel-in-progress: false
    # Already approved by owner on 2026-11-11. Permission is restricted
    # to this exact release-dispatch job; never granted to the result scorer.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify registered owner release SHA, source-owner gate, existing runs
        id: owner_gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production/boat-p0-p1-20261111" > "$RUNNER_TEMP/boat-owner-release.json"
          gh api "repos/$GITHUB_REPOSITORY/contents/docs/RACE_AI_LATEST_STATUS.md?ref=production%2Fboat-p0-p1-20261111" > "$RUNNER_TEMP/boat-owner-policy.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/boat-nationwide-ab-one-shot.yml/runs?branch=production%2Fboat-p0-p1-20261111&per_page=100" > "$RUNNER_TEMP/boat-owner-runs.json"
          retry_args=()
          # Only the actual pre-source CI failure on 2026-11-11 may be
          # retried. Independently check GitHub job steps and artifacts.
          # No general repeat-after-failure bypass and no source GET here.
          if [[ "$(TZ=Asia/Tokyo date +%F)" == "2026-11-11" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/42993305843" > "$RUNNER_TEMP/boat-earlier-failure.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/42993305843/jobs?per_page=100" > "$RUNNER_TEMP/boat-earlier-jobs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/42993305843/artifacts?per_page=100" > "$RUNNER_TEMP/boat-earlier-artifacts.json"
            python - <<'PY_RETRY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          names=('failure','jobs','artifacts')
          obj={'run':json.loads((root/'boat-earlier-failure.json').read_text()),
               'jobs':json.loads((root/'boat-earlier-jobs.json').read_text()),
               'artifacts':json.loads((root/'boat-earlier-artifacts.json').read_text())}
          (root/'boat-earlier-source-free-proof.json').write_text(
              json.dumps(obj,separators=(',',':')))
          print(json.dumps({'status':'VERIFY_EARLIER_PRE_SOURCE_FAILURE_ONLY',
                            'run_id':42993305843,'provider_requests':0,
                            'actual_forecast_proven':False},sort_keys=True))
          PY_RETRY
            retry_args+=(--retry-proof "$RUNNER_TEMP/boat-earlier-source-free-proof.json")
          fi
          python -m scripts.boat_main_dispatch_gate \
            --release "$RUNNER_TEMP/boat-owner-release.json" \
            --owner-doc "$RUNNER_TEMP/boat-owner-policy.json" \
            --history "$RUNNER_TEMP/boat-owner-runs.json" \
            "${retry_args[@]}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Dispatch only the existing owner P0/P1 workflow
        if: steps.owner_gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run boat-nationwide-ab-one-shot.yml \
            --ref production/boat-p0-p1-20261111 \
            -f production_scope=existing-owner-p0-p1
          echo 'DISPATCH_REQUESTED_REAL_P0_P1_NOT_YET_PROVEN'
