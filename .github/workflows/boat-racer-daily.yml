name: BOAT per-race results and athlete statistics
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/boat-racer-daily.yml]
  push:
    branches: [feat/four-sport-forecast-audit-view-20261022, main]
    paths: [docs/evidence/racer-daily-refresh-trigger.txt, docs/evidence/racer-intraday-refresh-trigger.txt, docs/evidence/owner-pdca-main-trigger.txt]
  workflow_run:
    workflows: ['BOAT nationwide cutoff-ordered A/B research (no Vercel)']
    types: [completed]
    branches: [feat/four-sport-forecast-audit-view-20261022]
  schedule:
    - cron: '2-59/5 0-14,22-23 * * *'
    - cron: '20 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '結果ごとの更新 / 日次資料との照合'
        type: choice
        options: [intraday, daily]
        default: intraday
      verify_site:
        description: '公開画面の結果をブラウザで確認（通常巡回では実行しない）'
        type: boolean
        default: false
      check_current_day:
        description: '公開画面確認時に当日のレース前・結果待ちの区別も確認'
        type: boolean
        default: false
      check_beforeinfo:
        description: '公開画面の直前情報・展示タイム・気象情報も確認'
        type: boolean
        default: false
      probe_race_id:
        description: '画面で照合するレースID（確認する場合だけ指定）'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: boat-racer-daily-statistics
  cancel-in-progress: false
jobs:
  mirror_contract:
    name: BOAT mirror source-free PR regression
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 914941a6244364480370ac392441ad4bb5781f83
          persist-credentials: false
      - name: Install pinned offline-only test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Verify HMAC envelopes, immutable mirror CAS and denied-source state
        run: python -m unittest tests.test_boat_source_control_mirror -v
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposed-workflow
          persist-credentials: false
      - name: Verify wiring without running any provider request
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path('proposed-workflow/.github/workflows/boat-racer-daily.yml').read_text()
          assert content.count('Reconcile verified completed BOAT source handoff') == 1
          assert 'python -m scripts.boat_source_control_mirror latest-closed' in content
          assert 'github.event.workflow_run.conclusion == \'success\'' in content
          assert "github.event.schedule == '20 21 * * *'" in content
          assert 'continue-on-error: true' not in content
          assert 'group: boat-racer-daily-statistics' in content
          pin = "ref: $" + "{{ github.event_name == 'push' && github.sha || '914941a6244364480370ac392441ad4bb5781f83' }}"
          assert pin in content
          PY
  daily:
    if: >-
      github.repository == 'haji84/RACE-AI' && github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'feat/four-sport-forecast-audit-view-20261022' &&
        github.event.workflow_run.conclusion == 'success')) &&
      (github.event_name != 'push' ||
       github.ref == 'refs/heads/feat/four-sport-forecast-audit-view-20261022' ||
       (github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'push' && github.sha || '914941a6244364480370ac392441ad4bb5781f83' }}
          persist-credentials: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Install original BOAT result collector dependencies
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Reconcile verified completed BOAT source handoff (GitHub-only; no provider GET)
        if: >-
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'feat/four-sport-forecast-audit-view-20261022' &&
           github.event.workflow_run.conclusion == 'success') ||
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *')
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: python -m scripts.boat_source_control_mirror latest-closed --repo-root . --output "$RUNNER_TEMP/boat-last-closed-control.json"
      - name: Reflect confirmed races and retain encrypted incremental source packets
        # Main's one-time owner PDCA verification does not make any provider GET.
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          INITIALIZE: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'racer-intraday-refresh: initialize') }}"
          DAILY_RECONCILE: "${{ (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily') || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'racer-daily-refresh:')) }}"
        shell: bash
        run: |
          args=()
          if [[ "$INITIALIZE" == 'true' ]]; then args+=(--initialize); fi
          if [[ "$DAILY_RECONCILE" == 'true' ]]; then args+=(--daily-reconcile); fi
          python -m scripts.racer_intraday_refresh --private-dir "$RUNNER_TEMP/racer-intraday" --verify-public --sync-results --sync-beforeinfo "${args[@]}"
      - name: Install browser check only for an explicit verification run
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.verify_site) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'racer-intraday-refresh: verify-results'))
        run: npm install --prefix "$RUNNER_TEMP/result-site-tools" --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Verify private result display without publishing owner data
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.verify_site) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'racer-intraday-refresh: verify-results'))
        timeout-minutes: 9
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          NODE_PATH: ${{ runner.temp }}/result-site-tools/node_modules
          RESULT_PROBE_RACE: ${{ inputs.probe_race_id || '' }}
          CHECK_CURRENT_DAY: ${{ inputs.check_current_day || 'false' }}
          CHECK_BEFOREINFO: ${{ inputs.check_beforeinfo || 'false' }}
          # The context installs its own repository-scoped credential.
          # Clear checkout's host header for this read-only step only.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ''
        run: |
          site_context_args=(--latest-saved-day)
          if [[ -n "$RESULT_PROBE_RACE" ]]; then
            [[ "$RESULT_PROBE_RACE" =~ ^[0-9]{8}-[0-9]{2}-[0-9]{2}$ ]] || exit 2
            site_context_args=(--day "${RESULT_PROBE_RACE:0:4}-${RESULT_PROBE_RACE:4:2}-${RESULT_PROBE_RACE:6:2}")
          fi
          python -m scripts.boat_saved_site_context --output "$RUNNER_TEMP/boat-saved-site-context.json" "${site_context_args[@]}"
          probe=()
          if [[ -n "$RESULT_PROBE_RACE" ]]; then probe+=("--race-id=$RESULT_PROBE_RACE"); fi
          if [[ "$CHECK_CURRENT_DAY" == 'true' ]]; then probe+=(--check-current-day); fi
          if [[ "$CHECK_BEFOREINFO" == 'true' ]]; then probe+=(--check-beforeinfo); fi
          env -u RACE_AI_STATE_KEY -u GH_TOKEN -u GITHUB_TOKEN node scripts/boat_saved_site_check.cjs "$RUNNER_TEMP/boat-saved-site-context.json" --compact-results "${probe[@]}"
      # Only the CODE+AES readback uses independently verified 0317235e.
      # Keep the official-result collector above pinned to its old source-bound code.
      - name: Checkout certified full-period model PDCA code (no source GET)
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca'))
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0317235eadc851b73913c537b7c09a32dc7c208c
          path: pdca-verified
          persist-credentials: false
      - name: Checkout original BOAT parser for existing full-period scorer
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca'))
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pdca-verified/pr64-reference
          persist-credentials: false
      - name: Checkout original result adapter for existing full-period scorer
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca'))
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pdca-verified/pr72-reference
          persist-credentials: false
      - name: Set up verified source-free PDCA dependencies
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca'))
        run: python -m pip install --disable-pip-version-check -r pdca-verified/requirements-history.txt
      - name: Seal authenticated full-period historical Top8 by original scorer
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca'))
        working-directory: pdca-verified
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.racer_intraday_refresh --private-dir "$RUNNER_TEMP/racer-intraday" --stage-existing-pdca
      - name: Independently decrypt AES Git and verify every indexed historical result
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
           startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca'))
        working-directory: pdca-verified
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.verify_all_history_pdca_readback --repository-root .
