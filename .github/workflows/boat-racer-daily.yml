name: BOAT per-race results and athlete statistics
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/boat-racer-daily.yml
      - scripts/boat_main_dispatch_gate.py
      - tests/test_boat_main_dispatch_gate.py
  push:
    branches: [main]
    paths: [docs/evidence/racer-daily-refresh-trigger.txt, docs/evidence/racer-intraday-refresh-trigger.txt, docs/evidence/owner-pdca-main-trigger.txt]
  workflow_run:
    workflows: ['BOAT nationwide cutoff-ordered A/B research (no Vercel)']
    types: [completed]
    branches: [production/boat-p0-p1-20261111]
  schedule:
    # Identical existing UTC minute coverage, separated only so the BOAT
    # owner launcher can select JST 07:02-08:57 without daily extra jobs.
    - cron: '2-59/5 0-14 * * *'
    - cron: '2-59/5 22-23 * * *'
    - cron: '20 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '結果ごとの更新 / 日次資料との照合'
        type: choice
        options: [intraday, daily]
        default: intraday
      verify_site:
        description: '公開画面の結果をブラウザで確認（通常巡回では実行しない）'
        type: boolean
        default: false
      check_current_day:
        description: '公開画面確認時に当日のレース前・結果待ちの区別も確認'
        type: boolean
        default: false
      check_beforeinfo:
        description: '公開画面の直前情報・展示タイム・気象情報も確認'
        type: boolean
        default: false
      probe_race_id:
        description: '画面で照合するレースID（確認する場合だけ指定）'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  # PR-only offline CI must never queue the real intraday result collector.
  group: ${{ github.event_name == 'pull_request' && 'boat-mirror-sourcefree-pr-ci' || 'boat-racer-daily-statistics' }}
  cancel-in-progress: false
jobs:
  mirror_contract:
    name: BOAT mirror source-free PR regression
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5d7ef4a69876ef6aea53b3b8fe4f5100a2c27ac6
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - name: Install pinned offline-only test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Verify HMAC envelopes, immutable mirror CAS and denied-source state
        run: |
          python - <<'PY'
          from pathlib import Path
          import unittest
          import race_ai
          for root in ('pr64-reference', 'pr72-reference'):
              package = Path(root, 'race_ai').resolve()
              assert package.is_dir(), 'PINNED_PARSER_NOT_INSTALLED'
              race_ai.__path__.append(str(package))
          suite = unittest.defaultTestLoader.loadTestsFromNames(['tests.test_boat_source_control_mirror',
                  'tests.test_boat_all_period_no_age_cutoff',
                  'tests.test_source_free_model_pdca_stage',
                  'tests.test_verify_all_history_pdca_readback',
                  'tests.test_first_p0_bootstrap',
                  'tests.test_boat_first_p0_readback',
                  'tests.test_boat_first_p0_reconcile',
                  'tests.test_boat_saved_result_recovery',
                  'tests.test_boat_private_original_vault_cli',
                  'tests.test_boat_saved_site_context',
                  'tests.test_boat_profile_one_shot_proof'])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Verify original-stage identity and private browser boundaries
        run: node --test tests/saved_site_check.test.cjs
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposed-workflow
          persist-credentials: false
      - name: Test canonical owner dispatch gate with no source requests
        working-directory: proposed-workflow
        run: python -m unittest tests.test_boat_main_dispatch_gate tests.test_boat_first_p0_recovery_gate -v
      - name: Read-only confirmation of approved owner release and canonical SHA
        working-directory: proposed-workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production/boat-p0-p1-20261111" > "$RUNNER_TEMP/boat-release-ref.json"
          gh api "repos/$GITHUB_REPOSITORY/contents/docs/RACE_AI_LATEST_STATUS.md?ref=production%2Fboat-p0-p1-20261111" > "$RUNNER_TEMP/boat-release-status.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/boat-nationwide-ab-one-shot.yml/runs?branch=production%2Fboat-p0-p1-20261111&per_page=100" > "$RUNNER_TEMP/boat-release-runs.json"
          python -m scripts.boat_main_dispatch_gate \
            --release "$RUNNER_TEMP/boat-release-ref.json" \
            --owner-doc "$RUNNER_TEMP/boat-release-status.json" \
            --history "$RUNNER_TEMP/boat-release-runs.json" > "$RUNNER_TEMP/boat-main-real-release-gate.json"
          python - <<'PY_BOAT_AUDIT'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'boat-main-real-release-gate.json').read_text())
          # This PR CI makes no dispatch and no official source GET.
          # Once user-approved fixed boundary is lifted, only an active/same-day
          # worker or missing API evidence may legitimately keep the gate HOLD.
          allowed={
              'READY_EXISTING_OWNER_WORKFLOW_ONLY',
              'HOLD_ALREADY_DISPATCHED_FOR_JST_DAY',
              'HOLD_ACTIVE_OWNER_WORKFLOW',
              'HOLD_INCOMPLETE_RUN_HISTORY',
              'HOLD_OUTSIDE_OWNER_DAYTIME_WINDOW',
              # Production advanced after main's pinned release; the existing
              # owner dispatcher must remain HOLD, but source-free PR tests
              # can independently validate this result-only repair.
              'HOLD_RELEASE_SHA_MISMATCH'}
          assert report['status'] in allowed, report['status']
          if report['status']=='HOLD_RELEASE_SHA_MISMATCH':
              assert report['dispatch_allowed'] is False
          assert report['new_model_or_scorer_added'] is False
          assert report['official_source_requests']==0
          assert report['future_real_forecast_proven'] is False
          print(json.dumps({'status':report['status'],
                            'release_scope_verified':report['status']!='HOLD_RELEASE_SHA_MISMATCH',
                            'dispatch_requested_from_pr':False,
                            'real_forecast_proven':False,'new_source_requests':0},sort_keys=True))
          PY_BOAT_AUDIT
      - name: Verify wiring without running any provider request
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path('proposed-workflow/.github/workflows/boat-racer-daily.yml').read_text()
          mirror = content.split('  source_mirror:\n', 1)[1].split('  daily:\n', 1)[0]
          daily = content.split('  daily:\n', 1)[1]
          header = content.split('jobs:\n', 1)[0]
          reader = content.split('  original_readback:\n', 1)[1].split('  original_reconcile:\n', 1)[0]
          assert '--verify-retained-p1 --output' in reader
          assert mirror.count('Reconcile verified completed BOAT source handoff') == 1
          assert 'needs: [source_mirror, original_reconcile]' in daily
          assert '!cancelled()' in daily
          assert 'actions: read' in mirror
          assert 'contents: write' in mirror
          assert 'from scripts.boat_source_control_mirror import main' in mirror
          assert "['latest-closed', '--repo-root', '.', '--output', output]" in mirror
          assert mirror.count('race_ai.__path__.append(str(package))') == 1
          assert "github.event.workflow_run.conclusion == 'success'" in mirror
          assert "github.event.workflow_run.event == 'workflow_dispatch'" in mirror
          assert "github.event.workflow_run.head_branch == 'production/boat-p0-p1-20261111'" in mirror
          assert "github.event.workflow_run.head_sha == '0796b52c2804177976e4c2e5ab9b65f32589720b'" in mirror
          assert "needs.source_mirror.result == 'success'" in daily
          assert "github.event.schedule == '20 21 * * *'" in mirror
          assert 'continue-on-error: true' not in mirror
          assert "'boat-mirror-sourcefree-pr-ci' || 'boat-racer-daily-statistics'" in header
          pin = "ref: $" + "{{ github.event_name == 'push' && github.sha || '914941a6244364480370ac392441ad4bb5781f83' }}"
          assert pin in daily
          PY
  original_retention:
    name: Retain exact first P0 and companions without source acquisition
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'production/boat-p0-p1-20261111' &&
        github.event.workflow_run.head_sha == '0796b52c2804177976e4c2e5ab9b65f32589720b') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca') &&
        contains(github.event.head_commit.message, 'recover-first-p0-42995325741')) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message,
                   'boat-owner-readback: recover-saved-p0-43131905826')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      vault_commit: ${{ steps.retained.outputs.vault_commit }}
      receipt_commit: ${{ steps.select.outputs.receipt_commit }}
      day: ${{ steps.select.outputs.day }}
      p0: ${{ steps.select.outputs.p0 }}
      continuity: ${{ steps.select.outputs.continuity }}
      control: ${{ steps.select.outputs.control }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Select authenticated original artifacts without another source attempt
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || (contains(github.event.head_commit.message, 'recover-saved-p0-43131905826') && '43131905826' || '42995325741') }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ORIGINAL_RUN_ID" =~ ^[1-9][0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN_ID" > "$RUNNER_TEMP/original-run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/original-artifact-pages.json"
          if [[ "$ORIGINAL_RUN_ID" == '42995325741' ]]; then
            receipt_commit='20fc291429003fd0351baef4b0c1918b76b4e066'
          else
            receipt_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feat/four-sport-forecast-audit-view-20261022" --jq '.object.sha')"
          fi
          [[ "$receipt_commit" =~ ^[a-f0-9]{40}$ ]]
          echo "receipt_commit=$receipt_commit" >> "$GITHUB_OUTPUT"
          python - <<'PY_SELECT'
          import json, os
          from pathlib import Path
          from scripts.boat_main_dispatch_gate import recovery_selection
          root=Path(os.environ['RUNNER_TEMP'])
          run=json.loads((root/'original-run.json').read_text())
          pages=json.loads((root/'original-artifact-pages.json').read_text())
          assert type(pages) is list and 1 <= len(pages) <= 11
          assert all(p['total_count']==pages[0]['total_count'] for p in pages)
          artifacts={'total_count':pages[0]['total_count'],
                     'artifacts':[a for p in pages for a in p['artifacts']]}
          selected=recovery_selection(run=run,artifacts=artifacts)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for name,value in dict(day=selected['day_jst'],p0=selected['p0_artifact'],
                                     continuity=selected['companion_artifacts'][0],
                                     control=selected['companion_artifacts'][1]).items():
                  out.write(f'{name}={value}\n')
          print(json.dumps(selected,sort_keys=True))
          PY_SELECT
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 0796b52c2804177976e4c2e5ab9b65f32589720b, path: owner-runtime}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 761247bee0209e37b1af6b8885e92cad3e9260a5, path: owner-runtime/pr64-reference}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe, path: owner-runtime/pr72-reference}
      - run: python -m pip install --disable-pip-version-check -r owner-runtime/requirements-history.txt
      - name: Append exact encrypted originals to the existing permanent vault
        id: retained
        working-directory: owner-runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          P0_ID: ${{ steps.select.outputs.p0 }}
          CONTINUITY_ID: ${{ steps.select.outputs.continuity }}
          CONTROL_ID: ${{ steps.select.outputs.control }}
        run: |
          python -m scripts.boat_private_original_vault capture --artifact "$P0_ID" --artifact "$CONTINUITY_ID" --artifact "$CONTROL_ID" --expected-parent current --repo-root . --output "$RUNNER_TEMP/first-p0-vault.json"
          python - <<'PY_VAULT'
          import json,os,re
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'first-p0-vault.json').read_text())
          assert report['retained_originals']==3 and report['independent_git_readback_verified'] is True
          expected={int(os.environ[key]) for key in ('P0_ID','CONTINUITY_ID','CONTROL_ID')}
          assert {r['artifact_id'] for r in report['locators']}==expected
          commit=report['source_commit']; assert re.fullmatch('[a-f0-9]{40}',commit)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f'vault_commit={commit}\n')
          PY_VAULT
  original_readback:
    name: Read first P0 on a separate runner at the exact vault commit
    needs: original_retention
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
      VAULT_COMMIT: ${{ needs.original_retention.outputs.vault_commit }}
      RECEIPT_COMMIT: ${{ needs.original_retention.outputs.receipt_commit }}
      ORIGINAL_DAY: ${{ needs.original_retention.outputs.day }}
      P0_ID: ${{ needs.original_retention.outputs.p0 }}
      CONTINUITY_ID: ${{ needs.original_retention.outputs.continuity }}
      CONTROL_ID: ${{ needs.original_retention.outputs.control }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 0796b52c2804177976e4c2e5ab9b65f32589720b}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 761247bee0209e37b1af6b8885e92cad3e9260a5, path: pr64-reference}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe, path: pr72-reference}
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Verify original hashes, receipts, forecast clocks and companions
        run: python -m scripts.boat_first_p0_readback --repo-root . --vault-commit "$VAULT_COMMIT" --receipt-commit "$RECEIPT_COMMIT" --day "$ORIGINAL_DAY" --p0-artifact "$P0_ID" --companion-artifact "$CONTINUITY_ID" --companion-artifact "$CONTROL_ID" --verify-retained-p1 --output "$RUNNER_TEMP/first-p0-independent-readback.json"
      - name: Retain only count and hash evidence from the separate reader
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-first-p0-independent-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/first-p0-independent-readback.json
          if-no-files-found: error
          retention-days: 90
  original_reconcile:
    name: Reconcile authenticated first P0 with retained official results
    needs: [original_retention, original_readback]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
      RACE_AI_ORIGINAL_VAULT_ENABLED: 'true'
      VAULT_COMMIT: ${{ needs.original_retention.outputs.vault_commit }}
      RECEIPT_COMMIT: ${{ needs.original_retention.outputs.receipt_commit }}
      ORIGINAL_DAY: ${{ needs.original_retention.outputs.day }}
      P0_ID: ${{ needs.original_retention.outputs.p0 }}
      CONTINUITY_ID: ${{ needs.original_retention.outputs.continuity }}
      CONTROL_ID: ${{ needs.original_retention.outputs.control }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 9a8116c35fcf930c68080852429f26fb826a68cd}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 761247bee0209e37b1af6b8885e92cad3e9260a5, path: pr64-reference}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe, path: pr72-reference}
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Use the original projector, official parser and scorer without source GET
        run: python -m scripts.boat_first_p0_reconcile --repo-root . --vault-commit "$VAULT_COMMIT" --receipt-commit "$RECEIPT_COMMIT" --day "$ORIGINAL_DAY" --p0-artifact "$P0_ID" --companion-artifact "$CONTINUITY_ID" --companion-artifact "$CONTROL_ID" --include-verified-result-names --diagnose-profile-index --output "$RUNNER_TEMP/first-p0-reconciliation.json"
      - name: Retain count-only existing-scorer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-first-p0-official-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/first-p0-reconciliation.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '22'}
      - name: Install the existing private Pages verifier
        run: npm install --prefix "$RUNNER_TEMP/result-site-tools" --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Verify the original P0 and official results on the existing Pages view
        timeout-minutes: 9
        env:
          NODE_PATH: ${{ runner.temp }}/result-site-tools/node_modules
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ''
        run: |
          python -m scripts.boat_saved_site_context --output "$RUNNER_TEMP/boat-saved-site-context.json" --day "$ORIGINAL_DAY" --stage P0 --expected-original-report "$RUNNER_TEMP/first-p0-reconciliation.json"
          env -u RACE_AI_STATE_KEY -u GH_TOKEN -u GITHUB_TOKEN node scripts/boat_saved_site_check.cjs "$RUNNER_TEMP/boat-saved-site-context.json" --compact-results
  source_mirror:
    needs: [original_retention, original_readback, original_reconcile]
    name: Reconcile authenticated completed BOAT source (no provider GET)
    if: >-
      !cancelled() && github.repository == 'haji84/RACE-AI' &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, 'recover-first-p0-42995325741')) &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'production/boat-p0-p1-20261111' &&
        github.event.workflow_run.head_sha == '0796b52c2804177976e4c2e5ab9b65f32589720b' &&
        github.event.workflow_run.conclusion == 'success' &&
        needs.original_readback.result == 'success' &&
        needs.original_reconcile.result == 'success') ||
       (github.event_name == 'schedule' && github.event.schedule == '20 21 * * *') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'racer-intraday-refresh: stage-model-pdca')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0796b52c2804177976e4c2e5ab9b65f32589720b
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - name: Install pinned mirror readback dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Reconcile verified completed BOAT source handoff (GitHub-only; no provider GET)
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import race_ai
          for root in ('pr64-reference', 'pr72-reference'):
              package = Path(root, 'race_ai').resolve()
              if not package.is_dir():
                  raise SystemExit('SOURCE_MIRROR_PINNED_DEPENDENCY_MISSING')
              race_ai.__path__.append(str(package))
          from scripts.boat_source_control_mirror import main
          output = str(Path(os.environ['RUNNER_TEMP']) / 'boat-last-closed-control.json')
          raise SystemExit(main(['latest-closed', '--repo-root', '.', '--output', output]))
          PY
  daily:
    needs: [source_mirror, original_reconcile]
    if: >-
      !cancelled() &&
      (!(github.event_name == 'push' && contains(github.event.head_commit.message, 'recover-first-p0-42995325741')) ||
