name: completion-controller-pilot
on:
  pull_request:
    paths:
      - scripts/completion-controller.mjs
      - scripts/completion-dispatch-protocol.mjs
      - tests/completion-dispatch-protocol.test.mjs
      - scripts/race-compass-adapter.mjs
      - tests/race-compass-adapter.test.mjs
      - docs/state/race-compass-state.json
      - vendor/compass/**
      - scripts/completion-ai-trial.py
      - scripts/completion-mock-trial.mjs
      - tests/completion-mock-trial.test.mjs
      - tests/completion-controller.test.mjs
      - tests/completion-controller.e2e.test.mjs
      - tests/ai09-review-handoff.test.mjs
      - scripts/ai09-review-handoff.mjs
      - config/completion-pilot.json
      - .github/workflows/completion-controller-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact checkout
        run: git rev-parse HEAD
      - name: Test bounded offline mock continuation and restart
        run: node --test tests/completion-mock-trial.test.mjs
      - name: Test bounded one-hop dispatch protocol without network or writes
        run: node --test tests/completion-dispatch-protocol.test.mjs
      - name: Test deterministic controller and recovery
        run: node --test tests/completion-controller.test.mjs tests/completion-controller.e2e.test.mjs tests/ai09-review-handoff.test.mjs
      - name: Read-only GitHub plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/completion-controller.mjs --github --catalog config/completion-pilot.json > /tmp/completion-plan.json
      - name: Read-only AI09 handoff for this PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ai09-review-handoff.mjs --pr "$PR_NUMBER" > /tmp/ai09-handoff.json
          node -e 'const p=require("/tmp/ai09-handoff.json"); if(p.headSha!==process.env.PR_HEAD||p.mergeAuthorized||p.githubApprovalSatisfied||p.gitHubWritePerformed) process.exit(1)'
      - name: Publish read-only AI09 request artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: race-ai09-review-request
          path: /tmp/ai09-handoff.json
          if-no-files-found: error
          retention-days: 3
      - name: Assert pilot never claims product completion or merge authority
        run: |
          node -e 'const p=require("/tmp/completion-plan.json");if(p.product_completion_claim_allowed || !p.read_only || p.autonomous_merge_enabled)process.exit(1)'

  # One-shot jobs were verified at the pinned trial head; later updates skip them.
  # This prevents repeated model downloads and expiry-induced CI failures.
  constrained-ai-trial:
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      github.event_name == 'pull_request' &&
      github.event.repository.private == false &&
      github.actor == 'haji84' &&
      github.event.pull_request.number == 65 &&
      github.event.pull_request.head.sha == '86f1be3c96e3a7e7dc529eb6c55748a827eb7779' &&
      github.event.pull_request.head.repo.full_name == 'haji84/RACE-AI' &&
      github.event.pull_request.head.ref == 'feat/completion-controller-pilot-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate constrained code verifier before model download
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          git rev-parse HEAD
          python3 scripts/completion-ai-trial.py --self-test
      - name: Reuse existing SHA256-pinned local Ollama runtime
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 300 \
            https://github.com/ollama/ollama/releases/download/v0.34.0/ollama-linux-amd64.tar.zst \
            -o "$RUNNER_TEMP/ollama.tar.zst"
          echo "cf95886728959aa09910bb34de5cca1cc5a8f68003b5597197d3f2c2d57c0804  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          mkdir "$RUNNER_TEMP/ollama-runtime"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama-runtime"
          echo "$RUNNER_TEMP/ollama-runtime/bin" >> "$GITHUB_PATH"
      - name: Start bounded loopback model
        env:
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MAX_LOADED_MODELS: '1'
          OLLAMA_KEEP_ALIVE: 5m
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$HOME" OLLAMA_HOST=127.0.0.1:11434 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 OLLAMA_KEEP_ALIVE=5m ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          echo "RACE_OLLAMA_PID=$!" >> "$GITHUB_ENV"
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          timeout 480s ollama pull qwen2.5-coder:3b
      - name: Generate and independently verify two constrained functions
        timeout-minutes: 12
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            python3 scripts/completion-ai-trial.py --output "$RUNNER_TEMP/constrained-ai-receipt.json"
      - name: Stop loopback model
        if: always()
        run: |
          if [[ "${RACE_OLLAMA_PID:-}" =~ ^[0-9]+$ ]]; then kill "$RACE_OLLAMA_PID" 2>/dev/null || true; fi

  checkpoint-producer:
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 65 &&
      github.event.pull_request.head.sha == '86f1be3c96e3a7e7dc529eb6c55748a827eb7779' &&
      github.event.pull_request.head.repo.full_name == 'haji84/RACE-AI' &&
      github.event.pull_request.head.ref == 'feat/completion-controller-pilot-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Save interrupted synthetic executor checkpoint for a distinct later run
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          set +e
          node scripts/completion-mock-trial.mjs --state-dir "$RUNNER_TEMP/checkpoint" --crash-after-result fixture-a
          result=$?
          set -e
          test "$result" = 43
          mkdir "$RUNNER_TEMP/portable-checkpoint"
          cp "$RUNNER_TEMP/checkpoint/state.json" "$RUNNER_TEMP/checkpoint/result-fixture-a.json" "$RUNNER_TEMP/checkpoint/effects.jsonl" "$RUNNER_TEMP/portable-checkpoint/"
          # Do not transfer a PID lock across hosts: the isolated subprocess exited above.
          node --input-type=module <<'NODE'
          import {writeFileSync,readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const sha256=p=>createHash('sha256').update(readFileSync(p)).digest('hex');
          const root=process.env.RUNNER_TEMP+'/portable-checkpoint/';
          writeFileSync(root+'manifest.json',JSON.stringify({
            kind:'SYNTHETIC_CHECKPOINT_TRANSFER_V1',source_head:process.env.SOURCE_HEAD,
            source_run:process.env.GITHUB_RUN_ID,source_attempt:process.env.GITHUB_RUN_ATTEMPT,
            runner_sha256:sha256('scripts/completion-mock-trial.mjs'),
            files:Object.fromEntries(['state.json','result-fixture-a.json','effects.jsonl'].map(f=>[f,sha256(root+f)]))
          }));
          NODE
      - name: Publish only small synthetic checkpoint, never code or secrets
        uses: actions/upload-artifact@v4
        with:
          name: completion-synthetic-checkpoint
          path: ${{ runner.temp }}/portable-checkpoint/
          if-no-files-found: error
          retention-days: 1

  checkpoint-consumer:
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 65 &&
      github.event.pull_request.head.sha == '86f1be3c96e3a7e7dc529eb6c55748a827eb7779' &&
      github.event.pull_request.head.repo.full_name == 'haji84/RACE-AI' &&
      github.event.pull_request.head.ref == 'feat/completion-controller-pilot-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_RUN: '39929030821'
      SOURCE_HEAD: e46ac3fa5c682c8ba39c3d343ea4badd39f0fc4e
      SOURCE_ARTIFACT: '12490811314'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate exact source run and immutable artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.github.com/repos/haji84/RACE-AI/';
          async function get(p){const r=await fetch(base+p,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},redirect:'error',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('SOURCE_API_'+r.status);return r.json();}
          const run=await get('actions/runs/'+process.env.SOURCE_RUN);
          if(String(run.id)===process.env.GITHUB_RUN_ID || run.head_sha!==process.env.SOURCE_HEAD || run.head_branch!=='feat/completion-controller-pilot-20261016' || run.event!=='pull_request' || run.path!=='.github/workflows/completion-controller-pilot.yml' || run.status!=='completed' || run.conclusion!=='success' || run.run_attempt!==1 || run.repository.full_name!=='haji84/RACE-AI')throw Error('SOURCE_RUN_INVALID');
          const artifact=await get('actions/artifacts/'+process.env.SOURCE_ARTIFACT);
          if(artifact.name!=='completion-synthetic-checkpoint' || artifact.expired || artifact.size_in_bytes>16384 || artifact.workflow_run.id!==Number(process.env.SOURCE_RUN) || artifact.workflow_run.head_sha!==process.env.SOURCE_HEAD || artifact.digest!=='sha256:1a39b67c9a3f124311655dba71eb04403f79bbe05afe66916fc9185034f131f9')throw Error('SOURCE_ARTIFACT_INVALID');
          console.log(JSON.stringify({source_run:run.id,source_head:run.head_sha,artifact_id:artifact.id,artifact_digest:artifact.digest}));
          NODE
      - name: Retrieve prior run synthetic checkpoint with read-only token
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ env.SOURCE_ARTIFACT }}
          path: ${{ runner.temp }}/recovered-checkpoint
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: haji84/RACE-AI
          run-id: ${{ env.SOURCE_RUN }}
      - name: Verify all transferred files before resuming trusted current runner
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync,lstatSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const root=process.env.RUNNER_TEMP+'/recovered-checkpoint/';
          const names=['effects.jsonl','manifest.json','result-fixture-a.json','state.json'];
          if(JSON.stringify(readdirSync(root).sort())!==JSON.stringify(names))throw Error('UNEXPECTED_CHECKPOINT_FILES');
          for(const file of names){const s=lstatSync(root+file);if(!s.isFile()||s.isSymbolicLink()||s.size>16384)throw Error('UNSAFE_CHECKPOINT_FILE');}
          const hash=p=>createHash('sha256').update(readFileSync(p)).digest('hex');
          const m=JSON.parse(readFileSync(root+'manifest.json','utf8'));
          if(m.kind!=='SYNTHETIC_CHECKPOINT_TRANSFER_V1'||m.source_head!==process.env.SOURCE_HEAD||m.source_run!==process.env.SOURCE_RUN||m.source_attempt!=='1'||m.runner_sha256!==hash('scripts/completion-mock-trial.mjs'))throw Error('CHECKPOINT_IDENTITY_MISMATCH');
          if(JSON.stringify(Object.keys(m.files).sort())!==JSON.stringify(names.filter(x=>x!=='manifest.json')))throw Error('CHECKPOINT_MANIFEST_INVALID');
          for(const [file,expected] of Object.entries(m.files)){if(hash(root+file)!==expected)throw Error('CHECKPOINT_HASH_MISMATCH');}
          const s=JSON.parse(readFileSync(root+'state.json','utf8'));
          if(s.completed.length!==0||s.active?.task_id!=='fixture-a')throw Error('WRONG_INTERRUPTION_CHECKPOINT');
          NODE
          node scripts/completion-mock-trial.mjs --state-dir "$RUNNER_TEMP/recovered-checkpoint"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const root=process.env.RUNNER_TEMP+'/recovered-checkpoint/';
          const state=JSON.parse(readFileSync(root+'state.json','utf8'));
          const effects=readFileSync(root+'effects.jsonl','utf8').trim().split('\n').map(JSON.parse);
          if(JSON.stringify(state.completed)!==JSON.stringify(['fixture-a','fixture-b'])||state.active!==null||effects.length!==2||effects[0].task_id!=='fixture-a'||effects[1].task_id!=='fixture-b')throw Error('RESUME_OR_IDEMPOTENCE_FAILED');
          console.log(JSON.stringify({status:'PASS',source_run:process.env.SOURCE_RUN,destination_run:process.env.GITHUB_RUN_ID,completed:state.completed,effects:effects.length,real_ai_development:false,autonomous_run_trigger:false,controlled_checkpoint_transfer:true}));
          NODE

  compass-adapter:
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 65 &&
      github.event.pull_request.head.repo.full_name == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify original Compass pins, isolation and evidence rejection
        run: |
          git rev-parse HEAD
          node --test tests/race-compass-adapter.test.mjs
      - name: Import canonical state, end process, reopen and export actual Compass SQLite
        run: |
          node scripts/race-compass-adapter.mjs import docs/state/race-compass-state.json "$RUNNER_TEMP/race-compass.sqlite"
          node scripts/race-compass-adapter.mjs export "$RUNNER_TEMP/race-compass.sqlite" "$RUNNER_TEMP/roundtrip.json"
          cmp docs/state/race-compass-state.json "$RUNNER_TEMP/roundtrip.json"
      - name: Independently retrieve historical run evidence without trusting snapshot claims
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/race-compass-adapter.mjs assess docs/state/race-compass-state.json "$EXPECTED_HEAD" "$RUNNER_TEMP/compass-assessment.json"
      - name: Read current full product position without promoting synthetic CI to acceptance
        run: node scripts/race-compass-adapter.mjs product docs/state/race-compass-state.json "$RUNNER_TEMP/product-position.json"
      - name: Confirm canonical file was not changed and no automatic writeback occurred
        if: always()
        run: git diff --exit-code -- docs/state/race-compass-state.json
