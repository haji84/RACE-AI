name: completion-controller-pilot
on:
  pull_request:
    paths:
      - scripts/completion-controller.mjs
      - scripts/completion-ai-trial.py
      - scripts/completion-mock-trial.mjs
      - tests/completion-mock-trial.test.mjs
      - tests/completion-controller.test.mjs
      - tests/completion-controller.e2e.test.mjs
      - tests/ai09-review-handoff.test.mjs
      - scripts/ai09-review-handoff.mjs
      - config/completion-pilot.json
      - .github/workflows/completion-controller-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact checkout
        run: git rev-parse HEAD
      - name: Test bounded offline mock continuation and restart
        run: node --test tests/completion-mock-trial.test.mjs
      - name: Test deterministic controller and recovery
        run: node --test tests/completion-controller.test.mjs tests/completion-controller.e2e.test.mjs tests/ai09-review-handoff.test.mjs
      - name: Read-only GitHub plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/completion-controller.mjs --github --catalog config/completion-pilot.json > /tmp/completion-plan.json
      - name: Read-only AI09 handoff for this PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ai09-review-handoff.mjs --pr "$PR_NUMBER" > /tmp/ai09-handoff.json
          node -e 'const p=require("/tmp/ai09-handoff.json"); if(p.headSha!==process.env.PR_HEAD||p.mergeAuthorized||p.githubApprovalSatisfied||p.gitHubWritePerformed) process.exit(1)'
      - name: Publish read-only AI09 request artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: race-ai09-review-request
          path: /tmp/ai09-handoff.json
          if-no-files-found: error
          retention-days: 3
      - name: Assert pilot never claims product completion or merge authority
        run: |
          node -e 'const p=require("/tmp/completion-plan.json");if(p.product_completion_claim_allowed || !p.read_only || p.autonomous_merge_enabled)process.exit(1)'

  constrained-ai-trial:
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      github.event_name == 'pull_request' &&
      github.event.repository.private == false &&
      github.actor == 'haji84' &&
      github.event.pull_request.number == 65 &&
      github.event.pull_request.head.repo.full_name == 'haji84/RACE-AI' &&
      github.event.pull_request.head.ref == 'feat/completion-controller-pilot-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate constrained code verifier before model download
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          git rev-parse HEAD
          python3 scripts/completion-ai-trial.py --self-test
      - name: Reuse existing SHA256-pinned local Ollama runtime
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 300 \
            https://github.com/ollama/ollama/releases/download/v0.34.0/ollama-linux-amd64.tar.zst \
            -o "$RUNNER_TEMP/ollama.tar.zst"
          echo "cf95886728959aa09910bb34de5cca1cc5a8f68003b5597197d3f2c2d57c0804  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          mkdir "$RUNNER_TEMP/ollama-runtime"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama-runtime"
          echo "$RUNNER_TEMP/ollama-runtime/bin" >> "$GITHUB_PATH"
      - name: Start bounded loopback model
        env:
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MAX_LOADED_MODELS: '1'
          OLLAMA_KEEP_ALIVE: 5m
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$HOME" OLLAMA_HOST=127.0.0.1:11434 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 OLLAMA_KEEP_ALIVE=5m ollama serve >"$RUNNER_TEMP/ollama.log" 2>&1 &
          echo "RACE_OLLAMA_PID=$!" >> "$GITHUB_ENV"
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          timeout 480s ollama pull qwen2.5-coder:3b
      - name: Generate and independently verify two constrained functions
        timeout-minutes: 12
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" \
            python3 scripts/completion-ai-trial.py --output "$RUNNER_TEMP/constrained-ai-receipt.json"
      - name: Stop loopback model
        if: always()
        run: |
          if [[ "${RACE_OLLAMA_PID:-}" =~ ^[0-9]+$ ]]; then kill "$RACE_OLLAMA_PID" 2>/dev/null || true; fi

  checkpoint-producer:
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 65 &&
      github.event.pull_request.head.repo.full_name == 'haji84/RACE-AI' &&
      github.event.pull_request.head.ref == 'feat/completion-controller-pilot-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Save interrupted synthetic executor checkpoint for a distinct later run
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          set +e
          node scripts/completion-mock-trial.mjs --state-dir "$RUNNER_TEMP/checkpoint" --crash-after-result fixture-a
          result=$?
          set -e
          test "$result" = 43
          mkdir "$RUNNER_TEMP/portable-checkpoint"
          cp "$RUNNER_TEMP/checkpoint/state.json" "$RUNNER_TEMP/checkpoint/result-fixture-a.json" "$RUNNER_TEMP/checkpoint/effects.jsonl" "$RUNNER_TEMP/portable-checkpoint/"
          # Do not transfer a PID lock across hosts: the isolated subprocess exited above.
          node --input-type=module <<'NODE'
          import {writeFileSync,readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const sha256=p=>createHash('sha256').update(readFileSync(p)).digest('hex');
          const root=process.env.RUNNER_TEMP+'/portable-checkpoint/';
          writeFileSync(root+'manifest.json',JSON.stringify({
            kind:'SYNTHETIC_CHECKPOINT_TRANSFER_V1',source_head:process.env.SOURCE_HEAD,
            source_run:process.env.GITHUB_RUN_ID,source_attempt:process.env.GITHUB_RUN_ATTEMPT,
            runner_sha256:sha256('scripts/completion-mock-trial.mjs'),
            files:Object.fromEntries(['state.json','result-fixture-a.json','effects.jsonl'].map(f=>[f,sha256(root+f)]))
          }));
          NODE
      - name: Publish only small synthetic checkpoint, never code or secrets
        uses: actions/upload-artifact@v4
        with:
          name: completion-synthetic-checkpoint
          path: ${{ runner.temp }}/portable-checkpoint/
          if-no-files-found: error
          retention-days: 1
