name: completion-controller-pilot
on:
  pull_request:
    paths:
      - scripts/completion-controller.mjs
      - scripts/completion-mock-trial.mjs
      - tests/completion-mock-trial.test.mjs
      - tests/completion-controller.test.mjs
      - tests/completion-controller.e2e.test.mjs
      - tests/ai09-review-handoff.test.mjs
      - scripts/ai09-review-handoff.mjs
      - config/completion-pilot.json
      - .github/workflows/completion-controller-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact checkout
        run: git rev-parse HEAD
      - name: Test bounded offline mock continuation and restart
        run: node --test tests/completion-mock-trial.test.mjs
      - name: Test deterministic controller and recovery
        run: node --test tests/completion-controller.test.mjs tests/completion-controller.e2e.test.mjs tests/ai09-review-handoff.test.mjs
      - name: Read-only GitHub plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/completion-controller.mjs --github --catalog config/completion-pilot.json > /tmp/completion-plan.json
      - name: Read-only AI09 handoff for this PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ai09-review-handoff.mjs --pr "$PR_NUMBER" > /tmp/ai09-handoff.json
          node -e 'const p=require("/tmp/ai09-handoff.json"); if(p.headSha!==process.env.PR_HEAD||p.mergeAuthorized||p.githubApprovalSatisfied||p.gitHubWritePerformed) process.exit(1)'
      - name: Publish read-only AI09 request artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: race-ai09-review-request
          path: /tmp/ai09-handoff.json
          if-no-files-found: error
          retention-days: 3
      - name: Assert pilot never claims product completion or merge authority
        run: |
          node -e 'const p=require("/tmp/completion-plan.json");if(p.product_completion_claim_allowed || !p.read_only || p.autonomous_merge_enabled)process.exit(1)'
