name: RACE AI unit tests
on:
  push:
    branches:
      - feat/v08-offline-st-waku10-exhibition-entry
      - codex/race-ai-completion
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned application and worker runtime
        run: python -m pip install -r requirements-worker.txt
      - name: Test full runtime, real signed JWTs and cross-language money parity
        run: python -m unittest discover -s tests -v
      - name: Validate browser code and state transitions
        run: |
          node --check web/app.js
          node --check web/money.js
          node --check web/ui-core.js
          node --check web/settlement.js
          node --test tests/ui_behavior.test.js tests/ui_race_updates.test.js tests/ui_prediction.test.js tests/ui_evaluation.test.js tests/ui_settlement.test.js
