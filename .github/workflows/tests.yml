name: RACE AI unit tests
on:
  push:
    branches:
      - feat/v08-offline-st-waku10-exhibition-entry
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Install pinned runtime for signed OIDC tests
        run: python -m pip install -r web/requirements.txt
      - name: Test runtime dependencies and real signed JWTs
        run: python -m unittest discover -s tests -v
