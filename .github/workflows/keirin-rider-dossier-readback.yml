name: KEIRIN rider dossier private readback

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/keirin-rider-dossier-readback.yml'
      - 'scripts/keirin_rider_dossier_readback.py'
      - 'scripts/keirin_public_rider_projection.py'
      - 'scripts/keirin_dossier_condition_archive.py'
      - 'race_ai/keirin_dossier_conditions.py'
      - 'tests/test_keirin_dossier_condition_archive.py'
      - 'tests/test_keirin_dossier_conditions.py'
      - 'tests/test_keirin_public_rider_projection.py'
      - 'tests/test_keirin_rider_dossier_readback.py'
      - 'docs/evidence/keirin-live-accuracy-closure-20261125/rider-dossier-recovery.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-rider-dossier-readback.yml'
      - 'scripts/keirin_rider_dossier_readback.py'
      - 'scripts/keirin_public_rider_projection.py'
      - 'scripts/keirin_dossier_condition_archive.py'
      - 'race_ai/keirin_dossier_conditions.py'
      - 'tests/test_keirin_public_rider_projection.py'
      - 'docs/evidence/keirin-live-accuracy-closure-20261125/rider-dossier-recovery.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'cryptography>=44,<48'
      - run: python -m unittest tests.test_keirin_rider_dossier_readback tests.test_keirin_joint_original_readback tests.test_keirin_public_rider_projection tests.test_keirin_dossier_conditions tests.test_keirin_dossier_condition_archive -v

  independent-private-restore:
    needs: contracts
    if: github.repository == 'haji84/RACE-AI' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'cryptography>=44,<48'
      - name: Verify the retained ciphertext before accessing an owner key
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re, urllib.error, urllib.request
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          status = None
          try:
              receipt = json.loads(Path('docs/evidence/keirin-live-accuracy-closure-20261125/rider-dossier-recovery.json').read_bytes())
              commit, path = receipt['archive_commit'], receipt['archive_path']
              expected = receipt['recovery_cipher_sha256']
              assert re.fullmatch('[a-f0-9]{40}', commit) and re.fullmatch('[a-f0-9]{64}', expected)
              assert re.fullmatch(r'state/keirin/research/rider-dossiers/v1/\d{4}-\d{2}-\d{2}/'+expected+r'\.sealed\.json', path)
              assert path.split('/')[-2] == receipt['day_jst']
              assert type(receipt['recovery_cipher_bytes']) is int and 0 < receipt['recovery_cipher_bytes'] <= 8 * 1024 * 1024
              url = 'https://raw.githubusercontent.com/haji84/RACE-AI/' + commit + '/' + path
              request = urllib.request.Request(url, headers={'User-Agent':'RACE-AI-owner-dossier-readback/1'})
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=45) as response:
                  status = response.status
                  assert status == 200 and response.geturl() == url
                  raw = response.read(receipt['recovery_cipher_bytes'] + 1)
              assert len(raw) == receipt['recovery_cipher_bytes'] and hashlib.sha256(raw).hexdigest() == expected
              folder = Path(os.environ['RUNNER_TEMP']) / 'keirin-dossier-private'
              folder.mkdir(mode=0o700)
              descriptor = os.open(folder/'recovery.sealed.json', os.O_WRONLY|os.O_CREAT|os.O_EXCL, 0o600)
              with os.fdopen(descriptor,'wb') as stream: stream.write(raw)
          except Exception as error:
              if isinstance(error, urllib.error.HTTPError): status = error.code
              print(json.dumps(dict(state='HOLD_DOSSIER_CIPHERTEXT_READBACK',stage='PINNED_GITHUB_CIPHERTEXT',http_status=status)))
              raise SystemExit(1) from None
          PY
      - name: Restore the exact dossier and registry privately on an independent runner
        shell: bash
        env:
          RACE_AI_KEIRIN_PRIVATE_RSA_PEM: ${{ secrets.RACE_AI_KEIRIN_PRIVATE_RSA_PEM }}
        run: |
          set -euo pipefail
          umask 077
          dossier_exit=0
          python -m scripts.keirin_rider_dossier_readback \
            --cipher "$RUNNER_TEMP/keirin-dossier-private/recovery.sealed.json" \
            --receipt docs/evidence/keirin-live-accuracy-closure-20261125/rider-dossier-recovery.json \
            --output-dir "$RUNNER_TEMP/keirin-dossier-private/restored" \
            > "$RUNNER_TEMP/keirin-dossier-private/safe-report.json" || dossier_exit=$?
          cat "$RUNNER_TEMP/keirin-dossier-private/safe-report.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$dossier_exit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-rider-dossier-safe-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/keirin-dossier-private/safe-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Project the verified registry and numeric histories for public display
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m scripts.keirin_public_rider_projection \
            --restored-dir "$RUNNER_TEMP/keirin-dossier-private/restored" \
            --receipt docs/evidence/keirin-live-accuracy-closure-20261125/rider-dossier-recovery.json \
            --output-dir "$RUNNER_TEMP/keirin-dossier-public" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-public-rider-directory-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/keirin-dossier-public/public-rider-directory.json
            ${{ runner.temp }}/keirin-dossier-public/public-rider-directory-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Reconcile meeting grades and rounds against the restored finish history
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/keirin-dossier-private"
          public="$RUNNER_TEMP/keirin-dossier-public"
          source='https://raw.githubusercontent.com/sumidatadayoshi/keirin-data/2a1260fb0940ad11160b56a36f9c24cc4fb2f6d2/data'
          curl --fail --silent --show-error --proto '=https' --max-time 90 --max-filesize 104706048 \
            "$source/keirin.db" --output "$private/keirin.db"
          curl --fail --silent --show-error --proto '=https' --max-time 90 --max-filesize 45436928 \
            "$source/keirin_2026q4.db" --output "$private/keirin_2026q4.db"
          (
            cd "$private"
            sha256sum --check --status <<'EOF'
          1bdad22b9744c9c5563f7bb1af31875170a3e6b7f4b0dd73fba8f98d645d8fc4  keirin.db
          d915560877493816b90df8bcd5e7bdef45557f57100b4cd40a3d017cd959334d  keirin_2026q4.db
          EOF
          )
          python -m scripts.keirin_dossier_condition_archive --restored "$private/restored" \
            --database "$private/keirin.db" --database "$private/keirin_2026q4.db" \
            --output "$public/rider-condition-archive.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-public-rider-condition-archive-${{ github.run_id }}
          path: ${{ runner.temp }}/keirin-dossier-public/rider-condition-archive.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove the private restored source documents
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/keirin-dossier-private"
