name: BOAT fast result original release no fixed GET cap
on:
  pull_request:
    branches: [release/boat-fast-result-uncapped-20261114]
    paths:
      - .github/workflows/boat-fast-result-unbounded-contract.yml
      - race_ai/racer_intraday.py
      - scripts/racer_intraday_refresh.py
      - tests/test_racer_fast_uncapped_due_queue.py
permissions:
  contents: read
jobs:
  source_free_fast_due:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    name: Fast 1-minute/2-minute results, >12 genuine GET, AES and provider waits
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: ${{ github.event.pull_request.head.sha }}, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 761247bee0209e37b1af6b8885e92cad3e9260a5, path: pr64-reference, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe, path: pr72-reference, persist-credentials: false}
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Source-free genuine result queue and original AES replay
        run: |
          python - <<'PY'
          import unittest,race_ai
          from pathlib import Path
          for root in ('pr64-reference','pr72-reference'):
              race_ai.__path__.append(str(Path(root,'race_ai').resolve()))
          names=('tests.test_racer_fast_uncapped_due_queue',
                 'tests.test_racer_result_queue','tests.test_racer_intraday',
                 'tests.test_racer_intraday_refresh','tests.test_racer_intraday_handoff',
                 'tests.test_racer_result_bridge','tests.test_racer_intraday_transport')
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(names))
          raise SystemExit(not result.wasSuccessful())
          PY
