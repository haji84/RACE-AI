permissions:
  contents: read
concurrency:
  group: forecast-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  train_only_tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify training isolation and creation-time constraints
        run: python -m unittest discover -s tests -p "test_four_sport*learning.py" -v
      - name: Verify separate training artifact and validation API
        run: python -m unittest discover -s tests -p test_four_sport_train_only.py -v
  pr64_cross_branch_bridge:
    name: Pinned PR64 store and PDCA synthetic E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout PR71 exact tested HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout immutable PR64 implementation as integration reference
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - name: Verify PR64 actual store and own pinned result projection
        env:
          PR64_REFERENCE_ROOT: pr64-reference
        run: |
          python tests/pr64_bridge_harness.py
          PYTHONPATH=. python tests/boat_historical_route_harness.py
          python -m unittest tests.test_exhibition_autorun -v
  viewer_contract:
    name: Viewer audit contract
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify repository revision
        run: git rev-parse HEAD
      - name: Use Node24 for local SQLite batch tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Check viewer script syntax
        run: |
          node --check web/forecast-audit-model.js
          node --check web/forecast-audit.js
          node --check web/full-odds-model.js
          node --check web/full-odds.js
          node --check workers/odds_feed_worker.mjs
          node --check workers/odds_auto_source_cron.mjs
          node --check race_ai/odds_three_cycle_audit.mjs
          node --check workers/private_wire_vault.mjs
          node --check workers/private_wire_vault_schema.mjs
          node --check tests/support/local_private_wire_d1.mjs
      - name: Validate Vercel-free BOAT lifecycle logic
        run: |
          node --check workers/boat_nonvercel_core.mjs
          node --test tests/boat_nonvercel_core.test.mjs
          node --check workers/boat_official_html.mjs
          node --check workers/boat_nonvercel_cron.mjs
          node --check workers/boat_pdca_shadow.mjs
          node --test tests/boat_official_html.test.mjs tests/boat_pdca_shadow.test.mjs tests/boat_continuous_control.test.mjs
      - name: Node contract and denominator tests
        run: node --test --test-reporter=tap tests/forecast_audit.test.cjs tests/full_odds.test.cjs tests/odds_feed_worker.test.mjs tests/odds_auto_source_cron.test.mjs tests/odds_three_cycle_audit.test.mjs tests/private_wire_vault.test.mjs
      - name: Python synthetic journal to viewer projection tests
        run: python -m unittest discover -s tests -v
      - name: Read frozen real-race research record by immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 0643ed09343d10a3181af855ad4065cb07074208
          path: independent-forecast-evidence
          persist-credentials: false
      - name: Verify historical pre-cutoff research snapshot without refreshing forecast
        run: |
          python - <<'PY'
          import json, pathlib, itertools, math
          p=pathlib.Path('independent-forecast-evidence/audit/2026-10-22/prospective_shadow_kojima_12r_0929JST_immutable.json')
          d=json.loads(p.read_text())
          rows=d['races']
          assert len(rows)==12 and len({r['race_id'] for r in rows})==12
          for race in rows:
              assert race['outcome_at_forecast_time'] is None and race['candidate_count']==120
              assert len(race['ordered_top8'])==8 and race['all_valid_candidates_ranked']
              w=race['model']['class_weight']; lanes=race['model']['lane_bias']; grades=race['entrant_classes']
              strengths=[w[g]*b for g,b in zip(grades,lanes)]; total=sum(strengths)
              u=[]
              for a,b,c in itertools.permutations(range(1,7),3):
                  sa,sb,sc=strengths[a-1],strengths[b-1],strengths[c-1]
                  u.append(([a,b,c],sa/total*sb/(total-sa)*sc/(total-sa-sb)))
              assert len(u)==120 and math.isclose(sum(t[1] for t in u),1,abs_tol=1e-9)
              u.sort(key=lambda item:(-item[1],item[0]))
              assert [t[0] for t in u[:8]]==[r['combination'] for r in race['ordered_top8']]
              assert race['model']['validated_accuracy'] is False and race['betting_decision']=='NO_BET'
          print('IMMUTABLE_RESEARCH_PROOF_12_OK: git-pinned pre-result ranking replays; NOT a trusted external freeze receipt')
          PY
      - name: Validate public audit seed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("web/data/2026-10-22-forecast-audit.json").read_text())
          races=obj["records"]
          assert obj["dataset_status"]=="AUDIT_ONLY"
          assert len(races)==322
          assert len({x["race_id"] for x in races})==322
          assert all(x["prediction"] is None and x["result"] is None for x in races)
          assert all(x["offering_status"]=="UNKNOWN" for x in races)
          print("AUDIT_ONLY 322 distinct race slots; no predictions or outcomes fabricated")
          PY
