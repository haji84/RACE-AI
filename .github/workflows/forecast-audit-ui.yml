name: Forecast audit viewer contract
on:
  pull_request:
    branches:
      - codex/actions-four-sport-e2e
    paths:
      - 'web/forecast-audit*'
      - 'web/full-odds*'
      - 'tests/full_odds.test.cjs'
      - 'workers/odds_feed_worker.mjs'
      - 'workers/odds_preview_assets.mjs'
      - 'docs/P0_CLOUDFLARE_PROTECTED_ODDS_PREVIEW_20261024.md'
      - 'workers/odds_schema.sql'
      - 'tests/odds_feed_worker.test.mjs'
      - 'race_ai/purchase_window_policy.py'
      - 'tests/test_purchase_window_policy.py'
      - 'docs/PURCHASE_BUFFER_AND_FULL_ODDS_V1_20261023.md'
      - 'web/data/2026-10-22-forecast-audit.json'
      - 'tests/forecast_audit.test.cjs'
      - 'tests/test_verified_event_projection.py'
      - 'race_ai/verified_event_projection.py'
      - 'race_ai/permissioned_source_delivery.py'
      - 'race_ai/boat_official_3t_odds_adapter.py'
      - 'race_ai/boat_3t_odds_handoff_cli.py'
      - 'race_ai/odds_refresh_plan.py'
      - 'race_ai/free_tier_budget.py'
      - 'tests/test_free_tier_budget.py'
      - 'docs/P0_CLOUDFLARE_FREE_TIER_BUDGET_20261024.md'
      - 'tests/test_odds_refresh_plan.py'
      - 'tests/test_boat_3t_odds_handoff_cli.py'
      - 'docs/ODDS_REAL_SOURCE_E2E_GATE_20261023.md'
      - 'tests/test_boat_official_3t_odds_adapter.py'
      - 'race_ai/boat_b_program_bridge.py'
      - 'race_ai/boat_b_offline_archive_intake.py'
      - 'docs/P0_BOAT_BK_DISTRIBUTION_RIGHTS_AND_TIMING_20261023.md'
      - 'tests/test_boat_b_offline_archive_intake.py'
      - 'race_ai/nar_official_csv_adapter.py'
      - 'race_ai/nar_model_handoff.py'
      - 'tests/test_nar_model_handoff.py'
      - 'tests/test_nar_official_payback_adapter.py'
      - 'race_ai/nar_official_payback_adapter.py'
      - 'tests/test_nar_csv_cli.py'
      - 'race_ai/nar_csv_cli.py'
      - 'tests/test_nar_official_csv_adapter.py'
      - 'race_ai/boat_b_handoff_cli.py'
      - 'tests/test_boat_b_handoff_cli.py'
      - 'tests/test_boat_b_program_bridge.py'
      - 'tests/test_permissioned_source_delivery.py'
      - 'tests/test_context_source_delivery.py'
      - 'docs/P0_SOURCE_TO_MODEL_DELIVERY_20261023.md'
      - 'race_ai/github_freeze_receipt.py'
      - 'tests/test_github_freeze_receipt.py'
      - 'audit/freezes/**'
      - 'race_ai/cutoff_job_queue.py'
      - 'race_ai/boat_multi_feature_models.py'
      - 'race_ai/boat_feature_adapter.py'
      - 'race_ai/comprehensive_four_sport_models.py'
      - 'race_ai/four_sport_matchup_models.py'
      - 'race_ai/four_sport_model_suite.py'
      - 'tests/test_four_sport_model_suite.py'
      - 'tests/test_four_sport_matchup_models.py'
      - 'race_ai/four_sport_learning.py'
      - 'tests/test_four_sport_learning.py'
      - 'tests/test_comprehensive_four_sport_models.py'
      - 'tests/test_boat_feature_adapter.py'
      - 'tests/test_boat_multi_feature_models.py'
      - 'tests/test_cutoff_job_queue.py'
      - '.github/workflows/forecast-audit-ui.yml'
permissions:
  contents: read
concurrency:
  group: forecast-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  viewer_contract:
    name: Viewer audit contract
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify repository revision
        run: git rev-parse HEAD
      - name: Check viewer script syntax
        run: |
          node --check web/forecast-audit-model.js
          node --check web/forecast-audit.js
          node --check web/full-odds-model.js
          node --check web/full-odds.js
          node --check workers/odds_feed_worker.mjs
      - name: Node contract and denominator tests
        run: node --test tests/forecast_audit.test.cjs tests/full_odds.test.cjs tests/odds_feed_worker.test.mjs
      - name: Python synthetic journal to viewer projection tests
        run: python -m unittest discover -s tests -v
      - name: Read frozen real-race research record by immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 0643ed09343d10a3181af855ad4065cb07074208
          path: independent-forecast-evidence
          persist-credentials: false
      - name: Verify historical pre-cutoff research snapshot without refreshing forecast
        run: |
          python - <<'PY'
          import json, pathlib, itertools, math
          p=pathlib.Path('independent-forecast-evidence/audit/2026-10-22/prospective_shadow_kojima_12r_0929JST_immutable.json')
          d=json.loads(p.read_text())
          rows=d['races']
          assert len(rows)==12 and len({r['race_id'] for r in rows})==12
          for race in rows:
              assert race['outcome_at_forecast_time'] is None and race['candidate_count']==120
              assert len(race['ordered_top8'])==8 and race['all_valid_candidates_ranked']
              w=race['model']['class_weight']; lanes=race['model']['lane_bias']; grades=race['entrant_classes']
              strengths=[w[g]*b for g,b in zip(grades,lanes)]; total=sum(strengths)
              u=[]
              for a,b,c in itertools.permutations(range(1,7),3):
                  sa,sb,sc=strengths[a-1],strengths[b-1],strengths[c-1]
                  u.append(([a,b,c],sa/total*sb/(total-sa)*sc/(total-sa-sb)))
              assert len(u)==120 and math.isclose(sum(t[1] for t in u),1,abs_tol=1e-9)
              u.sort(key=lambda item:(-item[1],item[0]))
              assert [t[0] for t in u[:8]]==[r['combination'] for r in race['ordered_top8']]
              assert race['model']['validated_accuracy'] is False and race['betting_decision']=='NO_BET'
          print('IMMUTABLE_RESEARCH_PROOF_12_OK: git-pinned pre-result ranking replays; NOT a trusted external freeze receipt')
          PY
      - name: Validate public audit seed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("web/data/2026-10-22-forecast-audit.json").read_text())
          races=obj["records"]
          assert obj["dataset_status"]=="AUDIT_ONLY"
          assert len(races)==322
          assert len({x["race_id"] for x in races})==322
          assert all(x["prediction"] is None and x["result"] is None for x in races)
          assert all(x["offering_status"]=="UNKNOWN" for x in races)
          print("AUDIT_ONLY 322 distinct race slots; no predictions or outcomes fabricated")
          PY
