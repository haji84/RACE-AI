name: Forecast audit viewer contract
on:
  pull_request:
    branches:
      - codex/actions-four-sport-e2e
    paths: ['requirements-history.txt', 'race_ai/**', 'scripts/**', 'tests/**', 'workers/**', 'web/**', 'docs/**', 'audit/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      video_context_cipher:
        description: 'Owner-encrypted context envelope; never supply a key, media or plaintext features'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('boat-video-publication-{0}', github.run_id) || format('forecast-audit-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  train_only_tests:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify training isolation and creation-time constraints
        run: python -m unittest discover -s tests -p "test_four_sport*learning.py" -v
      - name: Verify separate training artifact and validation API
        run: python -m unittest discover -s tests -p test_four_sport_train_only.py -v
  pr64_cross_branch_bridge:
    if: github.event_name == 'pull_request'
    name: Pinned PR64 store and PDCA synthetic E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout PR71 exact tested HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout immutable PR64 implementation as integration reference
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - name: Verify PR64 actual store and own pinned result projection
        env:
          PR64_REFERENCE_ROOT: pr64-reference
        run: |
          python tests/pr64_bridge_harness.py
          PYTHONPATH=. python tests/boat_historical_route_harness.py
          python -m unittest tests.test_exhibition_autorun -v
  boat_pdca_state_producer:
    if: github.event_name == 'pull_request'
    name: BOAT invented-data encrypted state producer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cipher_sha256: ${{ steps.produce.outputs.cipher_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Create invented history and immutable pair, then encrypt SQLite
        id: produce
        run: python -m scripts.boat_pdca_handoff_fixture produce --work "$RUNNER_TEMP/boat-producer" --artifact "$RUNNER_TEMP/boat-sealed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-pdca-synthetic-state-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/boat-sealed/state.enc
            ${{ runner.temp }}/boat-sealed/proof.json
            ${{ runner.temp }}/boat-sealed/handoff-proof.json
          retention-days: 3
          if-no-files-found: error
  boat_pdca_state_consumer:
    if: github.event_name == 'pull_request'
    name: BOAT restore on another runner and score result revisions once
    needs: boat_pdca_state_producer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: boat-pdca-synthetic-state-${{ github.run_id }}
          path: ${{ runner.temp }}/boat-incoming
      - name: Restore exact originals, score revisions, reject replay, prepare next pair
        env:
          RACE_AI_EXPECTED_CIPHER_SHA256: ${{ needs.boat_pdca_state_producer.outputs.cipher_sha256 }}
          EXPECTED_PRODUCER_RUN_ID: ${{ github.run_id }}
          EXPECTED_PRODUCER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m scripts.boat_pdca_handoff_fixture consume --work "$RUNNER_TEMP/boat-consumer" --artifact "$RUNNER_TEMP/boat-incoming"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-pdca-synthetic-restore-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/boat-consumer/consumer-proof.json
          retention-days: 3
          if-no-files-found: error
  boat_pdca_owner_recipient:
    name: BOAT owner public recipient (root key stays in Actions)
    if: github.repository == 'haji84/RACE-AI' && github.event.pull_request.number == 71 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Derive only the receiving public key from the configured owner secret
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -m scripts.boat_pdca_transfer receiver --private-dir "$RUNNER_TEMP/boat-owner-recipient"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-owner-recipient-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/boat-owner-recipient/receiver.json
            ${{ runner.temp }}/boat-owner-recipient/status.json
          retention-days: 7
          if-no-files-found: error
  boat_pdca_owner_transfer:
    name: BOAT receive encrypted originals using the existing owner key
    if: github.repository == 'haji84/RACE-AI' && github.event.pull_request.number == 71 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      encrypted: ${{ steps.receive.outputs.encrypted }}
      transfer_sha256: ${{ steps.receive.outputs.transfer_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Decrypt owner-addressed transport, preserve prior state and seal canonical checkpoint
        id: receive
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -m scripts.boat_pdca_transfer receive --input audit/state/boat-pdca-transfer-input.json --previous-input audit/state/boat-pdca-production-input.json --accepted-imports audit/state/boat-pdca-accepted-imports.json --private-dir "$RUNNER_TEMP/boat-owner-state"
      - name: Retain only owner-encrypted canonical state and public counts
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-owner-pdca-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/boat-owner-state/sealed/state.enc
            ${{ runner.temp }}/boat-owner-state/sealed/proof.json
            ${{ runner.temp }}/boat-owner-state/sealed/handoff-proof.json
            ${{ runner.temp }}/boat-owner-state/status.json
          retention-days: 7
          if-no-files-found: error
  boat_pdca_owner_transfer_readback:
    name: BOAT independent runner restores transferred production originals
    needs: boat_pdca_owner_transfer
    if: needs.boat_pdca_owner_transfer.outputs.encrypted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Read the exact producer artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.boat_pdca_owner_transfer.outputs.artifact_id }}
          path: ${{ runner.temp }}/boat-owner-state-incoming
          merge-multiple: true
      - name: Authenticate canonical state, exact originals and idempotent result replay
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          RACE_AI_EXPECTED_TRANSFER_SHA: ${{ needs.boat_pdca_owner_transfer.outputs.transfer_sha256 }}
        run: python -m scripts.boat_pdca_transfer verify --folder "$RUNNER_TEMP/boat-owner-state-incoming/sealed" --private-dir "$RUNNER_TEMP/boat-owner-state-readback" --transfer-sha "$RACE_AI_EXPECTED_TRANSFER_SHA"
      - name: Keep count-only independent readback proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-owner-pdca-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boat-owner-state-readback/status.json
          retention-days: 7
          if-no-files-found: error
  boat_pdca_production_readback:
    name: BOAT production encrypted-state acceptance or explicit HOLD
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI' && github.event.pull_request.number == 71 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Require owner key before pinned ciphertext GET and private restore
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: python -m scripts.boat_pdca_github readback --input audit/state/boat-pdca-production-input.json --private-dir "$RUNNER_TEMP/boat-production-readback"
      - name: Retain count-only acceptance status, never decrypted state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-production-readback-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boat-production-readback/production-readback-status.json
          retention-days: 7
          if-no-files-found: error
  viewer_contract:
    if: github.event_name == 'pull_request'
    name: Viewer audit contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout pinned PR64 parser for complete Python discovery
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - name: Checkout pinned PR72 source adapters for complete Python discovery
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
      - name: Verify repository revision
        run: git rev-parse HEAD
      - name: Use Node24 for local SQLite batch tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Check viewer script syntax
        run: |
          node --check web/forecast-audit-model.js
          node --check web/forecast-audit.js
          node --check web/full-odds-model.js
          node --check web/full-odds.js
          node --check workers/odds_feed_worker.mjs
          node --check workers/odds_auto_source_cron.mjs
          node --check race_ai/odds_three_cycle_audit.mjs
          node --check workers/private_wire_vault.mjs
          node --check workers/private_wire_vault_schema.mjs
          node --check tests/support/local_private_wire_d1.mjs
      - name: Validate Vercel-free BOAT lifecycle logic
        run: |
          node --check workers/boat_nonvercel_core.mjs
          node --test tests/boat_nonvercel_core.test.mjs
          node --check workers/boat_official_html.mjs
          node --check workers/boat_nonvercel_cron.mjs
          node --check workers/boat_pdca_shadow.mjs
          node --test tests/boat_official_html.test.mjs tests/boat_pdca_shadow.test.mjs tests/boat_continuous_control.test.mjs
      - name: Node contract and denominator tests
        run: node --test --test-reporter=tap tests/forecast_audit.test.cjs tests/full_odds.test.cjs tests/odds_feed_worker.test.mjs tests/odds_auto_source_cron.test.mjs tests/odds_three_cycle_audit.test.mjs tests/private_wire_vault.test.mjs
      - name: Install pinned private history cache crypto (synthetic keys only)
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Validate history formats, official reconciliation and unchanged model contracts offline
        run: python -m unittest discover -s tests -p 'test_teiai*.py' -v
      - name: Python synthetic journal to viewer projection tests
        run: python -m unittest discover -s tests -v
      - name: Verify isolated experimental video decoding and measurements
        run: |
          python -m venv "$RUNNER_TEMP/race-ai-video-tools"
          "$RUNNER_TEMP/race-ai-video-tools/bin/python" -m pip install -r requirements-video.txt -r requirements-history.txt
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || ! command -v tesseract >/dev/null; then
            # The Azure HTTP mirror stalled package downloads before any video test ran.
            # Keep Ubuntu's signed packages and use its canonical HTTPS archive.
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg tesseract-ocr tesseract-ocr-eng
          fi
          "$RUNNER_TEMP/race-ai-video-tools/bin/python" -m unittest tests.test_boat_video_tracking tests.test_boat_video_identity tests.test_boat_video_identity_tracking tests.test_boat_video_ocr_reliability tests.test_boat_video_intake tests.test_boat_video_cli tests.test_boat_video_tiled_detector tests.test_boat_video_crnn tests.test_boat_video_camera_identity tests.test_boat_video_calibration tests.test_boat_video_physical_context tests.test_boat_video_vision_cli tests.test_boat_video_publication tests.test_boat_video_publication_intake -v
      - name: Integrated product UI contracts
        run: |
          node --check web/app.js
          node --check web/ui-model.js
          node --check web/product-data.js
          node --check web/existing-model-catalog.js
          node --check scripts/existing_pdca_offline.mjs
          node --test --test-reporter=tap tests/ui_model.test.js tests/product_data.test.cjs tests/model_catalog.test.cjs tests/existing_pdca_offline.test.mjs
      - name: Install isolated pinned browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/race-ai-ui-tools" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/race-ai-ui-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise seven product pages at four viewport widths
        env:
          NODE_PATH: ${{ runner.temp }}/race-ai-ui-tools/node_modules
          UI_JOURNAL_EXPORT: ${{ runner.temp }}/product-ui-journal.json
          UI_PRIVATE_CYCLE_EXPORT: ${{ runner.temp }}/private-cycle-view.json
          UI_DISPATCH_VIEWS: ${{ runner.temp }}/private-dispatch-views.json
        run: |
          python -m race_ai.synthetic_e2e --db "$RUNNER_TEMP/product-ui-synthetic.sqlite"
          python -m race_ai.audit_projection --db "$RUNNER_TEMP/product-ui-synthetic.sqlite" --out "$UI_JOURNAL_EXPORT"
          python -m tests.private_cycle_ui_fixture --out "$UI_PRIVATE_CYCLE_EXPORT"
          python -m tests.private_dispatch_ui_fixture --out "$UI_DISPATCH_VIEWS"
          node tests/ui_browser.test.js
          node --test tests/boat_video_ui.test.mjs
      - name: Retain synthetic-only UI interaction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-product-ui-${{ github.sha }}
          path: artifacts/ui-browser/
          if-no-files-found: warn
          retention-days: 7
      - name: Read frozen real-race research record by immutable commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0643ed09343d10a3181af855ad4065cb07074208
          path: independent-forecast-evidence
          persist-credentials: false
      - name: Verify historical pre-cutoff research snapshot without refreshing forecast
        run: |
          python - <<'PY'
          import json, pathlib, itertools, math
          p=pathlib.Path('independent-forecast-evidence/audit/2026-10-22/prospective_shadow_kojima_12r_0929JST_immutable.json')
          d=json.loads(p.read_text())
          rows=d['races']
          assert len(rows)==12 and len({r['race_id'] for r in rows})==12
          for race in rows:
              assert race['outcome_at_forecast_time'] is None and race['candidate_count']==120
              assert len(race['ordered_top8'])==8 and race['all_valid_candidates_ranked']
              w=race['model']['class_weight']; lanes=race['model']['lane_bias']; grades=race['entrant_classes']
              strengths=[w[g]*b for g,b in zip(grades,lanes)]; total=sum(strengths)
              u=[]
              for a,b,c in itertools.permutations(range(1,7),3):
                  sa,sb,sc=strengths[a-1],strengths[b-1],strengths[c-1]
                  u.append(([a,b,c],sa/total*sb/(total-sa)*sc/(total-sa-sb)))
              assert len(u)==120 and math.isclose(sum(t[1] for t in u),1,abs_tol=1e-9)
              u.sort(key=lambda item:(-item[1],item[0]))
              assert [t[0] for t in u[:8]]==[r['combination'] for r in race['ordered_top8']]
              assert race['model']['validated_accuracy'] is False and race['betting_decision']=='NO_BET'
          print('IMMUTABLE_RESEARCH_PROOF_12_OK: git-pinned pre-result ranking replays; NOT a trusted external freeze receipt')
          PY
      - name: Validate public audit seed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("web/data/2026-10-22-forecast-audit.json").read_text())
          races=obj["records"]
          assert obj["dataset_status"]=="AUDIT_ONLY"
          assert len(races)==322
          assert len({x["race_id"] for x in races})==322
          assert all(x["prediction"] is None and x["result"] is None for x in races)
          assert all(x["offering_status"]=="UNKNOWN" for x in races)
          print("AUDIT_ONLY 322 distinct race slots; no predictions or outcomes fabricated")
          PY
  official_all_racer_intake:
    name: Official all-racer bulk intake (owner key or explicit HOLD)
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI' && github.event.pull_request.number == 71 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      encrypted: ${{ steps.capture.outputs.encrypted }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      venue_encrypted: ${{ steps.venue_capture.outputs.encrypted }}
      venue_artifact_id: ${{ steps.venue_upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha }}'}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 761247bee0209e37b1af6b8885e92cad3e9260a5, path: pr64-reference}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.19.0', package-manager-cache: false}
      - name: Install pinned private intake dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Restore only encrypted all-racer cache
        id: racer_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/all-racer-encrypted-cache
          key: boat-all-racers-v1-5c1e21cfe5a4dd53ea26eb07aca4905c4c20c3160b4a206ba96e92702eb4b46d
      - name: Verify owner key before single approved official file GET
        id: capture
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: |
          python -m scripts.boat_all_racers capture --out-dir "$RUNNER_TEMP/all-racer-intake" --reuse-dir "$RUNNER_TEMP/all-racer-encrypted-cache"
          python - <<'PY'
          import json, os, pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'all-racer-intake'/'summary.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('encrypted='+str(report.get('encrypted_checkpoint_created') is True).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('All-racer intake status: '+report['status']+'\n')
              out.write('No plaintext source or database artifact; HOLD is not ingestion success.\n')
          PY
      - name: Checkpoint first published venue-history month (or explicit owner-key HOLD)
        id: venue_capture
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: |
          python -m scripts.boat_venue_history capture-month --month 200501 --max-files 5 --out-dir "$RUNNER_TEMP/venue-history-month"
          python - <<'PY'
          import json, os, pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'venue-history-month'/'summary.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('encrypted='+str(report.get('encrypted_checkpoint_created') is True).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Venue history status: '+report['status']+'\n')
              out.write('One bounded month is not all-period completeness.\n')
          PY
      - name: Preserve only encrypted monthly history and count-only status
        id: venue_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-venue-history-200501-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/venue-history-month/history.checkpoint
            ${{ runner.temp }}/venue-history-month/summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare ciphertext-only cache when owner encryption succeeded
        if: steps.capture.outputs.encrypted == 'true' && steps.racer_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/all-racer-encrypted-cache"
          cp "$RUNNER_TEMP/all-racer-intake/racers.checkpoint" "$RUNNER_TEMP/all-racer-encrypted-cache/"
          cp "$RUNNER_TEMP/all-racer-intake/summary.json" "$RUNNER_TEMP/all-racer-encrypted-cache/"
      - name: Save only verified encrypted source snapshot for request reuse
        if: steps.capture.outputs.encrypted == 'true' && steps.racer_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/all-racer-encrypted-cache
          key: boat-all-racers-v1-5c1e21cfe5a4dd53ea26eb07aca4905c4c20c3160b4a206ba96e92702eb4b46d
      - name: Retain encrypted checkpoint and count-only status
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-all-racers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/all-racer-intake/racers.checkpoint
            ${{ runner.temp }}/all-racer-intake/summary.json
          if-no-files-found: error
          retention-days: 7
  official_all_racer_readback:
    name: Independently restore encrypted all-racer SQLite
    needs: official_all_racer_intake
    if: github.event_name == 'pull_request' && needs.official_all_racer_intake.outputs.encrypted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha }}'}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 761247bee0209e37b1af6b8885e92cad3e9260a5, path: pr64-reference}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.19.0', package-manager-cache: false}
      - name: Install pinned reader dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Read exact intake artifact from this run in a separate job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.official_all_racer_intake.outputs.artifact_id }}
          path: ${{ runner.temp }}/all-racer-readback
          merge-multiple: true
      - name: Authenticate, decrypt, verify SQLite and lookup every racer
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: python -m scripts.boat_all_racers restore --folder "$RUNNER_TEMP/all-racer-readback"
      - name: Read exact monthly-history ciphertext in this independent reader
        if: needs.official_all_racer_intake.outputs.venue_encrypted == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.official_all_racer_intake.outputs.venue_artifact_id }}
          path: ${{ runner.temp }}/venue-history-readback
          merge-multiple: true
      - name: Authenticate monthly raw source hashes and parsed-day counts
        if: needs.official_all_racer_intake.outputs.venue_encrypted == 'true'
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: python -m scripts.boat_venue_history restore-month --month 200501 --folder "$RUNNER_TEMP/venue-history-readback"
      - name: Restore pinned full-period monthly generations and verify every original hash
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: python -m scripts.boat_venue_history_handoff readback --input audit/state/boat-venue-history-input.json --out-dir "$RUNNER_TEMP/venue-history-all-period"
      - name: Restore encrypted venue grid and verify all racer and course cells
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: python -m scripts.boat_venue_dataset readback --input audit/state/boat-venue-dataset-input.json --out-dir "$RUNNER_TEMP/venue-history-grid"

  video_context_cipher_ingest:
    name: Private video-context ciphertext intake or explicit HOLD
    if: github.event_name == 'workflow_dispatch' && github.repository == 'haji84/RACE-AI' && github.ref == 'refs/heads/feat/four-sport-forecast-audit-view-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install existing private archive crypto dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Validate owner key, dispatch origin and pre-cutoff ciphertext
        id: receive
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: python -m race_ai.boat_video_publication receive --event-file "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/boat-video-context-ingest"
      - name: Retain ciphertext only for independent receipt verification
        if: steps.receive.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: race-video-context-${{ github.run_id }}
          path: ${{ runner.temp }}/boat-video-context-ingest/video-context.enc
          retention-days: 90
          if-no-files-found: error
