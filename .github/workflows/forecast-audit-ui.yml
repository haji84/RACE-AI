          race_ai.__path__.extend(str(Path(p).resolve()) for p in ('pr64-reference/race_ai','pr72-reference/race_ai'))
          try:
              from race_ai.permissioned_source_delivery import read_json_bytes
              raw=Path('audit/state/official-future-source-capture-input.json').read_bytes()
              if len(raw)>65536:raise ValueError('INPUT_BOUND')
              value=read_json_bytes(raw)
              kind=os.environ['FUTURE_CAPTURE_KIND']
              if kind=='SOURCE' and value.get('schema')=='RACE_AI_OFFICIAL_FUTURE_SOURCE_CAPTURE_INPUT_V1':
                  from race_ai.all_existing_model_future_source_capture import validate_manifest
                  scope,prefix='autorace-keirin','official-future-source-capture'
              elif kind=='SOURCE' and value.get('schema')=='RACE_AI_JRA_FUTURE_SOURCE_CAPTURE_INPUT_V1':
                  from race_ai.jra_future_source_capture import validate_manifest
                  scope,prefix='horse','official-jra-future-source-capture'
              elif kind=='RESULT' and value.get('schema') in ('RACE_AI_ALL_NATIVE_FUTURE_RESULT_CAPTURE_INPUT_V1','RACE_AI_ALL_NATIVE_FUTURE_RESULT_CAPTURE_INPUT_V2'):
                  from race_ai.all_existing_model_future_result_capture import validate_manifest
                  scope,prefix='official-result','official-future-result-capture'
              else:raise ValueError('INPUT_SCHEMA')
              validate_manifest(value,now=datetime.now(timezone.utc))
          except Exception:raise SystemExit('FUTURE_SOURCE_INPUT_REJECTED') from None
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('scope='+scope+'\nsource_artifact_prefix='+prefix+'\n')
          PY
      - name: Use the pinned Node runtime for isolated future source tooling
        if: steps.future_source_route.outputs.requested == 'true' && (steps.future_source_scope.outputs.scope == 'autorace-keirin' || steps.future_source_scope.outputs.scope == 'official-result')
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install isolated pinned future source browser tooling
        if: steps.future_source_route.outputs.requested == 'true' && (steps.future_source_scope.outputs.scope == 'autorace-keirin' || steps.future_source_scope.outputs.scope == 'official-result')
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/race-ai-future-ui-tools" --no-package-lock --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/race-ai-future-ui-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Bind the executable to the installed pinned Playwright version
        id: future_source_browser
        if: steps.future_source_route.outputs.requested == 'true' && (steps.future_source_scope.outputs.scope == 'autorace-keirin' || steps.future_source_scope.outputs.scope == 'official-result')
        env:
          NODE_PATH: ${{ runner.temp }}/race-ai-future-ui-tools/node_modules
        shell: bash
        run: |
          browser="$(node -e 'if(require("playwright/package.json").version!=="1.62.1")process.exit(1);process.stdout.write(require("playwright").chromium.executablePath())')"
          test -x "$browser"
          printf 'chromium_path=%s\n' "$browser" >> "$GITHUB_OUTPUT"
      - name: Reserve once and encrypt the exact future native source inputs
        id: future_source_capture
        if: steps.future_source_route.outputs.requested == 'true' && steps.future_source_scope.outputs.scope != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          FUTURE_SOURCE_SCOPE: ${{ steps.future_source_scope.outputs.scope }}
          NODE_PATH: ${{ runner.temp }}/race-ai-future-ui-tools/node_modules
          CHROMIUM_PATH: ${{ steps.future_source_browser.outputs.chromium_path }}
        shell: bash
        run: |
          umask 077
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'official-future-source-capture'
          proof=root.with_name(root.name+'.status.json')
          scope=os.environ['FUTURE_SOURCE_SCOPE']
          schemas={'autorace-keirin':'RACE_AI_OFFICIAL_FUTURE_SOURCE_CAPTURE_COUNTS_V1','horse':'RACE_AI_JRA_FUTURE_SOURCE_CAPTURE_COUNTS_V1',
              'official-result':'RACE_AI_ALL_NATIVE_FUTURE_RESULT_CAPTURE_COUNTS_V1'}
          pending=dict(schema=schemas[scope],ready=False,
              state='HOLD_SOURCE_OUTCOME_NOT_YET_VERIFIED',source_requests=None,source_request_upper_bound=32,
              old_source_requests_actual=None,old_source_requests_upper_bound=32,old_browser_outcome='UNKNOWN',
              plaintext_published=False,actual_purchases=False,production_promoted=False,
              independent_pre_cutoff_receipt_verified=False)
          if scope=='official-result':pending.update(independent_result_artifact_receipt_verified=False,
              all_requested_cases_confirmed=False,monetary_evaluation_available=False,
              evaluation_scope='ORDER_ONLY_NO_MONETARY_EVALUATION')
          fd=os.open(proof,os.O_WRONLY|os.O_CREAT|os.O_EXCL|getattr(os,'O_NOFOLLOW',0),0o600)
          with os.fdopen(fd,'w') as stream:json.dump(pending,stream,sort_keys=True)
          import race_ai
          race_ai.__path__.extend(str(Path(p).resolve()) for p in ('pr64-reference/race_ai','pr72-reference/race_ai'))
          if scope=='autorace-keirin':
              from scripts.all_existing_model_future_source_capture import main
          elif scope=='horse':
              os.environ.pop('NODE_PATH',None);os.environ.pop('CHROMIUM_PATH',None)
              from scripts.jra_future_source_capture import main
          elif scope=='official-result':
              from scripts.all_existing_model_future_result_capture import main
          else:raise SystemExit('FUTURE_SOURCE_SCOPE_REJECTED')
          raise SystemExit(main(['--input','audit/state/official-future-source-capture-input.json','--out-dir',str(root)]))
          PY
      - name: Save only ready encrypted native input partitions
        id: future_source_native_upload
        if: steps.future_source_capture.outputs.ready == 'true' && steps.future_source_scope.outputs.scope != 'official-result'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.future_source_capture.outputs.artifact_name }}
          path: ${{ runner.temp }}/official-future-source-capture/native/
          retention-days: 7
          if-no-files-found: error
      - name: Save only ready encrypted forward official results
        id: future_source_result_upload
        if: steps.future_source_capture.outputs.ready == 'true' && steps.future_source_scope.outputs.scope == 'official-result'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: all-existing-official-results-${{ github.run_id }}-900030
          path: ${{ runner.temp }}/official-future-source-capture/result/results.enc
          retention-days: 7
          if-no-files-found: error
      - name: Always retain only encrypted source reservation and original evidence
        id: future_source_upload
        if: always() && steps.future_source_route.outputs.requested == 'true' && steps.future_source_scope.outputs.scope != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.future_source_capture.outputs.source_artifact_name || format('{0}-{1}', steps.future_source_scope.outputs.source_artifact_prefix, github.run_id) }}
          path: ${{ runner.temp }}/official-future-source-capture/source/*.enc
          retention-days: 7
          if-no-files-found: ignore
      - name: Verify actual source receipt and every ready native baseline receipt
        id: future_source_readback
        if: always() && steps.future_source_upload.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          FUTURE_SOURCE_SCOPE: ${{ steps.future_source_scope.outputs.scope }}
          NATIVE_INPUT_ARTIFACT_ID: ${{ steps.future_source_native_upload.outputs.artifact-id }}
          RESULT_ARTIFACT_ID: ${{ steps.future_source_result_upload.outputs.artifact-id }}
          SOURCE_CAPTURE_ARTIFACT_ID: ${{ steps.future_source_upload.outputs.artifact-id }}
        shell: bash
        run: |
          umask 077
          python - <<'PY'
          import os, race_ai
          from pathlib import Path
          race_ai.__path__.extend(str(Path(p).resolve()) for p in ('pr64-reference/race_ai','pr72-reference/race_ai'))
          scope=os.environ['FUTURE_SOURCE_SCOPE']
          if scope=='autorace-keirin':
              from scripts.all_existing_model_future_source_capture import main
          elif scope=='horse':
              from scripts.jra_future_source_capture import main
          elif scope=='official-result':
              from scripts.all_existing_model_future_result_capture import main
          else:raise SystemExit('FUTURE_SOURCE_SCOPE_REJECTED')
          args=['--input','audit/state/official-future-source-capture-input.json',
              '--out-dir',str(Path(os.environ['RUNNER_TEMP'])/'official-future-source-capture'),
              '--readback-source',os.environ['SOURCE_CAPTURE_ARTIFACT_ID']]
          if scope=='official-result':
              if os.environ.get('NATIVE_INPUT_ARTIFACT_ID'):raise SystemExit('FUTURE_RESULT_ARTIFACT_KIND_REJECTED')
              if os.environ.get('RESULT_ARTIFACT_ID'):args+=['--readback-result',os.environ['RESULT_ARTIFACT_ID']]
          else:
              if os.environ.get('RESULT_ARTIFACT_ID'):raise SystemExit('FUTURE_SOURCE_ARTIFACT_KIND_REJECTED')
              if os.environ.get('NATIVE_INPUT_ARTIFACT_ID'):args+=['--readback-native',os.environ['NATIVE_INPUT_ARTIFACT_ID']]
          raise SystemExit(main(args))
          PY
      - name: Always retain count-only future source verification status
        id: future_source_proof
        if: always() && steps.future_source_route.outputs.requested == 'true' && steps.future_source_scope.outputs.scope != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.future_source_scope.outputs.source_artifact_prefix }}-proof-${{ github.run_id }}-1
          path: ${{ runner.temp }}/official-future-source-capture.status.json
          retention-days: 7
          if-no-files-found: ignore
  official_all_racer_intake:
    name: Official all-racer bulk intake (owner key or explicit HOLD)
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI' && github.event.pull_request.number == 71 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      encrypted: ${{ steps.capture.outputs.encrypted }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      venue_encrypted: ${{ steps.venue_capture.outputs.encrypted }}
      venue_artifact_id: ${{ steps.venue_upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: '${{ github.event.pull_request.head.sha }}'}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 761247bee0209e37b1af6b8885e92cad3e9260a5, path: pr64-reference}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.19.0', package-manager-cache: false}
      - name: Install pinned private intake dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Restore only encrypted all-racer cache
        id: racer_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/all-racer-encrypted-cache
          key: boat-all-racers-v1-5c1e21cfe5a4dd53ea26eb07aca4905c4c20c3160b4a206ba96e92702eb4b46d
      - name: Verify owner key before single approved official file GET
        id: capture
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: |
          python -m scripts.boat_all_racers capture --out-dir "$RUNNER_TEMP/all-racer-intake" --reuse-dir "$RUNNER_TEMP/all-racer-encrypted-cache"
          python - <<'PY'
          import json, os, pathlib
          report=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'all-racer-intake'/'summary.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('encrypted='+str(report.get('encrypted_checkpoint_created') is True).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('All-racer intake status: '+report['status']+'\n')
              out.write('No plaintext source or database artifact; HOLD is not ingestion success.\n')
          PY
      - name: Reuse pinned history before any bounded bootstrap capture
        id: venue_capture
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          from scripts.boat_venue_history import capture_month
          from scripts.boat_all_racers import _write
          pointer=json.loads(pathlib.Path('audit/state/boat-venue-history-input.json').read_text())
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'venue-history-month'
          if pointer.get('status')=='READY':
              assert pointer.get('schema')=='RACE_AI_BOAT_VENUE_COLLECTION_INPUT_V1' and pointer.get('repository_id')=='1416489937'
              folder.mkdir(mode=0o700)
              report=dict(status='PINNED_HISTORY_READBACK_REQUIRED_NO_PROVIDER_GET',upstream_gets=0,encrypted_checkpoint_created=False)
              _write(folder/'summary.json',json.dumps(report).encode())
          else:
              assert pointer.get('status')=='WAITING_ENCRYPTED_INPUT'
              report=capture_month(folder,month='200501',max_files=5)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('encrypted='+str(report.get('encrypted_checkpoint_created') is True).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Venue history status: '+report['status']+'\n')
              out.write('One bounded month is not all-period completeness.\n')
          PY
      - name: Preserve only encrypted monthly history and count-only status
        id: venue_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-venue-history-200501-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/venue-history-month/history.checkpoint
            ${{ runner.temp }}/venue-history-month/summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare ciphertext-only cache when owner encryption succeeded
        if: steps.capture.outputs.encrypted == 'true' && steps.racer_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/all-racer-encrypted-cache"
          cp "$RUNNER_TEMP/all-racer-intake/racers.checkpoint" "$RUNNER_TEMP/all-racer-encrypted-cache/"
          cp "$RUNNER_TEMP/all-racer-intake/summary.json" "$RUNNER_TEMP/all-racer-encrypted-cache/"
      - name: Save only verified encrypted source snapshot for request reuse
        if: steps.capture.outputs.encrypted == 'true' && steps.racer_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/all-racer-encrypted-cache
          key: boat-all-racers-v1-5c1e21cfe5a4dd53ea26eb07aca4905c4c20c3160b4a206ba96e92702eb4b46d
      - name: Retain encrypted checkpoint and count-only status
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-all-racers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/all-racer-intake/racers.checkpoint
            ${{ runner.temp }}/all-racer-intake/summary.json
          if-no-files-found: error
          retention-days: 7
  official_all_racer_readback:
