name: Forecast audit viewer contract
on:
  pull_request:
    branches:
      - codex/actions-four-sport-e2e
    paths: ['requirements-history.txt', 'race_ai/**', 'scripts/**', 'tests/**', 'workers/**', 'web/**', 'docs/**', 'audit/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      video_context_cipher:
        description: 'Owner-encrypted context envelope; never supply a key, media or plaintext features'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('boat-video-publication-{0}', github.run_id) || format('forecast-audit-{0}-{1}', github.ref, github.event.pull_request.head.sha || github.sha) }}
  cancel-in-progress: false
jobs:
  train_only_tests:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify training isolation and creation-time constraints
        run: python -m unittest discover -s tests -p "test_four_sport*learning.py" -v
      - name: Verify separate training artifact and validation API
        run: python -m unittest discover -s tests -p test_four_sport_train_only.py -v
  pr64_cross_branch_bridge:
    if: github.event_name == 'pull_request'
    name: Pinned PR64 store and PDCA synthetic E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout PR71 exact tested HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout immutable PR64 implementation as integration reference
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - name: Verify PR64 actual store and own pinned result projection
        env:
          PR64_REFERENCE_ROOT: pr64-reference
        run: |
          python tests/pr64_bridge_harness.py
          PYTHONPATH=. python tests/boat_historical_route_harness.py
          python -m unittest tests.test_exhibition_autorun -v
  boat_pdca_state_producer:
    if: github.event_name == 'pull_request'
    name: BOAT invented-data encrypted state producer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cipher_sha256: ${{ steps.produce.outputs.cipher_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Create invented history and immutable pair, then encrypt SQLite
        id: produce
        run: python -m scripts.boat_pdca_handoff_fixture produce --work "$RUNNER_TEMP/boat-producer" --artifact "$RUNNER_TEMP/boat-sealed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-pdca-synthetic-state-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/boat-sealed/state.enc
            ${{ runner.temp }}/boat-sealed/proof.json
            ${{ runner.temp }}/boat-sealed/handoff-proof.json
          retention-days: 3
          if-no-files-found: error
  boat_pdca_state_consumer:
    if: github.event_name == 'pull_request'
    name: BOAT restore on another runner and score result revisions once
    needs: boat_pdca_state_producer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: boat-pdca-synthetic-state-${{ github.run_id }}
          path: ${{ runner.temp }}/boat-incoming
      - name: Restore exact originals, score revisions, reject replay, prepare next pair
        env:
          RACE_AI_EXPECTED_CIPHER_SHA256: ${{ needs.boat_pdca_state_producer.outputs.cipher_sha256 }}
          EXPECTED_PRODUCER_RUN_ID: ${{ github.run_id }}
          EXPECTED_PRODUCER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m scripts.boat_pdca_handoff_fixture consume --work "$RUNNER_TEMP/boat-consumer" --artifact "$RUNNER_TEMP/boat-incoming"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-pdca-synthetic-restore-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/boat-consumer/consumer-proof.json
          retention-days: 3
          if-no-files-found: error
  boat_pdca_owner_recipient:
    name: BOAT owner public recipient (root key stays in Actions)
    if: github.repository == 'haji84/RACE-AI' && github.event.pull_request.number == 71 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Derive only the receiving public key from the configured owner secret
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -m scripts.boat_pdca_transfer receiver --private-dir "$RUNNER_TEMP/boat-owner-recipient"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-owner-recipient-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/boat-owner-recipient/receiver.json
            ${{ runner.temp }}/boat-owner-recipient/status.json
          retention-days: 7
          if-no-files-found: error
  boat_pdca_owner_transfer:
    name: BOAT receive encrypted originals using the existing owner key
    if: github.repository == 'haji84/RACE-AI' && github.event.pull_request.number == 71 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      encrypted: ${{ steps.receive.outputs.encrypted }}
      transfer_sha256: ${{ steps.receive.outputs.transfer_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Decrypt owner-addressed transport, preserve prior state and seal canonical checkpoint
        id: receive
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -m scripts.boat_pdca_transfer receive --input audit/state/boat-pdca-transfer-input.json --previous-input audit/state/boat-pdca-production-input.json --accepted-imports audit/state/boat-pdca-accepted-imports.json --private-dir "$RUNNER_TEMP/boat-owner-state"
      - name: Retain only owner-encrypted canonical state and public counts
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-owner-pdca-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/boat-owner-state/sealed/state.enc
            ${{ runner.temp }}/boat-owner-state/sealed/proof.json
            ${{ runner.temp }}/boat-owner-state/sealed/handoff-proof.json
            ${{ runner.temp }}/boat-owner-state/status.json
          retention-days: 7
          if-no-files-found: error
  boat_pdca_owner_transfer_readback:
    name: BOAT independent runner restores transferred production originals
    needs: boat_pdca_owner_transfer
    if: needs.boat_pdca_owner_transfer.outputs.encrypted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Read the exact producer artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.boat_pdca_owner_transfer.outputs.artifact_id }}
          path: ${{ runner.temp }}/boat-owner-state-incoming
          merge-multiple: true
      - name: Authenticate canonical state, exact originals and idempotent result replay
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          RACE_AI_EXPECTED_TRANSFER_SHA: ${{ needs.boat_pdca_owner_transfer.outputs.transfer_sha256 }}
        run: python -m scripts.boat_pdca_transfer verify --folder "$RUNNER_TEMP/boat-owner-state-incoming/sealed" --private-dir "$RUNNER_TEMP/boat-owner-state-readback" --transfer-sha "$RACE_AI_EXPECTED_TRANSFER_SHA" --input audit/state/boat-pdca-transfer-input.json
      - name: Keep count-only independent readback proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-owner-pdca-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boat-owner-state-readback/status.json
          retention-days: 7
          if-no-files-found: error
  boat_pdca_production_readback:
    name: BOAT production encrypted-state acceptance or explicit HOLD
    permissions:
      contents: read
      actions: read  # Re-read only this repository's actual encrypted artifacts.
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI' && github.event.pull_request.number == 71 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Require owner key before pinned ciphertext GET and private restore
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        run: python -m scripts.boat_pdca_github readback --input audit/state/boat-pdca-production-input.json --private-dir "$RUNNER_TEMP/boat-production-readback"
      - name: Retain count-only acceptance status, never decrypted state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-production-readback-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boat-production-readback/production-readback-status.json
          retention-days: 7
          if-no-files-found: error
      - name: Audit retained completion blockers without provider requests
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          message="$(git log -1 --format=%s)"
          if [[ "$message" == completion-audit:* || "$message" == 'saved-view: audit retained result conflicts without source requests' ]]; then
            python -m scripts.boat_remaining_completion_audit --input audit/state/remaining-completion-audit-input.json
          else
            echo 'Retained completion audit not requested.'
          fi
      - name: Connect frozen venue observations to existing shadow fitter or explicit HOLD
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_SOURCE_REVIEW_KEY: ${{ secrets.RACE_AI_SOURCE_REVIEW_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          policy_args=()
          if [[ -f audit/state/boat-venue-learning-permissions.json ]]; then
            policy_args+=(--permission-policy audit/state/boat-venue-learning-permissions.json)
          fi
          if [[ -f audit/state/boat-venue-learning-owner-research.json ]]; then
            policy_args+=(--owner-research-record audit/state/boat-venue-learning-owner-research.json)
          fi
          if [[ -f audit/state/all-existing-model-derived-owner-research.json ]]; then
            python -m scripts.all_existing_model_learning fit --restored-dir "$RUNNER_TEMP/boat-production-readback" --derive-from-observed --owner-research-record audit/state/all-existing-model-derived-owner-research.json --out-dir "$RUNNER_TEMP/boat-venue-learning"
          elif [[ -f audit/state/all-existing-model-owner-research.json ]]; then
            python -m scripts.all_existing_model_learning fit --restored-dir "$RUNNER_TEMP/boat-production-readback" --out-dir "$RUNNER_TEMP/boat-venue-learning"
          else
            python -m scripts.boat_venue_learning --restored-dir "$RUNNER_TEMP/boat-production-readback" --out-dir "$RUNNER_TEMP/boat-venue-learning" "${policy_args[@]}"
          fi
      - name: Keep owner-encrypted learning candidate and count-only status
        id: model_candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-venue-learning-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/boat-venue-learning/learning.enc
            ${{ runner.temp }}/boat-venue-learning/learning.json
            ${{ runner.temp }}/boat-venue-learning/summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Fit the explicit eight-race native research cohort from authenticated private originals
        id: native_research_fit
        if: hashFiles('audit/state/all-existing-model-native-ci-input.json') != ''
        env:
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$(git log -1 --format=%s)" == native-p1-compare:* ]]; then
            exit 0
          fi
          plan=audit/state/all-existing-model-native-ci-input.json
          if [[ -f audit/state/all-existing-model-full-native-ci-input.json ]]; then
            plan=audit/state/all-existing-model-full-native-ci-input.json
          fi
          python -m scripts.all_existing_model_learning_ci --input "$plan" --restored-dir "$RUNNER_TEMP/boat-production-readback" --out-dir "$RUNNER_TEMP/all-native-learning"
          echo 'fit_executed=true' >> "$GITHUB_OUTPUT"
      - name: Keep the encrypted native research fit and count-only status
        id: native_model_candidate
        if: hashFiles('audit/state/all-existing-model-native-ci-input.json') != '' && steps.native_research_fit.outputs.fit_executed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: all-existing-model-learning-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/all-native-learning/learning.enc
            ${{ runner.temp }}/all-native-learning/learning.json
            ${{ runner.temp }}/all-native-learning/summary.json
          retention-days: 7
          if-no-files-found: error
      - name: Freeze the explicitly requested official native inputs
        id: official_native_freeze
        if: hashFiles('audit/state/manual-official-freeze-input.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        shell: bash
        run: |
          # A one-time request on this commit; this makes no provider requests.
          if [[ "$(git log -1 --format=%s)" == official-native-freeze:* ]]; then
            plan=audit/state/manual-official-freeze-input.json
            if [[ -f audit/state/manual-official-backup-freeze-input.json ]]; then
              plan=audit/state/manual-official-backup-freeze-input.json
            fi
            if [[ -f audit/state/manual-official-future-freeze-input.json ]]; then
              plan=audit/state/manual-official-future-freeze-input.json
            fi
            candidate_artifact="$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); print(p["carrier_artifact"]["id"] if p["schema"]=="RACE_AI_MANUAL_OFFICIAL_NATIVE_FREEZE_INPUT_V3" else sys.argv[2])' "$plan" '${{ steps.native_model_candidate.outputs.artifact-id }}')"
            python -m scripts.all_existing_model_official_freeze --input "$plan" --candidate-artifact "$candidate_artifact" --out-dir "$RUNNER_TEMP/official-native-freeze"
          fi
      - name: Independently save the encrypted official native input capsules
        id: official_native_upload
        if: steps.official_native_freeze.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.official_native_freeze.outputs.artifact_name }}
          path: ${{ runner.temp }}/official-native-freeze/
          retention-days: 7
          if-no-files-found: error
      - name: Re-read the actual official native input artifact before its deadlines
        if: steps.official_native_upload.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        shell: bash
        run: |
          plan=audit/state/manual-official-freeze-input.json
          if [[ -f audit/state/manual-official-backup-freeze-input.json ]]; then
            plan=audit/state/manual-official-backup-freeze-input.json
          fi
          if [[ -f audit/state/manual-official-future-freeze-input.json ]]; then
            plan=audit/state/manual-official-future-freeze-input.json
          fi
          python -m scripts.all_existing_model_official_freeze --input "$plan" --readback-artifact '${{ steps.official_native_upload.outputs.artifact-id }}' --out-dir "$RUNNER_TEMP/official-native-freeze"
      - name: Keep count-only official native receipt proof
        if: steps.official_native_upload.outputs.artifact-id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-native-freeze-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/official-native-freeze.status.json
          retention-days: 7
          if-no-files-found: error
      - name: Freeze the explicitly requested official browser source packet
        id: official_source_packet
        if: hashFiles('audit/state/official-source-packet-freeze-input.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        shell: bash
        run: |
          if [[ "$(git log -1 --format=%s)" == official-source-freeze:* ]]; then
            plan=audit/state/official-source-packet-freeze-input.json
            if [[ -f audit/state/official-source-packet-future-freeze-input.json ]]; then
              plan=audit/state/official-source-packet-future-freeze-input.json
            fi
            candidate_artifact="$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); print(p["carrier_artifact"]["id"] if p["schema"]=="RACE_AI_OFFICIAL_SOURCE_PACKET_FREEZE_INPUT_V2" else sys.argv[2])' "$plan" '${{ steps.native_model_candidate.outputs.artifact-id }}')"
            python -m scripts.all_existing_model_source_packet_freeze --input "$plan" --candidate-artifact "$candidate_artifact" --out-dir "$RUNNER_TEMP/official-source-packet"
          fi
      - name: Independently save encrypted native inputs from the official source packet
        id: official_source_packet_upload
        if: steps.official_source_packet.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.official_source_packet.outputs.artifact_name }}
          path: ${{ runner.temp }}/official-source-packet/
          retention-days: 7
          if-no-files-found: error
      - name: Verify actual saved source packet inputs before their deadlines
        if: steps.official_source_packet_upload.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        shell: bash
        run: |
          plan=audit/state/official-source-packet-freeze-input.json
          if [[ -f audit/state/official-source-packet-future-freeze-input.json ]]; then
            plan=audit/state/official-source-packet-future-freeze-input.json
          fi
          python -m scripts.all_existing_model_source_packet_freeze --input "$plan" --readback-artifact '${{ steps.official_source_packet_upload.outputs.artifact-id }}' --out-dir "$RUNNER_TEMP/official-source-packet"
      - name: Keep count-only official source packet receipt proof
        if: steps.official_source_packet_upload.outputs.artifact-id != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-source-packet-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/official-source-packet.status.json
          retention-days: 7
          if-no-files-found: error
      - name: Compare the explicitly pinned future native cohort
        id: native_future
        if: hashFiles('audit/state/all-existing-model-native-future-input.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
        shell: bash
        run: |
          if [[ "$(git log -1 --format=%s)" == native-p1-compare:* ]]; then
            python -m scripts.all_existing_model_native_future --manifest audit/state/all-existing-model-native-future-input.json --out-dir "$RUNNER_TEMP/all-native-future"
          fi
      - name: Independently save the encrypted native future comparison
        id: native_future_upload
        if: steps.native_future.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.native_future.outputs.artifact_name }}
          path: ${{ runner.temp }}/all-native-future/
          retention-days: 7
          if-no-files-found: error
      - name: Keep the encrypted original-source provenance for the thirty-cell path
