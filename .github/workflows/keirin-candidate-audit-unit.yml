name: KEIRIN result candidate audit contract only
on:
  push:
    branches: [feat/p0-offline-discovery-gate-20261022]
    paths:
      - '.github/workflows/keirin-candidate-audit-unit.yml'
permissions:
  contents: read
jobs:
  research_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify no-leak candidate-versus-top8 contract
        run: python -m unittest discover -s tests -p 'test_keirin_candidate_audit.py' -v
      - name: Verify source candidate and safe one-shot parsing without GET
        run: python -m unittest discover -s tests -p 'test_keirin_mobile_one_shot.py' -v
      - name: Verify result event outbox contract without GET
        run: python -m unittest discover -s tests -p 'test_keirin_result_reactor.py' -v
