name: BOAT nationally authenticated P1 matrix (no racing GET)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/boat-owner-national-p1-matrix.yml
      - scripts/boat_owner_national_p1_matrix.py
      - tests/test_boat_owner_national_p1_matrix.py
      - scripts/boat_exact_all_model_zip_readback.py
      - tests/test_boat_exact_all_model_zip_readback.py
      - scripts/boat_owner_active_snapshot_audit.py
      - tests/test_boat_owner_active_snapshot_audit.py
      - scripts/boat_owner_evidence_audit.py
      - tests/test_boat_failed_checkpoint_audit.py
      - tests/test_boat_native_matrix_intake.py
      - race_ai/all_existing_model_archived_native.py
      - tests/test_all_existing_model_archived_native.py
      - audit/state/boat-m2-independent-audit-target.json
      - scripts/boat_current_pair_eligibility_audit.py
      - tests/test_boat_current_pair_eligibility_audit.py
      - scripts/boat_native_forward_study.py
      - scripts/boat_native_forward_study_audit.py
      - tests/test_boat_native_forward_study.py
      - audit/state/boat-native-forward-study.json
      - audit/state/boat-native-forward-study-witness.json
      - scripts/boat_cutoff_raw_replay_audit.py
      - tests/test_boat_cutoff_raw_replay_audit.py
      - scripts/boat_saved_reason_binding_audit.py
      - tests/test_boat_saved_reason_binding_audit.py
      - tests/test_boat_saved_reason_binding_io.py
      - scripts/boat_saved_rejection_anchor_audit.py
      - tests/test_boat_saved_rejection_anchor_proof.py
      - tests/test_boat_saved_rejection_anchor_io.py
      - scripts/boat_legacy_reason_anchor_guard.py
      - tests/test_boat_legacy_reason_anchor_guard.py
      - scripts/boat_legacy_reason_anchor_entry.py
      - tests/test_boat_legacy_reason_anchor_entry.py
      - tests/test_boat_saved_rejection_anchor_history.py
      - scripts/boat_rejection_anchor_restoration.py
      - tests/test_boat_rejection_anchor_restoration.py
      - scripts/boat_rejection_anchor_repair.py
      - tests/test_boat_rejection_anchor_repair.py
      - tests/test_boat_rejection_anchor_repair_cli.py
      - tests/fixtures/legacy_saved_view_feed_ffb_update.py
      - tests/fixtures/legacy_saved_view_feed_3295_update.py
  push:
    branches: [main]
    paths:
      - .github/workflows/boat-owner-national-p1-matrix.yml
      - scripts/boat_owner_national_p1_matrix.py
      - tests/test_boat_owner_national_p1_matrix.py
      - scripts/boat_exact_all_model_zip_readback.py
      - tests/test_boat_exact_all_model_zip_readback.py
      - scripts/boat_owner_active_snapshot_audit.py
      - tests/test_boat_owner_active_snapshot_audit.py
      - scripts/boat_owner_evidence_audit.py
      - tests/test_boat_failed_checkpoint_audit.py
      - tests/test_boat_native_matrix_intake.py
      - race_ai/all_existing_model_archived_native.py
      - tests/test_all_existing_model_archived_native.py
      - audit/state/boat-m2-independent-audit-target.json
      - scripts/boat_current_pair_eligibility_audit.py
      - tests/test_boat_current_pair_eligibility_audit.py
      - scripts/boat_native_forward_study.py
      - scripts/boat_native_forward_study_audit.py
      - tests/test_boat_native_forward_study.py
      - audit/state/boat-native-forward-study.json
      - audit/state/boat-native-forward-study-witness.json
      - scripts/boat_cutoff_raw_replay_audit.py
      - tests/test_boat_cutoff_raw_replay_audit.py
      - scripts/boat_saved_reason_binding_audit.py
      - tests/test_boat_saved_reason_binding_audit.py
      - tests/test_boat_saved_reason_binding_io.py
      - scripts/boat_saved_rejection_anchor_audit.py
      - tests/test_boat_saved_rejection_anchor_proof.py
      - tests/test_boat_saved_rejection_anchor_io.py
      - scripts/boat_legacy_reason_anchor_guard.py
      - tests/test_boat_legacy_reason_anchor_guard.py
      - scripts/boat_legacy_reason_anchor_entry.py
      - tests/test_boat_legacy_reason_anchor_entry.py
      - tests/test_boat_saved_rejection_anchor_history.py
      - scripts/boat_rejection_anchor_restoration.py
      - tests/test_boat_rejection_anchor_restoration.py
      - scripts/boat_rejection_anchor_repair.py
      - tests/test_boat_rejection_anchor_repair.py
      - tests/test_boat_rejection_anchor_repair_cli.py
      - tests/fixtures/legacy_saved_view_feed_ffb_update.py
      - tests/fixtures/legacy_saved_view_feed_3295_update.py
  workflow_run:
    workflows: ['BOAT nationwide cutoff-ordered A/B research (no Vercel)']
    types: [completed]
    branches: [production/boat-p0-p1-20261111]
permissions:
  contents: read
  actions: read
concurrency:
  group: boat-national-p1-independent-audit
  cancel-in-progress: false

jobs:
  unit:
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1dbb47b68d487fc6def0bd4b10b1423f0a2145f6
          path: owner-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: owner-source/pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: owner-source/pr72-reference
          persist-credentials: false
      - name: Install exact pinned owner reader dependencies for source-free test
        run: python -m pip install --disable-pip-version-check -r owner-source/requirements-history.txt
      - name: Read the exact guard only for invented reason-binding fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 86b029ae5bddd5d4956497d8b32b2c92b8eec521
          path: reason-binding-source
          persist-credentials: false
          sparse-checkout: race_ai/boat_saved_model_view.py
          sparse-checkout-cone-mode: false
      - name: Pure model matrix and forced original ZIP AES source-free contract
        run: python -m unittest tests.test_boat_owner_national_p1_matrix tests.test_boat_exact_all_model_zip_readback tests.test_boat_failed_checkpoint_audit tests.test_boat_native_matrix_intake tests.test_boat_matrix_readback_scope tests.test_boat_owner_active_snapshot_audit tests.test_all_existing_model_archived_native tests.test_boat_current_pair_eligibility_audit tests.test_boat_native_forward_study tests.test_boat_native_pair_raw_evidence tests.test_boat_saved_reason_binding_audit tests.test_boat_saved_reason_binding_io tests.test_boat_saved_rejection_anchor_proof tests.test_boat_saved_rejection_anchor_io tests.test_boat_legacy_reason_anchor_guard tests.test_boat_saved_rejection_anchor_history tests.test_boat_legacy_reason_anchor_entry tests.test_boat_rejection_anchor_restoration tests.test_boat_rejection_anchor_repair tests.test_boat_rejection_anchor_repair_cli -v
      - name: Prove source-owner and private key are only ever read on trusted main events
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/boat-owner-national-p1-matrix.yml').read_text()
          assert "if: github.event_name == 'pull_request'" in text
          live=text.split('\n  authenticated_original_matrix:\n',1)[1]
          assert "github.event_name == 'push'" in live and "github.event_name == 'workflow_run'" in live
          assert "github.event.workflow_run.head_sha == 'eff296f6d54ad4be297d93e32f1ee0d4592ad9e3'" in live
          assert "github.event.workflow_run.event == 'workflow_dispatch'" in live
          assert "github.event.workflow_run.head_branch == 'production/boat-p0-p1-20261111'" in live
          secret_token = '$' + '{{ secrets.RACE_AI_STATE_KEY }}'
          assert 'RACE_AI_STATE_KEY: ' + secret_token in live
          assert "owner_evidence_audit.py" in live and "inspect_run" in live
          assert 'www.boatrace.jp' not in live
          assert 'workflow_dispatch:' not in text.split('permissions:',1)[0]
          assert 'gh workflow run' not in live
          assert 'p1_saved_expected_slots' not in text.split('  unit:',1)[0]
          print('BOAT_NATIONAL_P1_OWNER_SOURCE_FREE_CI_CONTRACT_PASSED')
          PY

      - name: Compile the independent ALL_MODEL AES reader and keep provider source outside
        run: |
          python - <<'PY_CONTRACT'
          import ast,re,textwrap
          from pathlib import Path
          source=Path('.github/workflows/boat-owner-national-p1-matrix.yml').read_text()
          blocks=re.findall(r"^          python - <<'([A-Z_]+)'\n(.*?)^          \1\s*$",source,re.M|re.S)
          assert len(blocks)==11
          for tag,body in blocks:
              compile(textwrap.dedent(body),tag,'exec')
          stage=source.split("python - <<'PY_ALL_MODEL'\n",1)[1].split("\n          PY_ALL_MODEL",1)[0]
          ast.parse(textwrap.dedent(stage),filename='real_independent_all_model_gate')
          assert "audit.reopen_matrix_view(raw,gh,selected_owner=ident" in stage
          assert "audit.matrix_readback_scope(hydrated,readback" in stage
          assert "independent_scope=readback_scope" in stage
          assert "mod.vault_complete(after,counts,native_counts,baseline)" in stage
          assert "RACE_AI_STATE_KEY" in source
          assert "source_originals_modified=False" in stage
          assert "provider_gets=0" in stage
          assert "original_forecasts" not in stage.split("print(json.dumps(out",1)[1]
          assert 'www.boatrace.jp' not in stage
          exact=source.split("python - <<'PY_EXACT'\n",1)[1].split("\n          PY_EXACT",1)[0]
          ast.parse(textwrap.dedent(exact),filename='real_exact_zip_AES_readback')
          assert "audit(get=gh" in exact
          assert 'www.boatrace.jp' not in exact
          archived=source.split("python - <<'PY_ARCHIVED_NATIVE'\n",1)[1].split("\n          PY_ARCHIVED_NATIVE",1)[0]
          assert "mod.safe_summary(pin,root)" in archived
          assert "OWNER_AUDIT_SOURCE_SHA" in archived
          assert "source.parent.parent==main" in archived
          assert 'except Exception as exc:' in archived
          assert 'allowed_errors={' in archived
          assert 'HOLD_ARCHIVED_NATIVE_ORIGINAL_READBACK' in archived
          assert 'report_written=true' in archived
          assert "steps.archived_native_readback.outputs.report_written == 'true'" in source
          assert 'gh workflow run' not in archived and 'www.boatrace.jp' not in archived
          bootstrap=source.split('\n      - name: Count one fixed retained P0 original without changing the core audit\n',1)[1]
          condition=bootstrap.split('\n        working-directory:',1)[0].split('if: >-\n',1)[1]
          condition=' '.join(condition.split())
          assert condition==("always() && github.repository == 'haji84/RACE-AI' && "
              "github.event_name == 'push' && github.ref == 'refs/heads/main' && "
              "startsWith(github.event.head_commit.message, 'boat-owner-release: single-real-session-20261111') && "
              "steps.audit_source.outcome == 'success'")
          assert source.index('\n      - name: Count one fixed retained P0 original')>source.index(
              'name: retained-native-13559236491-aes-counts-')
          assert len(re.findall(r'^        uses: actions/upload-artifact@',source,re.M))==5
          counts=dict(blocks)['PY_BOOTSTRAP_COUNTS']
          ast.parse(textwrap.dedent(counts),filename='fixed_closed_bootstrap_original_counts')
          assert 'mod.audit_fixed_bootstrap_p0(get=gh,repo=root,now=datetime.now(timezone.utc))' in counts
          assert 'except Exception:\n' in textwrap.dedent(counts)
          assert 'str(exc)' not in counts and 'except Exception as' not in counts
          assert not any(word in counts for word in ('write_text(', 'write_bytes(', 'upload-artifact',
              'GITHUB_OUTPUT', 'GITHUB_STEP_SUMMARY', 'www.boatrace.jp', 'workflow run'))
          print('BOAT_ALL_MODEL_READONLY_AUDIT_PATH_COMPILED')
          PY_CONTRACT
      - name: Read fixed A74 only for synthetic saved cutoff replay tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: a74f1e940e7fc0852e63938f8138bdb58bd93163
          path: closed-a74-source
          persist-credentials: false
      - name: Test saved cutoff replay with separate A74 source namespace
        run: python -m unittest tests.test_boat_cutoff_raw_replay_audit -v

  authenticated_original_matrix:
    name: Independently reopen sealed national P0/P1 original matrix
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'production/boat-p0-p1-20261111' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.head_sha == 'eff296f6d54ad4be297d93e32f1ee0d4592ad9e3' ||
         github.event.workflow_run.head_sha == '86b029ae5bddd5d4956497d8b32b2c92b8eec521' ||
         github.event.workflow_run.head_sha == 'f55351dce855177a51330f72c37d6238ba2c9e3e' ||
         github.event.workflow_run.head_sha == 'bb49215034b779ea1493b35dd91e5c3ebfc04032' ||
         github.event.workflow_run.head_sha == 'a74f1e940e7fc0852e63938f8138bdb58bd93163' ||
         github.event.workflow_run.head_sha == 'f1f8ed4ffb2a29e6b702685f49de63918610479d' ||
         github.event.workflow_run.head_sha == 'c979aeb678538d99e277f26726047dccbdc982af' ||
         github.event.workflow_run.head_sha == '995ef00a2ffb98a0161e1875d7d2a33145367b40' ||
         github.event.workflow_run.head_sha == 'fbc743be548bfd123e46cdbfe290515a59e5e0d3' ||
         github.event.workflow_run.head_sha == '1dbb47b68d487fc6def0bd4b10b1423f0a2145f6') &&
        (github.event.workflow_run.conclusion == 'success' ||
         github.event.workflow_run.conclusion == 'failure')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: eff296f6d54ad4be297d93e32f1ee0d4592ad9e3
          path: owner-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: owner-source/pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: owner-source/pr72-reference
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -r owner-source/requirements-history.txt
      - name: Independently authenticate the historical failed owner checkpoint without dispatch
        if: github.event_name == 'push'
        working-directory: owner-source
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_ORIGINAL_VAULT_ENABLED: 'true'
        run: |
          python - <<'PY_CHECKPOINT'
          import importlib.util,json,os,re,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          import race_ai
          root=Path('.').resolve()
          for folder in ('pr64-reference','pr72-reference'):
              package=root/folder/'race_ai'
              assert package.is_dir()
              race_ai.__path__.append(str(package))
          from scripts.boat_private_original_vault import _environment
          from scripts.github_existing_cycle import gh
          path=(Path('..')/'scripts/boat_owner_evidence_audit.py').resolve()
          assert path.is_file() and path.parent.parent==Path('..').resolve()
          spec=importlib.util.spec_from_file_location('historical_failed_checkpoint_audit',path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          try:
              assert subprocess.check_output(['git','rev-parse','HEAD'],timeout=10).decode().strip()==mod.OWNER_SHA
              _environment(root)
              result=mod.inspect_failed_checkpoint(get=gh,run_id=43829249080,
                  now=datetime.now(timezone.utc))
              assert (result['aes_authenticated'] is True and
                      result['public_counters_match_AES'] is True and
                      result['successor_dispatch_allowed'] is False and
                      result['official_source_requests']==0 and result['new_forecasts']==0)
              target=Path(os.environ['RUNNER_TEMP'])/'boat-failed-checkpoint-aes-counts.json'
              assert not target.exists() and not target.is_symlink()
              target.write_text(json.dumps(result,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps(result,sort_keys=True))
          except Exception as exc:
              code=str(exc)
              reason=code if re.fullmatch(r'(?:OWNER_AUDIT|SAFE_SOURCE_CONTROL|PRIVATE_ORIGINAL|ALL_MODEL_RECOVERY|VAULT)_[A-Z0-9_]{1,100}',code) else 'FAILED_CHECKPOINT_AES_NOT_VERIFIED'
              print(json.dumps(dict(status='HOLD_FAILED_CHECKPOINT_AUDIT',reason=reason,
                  official_source_requests=0,new_forecasts=0,successor_dispatch_allowed=False)))
              raise SystemExit(2)
          PY_CHECKPOINT
      - name: Retain only historical checkpoint AES counts
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-failed-checkpoint-aes-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/boat-failed-checkpoint-aes-counts.json
          if-no-files-found: error
          retention-days: 30
      - name: Select exact read-only receipt audit target after historical eff checkpoint
        id: audit_target
        run: |
          python - <<'PY_TARGET'
          import importlib.util,json,os
          from pathlib import Path
          path=Path('scripts/boat_owner_active_snapshot_audit.py').resolve()
          spec=importlib.util.spec_from_file_location('main_readonly_audit_target',path)
          active=importlib.util.module_from_spec(spec);spec.loader.exec_module(active)
          config=Path('audit/state/boat-m2-independent-audit-target.json')
          target=None
          if os.environ['GITHUB_EVENT_NAME']=='push' and config.exists():
              assert config.is_file() and not config.is_symlink() and 0<config.stat().st_size<=4096
              target=json.loads(config.read_bytes())
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())
          selected=active.select_audit_target(os.environ['GITHUB_EVENT_NAME'],event,main_target=target)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('run_id='+str(selected['run_id'])+'\n')
              output.write('expected_owner_sha='+selected['expected_owner_sha']+'\n')
              output.write('closed_round='+str(selected.get('closed_round') or '')+'\n')
          PY_TARGET
      - name: Read exact selected producer package after historical checkpoint
        id: audit_source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.audit_target.outputs.expected_owner_sha }}
          path: owner-source
          # Preserve the two separately pinned parser checkouts; verify their SHAs below.
          clean: false
          persist-credentials: false
      - name: Audit real GitHub sealed originals, no result/provider GET or plaintext exposure
        id: original_audit
        working-directory: owner-source
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_ORIGINAL_VAULT_ENABLED: 'true'
          OWNER_AUDIT_RUN_ID: ${{ steps.audit_target.outputs.run_id }}
          OWNER_AUDIT_SOURCE_SHA: ${{ steps.audit_target.outputs.expected_owner_sha }}
          OWNER_AUDIT_CLOSED_ROUND: ${{ steps.audit_target.outputs.closed_round }}
        run: |
          python - <<'PY'
          import importlib.util,json,os,re,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          import race_ai,scripts
          scripts.__path__=list(scripts.__path__)+[str(Path('..').resolve()/'scripts')]
          owner=os.environ['OWNER_AUDIT_SOURCE_SHA']
          assert owner in ('eff296f6d54ad4be297d93e32f1ee0d4592ad9e3','86b029ae5bddd5d4956497d8b32b2c92b8eec521','f55351dce855177a51330f72c37d6238ba2c9e3e','bb49215034b779ea1493b35dd91e5c3ebfc04032','a74f1e940e7fc0852e63938f8138bdb58bd93163','f1f8ed4ffb2a29e6b702685f49de63918610479d','c979aeb678538d99e277f26726047dccbdc982af','995ef00a2ffb98a0161e1875d7d2a33145367b40','fbc743be548bfd123e46cdbfe290515a59e5e0d3','1dbb47b68d487fc6def0bd4b10b1423f0a2145f6')
          assert subprocess.check_output(['git','rev-parse','HEAD'],timeout=10).decode().strip()==owner
          for folder,pin in (('pr64-reference','761247bee0209e37b1af6b8885e92cad3e9260a5'),
                             ('pr72-reference','7a432e5acc4d3495a0e82bd79726929e2f8085fe')):
              target=Path(folder,'race_ai').resolve()
              assert target.is_dir()
              assert subprocess.check_output(['git','-C',str(target.parent),'rev-parse','HEAD'],timeout=10).decode().strip()==pin
              race_ai.__path__.append(str(target))
          def from_exact_file(name,path):
              source=Path(path).resolve()
              assert source.is_file() and source.parent.parent==Path('..').resolve()
              spec=importlib.util.spec_from_file_location(name,source)
              module=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module
          audit=from_exact_file('boat_owner_evidence_audit_private','../scripts/boat_owner_evidence_audit.py')
          matrix=from_exact_file('boat_owner_national_p1_matrix_private','../scripts/boat_owner_national_p1_matrix.py')
          try:
              ident=int(os.environ['OWNER_AUDIT_RUN_ID'])
              assert ident>0
              selected_round=os.environ.get('OWNER_AUDIT_CLOSED_ROUND','')
              closed_round=int(selected_round) if selected_round else None
              from scripts.boat_private_original_vault import _environment
              from scripts.github_existing_cycle import gh
              repo=Path('.').resolve();_environment(repo)
              active=from_exact_file('boat_active_snapshot_private','../scripts/boat_owner_active_snapshot_audit.py')
              snapshot_clock=datetime.now(timezone.utc)
              reads=active._Reads(gh)
              run=json.loads(reads(f'actions/runs/{ident}'))
              assert run.get('head_sha')==owner
