name: BOAT nationally authenticated P1 matrix (no racing GET)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/boat-owner-national-p1-matrix.yml
      - scripts/boat_owner_national_p1_matrix.py
      - tests/test_boat_owner_national_p1_matrix.py
      - scripts/boat_exact_all_model_zip_readback.py
      - tests/test_boat_exact_all_model_zip_readback.py
      - scripts/boat_owner_active_snapshot_audit.py
      - tests/test_boat_owner_active_snapshot_audit.py
      - scripts/boat_owner_evidence_audit.py
      - tests/test_boat_failed_checkpoint_audit.py
      - tests/test_boat_native_matrix_intake.py
  push:
    branches: [main]
    paths:
      - .github/workflows/boat-owner-national-p1-matrix.yml
      - scripts/boat_owner_national_p1_matrix.py
      - tests/test_boat_owner_national_p1_matrix.py
      - scripts/boat_exact_all_model_zip_readback.py
      - tests/test_boat_exact_all_model_zip_readback.py
      - scripts/boat_owner_active_snapshot_audit.py
      - tests/test_boat_owner_active_snapshot_audit.py
      - scripts/boat_owner_evidence_audit.py
      - tests/test_boat_failed_checkpoint_audit.py
      - tests/test_boat_native_matrix_intake.py
  workflow_run:
    workflows: ['BOAT nationwide cutoff-ordered A/B research (no Vercel)']
    types: [completed]
    branches: [production/boat-p0-p1-20261111]
permissions:
  contents: read
  actions: read
concurrency:
  group: boat-national-p1-independent-audit
  cancel-in-progress: false

jobs:
  unit:
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: eff296f6d54ad4be297d93e32f1ee0d4592ad9e3
          path: owner-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: owner-source/pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: owner-source/pr72-reference
          persist-credentials: false
      - name: Install exact pinned owner reader dependencies for source-free test
        run: python -m pip install --disable-pip-version-check -r owner-source/requirements-history.txt
      - name: Pure model matrix and forced original ZIP AES source-free contract
        run: python -m unittest tests.test_boat_owner_national_p1_matrix tests.test_boat_exact_all_model_zip_readback tests.test_boat_failed_checkpoint_audit tests.test_boat_native_matrix_intake tests.test_boat_matrix_readback_scope tests.test_boat_owner_active_snapshot_audit -v
      - name: Prove source-owner and private key are only ever read on trusted main events
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/boat-owner-national-p1-matrix.yml').read_text()
          assert "if: github.event_name == 'pull_request'" in text
          live=text.split('\n  authenticated_original_matrix:\n',1)[1]
          assert "github.event_name == 'push'" in live and "github.event_name == 'workflow_run'" in live
          assert "github.event.workflow_run.head_sha == 'eff296f6d54ad4be297d93e32f1ee0d4592ad9e3'" in live
          assert "github.event.workflow_run.event == 'workflow_dispatch'" in live
          assert "github.event.workflow_run.head_branch == 'production/boat-p0-p1-20261111'" in live
          secret_token = '$' + '{{ secrets.RACE_AI_STATE_KEY }}'
          assert 'RACE_AI_STATE_KEY: ' + secret_token in live
          assert "owner_evidence_audit.py" in live and "inspect_run" in live
          assert 'www.boatrace.jp' not in live
          assert 'workflow_dispatch:' not in text.split('permissions:',1)[0]
          assert 'gh workflow run' not in live
          assert 'p1_saved_expected_slots' not in text.split('  unit:',1)[0]
          print('BOAT_NATIONAL_P1_OWNER_SOURCE_FREE_CI_CONTRACT_PASSED')
          PY

      - name: Compile the independent ALL_MODEL AES reader and keep provider source outside
        run: |
          python - <<'PY_CONTRACT'
          import ast,textwrap
          from pathlib import Path
          source=Path('.github/workflows/boat-owner-national-p1-matrix.yml').read_text()
          stage=source.split("python - <<'PY_ALL_MODEL'\n",1)[1].split("\n          PY_ALL_MODEL",1)[0]
          ast.parse(textwrap.dedent(stage),filename='real_independent_all_model_gate')
          assert "audit.reopen_matrix_view(raw,gh,selected_owner=ident" in stage
          assert "audit.matrix_readback_scope(hydrated,readback" in stage
          assert "independent_scope=readback_scope" in stage
          assert "mod.vault_complete(after,counts,native_counts,baseline)" in stage
          assert "RACE_AI_STATE_KEY" in source
          assert "source_originals_modified=False" in stage
          assert "provider_gets=0" in stage
          assert "original_forecasts" not in stage.split("print(json.dumps(out",1)[1]
          assert 'www.boatrace.jp' not in stage
          exact=source.split("python - <<'PY_EXACT'\n",1)[1].split("\n          PY_EXACT",1)[0]
          ast.parse(textwrap.dedent(exact),filename='real_exact_zip_AES_readback')
          assert "audit(get=gh" in exact
          assert 'www.boatrace.jp' not in exact
          print('BOAT_ALL_MODEL_READONLY_AUDIT_PATH_COMPILED')
          PY_CONTRACT

  authenticated_original_matrix:
    name: Independently reopen sealed national P0/P1 original matrix
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'production/boat-p0-p1-20261111' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_sha == 'eff296f6d54ad4be297d93e32f1ee0d4592ad9e3' &&
        (github.event.workflow_run.conclusion == 'success' ||
         github.event.workflow_run.conclusion == 'failure')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: eff296f6d54ad4be297d93e32f1ee0d4592ad9e3
          path: owner-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: owner-source/pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: owner-source/pr72-reference
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -r owner-source/requirements-history.txt
      - name: Independently authenticate the historical failed owner checkpoint without dispatch
        if: github.event_name == 'push'
        working-directory: owner-source
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_ORIGINAL_VAULT_ENABLED: 'true'
        run: |
          python - <<'PY_CHECKPOINT'
          import importlib.util,json,os,re,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          import race_ai
          root=Path('.').resolve()
          for folder in ('pr64-reference','pr72-reference'):
              package=root/folder/'race_ai'
              assert package.is_dir()
              race_ai.__path__.append(str(package))
          from scripts.boat_private_original_vault import _environment
          from scripts.github_existing_cycle import gh
          path=(Path('..')/'scripts/boat_owner_evidence_audit.py').resolve()
          assert path.is_file() and path.parent.parent==Path('..').resolve()
          spec=importlib.util.spec_from_file_location('historical_failed_checkpoint_audit',path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          try:
              assert subprocess.check_output(['git','rev-parse','HEAD'],timeout=10).decode().strip()==mod.OWNER_SHA
              _environment(root)
              result=mod.inspect_failed_checkpoint(get=gh,run_id=43829249080,
                  now=datetime.now(timezone.utc))
              assert (result['aes_authenticated'] is True and
                      result['public_counters_match_AES'] is True and
                      result['successor_dispatch_allowed'] is False and
                      result['official_source_requests']==0 and result['new_forecasts']==0)
              target=Path(os.environ['RUNNER_TEMP'])/'boat-failed-checkpoint-aes-counts.json'
              assert not target.exists() and not target.is_symlink()
              target.write_text(json.dumps(result,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps(result,sort_keys=True))
          except Exception as exc:
              code=str(exc)
              reason=code if re.fullmatch(r'(?:OWNER_AUDIT|SAFE_SOURCE_CONTROL|PRIVATE_ORIGINAL|ALL_MODEL_RECOVERY|VAULT)_[A-Z0-9_]{1,100}',code) else 'FAILED_CHECKPOINT_AES_NOT_VERIFIED'
              print(json.dumps(dict(status='HOLD_FAILED_CHECKPOINT_AUDIT',reason=reason,
                  official_source_requests=0,new_forecasts=0,successor_dispatch_allowed=False)))
              raise SystemExit(2)
          PY_CHECKPOINT
      - name: Retain only historical checkpoint AES counts
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-failed-checkpoint-aes-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/boat-failed-checkpoint-aes-counts.json
          if-no-files-found: error
          retention-days: 30
      - name: Audit real GitHub sealed originals, no result/provider GET or plaintext exposure
        id: original_audit
        working-directory: owner-source
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_ORIGINAL_VAULT_ENABLED: 'true'
          # A trusted main push audits only saved completed-round receipts of this exact owner.
          # Genuine completion events continue to select their own actual run.
          OWNER_AUDIT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '44019591352' }}
        run: |
          python - <<'PY'
          import importlib.util,json,os,re,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          import race_ai,scripts
          scripts.__path__=list(scripts.__path__)+[str(Path('..').resolve()/'scripts')]
          owner='eff296f6d54ad4be297d93e32f1ee0d4592ad9e3'
          assert subprocess.check_output(['git','rev-parse','HEAD'],timeout=10).decode().strip()==owner
          for folder in ('pr64-reference','pr72-reference'):
              target=Path(folder,'race_ai').resolve()
              assert target.is_dir()
              race_ai.__path__.append(str(target))
          def from_exact_file(name,path):
              source=Path(path).resolve()
              assert source.is_file() and source.parent.parent==Path('..').resolve()
              spec=importlib.util.spec_from_file_location(name,source)
              module=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module
          audit=from_exact_file('boat_owner_evidence_audit_private','../scripts/boat_owner_evidence_audit.py')
          matrix=from_exact_file('boat_owner_national_p1_matrix_private','../scripts/boat_owner_national_p1_matrix.py')
          try:
              ident=int(os.environ['OWNER_AUDIT_RUN_ID'])
              assert ident>0
              from scripts.boat_private_original_vault import _environment
              from scripts.github_existing_cycle import gh
              repo=Path('.').resolve();_environment(repo)
              run=json.loads(gh(f'actions/runs/{ident}'))
              active_snapshot=os.environ['GITHUB_EVENT_NAME']=='push' and run.get('status')=='in_progress'
              if active_snapshot:
                  active=from_exact_file('boat_active_snapshot_private','../scripts/boat_owner_active_snapshot_audit.py')
                  report=active.audit_active_snapshot(repo,ident,now=datetime.now(timezone.utc),get=gh)
                  assert (report['official_source_requests']==0 and report['full_day_coverage'] is False and
                          report['successor_dispatch_allowed'] is False and report['latest_live_counters_audited'] is False)
                  for name in ('boat-all-model-vault-counts.json','boat-exact-zip-aes-model-proof.json'):
                      target=Path(os.environ['RUNNER_TEMP'])/name
                      assert not target.exists() and not target.is_symlink()
                      target.write_text(json.dumps(report,sort_keys=True)+'\n',encoding='utf-8')
              else:
                  result=audit.inspect_run(repo,ident,now=datetime.now(timezone.utc))
                  from race_ai.existing_model_coverage import active_catalog
                  expected=[r['model_id'] for r in active_catalog() if 'boat' in r['applicable_sports']]
                  report=matrix.calculate(result,expected,independent_original_reader=True,allow_pending_audit=True)
                  assert report['racing_provider_gets']==0 and report['original_forecasts_unchanged']
              with open(os.environ['GITHUB_OUTPUT'],'a') as output:
                  output.write('active_snapshot='+('true' if active_snapshot else 'false')+'\n')
              safe=Path(os.environ['RUNNER_TEMP'])/'boat-national-p1-counts.json'
              assert not safe.exists() and not safe.is_symlink()
              safe.write_text(json.dumps(report,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps(report,sort_keys=True))
          except Exception as exc:
              code=str(exc)
              reason=(code if type(code) is str and re.fullmatch(
                  r'(?:OWNER_ACTIVE_AUDIT|OWNER_AUDIT|BOAT_EXACT_ZIP_READBACK|VAULT|BOAT_OWNER_NATIONAL_P1_MATRIX)_[A-Z0-9_]{1,100}',code)
                  else 'AUTHENTICATED_ORIGINALS_NOT_YET_AUDITABLE')
              print(json.dumps(dict(status='HOLD_NATIONAL_P1_INDEPENDENT_AUDIT',
                  reason=reason,owner_run_id=os.environ['OWNER_AUDIT_RUN_ID'],
                  race_provider_gets=0,source_originals_modified=False,
                  **(active.failure_diagnostic(exc) if 'active' in locals() else {}))))
              raise SystemExit(2)
          PY
      - name: Reopen ALL_MODEL GitHub originals on independent runner and measure true model slots
        if: success() && steps.original_audit.outputs.active_snapshot != 'true'
        working-directory: owner-source
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_ORIGINAL_VAULT_ENABLED: 'true'
          OWNER_AUDIT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '44019591352' }}
        run: |
          python - <<'PY_ALL_MODEL'
          import importlib.util,json,os,re
          from datetime import datetime,timezone
          from pathlib import Path
          import race_ai
          for folder in ('pr64-reference','pr72-reference'):
              package=Path(folder,'race_ai').resolve()
              assert package.is_dir()
              race_ai.__path__.append(str(package))
          from scripts.boat_private_original_vault import _environment
          from scripts.github_existing_cycle import gh
          from race_ai.racer_result_bridge import SavedResultBridge
          from race_ai import saved_view_feed as F
          from race_ai.existing_model_coverage import active_catalog
          root=Path('.').resolve()
          main=Path('..').resolve()
          script=main/'scripts/boat_owner_national_p1_matrix.py'
          spec=importlib.util.spec_from_file_location('boat_saved_model_matrix_sourcefree',script)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          audit_spec=importlib.util.spec_from_file_location('boat_native_matrix_original_reader',
              main/'scripts/boat_owner_evidence_audit.py')
          audit=importlib.util.module_from_spec(audit_spec);audit_spec.loader.exec_module(audit)
          try:
              baseline=json.loads((Path(os.environ['RUNNER_TEMP'])/'boat-national-p1-counts.json').read_text())
              ident=int(os.environ['OWNER_AUDIT_RUN_ID'])
              assert baseline['owner_run_id']==ident and baseline['owner_original_reader_independently_verified'] is True
              day=baseline['day_jst'];scheduled=baseline['retained_schedule_races']
              repo=_environment(root)
              current=SavedResultBridge(repo,now=datetime.now(timezone.utc))
              raw=F.current_view(current.git,current.bootstrap,day=day)[3]
              models=[x['model_id'] for x in active_catalog() if 'boat' in x['applicable_sports']]
              native_context={}
              original_report=audit.inspect_run(root,ident,now=datetime.now(timezone.utc),
                  private_native=native_context)
              assert mod.calculate(original_report,models,independent_original_reader=True,
                  allow_pending_audit=True)==baseline
              official=native_context.get('official_schedule')
              before=mod.saved_view_coverage(raw,day=day,model_ids=models,
                         scheduled_races=scheduled,now=datetime.now(timezone.utc),official_schedule=official)
              replayed,counts,readback=audit.reopen_matrix_view(raw,gh,selected_owner=ident,
                  day=day,now=datetime.now(timezone.utc))
              native_context=dict(native_context,p1_originals=readback['native_originals'])
              hydrated,native_counts=audit.hydrate_native_matrix_view(replayed,native_context,
                  now=datetime.now(timezone.utc))
              readback_scope=audit.matrix_readback_scope(hydrated,readback,now=datetime.now(timezone.utc))
              after=mod.saved_view_coverage(hydrated,day=day,model_ids=models,
                         scheduled_races=scheduled,now=datetime.now(timezone.utc),official_schedule=official,
                         independent_scope=readback_scope)
              assert (counts['originals_unchanged'] is True and
                      counts['official_source_requests']==0 and
                      after['p1_qualified_unique_slots']>=before['p1_qualified_unique_slots'])
              complete=mod.vault_complete(after,counts,native_counts,baseline)
              out=dict(schema='BOAT_INDEPENDENT_ALL_MODEL_VAULT_P1_AUDIT_V1',
                       status='ALL_MODEL_P1_VAULT_COMPLETE' if complete else 'HOLD_ALL_MODEL_P1_COVERAGE',
                       day_jst=day,owner_run_id=ident,
                       original_p1_only_slots=baseline['p1_saved_expected_slots'],
                       aes_view_before=before,aes_view_after=after,
                       native_original_hydration=native_counts,
                       observed_source_control=baseline['observed_source_control'],
                       artifact_rounds_verified=counts['archives_verified'],
                       physical_models_generated=counts['generated_forecasts_reported'],
                       restored_p1_model_rows=counts['appended_p1_forecasts'],
                       deferred_artifacts=counts['deferred_artifacts'],
                       unrepresented_scoped_forecasts=counts['unrepresented_scoped_forecasts'],
                       independent_readback=after['independently_authenticated_source_zip_claim'],
                       readback_scope=after['independent_scope'],
                       all_model_p1_present=complete,real_video_identity_verified=False,
                       website_e2e_verified=False,
                       provider_gets=0,source_originals_modified=False)
              safe=Path(os.environ['RUNNER_TEMP'])/'boat-all-model-vault-counts.json'
              assert not safe.exists() and not safe.is_symlink()
              safe.write_text(json.dumps(out,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps(out,sort_keys=True))
          except Exception as exc:
              reason=str(exc)
              if not (type(reason) is str and re.fullmatch(
                  r'(?:ALL_MODEL_RECOVERY|ALL_MODEL_FORECAST|BOAT_OWNER_NATIONAL_P1_MATRIX|VAULT|FEED)_[A-Z0-9_]{1,100}',reason)):
                  reason='INDEPENDENT_ALL_MODEL_REPLAY_NOT_AVAILABLE'
              print(json.dumps(dict(status='HOLD_ALL_MODEL_VAULT_READBACK',
                                    reason=reason,provider_gets=0,
                                    production_forecasts_modified=False)))
              raise SystemExit(2)
          PY_ALL_MODEL
      - name: Independently reopen every original ALL_MODEL GitHub ZIP, AES and deadline
        if: success() && steps.original_audit.outputs.active_snapshot != 'true'
        working-directory: owner-source
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_ORIGINAL_VAULT_ENABLED: 'true'
          OWNER_AUDIT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '44019591352' }}
        run: |
          python - <<'PY_EXACT'
          import importlib.util,json,os,re,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          import race_ai
          for folder in ('pr64-reference','pr72-reference'):
              ref=Path(folder,'race_ai').resolve()
              assert ref.is_dir()
              race_ai.__path__.append(str(ref))
          from scripts.boat_private_original_vault import _environment
          from scripts.github_existing_cycle import gh
          from race_ai.racer_result_bridge import SavedResultBridge
          from race_ai import saved_view_feed as F
          from race_ai.existing_model_coverage import active_catalog
          root=Path('.').resolve()
          assert subprocess.check_output(['git','rev-parse','HEAD'],timeout=10).decode().strip()=='eff296f6d54ad4be297d93e32f1ee0d4592ad9e3'
          path=(Path('..')/'scripts/boat_exact_all_model_zip_readback.py').resolve()
          assert path.is_file() and path.parent.parent==Path('..').resolve()
          spec=importlib.util.spec_from_file_location('boat_exact_all_model_zip_readback_private',path)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          try:
              baseline=json.loads((Path(os.environ['RUNNER_TEMP'])/'boat-national-p1-counts.json').read_text())
              ident=int(os.environ['OWNER_AUDIT_RUN_ID'])
              assert baseline['owner_run_id']==ident and baseline['owner_original_reader_independently_verified'] is True
              day=baseline['day_jst']
              repo=_environment(root)
              bridge=SavedResultBridge(repo,now=datetime.now(timezone.utc))
              saved=F.current_view(bridge.git,bridge.bootstrap,day=day)[3]
              models=[r['model_id'] for r in active_catalog() if 'boat' in r['applicable_sports']]
              result=mod.audit(get=gh,repo=repo,run_id=ident,day=day,
                  expected_models=models,original_view=saved,now=datetime.now(timezone.utc),
                  maximum_artifacts=64)
              assert (result['actual_listed_archives']>0 and
                      result['github_zip_sha256_independently_verified']==result['actual_listed_archives'] and
                      result['aes_originals_independently_decrypted']==result['actual_listed_archives'] and
                      result['previously_archived_coverages_skipped_without_zip_read']==0 and
                      result['racing_provider_gets']==0 and
                      result['production_predictions_modified'] is False)
              target=Path(os.environ['RUNNER_TEMP'])/'boat-exact-zip-aes-model-proof.json'
              assert not target.exists() and not target.is_symlink()
              target.write_text(json.dumps(result,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps(result,sort_keys=True))
          except Exception as exc:
              code=str(exc)
              reason=code if type(code) is str and re.fullmatch(
                  r'(?:BOAT_EXACT_ZIP_READBACK|ALL_MODEL_RECOVERY|ALL_MODEL_FORECAST|VAULT|FEED)_[A-Z0-9_]{1,100}',code) else 'EXACT_ZIP_AES_REPLAY_NOT_VERIFIED'
              print(json.dumps(dict(status='HOLD_EXACT_ALL_MODEL_ORIGINAL_READBACK',
                  reason=reason,provider_gets=0,production_forecasts_modified=False)))
              raise SystemExit(2)
          PY_EXACT
      - name: Retain verified exact ALL_MODEL ZIP count proof only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-all-model-exact-zip-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/boat-exact-zip-aes-model-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain only count-only ALL_MODEL vault audit, no decrypted forecasts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-all-model-vault-p1-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/boat-all-model-vault-counts.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain only aggregate model counts, never original races or media
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-national-p1-model-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/boat-national-p1-counts.json
          if-no-files-found: error
          retention-days: 30
