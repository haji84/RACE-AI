name: BOAT nationally authenticated P1 matrix (no racing GET)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/boat-owner-national-p1-matrix.yml
      - scripts/boat_owner_national_p1_matrix.py
      - tests/test_boat_owner_national_p1_matrix.py
  push:
    branches: [main]
    paths:
      - .github/workflows/boat-owner-national-p1-matrix.yml
  workflow_run:
    workflows: ['BOAT nationwide cutoff-ordered A/B research (no Vercel)']
    types: [completed]
    branches: [production/boat-p0-p1-20261111]
permissions:
  contents: read
  actions: read
concurrency:
  group: boat-national-p1-independent-audit
  cancel-in-progress: false

jobs:
  offline_contract:
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Pure model matrix rejects synthetic and partial claims
        run: python -m unittest tests.test_boat_owner_national_p1_matrix -v
      - name: Prove source-owner and private key are only ever read on trusted main events
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/boat-owner-national-p1-matrix.yml').read_text()
          assert "if: github.event_name == 'pull_request'" in text
          live=text.split('\n  authenticated_original_matrix:\n',1)[1]
          assert "github.event_name == 'push'" in live and "github.event_name == 'workflow_run'" in live
          assert "github.event.workflow_run.head_sha == '5d1dabff0ab9bb83132cd7fbdd43f49fb4eef6c4'" in live
          assert "github.event.workflow_run.event == 'workflow_dispatch'" in live
          assert "github.event.workflow_run.head_branch == 'production/boat-p0-p1-20261111'" in live
          secret_token = '$' + '{{ secrets.RACE_AI_STATE_KEY }}'
          assert 'RACE_AI_STATE_KEY: ' + secret_token in live
          assert "owner_evidence_audit.py" in live and "inspect_run" in live
          assert 'www.boatrace.jp' not in live
          assert 'workflow_dispatch:' not in text.split('permissions:',1)[0]
          assert 'gh workflow run' not in text
          assert 'p1_saved_expected_slots' not in text.split('  offline_contract:',1)[0]
          print('BOAT_NATIONAL_P1_OWNER_SOURCE_FREE_CI_CONTRACT_PASSED')
          PY

  authenticated_original_matrix:
    name: Independently reopen sealed national P0/P1 original matrix
    if: >-
      github.repository == 'haji84/RACE-AI' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'production/boat-p0-p1-20261111' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_sha == '5d1dabff0ab9bb83132cd7fbdd43f49fb4eef6c4' &&
        (github.event.workflow_run.conclusion == 'success' ||
         github.event.workflow_run.conclusion == 'failure')))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5d1dabff0ab9bb83132cd7fbdd43f49fb4eef6c4
          path: owner-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: owner-source/pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: owner-source/pr72-reference
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -r owner-source/requirements-history.txt
      - name: Audit real GitHub sealed originals, no result/provider GET or plaintext exposure
        working-directory: owner-source
        env:
          GH_TOKEN: ${{ github.token }}
          RACE_AI_STATE_KEY: ${{ secrets.RACE_AI_STATE_KEY }}
          RACE_AI_ORIGINAL_VAULT_ENABLED: 'true'
          OWNER_AUDIT_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '43661420983' }}
        run: |
          python - <<'PY'
          import importlib.util,json,os,re,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          import race_ai
          owner='5d1dabff0ab9bb83132cd7fbdd43f49fb4eef6c4'
          assert subprocess.check_output(['git','rev-parse','HEAD'],timeout=10).decode().strip()==owner
          for folder in ('pr64-reference','pr72-reference'):
              target=Path(folder,'race_ai').resolve()
              assert target.is_dir()
              race_ai.__path__.append(str(target))
          def from_exact_file(name,path):
              source=Path(path).resolve()
              assert source.is_file() and source.parent.parent==Path('..').resolve()
              spec=importlib.util.spec_from_file_location(name,source)
              module=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module
          audit=from_exact_file('boat_owner_evidence_audit_private','../scripts/boat_owner_evidence_audit.py')
          matrix=from_exact_file('boat_owner_national_p1_matrix_private','../scripts/boat_owner_national_p1_matrix.py')
          try:
              ident=int(os.environ['OWNER_AUDIT_RUN_ID'])
              assert ident>0
              result=audit.inspect_run(Path('.').resolve(),ident,now=datetime.now(timezone.utc))
              from race_ai.existing_model_coverage import active_catalog
              expected=[r['model_id'] for r in active_catalog()
                        if 'boat' in r['applicable_sports']]
              report=matrix.calculate(result,expected,independent_original_reader=True)
              assert report['racing_provider_gets']==0 and report['original_forecasts_unchanged']
              safe=Path(os.environ['RUNNER_TEMP'])/'boat-national-p1-counts.json'
              assert not safe.exists() and not safe.is_symlink()
              safe.write_text(json.dumps(report,sort_keys=True)+'\n',encoding='utf-8')
              print(json.dumps(report,sort_keys=True))
          except Exception as exc:
              code=str(exc)
              reason=(code if type(code) is str and re.fullmatch(
                  r'(?:OWNER_AUDIT|VAULT|BOAT_OWNER_NATIONAL_P1_MATRIX)_[A-Z0-9_]{1,100}',code)
                  else 'AUTHENTICATED_ORIGINALS_NOT_YET_AUDITABLE')
              print(json.dumps(dict(status='HOLD_NATIONAL_P1_INDEPENDENT_AUDIT',
                  reason=reason,owner_run_id=os.environ['OWNER_AUDIT_RUN_ID'],
                  race_provider_gets=0,source_originals_modified=False)))
              raise SystemExit(2)
          PY
      - name: Retain only aggregate model counts, never original races or media
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-national-p1-model-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/boat-national-p1-counts.json
          if-no-files-found: error
          retention-days: 30
