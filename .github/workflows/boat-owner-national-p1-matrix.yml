                                  assert reason==expected_reason
                      else:
                          assert reason is None and all(type(value) is int and 0<=value<=56 for value in counts)
                      if counts[0] is not None:
                          assert counts[0]<=28 and sum(counts[1:])==2*counts[0]
                          assert counts[1]<=counts[0] and counts[2]<=counts[0]
                      if inspected['status']=='NO_MISMATCH_TARGETS':
                          assert counts==(0,0,0,0,0,0)
                      if inspected['status']=='SAVED_CLOCKS_MATCH_INSPECTED_GRIDS':
                          assert counts[0]>0 and counts[1]==counts[2]==counts[0] and counts[3:]==(0,0,0)
                      grid=dict(inspected)
              except (Exception,SystemExit):
                  pass
          print(json.dumps(grid,sort_keys=True,allow_nan=False),flush=True)
          PY_CLOSED_OWNER_COUNTS
