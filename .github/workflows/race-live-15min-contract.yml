name: RACE 15min prospective proof gate (synthetic contract only)

on:
  push:
    branches: [feat/live-15min-forecast-result-proof-20261111]
    paths:
      - race_ai/live_15min_proof.py
      - tests/test_live_15min_proof.py
      - .github/workflows/race-live-15min-contract.yml
  pull_request:
    paths:
      - race_ai/live_15min_proof.py
      - tests/test_live_15min_proof.py
      - .github/workflows/race-live-15min-contract.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify bounded real-race clock rules without any provider access
        run: |
          python -m py_compile race_ai/live_15min_proof.py tests/test_live_15min_proof.py
          python -m unittest -v tests.test_live_15min_proof
      - name: Never mislabel this as a live prediction proof
        run: |
          echo "Test-only: no live models, no licensed sources, no frozen original, no official settlement." >> "$GITHUB_STEP_SUMMARY"
