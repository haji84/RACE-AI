name: BOAT saved prediction visibility regression (test only)
on:
  push:
    branches: [fix/boat-saved-forecasts-visibility-20261110]
permissions:
  contents: read
jobs:
  saved-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Use installed Chromium
        shell: bash
        run: echo "CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Validate frontend JavaScript
        run: |
          node --check web/app.js
          node --check web/saved-view-crypto.js
      - name: Verify saved link, original forecasts, rollover, and V5 history
        run: |
          node tests/saved_pages_browser.test.js
          node tests/saved_view_history_browser.test.js
