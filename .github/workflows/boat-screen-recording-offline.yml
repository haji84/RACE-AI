# PR-only screen recorder contract. NO permission to call the official provider.
# No live owner job, keys, recording artifacts, website navigation or publication.
name: BOAT private screen recording offline regression
on:
  pull_request:
    branches: [production/boat-p0-p1-20261111]
    paths:
      - .github/workflows/boat-screen-recording-offline.yml
      - race_ai/boat_screen_record_research.py
      - race_ai/boat_screen_model_bridge.py
      - tests/test_boat_screen_model_bridge.py
      - tests/test_boat_short_field_video.py
      - tests/test_boat_video_tracking.py
      - tests/test_boat_video_sequential_context.py
      - tests/test_boat_video_physical_context.py
      - tests/test_boat_video_model_context.py
      - tests/test_boat_video_evaluation.py
      - race_ai/boat_video_evaluation.py
      - race_ai/boat_video_model_context.py
      - race_ai/boat_video_tracking.py
      - race_ai/boat_video_sequential_context.py
      - race_ai/boat_video_physical_context.py
      - tests/test_boat_screen_record_research.py
permissions:
  contents: read
jobs:
  offline_browser:
    name: Real Chromium local fixture / encrypted display-only clip
    if: github.event_name == 'pull_request' && github.repository == 'haji84/RACE-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Retain only tracked public source for offline reproduction
        run: |
          mkdir -p "$RUNNER_TEMP/boat-research-source"
          git archive --format=tar.gz HEAD race_ai scripts tests .github > "$RUNNER_TEMP/boat-research-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/boat-research-source/source-commit.txt"
          sha256sum "$RUNNER_TEMP/boat-research-source/source.tar.gz" > "$RUNNER_TEMP/boat-research-source/source-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boat-research-source-${{ github.run_id }}
          path: ${{ runner.temp }}/boat-research-source/
          retention-days: 1
          if-no-files-found: error
      - name: Install research-only browser and crypto without source credentials
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 cryptography==46.0.3 numpy==1.26.4 opencv-python-headless==4.10.0.84
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
      - name: Exercise actual Chromium screen recorder on local HTML5 fixture only
        env:
          RACE_AI_RESEARCH_FIXTURE_ONLY: 'true'
        run: |
          python -m unittest tests.test_boat_screen_record_research tests.test_boat_screen_model_bridge tests.test_boat_short_field_video tests.test_boat_video_tracking tests.test_boat_video_sequential_context tests.test_boat_video_physical_context tests.test_boat_video_model_context tests.test_boat_video_evaluation -v
          python -m unittest tests.test_boat_video_rights_admission tests.test_boat_20261113_retained_counts -v
