      - 'tests/test_keirin_frozen_forecast_view.py'
      - 'tests/test_keirin_official_fetch_diagnostics.py'
      - 'tests/test_keirin_note_result_reader.py'
      - 'tests/keirin_note_*.test.cjs'
      - 'tests/keirin_rider_history*.cjs'
  pull_request:
    paths:
      - '.github/workflows/keirin-result-live.yml'
      - '.github/workflows/keirin-nationwide-ab-auto.yml'
      - 'scripts/keirin_dt_r1_owner_restore.py'
      - 'scripts/keirin_dt_r1_official_holdout.py'
      - 'tests/test_keirin_dt_r1_owner_restore.py'
      - 'scripts/keirin_dt_r1_future_*.py'
      - 'tests/test_keirin_dt_r1_future_*.py'
      - 'race_ai/keirin_result_*.py'
      - 'race_ai/keirin_saved_source_comparison.py'
      - 'race_ai/keirin_frozen_forecast_view.py'
      - 'race_ai/keirin_confidence.py'
      - 'race_ai/keirin_authored_confidence.py'
      - 'scripts/keirin_note_create_forecasts.py'
      - 'web/confidence.js'
      - 'tests/test_keirin_confidence.py'
      - 'tests/test_keirin_confidence_storage.py'
      - 'tests/test_keirin_authored_confidence.py'
      - 'race_ai/keirin_official_source_continuation.py'
      - 'race_ai/keirin_official_nationwide_*.py'
      - 'race_ai/keirin_official_rider_history.py'
      - 'race_ai/keirin_dossier_ability.py'
      - 'race_ai/keirin_dossier_conditions.py'
      - 'race_ai/keirin_dossier_race_context.py'
      - 'scripts/keirin_publish_dossier_conditions.py'
      - 'tests/test_keirin_publish_dossier_conditions.py'
      - 'scripts/keirin_publish_rider_context.py'
      - 'tests/test_keirin_dossier_ability.py'
      - 'tests/test_keirin_dossier_race_context.py'
      - 'tests/test_keirin_publish_rider_context.py'
      - 'race_ai/keirin_public_forecasts.py'
      - 'scripts/keirin_daily_rider_update.py'
      - 'tests/test_keirin_daily_rider_update.py'
      - 'tests/test_keirin_official_rider_history.py'
      - 'race_ai/keirin_official_class_evidence.py'
      - 'tests/test_keirin_official_class_evidence.py'
      - 'race_ai/keirin_nationwide_forecast_view.py'
      - 'scripts/keirin_official_nationwide_continuation.py'
      - 'scripts/keirin_result_watch.py'
      - 'scripts/keirin_official_measured_outcomes.py'
      - 'scripts/keirin_publish_shortlist_confidence.py'
      - 'race_ai/keirin_public_confidence.py'
      - 'race_ai/keirin_calibrated_selection.py'
      - 'race_ai/keirin_official_combined_study.py'
      - 'tests/test_keirin_official_combined_study.py'
      - 'race_ai/keirin_official_learned_replay.py'
      - 'race_ai/keirin_learned_official_inputs.py'
      - 'tests/test_keirin_official_learned_replay.py'
      - 'tests/test_keirin_learned_official_inputs.py'
      - 'race_ai/keirin_measurement_publication.py'
      - 'race_ai/keirin_paired_measurement.py'
      - 'tests/test_keirin_measurement_publication.py'
      - 'tests/test_keirin_official_condition*.py'
      - 'tests/test_keirin_official_paired_measurement.py'
      - 'scripts/keirin_official_day_pipeline.py'
      - 'scripts/keirin_official_form_canary.py'
      - 'race_ai/keirin_official_form_history.py'
      - 'race_ai/keirin_note_feed.py'
      - 'web/keirin-note-*.js'
      - 'web/keirin-rider-history.js'
      - 'web/app.js'
      - 'tests/test_keirin_result_*.py'
      - 'tests/test_keirin_saved_source_comparison.py'
      - 'tests/test_keirin_frozen_forecast_view.py'
      - 'tests/test_keirin_official_fetch_diagnostics.py'
      - 'tests/test_keirin_note_result_reader.py'
      - 'tests/test_keirin_official_form_canary.py'
      - 'tests/test_keirin_note_browser.py'
      - 'tests/keirin_note_*.test.cjs'
      - 'tests/keirin_rider_history*.cjs'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: test
        options: [test, saved-only, observe, rider-dossiers, dossier-context, measure-results, measure-confidence, combined-study, learned-replay, dt-r1-restore, dt-r1-shadow, dt-r1-readback, dt-r1-settle, dt-r1-retain, dt-r1-official-holdout]
      dossier_day:
        type: string
        description: JST day for source-free dossier replay, measurement or DT-R1 day settlement
        required: false
      measurement_race_ids:
        type: string
        description: Optional comma-separated race IDs for an aggregate-only measurement of the specified day
        required: false
      combined_holdout_from:
        type: string
        description: ISO-8601 cutoff of the first combined-study evaluation race, with timezone
        required: false
      dt_r1_producer_run:
        type: string
        description: Actual main DT shadow producer run ID for independent readback
        required: false
      dt_r1_readback_run:
        type: string
        description: Completed independent main readback run ID for DT batch retention
        required: false
      dt_r1_compare_back:
        type: boolean
        description: Compare the retained DT-R1 final-back candidate in dt-r1-shadow
        default: false
        required: false
  schedule:
    # Start/recover the bounded observer during 08:00-23:59 JST.
    # GitHub may delay starts; this is not a push or wall-clock latency SLA.
    - cron: '2-57/5 23,0-14 * * *'

permissions:
  contents: read

concurrency:
  group: keirin-result-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify collection, encryption and result observer without providers
        run: |
          python -m pip install --disable-pip-version-check 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5' 'playwright>=1.49,<2'
          python -m unittest -v \
            tests.test_keirin_confidence \
            tests.test_keirin_public_confidence \
            tests.test_keirin_racecard_replay_confidence \
            tests.test_keirin_calibrated_selection \
            tests.test_keirin_shortlist_publication \
            tests.test_keirin_confidence_storage \
            tests.test_keirin_authored_confidence \
            tests.test_keirin_nationwide_auto_generator \
            tests.test_keirin_nationwide_auto_storage \
            tests.test_keirin_nationwide_auto_settlement \
            tests.test_keirin_nationwide_auto_runner \
            tests.test_keirin_legacy_evening_replay \
            tests.test_keirin_note_collect_inputs \
            tests.test_keirin_result_diagnostics \
            tests.test_keirin_result_collection \
            tests.test_keirin_result_observer \
            tests.test_keirin_result_watch \
            tests.test_keirin_result_updates \
            tests.test_keirin_saved_source_comparison \
            tests.test_keirin_frozen_forecast_view \
            tests.test_keirin_official_source_continuation \
            tests.test_keirin_official_class_evidence \
            tests.test_keirin_official_nationwide_continuation \
            tests.test_keirin_official_nationwide_sources \
            tests.test_keirin_official_nationwide_records \
            tests.test_keirin_official_combined_study \
            tests.test_keirin_official_learned_replay \
            tests.test_keirin_learned_official_inputs \
            tests.test_keirin_dt_r1_owner_restore \
            tests.test_keirin_dt_r1_future_workflow \
            tests.test_keirin_official_condition_trial \
            tests.test_keirin_official_condition_scoring \
            tests.test_keirin_official_paired_measurement \
            tests.test_keirin_measurement_publication \
            tests.test_keirin_daily_rider_update \
            tests.test_keirin_dossier_ability \
            tests.test_keirin_dossier_conditions \
            tests.test_keirin_publish_dossier_conditions \
            tests.test_keirin_dossier_race_context \
            tests.test_keirin_publish_rider_context \
            tests.test_keirin_official_rider_history \
            tests.test_keirin_official_continuation_workflow \
            tests.test_keirin_nationwide_forecast_view \
            tests.test_keirin_result_live_workflow \
            tests.test_keirin_official_form_canary \
            tests.test_keirin_official_form_history \
            tests.test_keirin_official_day_pipeline \
            tests.test_keirin_official_fetch_diagnostics \
            tests.test_keirin_github_provider_stop \
            tests.test_keirin_note_feed \
            tests.test_keirin_note_result_reader \
            tests.test_keirin_note_feed_cycle
          node --test tests/keirin_note_*.test.cjs
          node --test tests/keirin_joint*.test.cjs
          node --test tests/keirin_rider_history.test.cjs
      - name: Verify the owner view refresh in Chromium using invented loopback data
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-24.04 already includes Chrome. Reinstalling all browser OS
          # dependencies exhausted the job window after all seven tests passed.
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser_path" ] || [ ! -x "$browser_path" ]; then
            echo 'The runner-provided Chromium browser is unavailable.'
            exit 1
          fi
          "$browser_path" --version
          RACE_AI_TEST_CHROMIUM="$browser_path" python -m unittest tests.test_keirin_note_browser -v
          playwright_package="$(python -c "from pathlib import Path; import playwright; print(Path(playwright.__file__).resolve().parent / 'driver' / 'package')")"
          RACE_AI_TEST_CHROMIUM="$browser_path" RACE_AI_NODE_PLAYWRIGHT="$playwright_package" \
            RACE_AI_REQUIRE_RIDER_BROWSER=1 node --test tests/keirin_note_rider_browser.test.cjs
          RACE_AI_TEST_CHROMIUM="$browser_path" RACE_AI_NODE_PLAYWRIGHT="$playwright_package" \
            RACE_AI_REQUIRE_PUBLIC_BROWSER=1 node --test tests/keirin_note_public_forecasts_browser.test.cjs

  observe-results:
    # Same owner key/store and permissions. The admitted official-SP path
    # replays the actual completed trial before source access. Legacy JSON
    # retains its prior source opt-ins and persistent stops.
    # Source work does not wait for forecast capture or whole-day completion.
    needs: tests
    if: >-
      always() && !cancelled() &&
      github.repository == 'haji84/RACE-AI' &&
      github.repository_id == '1416489937' &&
      github.ref == 'refs/heads/main' &&
      vars.RACE_AI_AB_SOURCE_S3_PREFIX == '' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && needs.tests.result == 'success' &&
        (inputs.mode == 'saved-only' || inputs.mode == 'observe' || inputs.mode == 'dossier-context' ||
         inputs.mode == 'combined-study' || inputs.mode == 'learned-replay' || inputs.mode == 'dt-r1-restore' ||
         inputs.mode == 'dt-r1-shadow' || inputs.mode == 'dt-r1-readback' || inputs.mode == 'dt-r1-settle' ||
         inputs.mode == 'dt-r1-retain' || inputs.mode == 'dt-r1-official-holdout')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      # This job can read/write the already approved encrypted store. Source
      # access remains a separate authenticated decision inside the runner.
      RACE_AI_KEIRIN_AB_GIT_STORE_ENABLED: 'true'
      RACE_AI_KEIRIN_OFFICIAL_SOURCE_ENABLED: ${{ vars.RACE_AI_KEIRIN_OFFICIAL_SOURCE_ENABLED }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ (inputs.mode == 'dt-r1-restore' || inputs.mode == 'dt-r1-shadow' || inputs.mode == 'dt-r1-readback' || inputs.mode == 'dt-r1-settle' || inputs.mode == 'dt-r1-retain' || inputs.mode == 'dt-r1-official-holdout') && '3.12' || '3.11' }}
      - name: Observe admitted results and publish each encrypted update
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RACE_AI_KEIRIN_PRIVATE_RSA_PEM: ${{ secrets.RACE_AI_KEIRIN_PRIVATE_RSA_PEM }}
          RESULT_MODE: ${{ inputs.mode || 'observe' }}
          DOSSIER_DAY: ${{ inputs.dossier_day }}
          DT_R1_COMPARE_BACK: ${{ inputs.dt_r1_compare_back || false }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/keirin-result-live-$GITHUB_RUN_ID"
          mkdir -m 700 -p "$root/private" "$root/safe"
          if [ "$RESULT_MODE" = dt-r1-restore ]; then
            umask 077
            env -u RACE_AI_KEIRIN_PRIVATE_RSA_PEM -u GITHUB_TOKEN \
              python -m pip install --disable-pip-version-check --only-binary=:all: \
                -r research/chatgpt_dt_r1/requirements.txt 'beautifulsoup4>=4.12,<5' 'lightgbm==4.6.0'
            python -m scripts.keirin_dt_r1_owner_restore --repo "$GITHUB_WORKSPACE" \
              --private-root "$root/private" --day "$DOSSIER_DAY" \
              --owner-public-pem "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem" \
              | tee "$root/safe/summary.json" "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RESULT_MODE" = dt-r1-settle ]; then
            umask 077
            env -u RACE_AI_KEIRIN_PRIVATE_RSA_PEM -u GITHUB_TOKEN \
              python -m pip install --disable-pip-version-check --only-binary=:all: \
                -r research/chatgpt_dt_r1/requirements.txt 'beautifulsoup4>=4.12,<5'
            day_arg=()
            if [[ -n "$DOSSIER_DAY" ]]; then
              [[ "$DOSSIER_DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
              day_arg=(--day "$DOSSIER_DAY")
            fi
            python -m scripts.keirin_dt_r1_future_settle --repo "$GITHUB_WORKSPACE" \
              --private-root "$root/private" "${day_arg[@]}" \
              --owner-public-pem "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem" \
              | tee "$root/safe/summary.json" "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RESULT_MODE" = dt-r1-official-holdout ]; then
            umask 077
            env -u RACE_AI_KEIRIN_PRIVATE_RSA_PEM -u GITHUB_TOKEN \
              python -m pip install --disable-pip-version-check --only-binary=:all: \
                -r research/chatgpt_dt_r1/requirements.txt 'beautifulsoup4>=4.12,<5'
            holdout_args=()
            if [ -n "$DOSSIER_DAY" ]; then
              holdout_args+=(--day "$DOSSIER_DAY")
            fi
            python -m scripts.keirin_dt_r1_official_holdout --repo "$GITHUB_WORKSPACE" \
              --private-root "$root/private" \
              --owner-public-pem "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem" \
              "${holdout_args[@]}" | tee "$root/safe/summary.json" "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RESULT_MODE" = dt-r1-retain ]; then
            umask 077
            env -u RACE_AI_KEIRIN_PRIVATE_RSA_PEM -u GITHUB_TOKEN \
              python -m pip install --disable-pip-version-check --only-binary=:all: \
                -r research/chatgpt_dt_r1/requirements.txt 'beautifulsoup4>=4.12,<5'
            producer_run=$(jq -r '.inputs.dt_r1_producer_run // empty' "$GITHUB_EVENT_PATH")
            readback_run=$(jq -r '.inputs.dt_r1_readback_run // empty' "$GITHUB_EVENT_PATH")
            [[ "$producer_run" =~ ^[1-9][0-9]{0,17}$ && "$readback_run" =~ ^[1-9][0-9]{0,17}$ ]]
            env -u RACE_AI_KEIRIN_PRIVATE_RSA_PEM \
              python -m scripts.keirin_dt_r1_future_retain --repo "$GITHUB_WORKSPACE" \
                --producer-run "$producer_run" --readback-run "$readback_run" \
              | tee "$root/safe/summary.json" "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$RESULT_MODE" = dt-r1-shadow || "$RESULT_MODE" = dt-r1-readback ]]; then
            umask 077
            env -u RACE_AI_KEIRIN_PRIVATE_RSA_PEM -u GITHUB_TOKEN \
              python -m pip install --disable-pip-version-check --only-binary=:all: \
                -r research/chatgpt_dt_r1/requirements.txt 'beautifulsoup4>=4.12,<5'
            if [ "$RESULT_MODE" = dt-r1-shadow ]; then
              [[ -n "$DOSSIER_DAY" ]]
              dt_shadow_args=()
              if [ "$DT_R1_COMPARE_BACK" = true ]; then
                dt_shadow_args+=(--compare-back)
              fi
              python -m scripts.keirin_dt_r1_future_shadow --repo "$GITHUB_WORKSPACE" \
                --private-root "$root/private" --output "$root/safe/dt-future-cipher" --day "$DOSSIER_DAY" \
                --owner-public-pem "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem" \
                "${dt_shadow_args[@]}" \
                | tee "$root/safe/summary.json" "$GITHUB_STEP_SUMMARY"
            else
              producer_run=$(jq -r '.inputs.dt_r1_producer_run // empty' "$GITHUB_EVENT_PATH")
              [[ "$producer_run" =~ ^[1-9][0-9]*$ ]]
              env -u RACE_AI_KEIRIN_PRIVATE_RSA_PEM \
                python -m scripts.keirin_dt_r1_future_readback --repo "$GITHUB_WORKSPACE" \
                  --producer-run "$producer_run" | tee "$root/safe/summary.json" "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          python -m pip install --disable-pip-version-check 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5'
          if [ "$RESULT_MODE" = dossier-context ]; then
            python -m scripts.keirin_publish_rider_context --repo "$GITHUB_WORKSPACE" \
              --day "$DOSSIER_DAY" | tee "$root/safe/summary.json" "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RESULT_MODE" = combined-study ]; then
            umask 077
            ids=$(jq -r '.inputs.measurement_race_ids // empty' "$GITHUB_EVENT_PATH")
            holdout=$(jq -r '.inputs.combined_holdout_from // empty' "$GITHUB_EVENT_PATH")
            [[ -n "$DOSSIER_DAY" && -n "$ids" && -n "$holdout" ]]
            python -m scripts.keirin_official_measured_outcomes --repo "$GITHUB_WORKSPACE" \
              --private-root "$root/private" --day "$DOSSIER_DAY" --race-ids "$ids" \
              --combined-holdout-from "$holdout" \
              --owner-public-pem "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem" \
              | tee "$root/safe/summary.json" "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$RESULT_MODE" = learned-replay ]; then
            umask 077
            [[ -n "$DOSSIER_DAY" ]]
            env -u RACE_AI_KEIRIN_PRIVATE_RSA_PEM -u GITHUB_TOKEN \
              python -m pip install --disable-pip-version-check --only-binary=:all: 'numpy==2.2.6' 'lightgbm==4.6.0'
            ids=$(jq -r '.inputs.measurement_race_ids // empty' "$GITHUB_EVENT_PATH")
            scope=()
            if [ -n "$ids" ]; then
              scope=(--race-ids "$ids")
            fi
            python -m scripts.keirin_official_measured_outcomes --repo "$GITHUB_WORKSPACE" \
              --private-root "$root/private" --day "$DOSSIER_DAY" "${scope[@]}" \
              --official-learned-replay \
              --owner-public-pem "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem" \
              | tee "$root/safe/summary.json" "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          python -m scripts.keirin_result_watch \
            --mode "$RESULT_MODE" \
            --repo "$GITHUB_WORKSPACE" \
            --private-root "$root/private" \
            --owner-public-pem "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem" \
            --report "$root/safe/summary.json" \
            --interval-seconds 60 --duration-seconds 540 --max-ticks 10 || status=$?
          if [ -f "$root/safe/summary.json" ]; then
            cat "$root/safe/summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Retain only bounded safe result observer receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-result-live-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/keirin-result-live-${{ github.run_id }}/safe/summary.json
          retention-days: 21
          if-no-files-found: warn
      - name: Retain encrypted chronological study forecasts and model
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'combined-study'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-combined-study-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/keirin-result-live-${{ github.run_id }}/safe/combined-study-*.sealed.json
          retention-days: 21
          if-no-files-found: warn
      - name: Retain encrypted official learned replay forecasts
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'learned-replay'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-official-learned-replay-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/keirin-result-live-${{ github.run_id }}/safe/official-learned-replay-forecasts.sealed.json
          retention-days: 21
          if-no-files-found: warn
      # Every byte in this folder is a strict public manifest or owner ciphertext.
      # It is separate from private sources and never includes a decrypted forecast.
      - name: Retain the newly sealed DT future shadow ciphertext
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'dt-r1-shadow'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keirin-dt-r1-future-cipher-${{ github.run_id }}
          path: ${{ runner.temp }}/keirin-result-live-${{ github.run_id }}/safe/dt-future-cipher/
          retention-days: 21
          if-no-files-found: warn
          compression-level: 0
      - name: Destroy ephemeral plaintext
        if: always()
        shell: bash
        run: |
          root="$RUNNER_TEMP/keirin-result-live-$GITHUB_RUN_ID"
          if [ -d "$root" ] && [[ "$root" == "$RUNNER_TEMP"/keirin-result-live-* ]]; then
            rm -rf -- "$root"
          fi

  publish-rider-dossiers:
    # A stopped observer may still have verified saved results available.
    needs: [tests, observe-results]
    if: >-
      always() && !cancelled() &&
      github.repository == 'haji84/RACE-AI' &&
      github.repository_id == '1416489937' &&
      github.ref == 'refs/heads/main' &&
      vars.RACE_AI_AB_SOURCE_S3_PREFIX == '' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && needs.tests.result == 'success' &&
        inputs.mode == 'rider-dossiers'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Publish rider finish rates by meeting grade and round from the verified Git archive
        shell: bash
        env:
          RACE_AI_KEIRIN_AB_GIT_STORE_ENABLED: 'true'
          RACE_AI_KEIRIN_PRIVATE_RSA_PEM: ${{ secrets.RACE_AI_KEIRIN_PRIVATE_RSA_PEM }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5'
          python -m scripts.keirin_daily_rider_update --repo "$GITHUB_WORKSPACE" | tee -a "$GITHUB_STEP_SUMMARY"

  measured-results:
    # Replay only persisted observations after result settlement. Failures here
    # leave the separately published production predictions and results intact.
    needs: [tests, observe-results]
    if: >-
      always() && !cancelled() && github.repository == 'haji84/RACE-AI' &&
      github.repository_id == '1416489937' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'measure-results' || inputs.mode == 'measure-confidence') && needs.tests.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Measure archived races with their verified originals and results
        if: github.event_name == 'schedule' || inputs.mode == 'measure-results'
        shell: bash
        env:
          RACE_AI_KEIRIN_AB_GIT_STORE_ENABLED: 'true'
          RACE_AI_KEIRIN_PRIVATE_RSA_PEM: ${{ secrets.RACE_AI_KEIRIN_PRIVATE_RSA_PEM }}
          MEASUREMENT_DAY: ${{ inputs.dossier_day }}
        run: |
          set -euo pipefail
          umask 077
          python -m pip install --disable-pip-version-check 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5'
          root="$RUNNER_TEMP/keirin-measurement-$GITHUB_RUN_ID"
          mkdir -m 700 -p "$root/private" "$root/safe"
          mapfile -t days < <(python -c 'from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; d=datetime.now(ZoneInfo("Asia/Tokyo")).date(); print(d); print(d-timedelta(days=1))')
          if [ -n "$MEASUREMENT_DAY" ]; then
            [[ "$MEASUREMENT_DAY" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]
            days=("$MEASUREMENT_DAY")
          fi
          # Runner diagnostics print step environment values. Read the cohort
          # within this shell so only its digest and counts reach the report.
          measurement_race_ids=$(jq -r '.inputs.measurement_race_ids // empty' "$GITHUB_EVENT_PATH")
          scope=(--publish)
          if [ -n "$measurement_race_ids" ]; then
            [[ -n "$MEASUREMENT_DAY" ]]
            scope=(--race-ids "$measurement_race_ids")
          fi
          status=0
          for day in "${days[@]}"; do
            python -m scripts.keirin_official_measured_outcomes --repo "$GITHUB_WORKSPACE" \
              --private-root "$root/private" --day "$day" "${scope[@]}" \
              --owner-public-pem "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem" \
              > "$root/safe/$day.json" || status=$?
            jq -c '{day_jst,state,cohort,coverage,publication}|with_entries(select(.value != null))' \
              "$root/safe/$day.json" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - name: Validate and publish shortlist confidence using settled earlier dates
        if: >-
          always() && !cancelled() &&
          (github.event_name == 'schedule' || inputs.mode == 'measure-confidence')
        shell: bash
        env:
          RACE_AI_KEIRIN_AB_GIT_STORE_ENABLED: 'true'
          RACE_AI_KEIRIN_PRIVATE_RSA_PEM: ${{ secrets.RACE_AI_KEIRIN_PRIVATE_RSA_PEM }}
          MEASUREMENT_DAY: ${{ inputs.dossier_day }}
        run: |
          set -euo pipefail
          umask 077
          scope=()
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            [[ "$(TZ=Asia/Tokyo date +%H)" == "08" ]] || exit 0
            scope=(--skip-current)
          elif [ -n "$MEASUREMENT_DAY" ]; then
            scope=(--day "$MEASUREMENT_DAY")
          fi
          python -m pip install --disable-pip-version-check 'cryptography>=44,<48' 'beautifulsoup4>=4.12,<5'
          root="$RUNNER_TEMP/keirin-measurement-$GITHUB_RUN_ID"
          mkdir -m 700 -p "$root/private" "$root/safe"
          python -m scripts.keirin_publish_shortlist_confidence --repo "$GITHUB_WORKSPACE" \
            --private-root "$root/private" "${scope[@]}" \
            --owner-public-pem "$GITHUB_WORKSPACE/docs/evidence/2026-11-18/keirin_owner_existing_rsa_public_spki3072.pem" \
            > "$root/safe/confidence.json"
          jq -c '{day,publication,official_replay,secondary_state,rows}' "$root/safe/confidence.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: keirin-official-measurement-${{ github.run_id }}
          path: ${{ runner.temp }}/keirin-measurement-${{ github.run_id }}/safe/*.json
          retention-days: 21
          if-no-files-found: warn
      - name: Remove ephemeral measurement sources
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/keirin-measurement-$GITHUB_RUN_ID/private"
