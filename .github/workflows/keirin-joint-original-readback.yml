name: KEIRIN joint original independent readback

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/keirin-joint-original-readback.yml'
      - 'race_ai/keirin_joint_finish.py'
      - 'race_ai/keirin_joint_forecast.py'
      - 'scripts/keirin_joint_original_readback.py'
      - 'tests/test_keirin_joint_forecast.py'
      - 'tests/test_keirin_joint_original_readback.py'
      - 'docs/evidence/keirin-live-accuracy-closure-20261125/joint-original-rsa-recovery.json'
      - 'docs/evidence/keirin-live-accuracy-closure-20261125/independent-runner-readback.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-joint-original-readback.yml'
      - 'scripts/keirin_joint_original_readback.py'
      - 'docs/evidence/keirin-live-accuracy-closure-20261125/joint-original-rsa-recovery.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'cryptography>=44,<48'
      - name: Verify joint laws and recovery bounds with invented records
        run: python -m unittest tests.test_keirin_joint_forecast tests.test_keirin_joint_original_readback -v

  independent-owner-readback:
    needs: contracts
    if: github.repository == 'haji84/RACE-AI' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'cryptography>=44,<48'
      - name: Verify the original commitment and earlier runner before accessing a key
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re, urllib.request
          from datetime import datetime
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          try:
              receipt = json.loads(Path('docs/evidence/keirin-live-accuracy-closure-20261125/joint-original-rsa-recovery.json').read_bytes())
              witness = json.loads(Path('docs/evidence/keirin-live-accuracy-closure-20261125/independent-runner-readback.json').read_bytes())
              def get(url, limit):
                  request = urllib.request.Request(url, headers={'User-Agent':'RACE-AI-joint-origin-readback/1'})
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=45) as response:
                      assert response.status == 200 and response.geturl() == url
                      raw = response.read(limit + 1)
                  assert 0 < len(raw) <= limit
                  return raw
              def clock(value): return datetime.fromisoformat(value.replace('Z','+00:00'))
              original_commit, original_cipher = receipt['original_archive_commit'], receipt['original_cipher_sha256']
              assert re.fullmatch('[a-f0-9]{40}', original_commit) and re.fullmatch('[a-f0-9]{64}', original_cipher)
              assert witness['archive_commit'] == original_commit and witness['cipher_sha256'] == original_cipher
              assert witness['observed_at'] == receipt['expected_original_git_readback_at']
              assert witness['action_run'] == receipt['original_witness_run'] and witness['job_id'] == receipt['original_witness_job']
              assert witness['state'] == 'INDEPENDENT_RUNNER_CIPHER_SHA_READBACK_VERIFIED'
              assert witness['registered_comparison_races'] == witness['still_pre_cutoff_races'] == 10
              original_base = 'https://raw.githubusercontent.com/haji84/RACE-AI/' + original_commit + '/'
              original_wire = get(original_base + 'views/' + original_cipher + '.json', 90 * 1024 * 1024)
              assert hashlib.sha256(original_wire).hexdigest() == original_cipher and len(original_wire) == witness['cipher_bytes']
              original_header = json.loads(original_wire)['header']
              assert original_header['schema'] == 'RACE_AI_SAVED_WEB_VIEW_V1'
              assert original_header['source_content_sha256'] == receipt['original_note_sha256']
              index = json.loads(get(original_base + 'index.json', 2 * 1024 * 1024))
              entries = [e for e in index['entries'] if e['cipher_sha256'] == original_cipher]
              assert len(entries) == 1 and entries[0]['kind'] == 'research'
              assert entries[0]['created_at'] == receipt['expected_original_created_at']
              assert entries[0]['source_content_sha256'] == receipt['original_note_sha256']
              jobs_url = 'https://api.github.com/repos/haji84/RACE-AI/actions/runs/' + str(receipt['original_witness_run']) + '/jobs'
              jobs = json.loads(get(jobs_url, 2 * 1024 * 1024))['jobs']
              jobs = [j for j in jobs if j['id'] == receipt['original_witness_job']]
              assert len(jobs) == 1
              job = jobs[0]
              assert job['run_id'] == receipt['original_witness_run'] and job['head_sha'] == witness['source_commit']
              assert job['name'] == 'comparison-cipher-independent-readback' and job['status'] == 'completed' and job['conclusion'] == 'success'
              assert clock(job['started_at']) <= clock(witness['observed_at']) <= clock(job['completed_at']) < clock(receipt['earliest_cutoff'])
              assert re.fullmatch('[a-f0-9]{40}', job['head_sha'])
              prior = json.loads(get('https://raw.githubusercontent.com/haji84/RACE-AI/' + job['head_sha'] + '/docs/evidence/keirin-live-accuracy-closure-20261125/prospective-publication.json', 128 * 1024))
              assert prior['cipher_sha256'] == original_cipher and prior['publication']['source_commit'] == original_commit
              commit, path, expected = (receipt[k] for k in ('recovery_archive_commit','recovery_archive_path','recovery_cipher_sha256'))
              assert re.fullmatch('[a-f0-9]{40}', commit) and re.fullmatch('[a-f0-9]{64}', expected)
              assert re.fullmatch(r'state/keirin/research/joint-comparison/v1/\d{4}-\d{2}-\d{2}/'+expected+r'\.sealed\.json', path)
              url = 'https://raw.githubusercontent.com/haji84/RACE-AI/' + commit + '/' + path
              raw = get(url, 24 * 1024 * 1024)
              assert len(raw) == receipt['recovery_cipher_bytes'] <= 24 * 1024 * 1024
              assert hashlib.sha256(raw).hexdigest() == expected
              folder = Path(os.environ['RUNNER_TEMP']) / 'keirin-joint-independent'
              folder.mkdir(mode=0o700)
              descriptor = os.open(folder/'recovery.sealed.json', os.O_WRONLY|os.O_CREAT|os.O_EXCL, 0o600)
              with os.fdopen(descriptor,'wb') as stream: stream.write(raw)
          except Exception:
              raise SystemExit('HOLD_JOINT_RECOVERY_PINNED_CIPHERTEXT_UNAVAILABLE') from None
          PY
      - name: Independently decrypt the exact committed research original with the existing owner key
        env:
          RACE_AI_KEIRIN_PRIVATE_RSA_PEM: ${{ secrets.RACE_AI_KEIRIN_PRIVATE_RSA_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m scripts.keirin_joint_original_readback \
            --cipher "$RUNNER_TEMP/keirin-joint-independent/recovery.sealed.json" \
            --receipt docs/evidence/keirin-live-accuracy-closure-20261125/joint-original-rsa-recovery.json \
            > "$RUNNER_TEMP/keirin-joint-independent/safe-report.json"
          cat "$RUNNER_TEMP/keirin-joint-independent/safe-report.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: keirin-joint-independent-safe-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/keirin-joint-independent/safe-report.json
          if-no-files-found: ignore
