name: KEIRIN joint original independent readback

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/keirin-joint-original-readback.yml'
      - 'race_ai/keirin_joint_finish.py'
      - 'race_ai/keirin_joint_forecast.py'
      - 'scripts/keirin_joint_original_readback.py'
      - 'scripts/keirin_joint_readback_http.py'
      - 'scripts/keirin_joint_recovery_score.py'
      - 'scripts/keirin_joint_forward_score.py'
      - 'scripts/keirin_forward_score.py'
      - 'race_ai/keirin_secondary_result_consensus.py'
      - 'tests/test_keirin_joint_forecast.py'
      - 'tests/test_keirin_joint_original_readback.py'
      - 'tests/test_keirin_joint_readback_http.py'
      - 'docs/evidence/keirin-live-accuracy-closure-20261125/joint-original-rsa-recovery.json'
      - 'docs/evidence/keirin-live-accuracy-closure-20261125/independent-runner-readback.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/keirin-joint-original-readback.yml'
      - 'scripts/keirin_joint_original_readback.py'
      - 'scripts/keirin_joint_readback_http.py'
      - 'scripts/keirin_joint_recovery_score.py'
      - 'scripts/keirin_joint_forward_score.py'
      - 'scripts/keirin_forward_score.py'
      - 'race_ai/keirin_secondary_result_consensus.py'
      - 'docs/evidence/keirin-live-accuracy-closure-20261125/joint-original-rsa-recovery.json'
  workflow_dispatch:
  workflow_run:
    workflows: ['KEIRIN public Site result updates']
    branches: [main]
    types: [completed]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'cryptography>=44,<48'
      - name: Verify joint laws and recovery bounds with invented records
        run: |
          python -m unittest tests.test_keirin_joint_forecast tests.test_keirin_joint_original_readback \
            tests.test_keirin_joint_readback_http \
            tests.test_keirin_forward_score tests.test_keirin_joint_forward_score \
            tests.test_keirin_joint_recovery_score tests.test_keirin_published_result_validation \
            tests.test_keirin_flow_evaluation tests.test_keirin_form_fall_blind_pdca \
            tests.test_keirin_race_development -v
      - name: Verify public witness metadata with the existing read token
        if: github.event_name != 'workflow_run'
        env:
          RACE_AI_GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.keirin_joint_readback_http import diagnostic, get
          try:
              token = os.environ.pop('RACE_AI_GITHUB_READ_TOKEN', '')
              assert token
              receipt = json.loads(Path('docs/evidence/keirin-live-accuracy-closure-20261125/joint-original-rsa-recovery.json').read_bytes())
              url = 'https://api.github.com/repos/haji84/RACE-AI/actions/runs/' + str(receipt['original_witness_run']) + '/jobs'
              jobs = json.loads(get(url, 2 * 1024 * 1024, token=token))['jobs']
              matched = [job for job in jobs if job['id'] == receipt['original_witness_job']]
              assert len(matched) == 1 and matched[0]['conclusion'] == 'success'
              print('{"state":"EXISTING_READ_TOKEN_PUBLIC_WITNESS_VERIFIED","http_status":200,"permissions_changed":false}')
          except Exception as error:
              print(json.dumps(diagnostic('witness_jobs', error)), flush=True)
              raise SystemExit(1) from None
          PY

  independent-owner-readback:
    needs: contracts
    if: >-
      github.repository == 'haji84/RACE-AI' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       ((github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'cryptography>=44,<48'
      - name: Verify the original commitment and public result snapshot before accessing a key
        id: capture
        shell: bash
        env:
          RACE_AI_GITHUB_READ_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          from scripts.keirin_joint_readback_http import diagnostic, get as github_get
          read_token = os.environ.pop('RACE_AI_GITHUB_READ_TOKEN', '')
          def get(url, limit):
              return github_get(url, limit, token=read_token or None)
          stage = 'local_receipts'
          try:
              receipt = json.loads(Path('docs/evidence/keirin-live-accuracy-closure-20261125/joint-original-rsa-recovery.json').read_bytes())
              witness = json.loads(Path('docs/evidence/keirin-live-accuracy-closure-20261125/independent-runner-readback.json').read_bytes())
              def clock(value): return datetime.fromisoformat(value.replace('Z','+00:00'))
              publication = json.loads(Path('docs/evidence/keirin-live-accuracy-closure-20261125/prospective-publication.json').read_bytes())
              # The automatic one-day experiment is bounded. Manual audits remain available.
              end = max(clock(value) for value in publication['cutoffs'].values()) + timedelta(hours=6)
              if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_run' and datetime.now(timezone.utc) > end:
                  with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('run_score=false\n')
                  print('{"state":"COMPARISON_WINDOW_CLOSED_MANUAL_READBACK_AVAILABLE"}')
                  raise SystemExit(0)
              original_commit, original_cipher = receipt['original_archive_commit'], receipt['original_cipher_sha256']
              assert re.fullmatch('[a-f0-9]{40}', original_commit) and re.fullmatch('[a-f0-9]{64}', original_cipher)
              assert witness['archive_commit'] == original_commit and witness['cipher_sha256'] == original_cipher
              assert witness['observed_at'] == receipt['expected_original_git_readback_at']
              assert witness['action_run'] == receipt['original_witness_run'] and witness['job_id'] == receipt['original_witness_job']
              assert witness['state'] == 'INDEPENDENT_RUNNER_CIPHER_SHA_READBACK_VERIFIED'
              assert witness['registered_comparison_races'] == witness['still_pre_cutoff_races'] == 10
              original_base = 'https://raw.githubusercontent.com/haji84/RACE-AI/' + original_commit + '/'
              stage = 'original_cipher'
              original_wire = get(original_base + 'views/' + original_cipher + '.json', 90 * 1024 * 1024)
              assert hashlib.sha256(original_wire).hexdigest() == original_cipher and len(original_wire) == witness['cipher_bytes']
              original_header = json.loads(original_wire)['header']
              assert original_header['schema'] == 'RACE_AI_SAVED_WEB_VIEW_V1'
              assert original_header['source_content_sha256'] == receipt['original_note_sha256']
              stage = 'original_index'
              index = json.loads(get(original_base + 'index.json', 2 * 1024 * 1024))
              entries = [e for e in index['entries'] if e['cipher_sha256'] == original_cipher]
              assert len(entries) == 1 and entries[0]['kind'] == 'research'
              assert entries[0]['created_at'] == receipt['expected_original_created_at']
              assert entries[0]['source_content_sha256'] == receipt['original_note_sha256']
              jobs_url = 'https://api.github.com/repos/haji84/RACE-AI/actions/runs/' + str(receipt['original_witness_run']) + '/jobs'
              stage = 'witness_jobs'
              jobs = json.loads(get(jobs_url, 2 * 1024 * 1024))['jobs']
              jobs = [j for j in jobs if j['id'] == receipt['original_witness_job']]
              assert len(jobs) == 1
              job = jobs[0]
              assert job['run_id'] == receipt['original_witness_run'] and job['head_sha'] == witness['source_commit']
              assert job['name'] == 'comparison-cipher-independent-readback' and job['status'] == 'completed' and job['conclusion'] == 'success'
              assert clock(job['started_at']) <= clock(witness['observed_at']) <= clock(job['completed_at']) < clock(receipt['earliest_cutoff'])
              assert re.fullmatch('[a-f0-9]{40}', job['head_sha'])
              stage = 'prior_publication'
              prior = json.loads(get('https://raw.githubusercontent.com/haji84/RACE-AI/' + job['head_sha'] + '/docs/evidence/keirin-live-accuracy-closure-20261125/prospective-publication.json', 128 * 1024))
              assert prior['cipher_sha256'] == original_cipher and prior['publication']['source_commit'] == original_commit
              assert publication['cipher_sha256'] == original_cipher and publication['publication']['source_commit'] == original_commit
              assert set(publication['race_ids']) == set(prior['race_ids']) and publication['cutoffs'] == prior['cutoffs']
              assert publication['generated_at'] == prior['generated_at'] and publication['model_sha256'] == prior['model_sha256']
              stage = 'recovery_cipher'
              commit, path, expected = (receipt[k] for k in ('recovery_archive_commit','recovery_archive_path','recovery_cipher_sha256'))
              assert re.fullmatch('[a-f0-9]{40}', commit) and re.fullmatch('[a-f0-9]{64}', expected)
              assert re.fullmatch(r'state/keirin/research/joint-comparison/v1/\d{4}-\d{2}-\d{2}/'+expected+r'\.sealed\.json', path)
              url = 'https://raw.githubusercontent.com/haji84/RACE-AI/' + commit + '/' + path
              raw = get(url, 24 * 1024 * 1024)
              assert len(raw) == receipt['recovery_cipher_bytes'] <= 24 * 1024 * 1024
              assert hashlib.sha256(raw).hexdigest() == expected
              stage = 'write_snapshot'
              folder = Path(os.environ['RUNNER_TEMP']) / 'keirin-joint-independent'
              folder.mkdir(mode=0o700)
              descriptor = os.open(folder/'recovery.sealed.json', os.O_WRONLY|os.O_CREAT|os.O_EXCL, 0o600)
              with os.fdopen(descriptor,'wb') as stream: stream.write(raw)
              days = {race_id[:8] for race_id in publication['race_ids']}
              assert len(days) == 1
              compact = next(iter(days))
              day = compact[:4] + '-' + compact[4:6] + '-' + compact[6:8]
              assert re.fullmatch(r'20\d{2}-\d{2}-\d{2}', day)
              stage = 'result_ref'
              result_ref = json.loads(get('https://api.github.com/repos/haji84/RACE-AI/git/ref/heads/state/keirin-public-results', 128 * 1024))['object']
              result_commit = result_ref['sha']
              assert result_ref['type'] == 'commit' and re.fullmatch('[a-f0-9]{40}', result_commit)
              result_base = 'https://raw.githubusercontent.com/haji84/RACE-AI/' + result_commit + '/'
              for stage, name, remote in (('result_roster','roster.json','rosters/'),('result_data','results.json','results/')):
                  body = get(result_base + remote + day + '.json', 12 * 1024 * 1024)
                  value = json.loads(body)
                  assert value['date'] == day
                  descriptor = os.open(folder/name, os.O_WRONLY|os.O_CREAT|os.O_EXCL, 0o600)
                  with os.fdopen(descriptor,'wb') as stream: stream.write(body)
              stage = 'write_snapshot'
              source = dict(repository='haji84/RACE-AI', branch='state/keirin-public-results', commit=result_commit, day_jst=day,
                  roster_sha256=hashlib.sha256((folder/'roster.json').read_bytes()).hexdigest(),
                  results_sha256=hashlib.sha256((folder/'results.json').read_bytes()).hexdigest())
              descriptor = os.open(folder/'result-source.json', os.O_WRONLY|os.O_CREAT|os.O_EXCL, 0o600)
              with os.fdopen(descriptor,'w') as stream: json.dump(source,stream)
              with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('run_score=true\n')
          except Exception as error:
              print(json.dumps(diagnostic(stage, error)), flush=True)
              raise SystemExit('HOLD_JOINT_RECOVERY_PINNED_CIPHERTEXT_UNAVAILABLE') from None
          PY
      - name: Independently decrypt and score the same original after result updates
        if: steps.capture.outputs.run_score == 'true'
        env:
          RACE_AI_KEIRIN_PRIVATE_RSA_PEM: ${{ secrets.RACE_AI_KEIRIN_PRIVATE_RSA_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m scripts.keirin_joint_original_readback \
            --cipher "$RUNNER_TEMP/keirin-joint-independent/recovery.sealed.json" \
            --receipt docs/evidence/keirin-live-accuracy-closure-20261125/joint-original-rsa-recovery.json \
            > "$RUNNER_TEMP/keirin-joint-independent/safe-report.json"
          cat "$RUNNER_TEMP/keirin-joint-independent/safe-report.json" | tee -a "$GITHUB_STEP_SUMMARY"
          python -m scripts.keirin_joint_recovery_score \
            --cipher "$RUNNER_TEMP/keirin-joint-independent/recovery.sealed.json" \
            --receipt docs/evidence/keirin-live-accuracy-closure-20261125/joint-original-rsa-recovery.json \
            --publication docs/evidence/keirin-live-accuracy-closure-20261125/prospective-publication.json \
            --witness docs/evidence/keirin-live-accuracy-closure-20261125/independent-runner-readback.json \
            --roster "$RUNNER_TEMP/keirin-joint-independent/roster.json" \
            --results "$RUNNER_TEMP/keirin-joint-independent/results.json" \
            > "$RUNNER_TEMP/keirin-joint-independent/score-report.json"
          env -u RACE_AI_KEIRIN_PRIVATE_RSA_PEM python - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'keirin-joint-independent'
          report = json.loads((folder/'score-report.json').read_bytes())
          source = json.loads((folder/'result-source.json').read_bytes())
          assert report['roster_sha256'] == source['roster_sha256'] and report['results_sha256'] == source['results_sha256']
          report['result_source'] = source
          for key in ('gained','lost'): report[key+'_count'] = len(report.pop(key,[]))
          (folder/'score-report.json').write_text(json.dumps(report, ensure_ascii=False, sort_keys=True)+'\n')
          PY
          cat "$RUNNER_TEMP/keirin-joint-independent/score-report.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: keirin-joint-independent-safe-readback-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/keirin-joint-independent/safe-report.json
            ${{ runner.temp }}/keirin-joint-independent/score-report.json
          if-no-files-found: ignore
