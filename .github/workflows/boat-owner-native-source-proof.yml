name: BOAT current owner release candidate name/vault source-free proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/boat-owner-native-source-proof.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/boat-owner-native-source-proof.yml
permissions:
  contents: read
jobs:
  prove_source_free_name_and_vault:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c00b162dc39c7fbef8169c7e39f07f74e92e6eee
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 761247bee0209e37b1af6b8885e92cad3e9260a5
          path: pr64-reference
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7a432e5acc4d3495a0e82bd79726929e2f8085fe
          path: pr72-reference
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check -r requirements-history.txt
      - name: Fail-closed source-free tests using original signed P0 source and exact retries
        run: |
          python - <<'PY'
          import unittest
          from pathlib import Path
          import race_ai
          for folder in ('pr64-reference','pr72-reference'):
              race_ai.__path__.append(str(Path(folder,'race_ai').resolve()))
          names=[
              'tests.test_boat_saved_model_new_name_sources',
              'tests.test_boat_private_original_vault_live_artifact_retry',
              'tests.test_boat_saved_model_view',
              'tests.test_boat_private_original_vault_cli',
              'tests.test_saved_model_name_alias_intake',
          ]
          suite=unittest.defaultTestLoader.loadTestsFromNames(names)
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():raise SystemExit(1)
          print('BOAT_OWNER_NAME_SOURCE_VAULT_EVIDENCE_CANDIDATE_TESTS_GREEN')
          PY
      - name: Verify no forecast, request budget, or source acquisition logic was changed
        run: |
          python - <<'PY'
          from pathlib import Path
          names=Path('race_ai/boat_saved_model_view.py').read_text()
          vault=Path('scripts/boat_private_original_vault.py').read_text()
          assert 'def _official_result_name_binding(' in names
          assert 'SAME_DAY_OFFICIAL_RESULT' in names
          assert 'VERIFIED_OFFICIAL_PROFILE' in names
          assert 'def _gh_once(' in vault
          assert 'attempts = 3 if endpoint.startswith("actions/artifacts/") else 1' in vault
          assert 'time.sleep(2*(attempt+1))' in vault
          assert 'LIVE_ARTIFACT_DIGEST_INVALID' in vault
          assert 'V.retain_originals' in vault
          assert 'source_provider_requests' not in vault
          print('BOAT_OWNER_CANDIDATE_SOURCE_QUOTAS_AND_FORECAST_UNCHANGED')
          PY
